  { id: 'b2_t05', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.9', subtopic_name: 'Transpiration (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Explain the **mechanism by which guard cells open and close** stomata.',
    a: ['When water is **plentiful**: guard cells absorb water by **osmosis** → become **turgid** → their curved shape opens the stoma', 'When water is **scarce** (e.g. drought): guard cells lose water → become **flaccid** → stomata **close** — preventing further water loss', 'Guard cells close stomata to prevent **wilting** when water availability is low', 'This creates a trade-off: closed stomata prevent transpiration but also **reduce CO₂ uptake** for photosynthesis'],
    hint: 'Water in = turgid = pore opens. Water out = flaccid = pore closes. It\'s osmosis controlling a valve.',
    exam_q: 'Explain why stomata close in dry conditions.',
    examMarks: 3,
    examA: 'become **turgid** → their curved shape opens the stoma - When water is **scarce** (e.g. drought): guard cells lose water → become **flaccid** → stomata **close** — preventing further water loss - Guard cells close stomata to prevent **wilting** when water availability is low - This creates a trade-off: closed stomata prevent transpiration but also **reduce CO₂ uptake** for photosynthesis Hint: Water in = turgid = pore opens. Water out = flaccid = pore closes. It\'s osmosis controlling a valve. Exam Q: "Explain why stomata close in dry conditions." [3 marks] → Guard cells lose water by osmosis / become flaccid (1) + stomata close / guard cells no longer curve open (1) + reduces water loss / prevents wilting (1).' },

  { id: 'b2_t06', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.6', subtopic_name: 'Cancer', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 differences** between **benign** and **malignant** tumours.',
    a: ['**Benign**: stays in **one place** / does not spread to other tissues; usually encapsulated; generally not life-threatening', '**Malignant**: cells can **invade** surrounding tissue and spread through the blood or lymphatic system to other parts of the body (**metastasis**)', 'Malignant cells form **secondary tumours** (metastases) in distant organs; benign cells do not'],
    hint: 'Benign = stays put (harmless). Malignant = spreads (dangerous). Metastasis = the word for spreading.',
    exam_q: 'Describe the difference between a benign and a malignant tumour.',
    examMarks: 2,
    examA: 'Benign tumour remains in one place / does not spread (1) + malignant tumour spreads to other parts of the body / forms secondary tumours / metastasis (1).' },

  { id: 'b2_t07', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.6', subtopic_name: 'Cancer', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 lifestyle risk factors** that increase the chance of developing cancer.',
    a: ['**Smoking**: strongly linked to lung cancer, also throat, mouth, bladder', '**Excessive UV exposure** (sunbathing / sunbeds): linked to skin cancer (melanoma)', '**Obesity**: linked to increased risk of bowel, breast, and several other cancers', '**Excessive alcohol consumption**: linked to liver, mouth, throat and oesophageal cancer'],
    hint: 'Smoke, sun, size, spirits (alcohol). Four lifestyle factors that can all be modified.',
    exam_q: 'Give two lifestyle risk factors that increase the chance of developing cancer.',
    examMarks: 2,
    examA: 'Any 2 from: smoking / excessive UV / obesity / excessive alcohol / low fibre diet.' },

  { id: 'b2_t08', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.6', subtopic_name: 'Cancer', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 facts** about **genetic risk factors** for cancer.',
    a: ['Some people inherit **mutated tumour suppressor genes** (e.g. BRCA1 or BRCA2 mutations increase risk of breast cancer)', 'A family history of a particular cancer suggests a **genetic predisposition** — but does not guarantee the cancer will develop'],
    hint: 'BRCA1/2 = genetic breast cancer risk. Inherited mutations raise risk. Family history is a flag.',
    exam_q: 'Explain why some people have a higher genetic risk of developing cancer.',
    examMarks: 2,
    examA: 'They may have inherited mutations in tumour suppressor genes (1) + these mutations mean cells are more likely to divide uncontrollably (1).' },


  // Biology B3 — Infection and Response (Triple-only additions)
  { id: 'b3_t01', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.5', subtopic_name: 'Lymphocytes and Specific Immune Response', tier: 'T', exam_board: 'AQA',
    q: 'Describe the role of **B-lymphocytes** in the specific immune response.',
    a: ['**B-lymphocytes** (B-cells) are white blood cells that recognise **specific antigens** on pathogens', 'When activated, they divide rapidly (**clonal expansion**) → produce large numbers of **plasma cells**', 'Plasma cells secrete large quantities of **antibodies** specific to that antigen', 'Some B-cells remain as long-lived **memory cells** → allow faster response on second exposure to the same antigen'],
    hint: 'B-cells → plasma cells → antibodies. Memory cells = why vaccines work. Clonal expansion = rapid multiplication.',
    exam_q: 'Describe the role of B-lymphocytes in the immune response.',
    examMarks: 3,
    examA: 'produce large numbers of **plasma cells** - Plasma cells secrete large quantities of **antibodies** specific to that antigen - Some B-cells remain as long-lived **memory cells** → allow faster response on second exposure to the same antigen Hint: B-cells → plasma cells → antibodies. Memory cells = why vaccines work. Clonal expansion = rapid multiplication. Exam Q: "Describe the role of B-lymphocytes in the immune response." [3 marks] → Recognise specific antigens on the pathogen (1) + divide to produce plasma cells that secrete antibodies (1) + some remain as memory cells for a faster secondary response (1).' },

  { id: 'b3_t02', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.5', subtopic_name: 'Lymphocytes and Specific Immune Response', tier: 'T', exam_board: 'AQA',
    q: 'Describe the role of **T-lymphocytes** in the specific immune response.',
    a: ['**T-lymphocytes** (T-cells) recognise antigens displayed on the surface of **infected body cells** or pathogens', '**Helper T-cells** activate B-lymphocytes and coordinate the immune response', '**Killer T-cells (cytotoxic T-cells)** destroy infected body cells directly — by releasing chemicals that cause cell death'],
    hint: 'T-cells = commanders and killers. Helper T-cells = coordinator. Killer T-cells = destroy infected cells.',
    exam_q: 'State the role of killer T-cells in the immune response.',
    examMarks: 1,
    examA: 'Destroy / kill infected body cells / cells displaying foreign antigens.' },

  { id: 'b3_t03', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.5', subtopic_name: 'Lymphocytes and Specific Immune Response', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **antibodies** destroy pathogens.',
    a: ['Antibodies are **Y-shaped proteins** — each has a unique **antigen-binding site** complementary to one specific antigen', 'Antibodies bind to antigens on the pathogen surface → **agglutination** (clumping) — marks them for destruction by **phagocytes**', 'Some antibodies **neutralise toxins** produced by bacteria, preventing them from harming body cells'],
    hint: 'Y-shaped. Specific. Bind → clump → phagocytes eat. Or neutralise toxins directly.',
    exam_q: 'Explain how antibodies help to destroy pathogens.',
    examMarks: 3,
    examA: '**agglutination** (clumping) — marks them for destruction by **phagocytes** - Some antibodies **neutralise toxins** produced by bacteria, preventing them from harming body cells Hint: Y-shaped. Specific. Bind → clump → phagocytes eat. Or neutralise toxins directly. Exam Q: "Explain how antibodies help to destroy pathogens." [3 marks] → Antibodies have a specific shape complementary to the antigen (1) + bind to antigens on the pathogen / cause agglutination (1) + pathogens are then destroyed by phagocytosis / antibodies neutralise toxins (1).' },

  { id: 'b3_t04', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.6', subtopic_name: 'Monoclonal Antibodies', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **monoclonal antibodies** are produced (the hybridoma method).',
    a: ['A mouse is injected with a **specific antigen** → its immune system produces **B-lymphocytes** specific to that antigen', 'The B-lymphocytes are **fused** with **tumour cells (myeloma cells)** → form **hybridoma cells**', 'Hybridoma cells can divide **indefinitely** (from the tumour cell) AND produce the specific antibody (from the B-cell)', 'Hybridoma cells are cultured in large quantities → produce large amounts of **identical (monoclonal) antibodies**', 'Antibodies are collected, **purified** and used in diagnostic tests or treatments'],
    hint: 'Mouse + antigen → B-cells. Fuse B-cell + tumour cell → hybridoma. Hybridoma = immortal + antibody-producing.',
    exam_q: 'Describe how monoclonal antibodies are produced.',
    examMarks: 4,
    examA: 'its immune system produces **B-lymphocytes** specific to that antigen - The B-lymphocytes are **fused** with **tumour cells (myeloma cells)** → form **hybridoma cells** - Hybridoma cells can divide **indefinitely** (from the tumour cell) AND produce the specific antibody (from the B-cell) - Hybridoma cells are cultured in large quantities → produce large amounts of **identical (monoclonal) antibodies** - Antibodies are collected, **purified** and used in diagnostic tests or treatments Hint: Mouse + antigen → B-cells. Fuse B-cell + tumour cell → hybridoma. Hybridoma = immortal + antibody-producing. Exam Q: "Describe how monoclonal antibodies are produced." [4 marks] → Mouse injected with antigen (1) + B-lymphocytes / antibody-producing cells collected (1) + fused with tumour / myeloma cells to form hybridoma cells (1) + hybridoma cells cultured to produce large quantities of specific antibodies (1).' },

  { id: 'b3_t05', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.6', subtopic_name: 'Monoclonal Antibodies', tier: 'T', exam_board: 'AQA',
    q: 'Explain how monoclonal antibodies are used in **pregnancy tests**.',
    a: ['Pregnancy tests detect **HCG (human chorionic gonadotrophin)** — a hormone produced only during pregnancy', 'The test strip contains **monoclonal antibodies specific to HCG**', 'If HCG is present in urine, it binds to the antibodies → causes a **colour change** visible in the test window'],
    hint: 'HCG = pregnancy hormone. Antibodies on the test strip grab it. Colour change = positive.',
    exam_q: 'Explain how a pregnancy test uses monoclonal antibodies to detect pregnancy.',
    examMarks: 3,
    examA: 'causes a **colour change** visible in the test window Hint: HCG = pregnancy hormone. Antibodies on the test strip grab it. Colour change = positive. Exam Q: "Explain how a pregnancy test uses monoclonal antibodies to detect pregnancy." [3 marks] → The test contains antibodies specific to HCG (1) + if HCG is present in urine it binds to the antibodies (1) + binding causes a visible colour change / positive result (1).' },

  { id: 'b3_t06', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.6', subtopic_name: 'Monoclonal Antibodies', tier: 'T', exam_board: 'AQA',
    q: 'Describe how monoclonal antibodies can be used in **cancer treatment**.',
    a: ['Monoclonal antibodies are produced that are **specific to antigens on cancer cells**', 'They can be attached to a **cytotoxic drug** or **radioactive substance** and delivered directly to tumour cells', 'This **targets treatment** at cancer cells only — reducing damage to surrounding healthy tissue compared to conventional chemotherapy'],
    hint: 'Antibody finds cancer cell → delivers toxic drug directly. Like a guided missile to the tumour.',
    exam_q: 'Describe how monoclonal antibodies can be used to treat cancer.',
    examMarks: 3,
    examA: 'delivers toxic drug directly. Like a guided missile to the tumour. Exam Q: "Describe how monoclonal antibodies can be used to treat cancer." [3 marks] → Antibodies specific to cancer cell antigens are produced (1) + cytotoxic drug / radioactive substance attached to antibody (1) + drug delivered directly to cancer cells / reduced damage to healthy tissue (1).' },

  { id: 'b3_t07', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.6', subtopic_name: 'Monoclonal Antibodies', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 other uses** of monoclonal antibodies in **medical diagnosis**.',
    a: ['Used to detect the presence of **specific antigens** in blood or tissue samples (e.g. detecting HIV, or specific cancer markers in biopsies)', 'Used in **ELISA tests** — antibodies linked to colour-producing enzymes detect and measure specific substances in samples'],
    hint: 'Detect HIV, cancer markers, hormones in blood. ELISA = colour-change test using antibody + enzyme.',
    exam_q: 'Give one use of monoclonal antibodies other than pregnancy testing and cancer treatment.',
    examMarks: 1,
    examA: 'Any 1 from: detecting HIV / identifying specific cancer cells / drug testing / detecting allergens / blood typing.' },

  { id: 'b3_t08', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.7', subtopic_name: 'Plant Disease', tier: 'T', exam_board: 'AQA',
    q: 'Describe **3 methods** used to **detect and identify** plant diseases.',
    a: ['**Visual inspection**: observe symptoms — yellowing (**chlorosis**), spots, stunted growth, wilting, visible mould or rot', '**Testing kits**: contain monoclonal antibodies specific to plant pathogens → rapid identification in the field', '**Laboratory analysis**: microscopy (identify fungal hyphae), DNA/RNA testing, cultures to grow and identify pathogens'],
    hint: 'Look (visual), test kit (antibodies), lab (microscopy/DNA). Farmers use all three depending on cost and accuracy needed.',
    exam_q: 'Describe how a farmer could identify a disease affecting their crops.',
    examMarks: 3,
    examA: 'rapid identification in the field - **Laboratory analysis**: microscopy (identify fungal hyphae), DNA/RNA testing, cultures to grow and identify pathogens Hint: Look (visual), test kit (antibodies), lab (microscopy/DNA). Farmers use all three depending on cost and accuracy needed. Exam Q: "Describe how a farmer could identify a disease affecting their crops." [3 marks] → Observe visual symptoms such as discolouration / spots / stunted growth (1) + use a field testing kit with antibodies specific to pathogens (1) + send samples to a laboratory for microscopy or DNA analysis (1).' },

  { id: 'b3_t09', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.7', subtopic_name: 'Plant Disease', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 physical defences** plants use against pathogens and pests.',
    a: ['**Waxy cuticle**: waterproof layer covering leaves — prevents water retention and provides a barrier against pathogen entry', '**Cell walls** (made of cellulose): rigid barrier around all plant cells that physically prevents pathogens from entering', '**Bark**: thick, tough outer layer on stems and branches of woody plants — prevents pathogen penetration'],
    hint: 'Wax → keep it out. Cell wall → can\'t get in. Bark → armour for the trunk.',
    exam_q: 'Give two physical defences that protect plants from pathogens.',
    examMarks: 2,
    examA: 'keep it out. Cell wall → can\'t get in. Bark → armour for the trunk. Exam Q: "Give two physical defences that protect plants from pathogens." [2 marks] → Any 2 from: waxy cuticle / cell walls / bark / tough outer layer.' },

  { id: 'b3_t10', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.7', subtopic_name: 'Plant Disease', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 chemical defences** plants produce against pathogens and pests.',
    a: ['**Antibacterial chemicals**: some plants produce substances that kill or inhibit bacterial growth (e.g. tea tree, garlic allicin)', '**Toxic chemicals** / **secondary metabolites**: poisons such as alkaloids (e.g. nicotine, caffeine) and terpenes deter herbivores', 'Some plants release **repellent chemicals** when attacked — warning other parts of the plant or nearby plants'],
    hint: 'Antibacterial (kill bacteria), alkaloids (poison animals), volatile chemicals (warn others). Chemical warfare.',
    exam_q: 'Give one chemical defence used by plants against pests.',
    examMarks: 1,
    examA: 'Any 1 from: antibacterial chemicals / alkaloids / toxins / repellent chemicals / poisons.' },

  { id: 'b3_t11', subject: 'Biology', topic: 'B3', topic_name: 'Infection and Response', subtopic: 'B3.7', subtopic_name: 'Plant Disease', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 mechanical adaptations** plants use to deter pests and predators.',
    a: ['**Thorns and spines**: physical deterrents that injure animals attempting to eat the plant (e.g. roses, cacti)', '**Hairs on leaves (trichomes)**: trap insects, make surface difficult to walk on, or secrete sticky substances', '**Leaves that droop or curl** when touched (e.g. *Mimosa pudica*): startle or dislodge insects; may reduce herbivory'],
    hint: 'Thorns = stab. Hairs = trap. Droop when touched = surprise insects. Mechanical = physical moving/structural.',
    exam_q: 'Give two mechanical adaptations that protect plants from being eaten by animals.',
    examMarks: 2,
    examA: 'Any 2 from: thorns / spines / hairs / leaves that curl when touched / spiky leaf edges.' },


  // Biology B4 — Bioenergetics (Triple-only additions)
  { id: 'b4_t01', subject: 'Biology', topic: 'B4', topic_name: 'Bioenergetics', subtopic: 'B4.1', subtopic_name: 'Photosynthesis: Two Stages', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **light-dependent stage** of photosynthesis.',
    a: ['Occurs in the **chloroplast** (thylakoid membranes)', '**Light energy** is absorbed by **chlorophyll** and used to split **water molecules**', 'This releases **oxygen** as a byproduct (into the air) and produces **ATP** which is used in the second stage'],
    hint: 'Light → split water → O₂ released + ATP made. Happens in the thylakoid. ATP goes to stage 2.',
    exam_q: 'Describe what happens in the light-dependent stage of photosynthesis.',
    examMarks: 3,
    examA: 'split water → O₂ released + ATP made. Happens in the thylakoid. ATP goes to stage 2. Exam Q: "Describe what happens in the light-dependent stage of photosynthesis." [3 marks] → Occurs in the chloroplast (1) + light energy used to split water molecules / photolysis (1) + oxygen released as a byproduct and ATP produced (1).' },

  { id: 'b4_t02', subject: 'Biology', topic: 'B4', topic_name: 'Bioenergetics', subtopic: 'B4.1', subtopic_name: 'Photosynthesis: Two Stages', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **light-independent stage** of photosynthesis.',
    a: ['Occurs in the **stroma** of the chloroplast', 'Uses **ATP** (produced in the light-dependent stage) and **carbon dioxide** absorbed from the air', 'CO₂ is converted into **glucose** — the organic product used for energy and building materials'],
    hint: 'Stroma. Uses ATP from stage 1 + CO₂ from air → glucose. Does not need light directly, but needs ATP from stage 1.',
    exam_q: 'Describe what happens in the light-independent stage of photosynthesis.',
    examMarks: 2,
    examA: 'glucose. Does not need light directly, but needs ATP from stage 1. Exam Q: "Describe what happens in the light-independent stage of photosynthesis." [2 marks] → Carbon dioxide is used (1) + along with ATP from the light-dependent stage to produce glucose (1).' },

  { id: 'b4_t03', subject: 'Biology', topic: 'B4', topic_name: 'Bioenergetics', subtopic: 'B4.4', subtopic_name: 'ATP', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 facts** about **ATP** as the energy currency of cells.',
    a: ['**ATP (adenosine triphosphate)** is the **immediate source of energy** in all cells — not glucose directly', '**Respiration** transfers energy from glucose into ATP', 'When **ATP is broken down** (to ADP + Pi), energy is **released** for use by the cell', 'ATP is used for: **muscle contraction**, **active transport**, **protein synthesis** and **cell division**'],
    hint: 'ATP = cell\'s money. Respiration earns it. Cellular processes spend it. Glucose is the raw material, ATP is the usable form.',
    exam_q: 'Explain why ATP is described as the immediate source of energy in cells.',
    examMarks: 2,
    examA: 'ATP can be directly broken down to release energy for cellular processes (1) + glucose cannot directly power most cellular reactions / must first be converted to ATP (1).' },

  { id: 'b4_t04', subject: 'Biology', topic: 'B4', topic_name: 'Bioenergetics', subtopic: 'B4.5', subtopic_name: 'Anaerobic Respiration Additions', tier: 'T', exam_board: 'AQA',
    q: 'Describe **anaerobic respiration in yeast** in detail.',
    a: ['In the **absence of oxygen**, yeast respires anaerobically', 'Glucose → **ethanol + carbon dioxide** (fermentation)', 'Only a **small amount of ATP** is released — far less than aerobic respiration', 'The process is called **fermentation** — used industrially in **bread making** (CO₂ makes dough rise) and **alcohol production** (ethanol in beer/wine)'],
    hint: 'Yeast + no O₂ → ethanol + CO₂. CO₂ = bread rising. Ethanol = beer. Little ATP. Called fermentation.',
    exam_q: 'Write the word equation for anaerobic respiration in yeast.',
    examMarks: 1,
    examA: '**ethanol + carbon dioxide** (fermentation) - Only a **small amount of ATP** is released — far less than aerobic respiration - The process is called **fermentation** — used industrially in **bread making** (CO₂ makes dough rise) and **alcohol production** (ethanol in beer/wine) Hint: Yeast + no O₂ → ethanol + CO₂. CO₂ = bread rising. Ethanol = beer. Little ATP. Called fermentation. Exam Q: "Write the word equation for anaerobic respiration in yeast." [1 mark] → Glucose → ethanol + carbon dioxide.' },

  { id: 'b4_t05', subject: 'Biology', topic: 'B4', topic_name: 'Bioenergetics', subtopic: 'B4.5', subtopic_name: 'Anaerobic Respiration Additions', tier: 'T', exam_board: 'AQA',
    q: 'Define **oxygen debt** and explain how it is **repaid** after exercise.',
    a: ['During intense exercise, muscles respire **anaerobically** → **lactic acid** accumulates in muscles and blood', '**Oxygen debt** is the amount of **extra oxygen** needed after exercise to remove the accumulated lactic acid', 'After exercise, elevated **breathing rate and heart rate** deliver extra O₂ to the **liver**', 'The liver uses this O₂ to **oxidise lactic acid** → converted to glucose or CO₂ and water'],
    hint: 'Exercise → lactic acid builds → need extra O₂ to deal with it = oxygen debt. Repaid by faster breathing after stopping.',
    exam_q: 'Explain what is meant by oxygen debt.',
    examMarks: 2,
    examA: '**lactic acid** accumulates in muscles and blood - **Oxygen debt** is the amount of **extra oxygen** needed after exercise to remove the accumulated lactic acid - After exercise, elevated **breathing rate and heart rate** deliver extra O₂ to the **liver** - The liver uses this O₂ to **oxidise lactic acid** → converted to glucose or CO₂ and water Hint: Exercise → lactic acid builds → need extra O₂ to deal with it = oxygen debt. Repaid by faster breathing after stopping. Exam Q: "Explain what is meant by oxygen debt." [2 marks] → The extra oxygen needed after exercise (1) + to oxidise / remove the lactic acid that accumulated during anaerobic respiration (1).' },


  // Biology B5 — Homeostasis and Response (Triple-only additions)
  { id: 'b5_t01', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.2', subtopic_name: 'The Brain', tier: 'T', exam_board: 'AQA',
    q: 'Describe the function of the **cerebral cortex**.',
    a: ['The outer layer of the brain — highly **folded** to increase surface area for neurones', 'Controls **conscious thought**, **memory**, **language**, **personality** and **voluntary movement**', 'Also processes information from the **senses** (sight, sound, touch, taste, smell)'],
    hint: 'Cerebral cortex = everything you think and feel consciously. Folded for surface area. Most complex region.',
    exam_q: 'State two functions of the cerebral cortex.',
    examMarks: 2,
    examA: 'Any 2 from: conscious thought / memory / language / personality / voluntary movement / sensory processing.' },

  { id: 'b5_t02', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.2', subtopic_name: 'The Brain', tier: 'T', exam_board: 'AQA',
    q: 'Describe the function of the **cerebellum**.',
    a: ['Located at the **back of the brain**', 'Controls **balance**, **posture** and **coordination** of muscle movements — ensures movements are smooth and precise'],
    hint: 'Cerebellum = coordination. Without it you\'d stagger and fall. Essential for walking, writing, playing sport.',
    exam_q: 'Describe the function of the cerebellum.',
    examMarks: 2,
    examA: 'Controls balance and posture (1) + coordinates smooth and precise muscle movements (1).' },

  { id: 'b5_t03', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.2', subtopic_name: 'The Brain', tier: 'T', exam_board: 'AQA',
    q: 'Describe the function of the **medulla oblongata**.',
    a: ['Located at the **base of the brain**, continuous with the spinal cord', 'Controls **unconscious (automatic) vital functions** including **heart rate** and **breathing rate**'],
    hint: 'Medulla = keeps you alive without thinking. You don\'t choose to breathe. Medulla does it automatically.',
    exam_q: 'State one function of the medulla oblongata.',
    examMarks: 1,
    examA: 'Any 1 from: controls heart rate / controls breathing rate / regulates blood pressure.' },

  { id: 'b5_t04', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.3', subtopic_name: 'The Eye', tier: 'T', exam_board: 'AQA',
    q: 'Give the **function of each part** of the eye.',
    a: ['**Cornea**: transparent outer layer — **refracts (bends) light** as it enters the eye; does most of the focusing', '**Iris**: ring of muscle around the pupil — **controls pupil size** → regulates amount of light entering', '**Lens**: transparent, flexible — **fine-tunes focus** by changing shape (accommodation)', '**Retina**: inner layer containing **light-sensitive receptor cells** (rods and cones) — converts light to electrical impulses', '**Optic nerve**: carries **electrical impulses** from the retina to the **brain** for processing'],
    hint: 'Cornea bends light. Iris controls light. Lens fine-tunes. Retina detects. Optic nerve sends. CILRO.',
    exam_q: 'State the function of the cornea.',
    examMarks: 1,
    examA: 'regulates amount of light entering - **Lens**: transparent, flexible — **fine-tunes focus** by changing shape (accommodation) - **Retina**: inner layer containing **light-sensitive receptor cells** (rods and cones) — converts light to electrical impulses - **Optic nerve**: carries **electrical impulses** from the retina to the **brain** for processing Hint: Cornea bends light. Iris controls light. Lens fine-tunes. Retina detects. Optic nerve sends. CILRO. Exam Q: "State the function of the cornea." [1 mark] → Refracts / bends light as it enters the eye.' },

  { id: 'b5_t05', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.3', subtopic_name: 'The Eye', tier: 'T', exam_board: 'AQA',
    q: 'Describe how the eye **accommodates to focus on a near object**.',
    a: ['**Ciliary muscles contract**', '**Suspensory ligaments slacken** (go slack) — less tension on the lens', '**Lens becomes fatter / more curved** (more convex)', 'Light is **refracted more** → focused onto the retina'],
    hint: 'Near: muscles CONTRACT, ligaments SLACK, lens FAT. Muscles pull themselves, not the ligaments.',
    exam_q: 'Describe how the eye focuses on a near object.',
    examMarks: 3,
    examA: 'focused onto the retina Hint: Near: muscles CONTRACT, ligaments SLACK, lens FAT. Muscles pull themselves, not the ligaments. Exam Q: "Describe how the eye focuses on a near object." [3 marks] → Ciliary muscles contract (1) + suspensory ligaments slacken (1) + lens becomes more curved / fatter / refracts light more (1).' },

  { id: 'b5_t06', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.3', subtopic_name: 'The Eye', tier: 'T', exam_board: 'AQA',
    q: 'Describe how the eye **accommodates to focus on a distant object**.',
    a: ['**Ciliary muscles relax**', '**Suspensory ligaments tighten** (pulled taut by elastic recoil)', '**Lens becomes thinner / less curved** (less convex)', 'Light is **refracted less** (already nearly parallel from a distant source) → focused onto the retina'],
    hint: 'Far: muscles RELAX, ligaments TAUT, lens THIN. Opposite of near vision.',
    exam_q: 'Describe the changes in the eye when looking from a near object to a distant object.',
    examMarks: 3,
    examA: 'focused onto the retina Hint: Far: muscles RELAX, ligaments TAUT, lens THIN. Opposite of near vision. Exam Q: "Describe the changes in the eye when looking from a near object to a distant object." [3 marks] → Ciliary muscles relax (1) + suspensory ligaments tighten / pull lens (1) + lens becomes less curved / thinner / refracts light less (1).' },

  { id: 'b5_t07', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.3', subtopic_name: 'The Eye', tier: 'T', exam_board: 'AQA',
    q: 'Describe **myopia** (short-sightedness) — cause and correction.',
    a: ['**Cause**: eyeball is **too long** or lens is **too powerful** (too curved) → light focuses **in front of** the retina', '**Symptom**: near objects are clear; **distant objects appear blurred**', '**Correction**: **concave (diverging) lens** — spreads light rays apart before they enter the eye → moves focal point back onto the retina'],
    hint: 'Myopia = can\'t see far. Eyeball too long. Fix with concave lens (thinner in middle).',
    exam_q: 'Explain how a concave lens corrects myopia.',
    examMarks: 2,
    examA: 'light focuses **in front of** the retina - **Symptom**: near objects are clear; **distant objects appear blurred** - **Correction**: **concave (diverging) lens** — spreads light rays apart before they enter the eye → moves focal point back onto the retina Hint: Myopia = can\'t see far. Eyeball too long. Fix with concave lens (thinner in middle). Exam Q: "Explain how a concave lens corrects myopia." [2 marks] → The concave lens diverges / spreads light rays (1) + so they are focused further back / onto the retina rather than in front of it (1).' },

  { id: 'b5_t08', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.3', subtopic_name: 'The Eye', tier: 'T', exam_board: 'AQA',
    q: 'Describe **hyperopia** (long-sightedness) — cause and correction.',
    a: ['**Cause**: eyeball is **too short** or lens is **not powerful enough** (too flat) → light would focus **behind** the retina', '**Symptom**: distant objects are clear; **near objects appear blurred**', '**Correction**: **convex (converging) lens** — bends light rays together before they enter the eye → moves focal point forward onto the retina'],
    hint: 'Hyperopia = can\'t see near. Eyeball too short. Fix with convex lens (thicker in middle).',
    exam_q: 'A person is long-sighted. What type of lens is used to correct this defect and why?',
    examMarks: 2,
    examA: 'light would focus **behind** the retina - **Symptom**: distant objects are clear; **near objects appear blurred** - **Correction**: **convex (converging) lens** — bends light rays together before they enter the eye → moves focal point forward onto the retina Hint: Hyperopia = can\'t see near. Eyeball too short. Fix with convex lens (thicker in middle). Exam Q: "A person is long-sighted. What type of lens is used to correct this defect and why?" [2 marks] → Convex lens (1) + converges / brings light rays together so they focus on the retina rather than behind it (1).' },

  { id: 'b5_t09', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.5', subtopic_name: 'Thermoregulation', tier: 'T', exam_board: 'AQA',
    q: 'Describe the role of the **hypothalamus** in controlling body temperature.',
    a: ['The **hypothalamus** acts as the body\'s **thermostat** — contains thermoreceptors that detect changes in blood temperature', 'If temperature deviates from the **set point (37°C)**, the hypothalamus sends **nerve impulses** to effectors', 'Effectors bring about responses that **restore** body temperature to 37°C'],
    hint: 'Hypothalamus = thermostat. Detects blood temp. Sends nerve signals. Corrects deviation. It\'s in the brain.',
    exam_q: 'Describe the role of the hypothalamus in thermoregulation.',
    examMarks: 2,
    examA: 'Contains temperature receptors / detects changes in blood temperature (1) + sends signals to effectors to restore normal temperature (1).' },

  { id: 'b5_t10', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.5', subtopic_name: 'Thermoregulation', tier: 'T', exam_board: 'AQA',
    q: 'Describe the body\'s responses when **body temperature is too high**.',
    a: ['**Sweating**: sweat glands produce **sweat** → water evaporates from skin surface → **removes heat energy** from body', '**Vasodilation**: blood vessels near skin surface **widen** → more **blood flows to the skin** → more heat is **radiated** away from the surface', 'Both responses are initiated by nerve signals from the **hypothalamus**', '**Hair erector muscles relax** → hairs lie flat → less insulating air layer (less effective in humans)'],
    hint: 'Too hot: sweat (evaporation cools) + vasodilation (blood near skin surface radiates heat). Both reduce temperature.',
    exam_q: 'Explain how sweating helps to reduce body temperature.',
    examMarks: 2,
    examA: 'water evaporates from skin surface → **removes heat energy** from body - **Vasodilation**: blood vessels near skin surface **widen** → more **blood flows to the skin** → more heat is **radiated** away from the surface - Both responses are initiated by nerve signals from the **hypothalamus** - **Hair erector muscles relax** → hairs lie flat → less insulating air layer (less effective in humans) Hint: Too hot: sweat (evaporation cools) + vasodilation (blood near skin surface radiates heat). Both reduce temperature. Exam Q: "Explain how sweating helps to reduce body temperature." [2 marks] → Water in sweat evaporates from the skin surface (1) + this requires heat energy / removes heat from the body (1).' },

  { id: 'b5_t11', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.5', subtopic_name: 'Thermoregulation', tier: 'T', exam_board: 'AQA',
    q: 'Describe the body\'s responses when **body temperature is too low**.',
    a: ['**Shivering**: skeletal muscles **contract and relax rapidly** → generates **heat energy** → raises body temperature', '**Vasoconstriction**: blood vessels near the skin surface **narrow** → **less blood flows to the skin** → less heat is radiated away → heat is conserved in core', 'Both responses are initiated by nerve signals from the **hypothalamus**', '**Hair erector muscles contract** → hairs stand on end → trap an insulating layer of air (more effective in furry animals)'],
    hint: 'Too cold: shiver (generate heat) + vasoconstrict (keep heat in). Opposite of too hot responses.',
    exam_q: 'Explain how vasoconstriction helps to maintain body temperature in cold conditions.',
    examMarks: 2,
    examA: 'generates **heat energy** → raises body temperature - **Vasoconstriction**: blood vessels near the skin surface **narrow** → **less blood flows to the skin** → less heat is radiated away → heat is conserved in core - Both responses are initiated by nerve signals from the **hypothalamus** - **Hair erector muscles contract** → hairs stand on end → trap an insulating layer of air (more effective in furry animals) Hint: Too cold: shiver (generate heat) + vasoconstrict (keep heat in). Opposite of too hot responses. Exam Q: "Explain how vasoconstriction helps to maintain body temperature in cold conditions." [2 marks] → Blood vessels near the skin surface narrow (1) + less blood flows to the skin / less heat is radiated away from the surface (1).' },

  { id: 'b5_t12', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.6', subtopic_name: 'Kidneys', tier: 'T', exam_board: 'AQA',
    q: 'Describe the process of **ultrafiltration** in the kidneys.',
    a: ['Blood is delivered under **high pressure** to the **glomerulus** (a knot of capillaries in the Bowman\'s capsule)', 'Small molecules are **forced out** of the blood into the Bowman\'s capsule to form the **filtrate**', 'Filtered molecules include: **water**, **glucose**, **urea**, **mineral ions**', '**Large molecules** (proteins, blood cells) are **too big** to pass through — remain in the blood'],
    hint: 'High pressure → small molecules squeezed out. Glucose, water, urea, ions go through. Proteins and cells stay.',
    exam_q: 'Name two substances that are filtered from the blood in the glomerulus.',
    examMarks: 2,
    examA: 'small molecules squeezed out. Glucose, water, urea, ions go through. Proteins and cells stay. Exam Q: "Name two substances that are filtered from the blood in the glomerulus." [2 marks] → Any 2 from: water / glucose / urea / mineral ions / amino acids.' },

  { id: 'b5_t13', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.6', subtopic_name: 'Kidneys', tier: 'T', exam_board: 'AQA',
    q: 'Describe the process of **selective reabsorption** in the kidney tubules.',
    a: ['As filtrate passes along the **tubule**, useful substances are reabsorbed into surrounding **capillaries**', '**All glucose** is reabsorbed by **active transport** (requires energy)', '**Useful mineral ions** are reabsorbed (some remain in urine if in excess)', '**Some water** is reabsorbed — the amount varies depending on the body\'s water needs', '**Urea** is not reabsorbed — remains in filtrate → excreted in urine'],
    hint: 'All glucose back. Some ions back. Some water back. Urea stays. This is selective — not everything returns.',
    exam_q: 'Explain why glucose is not normally present in urine even though it is filtered at the glomerulus.',
    examMarks: 2,
    examA: 'excreted in urine Hint: All glucose back. Some ions back. Some water back. Urea stays. This is selective — not everything returns. Exam Q: "Explain why glucose is not normally present in urine even though it is filtered at the glomerulus." [2 marks] → All glucose is reabsorbed in the tubule (1) + by active transport back into the blood (1).' },

  { id: 'b5_t14', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.6', subtopic_name: 'Kidneys', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **ADH** controls the water content of blood.',
    a: ['**ADH (anti-diuretic hormone)** is produced by the **hypothalamus** and released by the **pituitary gland**', 'When blood water content is **too low**: more ADH released → kidney tubules become **more permeable** to water → more water reabsorbed → **concentrated urine** produced', 'When blood water content is **too high**: less ADH released → tubules **less permeable** → less water reabsorbed → **dilute urine** produced', 'This is an example of **negative feedback** — ADH levels adjust until blood water returns to normal'],
    hint: 'Dehydrated → more ADH → more water back → concentrated urine. Well hydrated → less ADH → dilute urine.',
    exam_q: 'Explain how the body responds when blood water concentration falls below normal.',
    examMarks: 3,
    examA: 'kidney tubules become **more permeable** to water → more water reabsorbed → **concentrated urine** produced - When blood water content is **too high**: less ADH released → tubules **less permeable** → less water reabsorbed → **dilute urine** produced - This is an example of **negative feedback** — ADH levels adjust until blood water returns to normal Hint: Dehydrated → more ADH → more water back → concentrated urine. Well hydrated → less ADH → dilute urine. Exam Q: "Explain how the body responds when blood water concentration falls below normal." [3 marks] → Hypothalamus / pituitary releases more ADH (1) + kidney tubules become more permeable to water (1) + more water reabsorbed into blood / more concentrated urine produced (1).' },

  { id: 'b5_t15', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.6', subtopic_name: 'Kidneys', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **kidney dialysis** works.',
    a: ['Blood is taken from the patient and passed through the **dialysis machine** across a **partially permeable membrane**', 'On the other side is **dialysis fluid** — which contains normal concentrations of useful substances (glucose, ions) but no **urea**', '**Urea** and **excess ions** diffuse from the blood into the fluid (down their concentration gradient)', '**Glucose** and useful ions do not diffuse out — their concentration in dialysis fluid matches blood levels'],
    hint: 'Blood flows past dialysis fluid across a membrane. Urea diffuses out. Glucose stays. Repeated 3 times per week.',
    exam_q: 'Explain why dialysis fluid contains glucose at the same concentration as blood.',
    examMarks: 2,
    examA: 'To prevent glucose from diffusing out of the blood (1) + so no glucose is lost from the patient\'s blood during dialysis (1).' },

  { id: 'b5_t16', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.6', subtopic_name: 'Kidneys', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 advantages and 2 disadvantages** of a kidney **transplant** compared to dialysis.',
    a: ['**Advantages**: patient is no longer dependent on regular dialysis sessions; better quality of life; more cost-effective long-term', '**Disadvantages**: donor kidney must be a good **tissue match** to reduce risk of rejection; patient must take **immunosuppressant drugs** for life → increased vulnerability to infection'],
    hint: 'Transplant = freedom from machine. But need match + lifelong drugs. Dialysis = temporary fix, needs machine.',
    exam_q: 'Give one disadvantage of a kidney transplant compared to dialysis.',
    examMarks: 1,
    examA: 'increased vulnerability to infection Hint: Transplant = freedom from machine. But need match + lifelong drugs. Dialysis = temporary fix, needs machine. Exam Q: "Give one disadvantage of a kidney transplant compared to dialysis." [1 mark] → Any 1 from: requires a tissue-matched donor / patient must take immunosuppressant drugs for life / increased risk of infection / risk of rejection.' },


  // Biology B6 — Inheritance, Variation and Evolution (Triple-only additions)
  { id: 'b6_t01', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.1', subtopic_name: 'Sexual and Asexual Reproduction (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 advantages of sexual reproduction** over asexual reproduction.',
    a: ['Produces **genetic variation** in offspring — each individual is unique (different combinations of alleles)', 'Variation means that if the **environment changes**, some offspring may be **better adapted** → population can survive', 'Sexual reproduction drives **natural selection** → allows species to evolve over time'],
    hint: 'Sexual = variation = survival in changing environments. Key advantage = adaptability. Asexual = no variation = all die if environment changes.',
    exam_q: 'Explain one advantage of sexual reproduction over asexual reproduction.',
    examMarks: 2,
    examA: 'population can survive - Sexual reproduction drives **natural selection** → allows species to evolve over time Hint: Sexual = variation = survival in changing environments. Key advantage = adaptability. Asexual = no variation = all die if environment changes. Exam Q: "Explain one advantage of sexual reproduction over asexual reproduction." [2 marks] → Produces genetic variation in offspring (1) + variation means some individuals are more likely to survive environmental changes / natural selection can act (1).' },

  { id: 'b6_t02', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.1', subtopic_name: 'Sexual and Asexual Reproduction (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 advantages of asexual reproduction** over sexual reproduction.',
    a: ['Requires only **one parent** — no need to find a mate', 'Much **faster** than sexual reproduction — can produce large numbers of offspring rapidly', 'All offspring are **genetically identical to the parent** and to each other — if the parent is well adapted to the current environment, so will all offspring be'],
    hint: 'Asexual = fast, no mate needed, all clones. Good when environment is stable. Bad if it changes.',
    exam_q: 'Give two advantages of asexual reproduction.',
    examMarks: 2,
    examA: 'Any 2 from: requires only one parent / faster / produces large numbers of offspring quickly / offspring all carry the same well-adapted genes as the parent.' },

  { id: 'b6_t03', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.2', subtopic_name: 'Meiosis and Genetic Variation', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **independent assortment** during meiosis produces genetic variation.',
    a: ['During meiosis, **homologous pairs** of chromosomes line up and separate into different cells', 'The orientation of each chromosome pair is **completely random** (independent of other pairs)', 'In humans (23 pairs), this gives **2²³ (over 8 million)** possible combinations of chromosomes — so virtually every gamete is genetically unique'],
    hint: '23 pairs → each can go either way → 2²³ combinations. That\'s why siblings look different even from the same parents.',
    exam_q: 'Explain how independent assortment during meiosis leads to genetic variation.',
    examMarks: 2,
    examA: 'each can go either way → 2²³ combinations. That\'s why siblings look different even from the same parents. Exam Q: "Explain how independent assortment during meiosis leads to genetic variation." [2 marks] → Chromosomes in each homologous pair separate independently / randomly (1) + this produces gametes with different combinations of chromosomes / over 8 million possible combinations (1).' },

  { id: 'b6_t04', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.2', subtopic_name: 'Meiosis and Genetic Variation', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **crossing over** during meiosis produces genetic variation.',
    a: ['During the first division of meiosis, **homologous chromosomes** pair up closely and **exchange segments of DNA**', 'This is called **crossing over** — the exchange points are called **chiasmata**', 'Crossing over produces **new combinations of alleles** on chromosomes that were not present in the original chromosomes'],
    hint: 'Chromosomes swap sections → new allele combinations. Crossing over + independent assortment = enormous variation.',
    exam_q: 'Explain how crossing over during meiosis results in genetic variation.',
    examMarks: 2,
    examA: 'new allele combinations. Crossing over + independent assortment = enormous variation. Exam Q: "Explain how crossing over during meiosis results in genetic variation." [2 marks] → Homologous chromosomes exchange sections of DNA (1) + this produces new combinations of alleles on each chromosome (1).' },

  { id: 'b6_t05', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.9', subtopic_name: 'Genetic Engineering (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **process of genetic engineering** — how a gene is inserted into a host organism.',
    a: ['The **desired gene** is cut from the donor DNA using **restriction enzymes** — these cut at specific DNA sequences leaving **sticky ends**', 'The same restriction enzyme cuts the **vector** (usually a **bacterial plasmid**) — also leaves complementary sticky ends', 'The gene and vector are mixed → **complementary sticky ends** join together (hydrogen bonds)', '**Ligase enzyme** seals the sugar-phosphate backbone → gene is permanently joined to the plasmid', 'The **recombinant plasmid** is introduced into a **host bacterium** → bacterium expresses the new gene'],
    hint: 'Restriction enzyme cuts (both gene and plasmid). Sticky ends join. Ligase seals. Plasmid → bacterium.',
    exam_q: 'Describe how a gene from one organism is inserted into a bacterial plasmid.',
    examMarks: 4,
    examA: '**complementary sticky ends** join together (hydrogen bonds) - **Ligase enzyme** seals the sugar-phosphate backbone → gene is permanently joined to the plasmid - The **recombinant plasmid** is introduced into a **host bacterium** → bacterium expresses the new gene Hint: Restriction enzyme cuts (both gene and plasmid). Sticky ends join. Ligase seals. Plasmid → bacterium. Exam Q: "Describe how a gene from one organism is inserted into a bacterial plasmid." [4 marks] → Restriction enzyme cuts the gene from donor DNA / cuts plasmid at same recognition sequence (1) + complementary sticky ends are produced (1) + gene inserted into plasmid / sticky ends join (1) + ligase enzyme seals the DNA / joins the strands permanently (1).' },

  { id: 'b6_t06', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.9', subtopic_name: 'Genetic Engineering (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Describe how bacteria are used to produce **human insulin**.',
    a: ['The human gene for **insulin** is identified and cut from human DNA using **restriction enzymes**', 'Inserted into a **bacterial plasmid** using ligase enzyme → **recombinant plasmid** produced', 'Bacteria containing the plasmid are cultured in large **fermenters** → they produce and secrete **human insulin**', 'Insulin is **harvested and purified** → used by people with **Type 1 diabetes**'],
    hint: 'Human insulin gene → cut → insert into plasmid → bacteria in fermenters → harvest insulin. Safer than pig insulin (old method).',
    exam_q: 'Explain why genetically engineered bacteria are used to produce insulin for people with Type 1 diabetes.',
    examMarks: 3,
    examA: '**recombinant plasmid** produced - Bacteria containing the plasmid are cultured in large **fermenters** → they produce and secrete **human insulin** - Insulin is **harvested and purified** → used by people with **Type 1 diabetes** Hint: Human insulin gene → cut → insert into plasmid → bacteria in fermenters → harvest insulin. Safer than pig insulin (old method). Exam Q: "Explain why genetically engineered bacteria are used to produce insulin for people with Type 1 diabetes." [3 marks] → The human insulin gene is inserted into bacteria / bacteria produce human insulin (1) + large quantities can be produced using fermenters (1) + human insulin is identical to naturally produced insulin / less risk of immune reaction than animal insulin (1).' },

  { id: 'b6_t07', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.9', subtopic_name: 'Genetic Engineering (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 benefits** and **3 risks** of **GM crops**.',
    a: ['**Benefits**: engineered resistance to insects/herbicides → higher yield; improved nutritional content (e.g. golden rice with beta-carotene); drought-resistant crops → useful in climate change', '**Risks**: GM genes could spread to **wild plant populations** (gene flow) → unintended ecological consequences; unknown **long-term effects** on ecosystems and human health; concerns about **corporate control** of food supply by multinational companies'],
    hint: 'Benefits = better yield, better nutrition, survive drought. Risks = gene spread, unknown effects, corporate monopoly.',
    exam_q: 'Give one benefit and one risk of growing genetically modified crops.',
    examMarks: 2,
    examA: 'higher yield; improved nutritional content (e.g. golden rice with beta-carotene); drought-resistant crops → useful in climate change - **Risks**: GM genes could spread to **wild plant populations** (gene flow) → unintended ecological consequences; unknown **long-term effects** on ecosystems and human health; concerns about **corporate control** of food supply by multinational companies Hint: Benefits = better yield, better nutrition, survive drought. Risks = gene spread, unknown effects, corporate monopoly. Exam Q: "Give one benefit and one risk of growing genetically modified crops." [2 marks] → Benefit: any 1 from: higher yield / pest/herbicide resistant / improved nutritional content / drought resistant (1). Risk: any 1 from: GM genes may spread to wild plants / unknown effects on ecosystems / concerns about long-term health effects (1).' },

  { id: 'b6_t08', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.10', subtopic_name: 'Cloning', tier: 'T', exam_board: 'AQA',
    q: 'Describe **embryo transplants** in animals.',
    a: ['An embryo from animals with **desirable characteristics** (e.g. a prize bull and cow) is produced through fertilisation', 'The early embryo is **split** into multiple identical cells / groups of cells — each can develop into a complete embryo', 'Each embryo is **implanted into a surrogate mother** → multiple genetically identical offspring with desirable traits are produced'],
    hint: 'Split early embryo → implant into surrogates → many identical animals from one set of valuable parents. Farmers use this.',
    exam_q: 'Describe how embryo transplants are used in cattle farming.',
    examMarks: 3,
    examA: 'multiple genetically identical offspring with desirable traits are produced Hint: Split early embryo → implant into surrogates → many identical animals from one set of valuable parents. Farmers use this. Exam Q: "Describe how embryo transplants are used in cattle farming." [3 marks] → Embryo from prize cattle produced and split into multiple embryos (1) + each embryo has the same genetic material (1) + embryos implanted into surrogate mothers to develop (1).' },

  { id: 'b6_t09', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.10', subtopic_name: 'Cloning', tier: 'T', exam_board: 'AQA',
    q: 'Describe the steps of **adult cell cloning** (as used to produce Dolly the sheep).',
    a: ['**Nucleus removed** from an unfertilised egg cell (enucleated egg)', '**Nucleus taken** from an **adult body cell** (donor with desired characteristics) and inserted into the enucleated egg', 'An **electric shock** or chemical stimulus triggers the egg cell to begin **dividing** (as if fertilised)', 'The resulting **embryo** is implanted into a **surrogate mother**', 'The offspring is **genetically identical** to the donor of the nucleus (not the egg cell donor)'],
    hint: 'Empty egg + adult nucleus → electric shock → embryo → surrogate. Clone is identical to nucleus donor.',
    exam_q: 'Describe how adult cell cloning is carried out.',
    examMarks: 4,
    examA: 'electric shock → embryo → surrogate. Clone is identical to nucleus donor. Exam Q: "Describe how adult cell cloning is carried out." [4 marks] → Nucleus removed from egg cell (1) + nucleus from adult body cell inserted into egg (1) + electric shock stimulates cell division (1) + embryo implanted into surrogate mother (1).' },

  { id: 'b6_t10', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.10', subtopic_name: 'Cloning', tier: 'T', exam_board: 'AQA',
    q: 'Describe **therapeutic cloning** and state its main advantage.',
    a: ['An embryo is created that is **genetically identical** to the patient (using nuclear transfer as in adult cell cloning)', '**Stem cells** are extracted from this embryo before it develops further', 'Stem cells are grown into **replacement tissues or organs** for the patient', 'Main advantage: the tissues will **match the patient\'s own DNA** → immune system will **not reject** them'],
    hint: 'Patient\'s nucleus → embryo → stem cells → tissues that match the patient exactly. No rejection. But embryo is destroyed.',
    exam_q: 'Describe one advantage of therapeutic cloning over using stem cells from a donor.',
    examMarks: 2,
    examA: 'immune system will **not reject** them Hint: Patient\'s nucleus → embryo → stem cells → tissues that match the patient exactly. No rejection. But embryo is destroyed. Exam Q: "Describe one advantage of therapeutic cloning over using stem cells from a donor." [2 marks] → Cells have the same genetic material as the patient (1) + so tissues grown will not be rejected by the patient\'s immune system (1).' },

  { id: 'b6_t11', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.10', subtopic_name: 'Cloning', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 risks or concerns** associated with cloning.',
    a: ['Cloned animals often show **premature ageing** and health problems (e.g. Dolly developed arthritis early)', 'Cloning reduces **genetic diversity** in a population → all individuals susceptible to the same diseases/pathogens', '**Ethical concerns**: welfare of surrogate mothers; moral status of embryos destroyed in therapeutic cloning; fear of applying techniques to humans'],
    hint: 'Ageing problems. No genetic diversity. Ethical issues. Three things cloning critics worry about.',
    exam_q: 'Give two concerns about cloning animals.',
    examMarks: 2,
    examA: 'all individuals susceptible to the same diseases/pathogens - **Ethical concerns**: welfare of surrogate mothers; moral status of embryos destroyed in therapeutic cloning; fear of applying techniques to humans Hint: Ageing problems. No genetic diversity. Ethical issues. Three things cloning critics worry about. Exam Q: "Give two concerns about cloning animals." [2 marks] → Any 2 from: cloned animals may have health problems / premature ageing / reduced genetic diversity in population / ethical objections / welfare of surrogates.' },


  // Biology B7 — Ecology (Triple-only additions)
  { id: 'b7_t01', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.5', subtopic_name: 'Decomposition', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 factors** that affect the **rate of decomposition** by microorganisms and explain each.',
    a: ['**Temperature**: higher temperature → faster enzyme activity in decomposers → faster decay (up to the optimum; enzymes denature above this)', '**Water availability**: decomposers need water for enzyme reactions → dry conditions significantly slow decay', '**Oxygen availability**: most decomposers are **aerobic** → waterlogged or anaerobic conditions slow decay considerably'],
    hint: 'Temperature (enzyme speed), water (enzymes need it), oxygen (aerobic decomposers). All three affect enzyme activity in bacteria and fungi.',
    exam_q: 'Explain why food is preserved by drying.',
    examMarks: 2,
    examA: 'faster enzyme activity in decomposers → faster decay (up to the optimum; enzymes denature above this) - **Water availability**: decomposers need water for enzyme reactions → dry conditions significantly slow decay - **Oxygen availability**: most decomposers are **aerobic** → waterlogged or anaerobic conditions slow decay considerably Hint: Temperature (enzyme speed), water (enzymes need it), oxygen (aerobic decomposers). All three affect enzyme activity in bacteria and fungi. Exam Q: "Explain why food is preserved by drying." [2 marks] → Decomposing microorganisms / bacteria and fungi need water (1) + removing water / drying prevents their enzymes from working / slows / stops decomposition (1).' },

  { id: 'b7_t02', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.5', subtopic_name: 'Decomposition', tier: 'T', exam_board: 'AQA',
    q: 'Describe a **required practical** to investigate the **effect of temperature on rate of decomposition**.',
    a: ['Place **equal volumes of fresh milk** in test tubes at different temperatures (e.g. 10°C, 20°C, 30°C, 40°C)', 'Add the same quantity of **lipase** (or bacteria) to each tube; add a **pH indicator** (e.g. phenolphthalein)', 'Time how long the **indicator changes colour** (when lipids are broken down by bacteria, pH drops from alkaline to neutral)', '**Control variables**: volume of milk, type/amount of enzyme, initial pH; **independent variable**: temperature; **dependent variable**: time for colour change'],
    hint: 'Milk + bacteria + indicator at different temperatures. Time the colour change. Faster change = faster decomposition.',
    exam_q: 'A student investigates the effect of temperature on decomposition rate. Give two variables they should control.',
    examMarks: 2,
    examA: 'Any 2 from: volume of milk / concentration of enzyme / starting pH / type of milk / type of bacteria.' },

  { id: 'b7_t03', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.8', subtopic_name: 'Maintaining Biodiversity (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 reasons** why maintaining **biodiversity** is important.',
    a: ['Greater biodiversity → more **stable ecosystems** — more species can fill each role; if one species is lost, another can replace it', 'Many **medicines** are derived from wild organisms (e.g. aspirin from willow, penicillin from fungus, morphine from poppy)', 'Biodiversity in food crops provides **genetic variation** that protects against new diseases and environmental changes', '**Ethical responsibility**: species have intrinsic value and a right to exist, regardless of utility to humans'],
    hint: 'Stability. Medicines. Food security. Ethics. Four reasons we protect biodiversity.',
    exam_q: 'Give two reasons why it is important to maintain biodiversity.',
    examMarks: 2,
    examA: 'more **stable ecosystems** — more species can fill each role; if one species is lost, another can replace it - Many **medicines** are derived from wild organisms (e.g. aspirin from willow, penicillin from fungus, morphine from poppy) - Biodiversity in food crops provides **genetic variation** that protects against new diseases and environmental changes - **Ethical responsibility**: species have intrinsic value and a right to exist, regardless of utility to humans Hint: Stability. Medicines. Food security. Ethics. Four reasons we protect biodiversity. Exam Q: "Give two reasons why it is important to maintain biodiversity." [2 marks] → Any 2 from: more stable ecosystems / source of medicines / protects genetic diversity in crops / species have intrinsic value / ethical reasons.' },

  { id: 'b7_t04', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.8', subtopic_name: 'Maintaining Biodiversity (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Describe **4 methods** used to maintain biodiversity.',
    a: ['**Seed banks**: seeds of thousands of plant species preserved at low temperatures → can regenerate if the species becomes extinct in the wild (e.g. Svalbard Global Seed Vault)', '**Captive breeding**: endangered species bred in zoos/wildlife centres → individuals eventually reintroduced to the wild', '**Protected areas**: nature reserves and national parks protect habitats from development, agriculture and pollution', '**International agreements**: treaties such as CITES ban trade in endangered species; governments commit to conservation and habitat protection targets'],
    hint: 'Seed banks, captive breeding, protected areas, international laws. Four approaches from local to global.',
    exam_q: 'Describe one way in which zoos contribute to the conservation of endangered species.',
    examMarks: 2,
    examA: 'can regenerate if the species becomes extinct in the wild (e.g. Svalbard Global Seed Vault) - **Captive breeding**: endangered species bred in zoos/wildlife centres → individuals eventually reintroduced to the wild - **Protected areas**: nature reserves and national parks protect habitats from development, agriculture and pollution - **International agreements**: treaties such as CITES ban trade in endangered species; governments commit to conservation and habitat protection targets Hint: Seed banks, captive breeding, protected areas, international laws. Four approaches from local to global. Exam Q: "Describe one way in which zoos contribute to the conservation of endangered species." [2 marks] → Breed animals in captivity / captive breeding (1) + with the aim of reintroducing them to the wild / maintaining population numbers (1).' },

  { id: 'b7_t05', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.9', subtopic_name: 'Food Security', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 factors** that threaten **food security** globally.',
    a: ['**Growing human population**: more people require more food from the same or decreasing land area', '**Climate change**: droughts, floods and extreme weather cause crop failures and reduce agricultural productivity', '**High cost of farming**: fertilisers, machinery, irrigation and land are expensive → many farmers in developing countries cannot afford to improve yield', '**New pests and pathogens**: climate change and global trade spread new diseases to crops and livestock'],
    hint: 'Population up. Climate changing. Farming expensive. New diseases spreading. Food security = can people reliably get enough food?',
    exam_q: 'Give two factors that may cause food insecurity in the future.',
    examMarks: 2,
    examA: 'many farmers in developing countries cannot afford to improve yield - **New pests and pathogens**: climate change and global trade spread new diseases to crops and livestock Hint: Population up. Climate changing. Farming expensive. New diseases spreading. Food security = can people reliably get enough food? Exam Q: "Give two factors that may cause food insecurity in the future." [2 marks] → Any 2 from: increasing global population / climate change causing crop failure / high cost of farming inputs / new pests or diseases.' },

  { id: 'b7_t06', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.9', subtopic_name: 'Food Security', tier: 'T', exam_board: 'AQA',
    q: 'Describe **3 methods** used to make fishing more **sustainable**.',
    a: ['**Fishing quotas**: limits set on the number or mass of fish that can be caught per year → allows fish populations to recover', '**Net size regulations**: minimum mesh size requirements → smaller, younger fish escape through the net → fish reach breeding age before being caught', '**Fishing exclusion zones (marine reserves)**: areas where fishing is prohibited → fish populations recover undisturbed; species can recolonise nearby areas'],
    hint: 'Quotas (catch limit), net size (let young escape), exclusion zones (protected areas). All reduce pressure on fish stocks.',
    exam_q: 'Explain how fishing quotas help to maintain fish populations.',
    examMarks: 2,
    examA: 'allows fish populations to recover - **Net size regulations**: minimum mesh size requirements → smaller, younger fish escape through the net → fish reach breeding age before being caught - **Fishing exclusion zones (marine reserves)**: areas where fishing is prohibited → fish populations recover undisturbed; species can recolonise nearby areas Hint: Quotas (catch limit), net size (let young escape), exclusion zones (protected areas). All reduce pressure on fish stocks. Exam Q: "Explain how fishing quotas help to maintain fish populations." [2 marks] → Quotas limit the number / mass of fish caught (1) + allows fish populations to recover / enough fish left to breed and maintain population (1).' },

  { id: 'b7_t07', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.9', subtopic_name: 'Food Security', tier: 'T', exam_board: 'AQA',
    q: 'Describe **3 methods** used to make farming more **sustainable**.',
    a: ['**Biological control**: use natural predators or parasites to control pest populations → reduces need for chemical pesticides', '**Crop rotation**: different crops grown in the same field each year → maintains soil nutrients (especially nitrogen from legumes), reduces build-up of crop-specific pests and diseases', '**Reducing pesticide and fertiliser use**: minimises water pollution (eutrophication), protects non-target organisms including pollinators'],
    hint: 'Biological control, crop rotation, reduce chemicals. All aim to farm with less impact on the environment.',
    exam_q: 'Explain how biological control of pests is more sustainable than using pesticides.',
    examMarks: 2,
    examA: 'reduces need for chemical pesticides - **Crop rotation**: different crops grown in the same field each year → maintains soil nutrients (especially nitrogen from legumes), reduces build-up of crop-specific pests and diseases - **Reducing pesticide and fertiliser use**: minimises water pollution (eutrophication), protects non-target organisms including pollinators Hint: Biological control, crop rotation, reduce chemicals. All aim to farm with less impact on the environment. Exam Q: "Explain how biological control of pests is more sustainable than using pesticides." [2 marks] → Uses natural predators / parasites rather than chemicals (1) + reduces chemical pollution / less harm to non-target species / more sustainable long-term (1).' },


  // Biology B1 — Cell Biology (Triple-only additions)
  { id: 'b1_t10', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'How do you **calculate the mean inhibition zone** from replica plate results?',
    a: ['Measure the **diameter** of each inhibition zone in mm for each replicate', 'Calculate the **mean diameter**: add all values ÷ number of replicates', 'If the zone is not perfectly circular, measure in **two directions** and average them', 'A larger mean inhibition zone = **greater effectiveness** of the antibiotic'],
    hint: 'Mean inhibition zone = sum of diameters ÷ number of replicates. Larger zone = more effective antibiotic.',
    exam_q: 'A student recorded inhibition zone diameters of 12 mm, 14 mm, and 13 mm for an antibiotic. Calculate the mean.',
    examMarks: 1,
    examA: '(12 + 14 + 13) ÷ 3 = 13 mm.' },

  { id: 'b1_t11', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **full aseptic technique** for culturing bacteria on agar plates. *(5 steps)*',
    a: ['**Sterilise** the inoculating loop in a Bunsen burner flame until red-hot; allow to cool', '**Flame the neck** of the culture bottle before and after removing the culture; work near the Bunsen flame to prevent airborne contamination', '**Inoculate** the agar plate by streaking the cooled loop across the surface; replace lid quickly', '**Seal** the Petri dish with two strips of adhesive tape (not all the way around — prevents anaerobic growth of pathogens)', '**Incubate** at **25 °C** in schools (not 37 °C — avoids pathogens that thrive at body temperature)'],
    hint: 'Flame loop. Flame bottle neck. Streak agar. Two tape strips. Incubate at 25 °C (not 37 °C — safety).',
    exam_q: 'Explain why school experiments incubate bacteria at 25 °C rather than 37 °C.',
    examMarks: 2,
    examA: '37 °C is body temperature / optimum for human pathogens (1) + incubating at 25 °C reduces risk of culturing harmful pathogens (1).' },


  // Biology B2 — Organisation (Triple-only additions)
  { id: 'b2_t09', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.2', subtopic_name: 'Digestive System', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **role of the bile duct** and explain why bile does not contain enzymes.',
    a: ['**Bile** is produced in the **liver**, stored in the **gall bladder**, then released into the **small intestine** via the **bile duct**', 'Bile **emulsifies** fats — breaks large fat droplets into smaller ones → increases surface area → lipase works faster', 'Bile is an **alkaline** solution that **neutralises** stomach acid in the duodenum — provides optimal pH for intestinal enzymes', 'Bile is **not an enzyme** — it does not catalyse reactions; it is a physical emulsifier'],
    hint: 'Liver makes bile → gall bladder stores → bile duct delivers to small intestine. Emulsifies fat (physical, not chemical). Neutralises acid.',
    exam_q: 'Explain how bile aids the digestion of fats.',
    examMarks: 2,
    examA: 'increases surface area → lipase works faster - Bile is an **alkaline** solution that **neutralises** stomach acid in the duodenum — provides optimal pH for intestinal enzymes - Bile is **not an enzyme** — it does not catalyse reactions; it is a physical emulsifier Hint: Liver makes bile → gall bladder stores → bile duct delivers to small intestine. Emulsifies fat (physical, not chemical). Neutralises acid. Exam Q: "Explain how bile aids the digestion of fats." [2 marks] → Bile emulsifies fats / breaks large fat droplets into smaller droplets (1) + increases surface area for lipase to act on (1).' },

  { id: 'b2_t10', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.3', subtopic_name: 'The Heart', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **anatomy of the coronary arteries** and explain how **blockage** causes a heart attack.',
    a: ['**Coronary arteries** are small blood vessels on the **surface of the heart** that supply the heart muscle with oxygen and glucose', '**Atherosclerosis**: fatty deposits (plaques) build up inside coronary artery walls → **narrows** the lumen → restricts blood flow', 'A **blood clot** (thrombus) can block a narrowed coronary artery completely → **no oxygen reaches heart muscle cells**', '**Heart muscle cells die** → this is a **myocardial infarction** (heart attack) — the heart may stop pumping effectively'],
    hint: 'Coronary arteries feed heart muscle. Plaque narrows them. Clot blocks → no oxygen → muscle dies → heart attack.',
    exam_q: 'Explain how a build-up of fatty deposits in the coronary arteries can lead to a heart attack.',
    examMarks: 3,
    examA: '**narrows** the lumen → restricts blood flow - A **blood clot** (thrombus) can block a narrowed coronary artery completely → **no oxygen reaches heart muscle cells** - **Heart muscle cells die** → this is a **myocardial infarction** (heart attack) — the heart may stop pumping effectively Hint: Coronary arteries feed heart muscle. Plaque narrows them. Clot blocks → no oxygen → muscle dies → heart attack. Exam Q: "Explain how a build-up of fatty deposits in the coronary arteries can lead to a heart attack." [3 marks] → Fatty deposits narrow the coronary artery (1) + restricts blood flow / reduces oxygen supply to heart muscle (1) + heart muscle cells die (1).' },

  { id: 'b2_t11', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.9', subtopic_name: 'Transpiration', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **potometer practical** for measuring transpiration rate. *(4 steps)*',
    a: ['Cut a shoot under **water** and quickly seal it into a potometer to prevent air entering the xylem', 'Allow the shoot to stabilise, then allow a **bubble** to enter the capillary tube by removing the shoot briefly from water', 'Measure the distance the bubble moves in a set time → calculate **rate of water uptake** (proxy for transpiration)', '**Change one variable** at a time (e.g. fan for wind, lamp for light, Vaseline on leaves to block stomata) and record the new rate'],
    hint: 'Seal shoot into potometer under water. Introduce bubble. Measure bubble movement per minute. Change one variable and repeat.',
    exam_q: 'A student placed a leafy shoot in a potometer. Explain what the movement of the bubble shows.',
    examMarks: 2,
    examA: 'calculate **rate of water uptake** (proxy for transpiration) - **Change one variable** at a time (e.g. fan for wind, lamp for light, Vaseline on leaves to block stomata) and record the new rate Hint: Seal shoot into potometer under water. Introduce bubble. Measure bubble movement per minute. Change one variable and repeat. Exam Q: "A student placed a leafy shoot in a potometer. Explain what the movement of the bubble shows." [2 marks] → The bubble moves as water is taken up by the shoot (1) + rate of bubble movement indicates rate of transpiration / water uptake (1).' },


  // Biology B3 — Infection and Response (Triple-only additions)
