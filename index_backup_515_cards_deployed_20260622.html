    examA: 'four times the power loss) Hint: P = I²R. Derived from P = IV and V = IR. Most useful when you have current and resistance. Explains cable heating. Exam Q: "A resistor has resistance 20 Ω and carries a current of 3 A. Calculate the power dissipated." [2 marks] → P = I²R = 3² × 20 (1) = 9 × 20 = **180 W** (1).' },

  { id: 'p2_t08', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.8', subtopic_name: 'The Oscilloscope', tier: 'T', exam_board: 'AQA',
    q: 'Explain how to read **peak voltage** from an oscilloscope trace.',
    a: ['The oscilloscope displays voltage on the **vertical (y) axis** and time on the horizontal (x) axis', '**Peak voltage** = the maximum displacement of the trace from the centre line (amplitude)', 'Peak voltage = **number of vertical divisions from centre to peak × volts per division (V/div) setting**'],
    hint: 'Peak voltage = height from centre to top × volts/div. Read the scale setting, count the squares, multiply.',
    exam_q: 'An oscilloscope trace has an amplitude of 2.5 divisions. The y-axis setting is 4 V/div. Calculate the peak voltage.',
    examMarks: 2,
    examA: 'Peak voltage = 2.5 × 4 (1) = **10 V** (1).' },

  { id: 'p2_t09', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.8', subtopic_name: 'The Oscilloscope', tier: 'T', exam_board: 'AQA',
    q: 'Explain how to read **time period and frequency** from an oscilloscope trace.',
    a: ['**Time period (T)** = the time for one complete cycle of the wave — read from the horizontal (x) axis', 'Time period = **number of horizontal divisions for one complete cycle × time per division (time/div or s/div)**', '**Frequency (f) = 1/T** (in Hz, if T is in seconds)', 'For AC mains (50 Hz): T = 1/50 = 0.02 s = 20 ms — one complete cycle takes 20 milliseconds'],
    hint: 'T = number of divisions per cycle × time/div. Then f = 1/T. Count one full wave (start to same point again).',
    exam_q: 'One complete wave on an oscilloscope trace spans 4 divisions. The time/div is set to 5 ms/div. Calculate the frequency.',
    examMarks: 3,
    examA: 'T = 4 × 5 ms = 20 ms = 0.02 s (1) + f = 1/T = 1/0.02 (1) = **50 Hz** (1).' },


  // Physics P3 — Particle Model of Matter (Triple-only additions)
  { id: 'p3_t01', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.3', subtopic_name: 'Internal Energy', tier: 'T', exam_board: 'AQA',
    q: 'Define **internal energy** and explain how heating changes it.',
    a: ['**Internal energy** = the total **kinetic energy** and **potential energy** of all the particles in a system', 'Heating a substance increases its internal energy by increasing the **kinetic energy of particles** → particles move faster → temperature rises', 'Alternatively, heating can increase **potential energy** of particles without raising temperature → this occurs during a **change of state** (e.g. melting, boiling)', 'The internal energy of a system can be changed by **heating** or by **doing work** on it'],
    hint: 'Internal energy = KE + PE of all particles. Heat → KE up → temp up. OR heat → PE up → state changes (temp stays same).',
    exam_q: 'Explain what happens to the internal energy of a substance when it is heated.',
    examMarks: 2,
    examA: 'particles move faster → temperature rises - Alternatively, heating can increase **potential energy** of particles without raising temperature → this occurs during a **change of state** (e.g. melting, boiling) - The internal energy of a system can be changed by **heating** or by **doing work** on it Hint: Internal energy = KE + PE of all particles. Heat → KE up → temp up. OR heat → PE up → state changes (temp stays same). Exam Q: "Explain what happens to the internal energy of a substance when it is heated." [2 marks] → The internal energy increases (1) + because the kinetic energy of the particles increases / particles move faster (1).' },

  { id: 'p3_t02', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.3', subtopic_name: 'Internal Energy', tier: 'T', exam_board: 'AQA',
    q: 'Explain why temperature **stays constant during a change of state** even though energy is being added.',
    a: ['During melting or boiling, the energy supplied increases the **potential energy** of particles — the energy is used to overcome the **intermolecular forces** between particles', 'The **kinetic energy** of particles does not increase → temperature does not rise', 'This explains the **flat section** on a heating/cooling curve at the melting and boiling points'],
    hint: 'State change = flat line on graph. Energy goes into breaking bonds (PE), not speeding up particles (KE). Temp stays constant.',
    exam_q: 'Explain why the temperature of water does not increase while it is boiling, even though energy is being supplied.',
    examMarks: 2,
    examA: 'temperature does not rise - This explains the **flat section** on a heating/cooling curve at the melting and boiling points Hint: State change = flat line on graph. Energy goes into breaking bonds (PE), not speeding up particles (KE). Temp stays constant. Exam Q: "Explain why the temperature of water does not increase while it is boiling, even though energy is being supplied." [2 marks] → The energy is used to break intermolecular bonds / increase potential energy of particles (1) + not to increase the kinetic energy of particles / temperature only increases when KE increases (1).' },

  { id: 'p3_t03', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.4', subtopic_name: 'Specific Heat Capacity', tier: 'T', exam_board: 'AQA',
    q: 'Define **specific heat capacity** and state its unit.',
    a: ['**Specific heat capacity (c)** is the amount of energy required to **raise the temperature of 1 kg of a substance by 1°C** (or 1 K)', 'Unit: **J/kg°C** (joules per kilogram per degree Celsius) — also written J kg⁻¹ K⁻¹', 'Different materials have different specific heat capacities — **water** has a high SHC (4200 J/kg°C), making it useful as a coolant and heat store'],
    hint: 'SHC = energy to heat 1 kg by 1°C. Unit: J/kg°C. Water = 4200 J/kg°C (high — good coolant).',
    exam_q: 'Define specific heat capacity.',
    examMarks: 2,
    examA: 'The energy required (1) + to raise the temperature of 1 kg of a substance by 1°C (or 1 K) (1).' },

  { id: 'p3_t04', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.4', subtopic_name: 'Specific Heat Capacity', tier: 'T', exam_board: 'AQA',
    q: 'State and use the equation **Q = mcΔT**.',
    a: ['**Q = mcΔT** where: Q = energy transferred (J), m = mass (kg), c = specific heat capacity (J/kg°C), ΔT = temperature change (°C)', 'Rearrangements: **c = Q/(mΔT)**; **m = Q/(cΔT)**; **ΔT = Q/(mc)**', 'ΔT must be the **change** in temperature — subtract initial from final temperature', 'Always check that mass is in **kg** (not g) before substituting'],
    hint: 'Q = mcΔT. Q in J, m in kg, c in J/kg°C, ΔT in °C. Watch units — kg not g.',
    exam_q: 'Calculate the energy needed to heat 2 kg of water from 20°C to 100°C. [Specific heat capacity of water = 4200 J/kg°C]',
    examMarks: 3,
    examA: 'ΔT = 100 − 20 = 80°C (1) + Q = 2 × 4200 × 80 (1) = **672,000 J** / 672 kJ (1).' },

  { id: 'p3_t05', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.4', subtopic_name: 'Specific Heat Capacity', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **required practical** to determine the specific heat capacity of a material.',
    a: ['Place a **known mass** (m, in kg) of the material (e.g. a metal block or water) in an insulated container', 'Use an **electric heater** to supply energy (Q = IVt — measure current, voltage, and time) and a **thermometer** to record temperature change (ΔT)', 'Calculate c using: **c = Q/(mΔT) = IVt/(mΔT)**', 'Sources of error: heat lost to surroundings (insulate equipment); thermometer not in direct contact with material (error in ΔT reading)'],
    hint: 'Insulated container, electric heater (measure I, V, t), thermometer. c = IVt / (mΔT). Minimise heat loss.',
    exam_q: 'Describe how you would measure the specific heat capacity of a metal block.',
    examMarks: 4,
    examA: 'Measure the mass of the block (1) + use an electric heater in the block and measure current, voltage and time (1) + record the temperature change using a thermometer (1) + calculate c = IVt/(mΔT) (1).' },

  { id: 'p3_t06', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.5', subtopic_name: 'Specific Latent Heat', tier: 'T', exam_board: 'AQA',
    q: 'Define **specific latent heat** and state its unit.',
    a: ['**Specific latent heat (L)** is the energy required to change the state of **1 kg** of a substance at **constant temperature** — no temperature change occurs', 'Unit: **J/kg** (joules per kilogram)', 'Two types: **specific latent heat of fusion** (melting or freezing) and **specific latent heat of vaporisation** (boiling or condensing)'],
    hint: 'L = energy to change state of 1 kg. No temperature change. Fusion = melting. Vaporisation = boiling.',
    exam_q: 'Define specific latent heat.',
    examMarks: 2,
    examA: 'The energy required (1) + to change the state of 1 kg of a substance without a change in temperature (1).' },

  { id: 'p3_t07', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.5', subtopic_name: 'Specific Latent Heat', tier: 'T', exam_board: 'AQA',
    q: 'State and use the equation **Q = mL**.',
    a: ['**Q = mL** where: Q = energy transferred (J), m = mass (kg), L = specific latent heat (J/kg)', 'Rearrangements: **L = Q/m**; **m = Q/L**', 'Always check mass is in **kg** and L is for the correct process (fusion or vaporisation)'],
    hint: 'Q = mL. Q in J, m in kg, L in J/kg. Simple multiplication. No ΔT because there\'s no temperature change.',
    exam_q: 'Calculate the energy needed to melt 0.5 kg of ice. [Specific latent heat of fusion of water = 340,000 J/kg]',
    examMarks: 2,
    examA: 'Q = mL = 0.5 × 340,000 (1) = **170,000 J** / 170 kJ (1).' },

  { id: 'p3_t08', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.5', subtopic_name: 'Specific Latent Heat', tier: 'T', exam_board: 'AQA',
    q: 'Explain why the **specific latent heat of vaporisation** is much greater than the **specific latent heat of fusion** for the same substance.',
    a: ['During **fusion (melting)**: particles gain enough energy to break free from fixed positions but remain close together — bonds are **weakened**, not fully broken', 'During **vaporisation (boiling)**: particles gain enough energy to **fully escape** from all intermolecular forces — bonds are completely broken and particles become widely separated', 'Much **more energy** is required to completely separate particles (vaporisation) than to allow them to move around each other (melting)'],
    hint: 'Melting = slightly loosen bonds. Boiling = completely break all bonds. Breaking all bonds needs much more energy.',
    exam_q: 'For water, the specific latent heat of vaporisation is much greater than the specific latent heat of fusion. Explain why.',
    examMarks: 2,
    examA: 'During vaporisation, intermolecular forces must be completely overcome / particles must be fully separated (1) + whereas during melting, particles only need to move freely past each other / bonds are only weakened not fully broken (1).' },

  { id: 'p3_t09', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.6', subtopic_name: 'Gas Pressure and Temperature', tier: 'T', exam_board: 'AQA',
    q: 'Explain the relationship between **gas pressure and temperature** at constant volume.',
    a: ['At **constant volume**, pressure is **directly proportional to absolute temperature**: P/T = constant (or P₁/T₁ = P₂/T₂)', 'When temperature increases, gas particles have **more kinetic energy** → move **faster**', 'Faster particles hit the container walls **more frequently** and with **greater force** → pressure increases', 'Temperature must be in **Kelvin (K)** for this relationship to apply'],
    hint: 'More heat → faster particles → hit walls more often + harder → higher pressure. P ∝ T (in Kelvin). P/T = constant.',
    exam_q: 'Explain, using particle theory, why gas pressure increases when a sealed container is heated at constant volume.',
    examMarks: 3,
    examA: 'move **faster** - Faster particles hit the container walls **more frequently** and with **greater force** → pressure increases - Temperature must be in **Kelvin (K)** for this relationship to apply Hint: More heat → faster particles → hit walls more often + harder → higher pressure. P ∝ T (in Kelvin). P/T = constant. Exam Q: "Explain, using particle theory, why gas pressure increases when a sealed container is heated at constant volume." [3 marks] → Particles gain kinetic energy / move faster when heated (1) + collide with walls more frequently (1) + and with greater force, so pressure increases (1).' },

  { id: 'p3_t10', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.6', subtopic_name: 'Gas Pressure and Temperature', tier: 'T', exam_board: 'AQA',
    q: 'Define **absolute zero** and explain its significance.',
    a: ['**Absolute zero** = **−273°C** = **0 K** — the lowest possible temperature', 'At absolute zero, particles have **minimum kinetic energy** (they are essentially at rest — no movement)', 'Theoretically, gas pressure would be **zero** at absolute zero (no particle collisions with walls); in practice gases liquify before reaching this temperature'],
    hint: 'Absolute zero = −273°C = 0 K. Minimum kinetic energy. Particles barely move. Pressure would be zero.',
    exam_q: 'What is absolute zero in degrees Celsius, and what happens to the kinetic energy of particles at this temperature?',
    examMarks: 2,
    examA: 'Absolute zero = −273°C (1) + particles have minimum / zero kinetic energy / particles are essentially stationary (1).' },

  { id: 'p3_t11', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model of Matter', subtopic: 'P3.6', subtopic_name: 'Gas Pressure and Temperature', tier: 'T', exam_board: 'AQA',
    q: 'Convert between **Celsius and Kelvin** and apply the pressure-temperature equation.',
    a: ['**T(K) = T(°C) + 273**; **T(°C) = T(K) − 273**', 'Example: 27°C = 27 + 273 = **300 K**; 0°C = **273 K**', 'For pressure-temperature calculations: **P₁/T₁ = P₂/T₂** (both temperatures must be in Kelvin)'],
    hint: 'K = °C + 273. Always convert to Kelvin before using P/T = constant. 0°C = 273 K, 100°C = 373 K.',
    exam_q: 'A sealed gas at 100 kPa and 27°C is heated to 127°C at constant volume. Calculate the new pressure.',
    examMarks: 3,
    examA: 'T₁ = 27 + 273 = 300 K; T₂ = 127 + 273 = 400 K (1) + P₂ = P₁ × T₂/T₁ = 100 × 400/300 (1) = **133 kPa** (1).' },


  // Physics P4 — Atomic Structure (Triple-only additions)
  { id: 'p4_t01', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.4', subtopic_name: 'Nuclear Equations', tier: 'T', exam_board: 'AQA',
    q: 'Write and explain a **nuclear equation for alpha decay**.',
    a: ['**Alpha particle** (⁴₂He or α): has mass number 4 and atomic number 2', 'In alpha decay: **mass number decreases by 4**, **atomic number decreases by 2**', 'Example: ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He', 'Check balance: top numbers (238 = 234 + 4 ✓) and bottom numbers (92 = 90 + 2 ✓) must both add up correctly'],
    hint: 'Alpha decay: −4 mass number, −2 atomic number. ⁴₂He is the alpha particle. Balance top and bottom numbers separately.',
    exam_q: 'Radium-226 (²²⁶₈₈Ra) decays by alpha emission. Write a balanced nuclear equation.',
    examMarks: 2,
    examA: '²³⁴₉₀Th + ⁴₂He - Check balance: top numbers (238 = 234 + 4 ✓) and bottom numbers (92 = 90 + 2 ✓) must both add up correctly Hint: Alpha decay: −4 mass number, −2 atomic number. ⁴₂He is the alpha particle. Balance top and bottom numbers separately. Exam Q: "Radium-226 (²²⁶₈₈Ra) decays by alpha emission. Write a balanced nuclear equation." [2 marks] → ²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He — correct daughter nucleus symbol/numbers (1) + correct alpha particle symbol (1).' },

  { id: 'p4_t02', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.4', subtopic_name: 'Nuclear Equations', tier: 'T', exam_board: 'AQA',
    q: 'Write and explain a **nuclear equation for beta decay**.',
    a: ['**Beta particle** (⁰₋₁e or β⁻): has mass number 0 and atomic number −1 (an electron from the nucleus)', 'In beta-minus decay: a **neutron → proton + electron** (beta particle); **mass number unchanged**, **atomic number increases by 1**', 'Example: ¹⁴₆C → ¹⁴₇N + ⁰₋₁e', 'Check balance: top (14 = 14 + 0 ✓), bottom (6 = 7 + (−1) ✓)'],
    hint: 'Beta decay: mass stays same, atomic number +1. ⁰₋₁e is the beta particle. Neutron becomes proton → element changes.',
    exam_q: 'Carbon-14 (¹⁴₆C) decays by beta emission. Write a balanced nuclear equation.',
    examMarks: 2,
    examA: 'proton + electron** (beta particle); **mass number unchanged**, **atomic number increases by 1** - Example: ¹⁴₆C → ¹⁴₇N + ⁰₋₁e - Check balance: top (14 = 14 + 0 ✓), bottom (6 = 7 + (−1) ✓) Hint: Beta decay: mass stays same, atomic number +1. ⁰₋₁e is the beta particle. Neutron becomes proton → element changes. Exam Q: "Carbon-14 (¹⁴₆C) decays by beta emission. Write a balanced nuclear equation." [2 marks] → ¹⁴₆C → ¹⁴₇N + ⁰₋₁e — correct nitrogen nucleus (1) + correct beta particle symbol (1).' },

  { id: 'p4_t03', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.4', subtopic_name: 'Nuclear Equations', tier: 'T', exam_board: 'AQA',
    q: 'State the rules for **balancing nuclear equations** and apply them to an unknown product.',
    a: ['**Top numbers (mass numbers)** must sum to the same total on both sides of the equation', '**Bottom numbers (atomic numbers / proton numbers)** must sum to the same total on both sides', 'To find an unknown product: subtract the known particle\'s numbers from the parent nucleus numbers'],
    hint: 'Top = total mass numbers balance. Bottom = total proton numbers balance. Unknown: subtract what you know.',
    exam_q: 'Polonium-218 (²¹⁸₈₄Po) decays by alpha emission. Determine the mass number and atomic number of the daughter nucleus.',
    examMarks: 2,
    examA: 'Mass number = 218 − 4 = **214** (1) + Atomic number = 84 − 2 = **82** / daughter is lead-214 / ²¹⁴₈₂Pb (1).' },

  { id: 'p4_t04', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.5', subtopic_name: 'Half-life Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Define **half-life** and explain what it measures.',
    a: ['**Half-life** is the time it takes for **half** of the radioactive nuclei in a sample to decay', 'Equivalently: the time for the **count rate** (or activity) from a sample to **halve**', 'Half-life is constant for a given isotope — it does not depend on temperature, pressure, or chemical form'],
    hint: 'Half-life = time for count rate (or number of nuclei) to halve. Constant property of each isotope. Cannot be changed.',
    exam_q: 'Define the term \'half-life\' of a radioactive isotope.',
    examMarks: 2,
    examA: 'The time taken for the number of radioactive nuclei / activity / count rate (1) + to decrease to half its initial value (1).' },

  { id: 'p4_t05', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.5', subtopic_name: 'Half-life Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Use the equation **N = N₀ × (½)ⁿ** to calculate remaining activity after n half-lives.',
    a: ['**N = N₀ × (½)ⁿ** where N₀ = initial count/nuclei, N = remaining count/nuclei, n = number of half-lives elapsed', 'Each half-life halves the remaining nuclei/count rate', 'Example: initial count rate 800 Bq, half-life 2 hours — after 6 hours (3 half-lives): N = 800 × (½)³ = 800 × 1/8 = **100 Bq**'],
    hint: 'N = N₀ × (½)ⁿ. Count half-lives elapsed (n = total time ÷ half-life). Then halve n times.',
    exam_q: 'An isotope has a half-life of 5 days. The initial activity is 640 Bq. What is the activity after 20 days?',
    examMarks: 3,
    examA: 'n = 20 ÷ 5 = 4 half-lives (1) + N = 640 × (½)⁴ = 640 × 1/16 (1) = **40 Bq** (1).' },

  { id: 'p4_t06', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.5', subtopic_name: 'Half-life Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Explain how to determine **half-life from a decay graph**.',
    a: ['Plot **count rate (or number of nuclei) on the y-axis** against **time on the x-axis**', 'Identify any count rate on the y-axis; read across to the curve; read down to the time axis → repeat for half that count rate → read off that time', '**Half-life = difference between the two time values** — repeat for several pairs to confirm consistency'],
    hint: 'Pick any y-value. Find when it halves. Read time difference. Repeat to check. Should give same value each time.',
    exam_q: 'Describe how to determine the half-life of a radioactive source from its decay graph.',
    examMarks: 2,
    examA: 'repeat for half that count rate → read off that time - **Half-life = difference between the two time values** — repeat for several pairs to confirm consistency Hint: Pick any y-value. Find when it halves. Read time difference. Repeat to check. Should give same value each time. Exam Q: "Describe how to determine the half-life of a radioactive source from its decay graph." [2 marks] → Choose an initial count rate on the y-axis and find the corresponding time (1) + find the time when the count rate has halved — the half-life is the difference between the two times (1).' },

  { id: 'p4_t07', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.6', subtopic_name: 'Background Radiation Sources', tier: 'T', exam_board: 'AQA',
    q: 'Give **5 sources** of background radiation.',
    a: ['**Rocks and soil**: naturally occurring radioactive elements (uranium, thorium, radium) decay and produce gamma and alpha radiation; radon gas (alpha) seeps from granite rocks', '**Cosmic rays**: high-energy particles from space; contribute significantly at high altitude and in aircraft', '**Food and drink**: radioactive carbon-14 and potassium-40 are naturally present in all food', '**Medical procedures**: X-rays, CT scans, and radioactive tracers contribute a small dose', '**Nuclear industry**: very small contribution in most countries; higher near nuclear plants or after accidents'],
    hint: 'Rocks (radon), cosmic rays, food (C-14/K-40), medical, nuclear industry. RCFMN or "Rocks Can Find Many Neutrons".',
    exam_q: 'State two natural sources of background radiation.',
    examMarks: 2,
    examA: 'Any 2 from: rocks and soil / radon gas (1) + cosmic rays (1) + food and drink (1).' },

  { id: 'p4_t08', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.6', subtopic_name: 'Background Radiation Sources', tier: 'T', exam_board: 'AQA',
    q: 'Explain why **background radiation must be subtracted** when measuring a radioactive source.',
    a: ['**Background radiation** is always present from natural and artificial sources — any detector will record background counts even without the source', 'To find the **true count rate** from a source: true count rate = measured count rate − **background count rate** (measured with the source removed)'],
    hint: 'Background is always there. Source count = total − background. Measure background first (no source), then subtract.',
    exam_q: 'Explain why a student subtracts the background count from their measured count rate.',
    examMarks: 2,
    examA: 'Background radiation is always present from other sources (1) + subtracting it gives the true / net count rate from only the radioactive source being investigated (1).' },

  { id: 'p4_t09', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.7', subtopic_name: 'Uses and Hazards of Radiation', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **medical tracers** and **radiotherapy** use ionising radiation.',
    a: ['**Medical tracers**: a **gamma-emitting** isotope with a short half-life is injected into the patient → detected outside the body by a **gamma camera** → maps blood flow and organ function; gamma chosen because it passes through tissue without being absorbed', '**Radiotherapy**: **focused gamma** or **X-ray beams** from multiple angles are directed at a tumour → high dose at tumour kills cancer cells while minimising damage to surrounding tissue', 'Short half-life tracers are chosen to minimise radiation dose after the scan is complete', 'Beta-emitting isotopes can also be used in **internal radiotherapy** (placed inside the body near the tumour)'],
    hint: 'Tracers = gamma in, detected outside (gamma camera). Radiotherapy = focused beams kill tumour. Both use ionising radiation selectively.',
    exam_q: 'Explain why a gamma-emitting isotope is used rather than an alpha-emitting one for medical tracers.',
    examMarks: 2,
    examA: 'detected outside the body by a **gamma camera** → maps blood flow and organ function; gamma chosen because it passes through tissue without being absorbed - **Radiotherapy**: **focused gamma** or **X-ray beams** from multiple angles are directed at a tumour → high dose at tumour kills cancer cells while minimising damage to surrounding tissue - Short half-life tracers are chosen to minimise radiation dose after the scan is complete - Beta-emitting isotopes can also be used in **internal radiotherapy** (placed inside the body near the tumour) Hint: Tracers = gamma in, detected outside (gamma camera). Radiotherapy = focused beams kill tumour. Both use ionising radiation selectively. Exam Q: "Explain why a gamma-emitting isotope is used rather than an alpha-emitting one for medical tracers." [2 marks] → Gamma radiation can pass out of the body to be detected by a gamma camera (1) + alpha radiation would be absorbed immediately by body tissue and could not be detected externally (1).' },

  { id: 'p4_t10', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.7', subtopic_name: 'Uses and Hazards of Radiation', tier: 'T', exam_board: 'AQA',
    q: 'Explain how a **smoke detector** uses alpha radiation.',
    a: ['Contains an **americium-241** source (alpha emitter) between two metal plates with a potential difference', 'Alpha particles **ionise the air** between the plates → ions carry a small **current** between the plates', 'If **smoke enters**: smoke particles **absorb the alpha radiation** → ionisation decreases → current falls → **alarm sounds**', 'Alpha is used because it is highly ionising (creates lots of ions) but has a very short range (does not escape the detector housing — safe for occupants)'],
    hint: 'Alpha ionises air → current flows → smoke blocks alpha → current drops → alarm. Alpha chosen: highly ionising + short range (safe).',
    exam_q: 'Explain why alpha radiation is used in smoke detectors rather than gamma radiation.',
    examMarks: 2,
    examA: 'ions carry a small **current** between the plates - If **smoke enters**: smoke particles **absorb the alpha radiation** → ionisation decreases → current falls → **alarm sounds** - Alpha is used because it is highly ionising (creates lots of ions) but has a very short range (does not escape the detector housing — safe for occupants) Hint: Alpha ionises air → current flows → smoke blocks alpha → current drops → alarm. Alpha chosen: highly ionising + short range (safe). Exam Q: "Explain why alpha radiation is used in smoke detectors rather than gamma radiation." [2 marks] → Alpha is highly ionising and can ionise air to produce a current (1) + alpha has a very short range in air and is absorbed by the detector casing / gamma would pass straight through and could not be blocked by smoke (1).' },

  { id: 'p4_t11', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.7', subtopic_name: 'Uses and Hazards of Radiation', tier: 'T', exam_board: 'AQA',
    q: 'Explain the **hazards of ionising radiation** and how they relate to the type of radiation.',
    a: ['**Ionising radiation** can knock electrons from atoms → creates ions → can **damage or mutate DNA** → leads to cancer or cell death', '**Alpha** radiation is most **dangerous when inhaled or ingested** (highly ionising, absorbed quickly by surrounding tissue — high energy deposited in small area); less dangerous from outside body (stopped by skin/paper)', '**Beta** radiation can penetrate skin → moderate internal and external hazard; stopped by a few mm of aluminium', '**Gamma** radiation is least ionising per unit path but most **penetrating** (needs thick lead or concrete to stop) → external exposure over large dose is dangerous'],
    hint: 'All ionise DNA → cancer. Alpha = dangerous inside body. Beta = penetrates skin. Gamma = penetrates everything. Range = safety.',
    exam_q: 'Explain why alpha radiation is more dangerous than gamma radiation when the source is inside the body.',
    examMarks: 2,
    examA: 'creates ions → can **damage or mutate DNA** → leads to cancer or cell death - **Alpha** radiation is most **dangerous when inhaled or ingested** (highly ionising, absorbed quickly by surrounding tissue — high energy deposited in small area); less dangerous from outside body (stopped by skin/paper) - **Beta** radiation can penetrate skin → moderate internal and external hazard; stopped by a few mm of aluminium - **Gamma** radiation is least ionising per unit path but most **penetrating** (needs thick lead or concrete to stop) → external exposure over large dose is dangerous Hint: All ionise DNA → cancer. Alpha = dangerous inside body. Beta = penetrates skin. Gamma = penetrates everything. Range = safety. Exam Q: "Explain why alpha radiation is more dangerous than gamma radiation when the source is inside the body." [2 marks] → Alpha is highly ionising and deposits all its energy in a very short range / in surrounding tissue (1) + causing more damage to DNA / cells in the immediate area (1).' },

  { id: 'p4_t12', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', subtopic: 'P4.7', subtopic_name: 'Uses and Hazards of Radiation', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 additional uses** of ionising radiation in industry.',
    a: ['**Sterilising food**: gamma radiation kills bacteria and microorganisms in food → extends shelf life without heating; food does not become radioactive', '**Thickness monitoring**: beta or gamma source on one side of a material and detector on the other; if material is too thick → less radiation detected → rollers adjust; used in paper, foil, and sheet metal production'],
    hint: 'Food sterilisation (gamma kills bacteria). Thickness monitoring (beta/gamma absorbed more by thicker material → feedback control).',
    exam_q: 'Describe how ionising radiation is used to control the thickness of sheet metal.',
    examMarks: 3,
    examA: 'extends shelf life without heating; food does not become radioactive - **Thickness monitoring**: beta or gamma source on one side of a material and detector on the other; if material is too thick → less radiation detected → rollers adjust; used in paper, foil, and sheet metal production Hint: Food sterilisation (gamma kills bacteria). Thickness monitoring (beta/gamma absorbed more by thicker material → feedback control). Exam Q: "Describe how ionising radiation is used to control the thickness of sheet metal." [3 marks] → A radioactive source is placed on one side of the metal sheet and a detector on the other (1) + if the sheet is too thick, less radiation is detected (1) + this signal is used to adjust the rollers / increase the gap to make the sheet thinner (1).' },


  // Physics P5 — Forces (Triple-only additions)
  { id: 'p5_t01', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.7', subtopic_name: 'Momentum', tier: 'T', exam_board: 'AQA',
    q: 'Define **momentum** and state the equation, units and vector nature.',
    a: ['**Momentum (p) = mass (m) × velocity (v)**; p = mv', 'Units: **kg⋅m/s** (kilogram metres per second) or equivalently N⋅s', 'Momentum is a **vector quantity** — it has both magnitude and direction; direction is usually taken as positive in the direction of motion', 'A stationary object has **zero momentum**'],
    hint: 'p = mv. Units kg⋅m/s. Vector — direction matters. p = 0 when v = 0.',
    exam_q: 'Calculate the momentum of a 1200 kg car travelling at 15 m/s.',
    examMarks: 2,
    examA: 'p = mv = 1200 × 15 (1) = **18,000 kg⋅m/s** (1).' },

  { id: 'p5_t02', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.7', subtopic_name: 'Momentum', tier: 'T', exam_board: 'AQA',
    q: 'State and apply the **principle of conservation of momentum**.',
    a: ['**Conservation of momentum**: in a **closed system** (no external forces), the **total momentum before** a collision or explosion **equals the total momentum after**', 'Σp (before) = Σp (after)', 'Applies to collisions (objects join or bounce) and explosions (objects move apart)', 'For two objects: **m₁v₁ + m₂v₂ = m₁v₁\' + m₂v₂\'** (after collision)'],
    hint: 'Total momentum before = total momentum after. No external forces needed for conservation. Works for ALL collisions and explosions.',
    exam_q: 'A 2 kg ball moving at 5 m/s collides with a stationary 3 kg ball. They stick together. Calculate their velocity after the collision.',
    examMarks: 3,
    examA: 'Total momentum before = 2 × 5 + 3 × 0 = 10 kg⋅m/s (1) + momentum after = (2 + 3) × v (1) + v = 10/5 = **2 m/s** (1).' },

  { id: 'p5_t03', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.7', subtopic_name: 'Momentum', tier: 'T', exam_board: 'AQA',
    q: 'Apply conservation of momentum to an **explosion** (recoil).',
    a: ['In an explosion, the **total initial momentum = 0** (both objects start at rest)', 'Total final momentum must also = 0: so the two objects move in **opposite directions** with equal and opposite momenta', 'm₁v₁ = −m₂v₂ (magnitudes equal, directions opposite); lighter object moves faster'],
    hint: 'Explosion: total p = 0 before = 0 after. Two pieces fly apart with equal and opposite momentum. Lighter = faster.',
    exam_q: 'A 70 kg astronaut pushes off a 420 kg spacecraft. The spacecraft moves at 0.5 m/s. Calculate the astronaut\'s recoil speed.',
    examMarks: 3,
    examA: 'Total initial momentum = 0 (1) + 70 × v = 420 × 0.5 (1) + v = 210/70 = **3 m/s** (in opposite direction to spacecraft) (1).' },

  { id: 'p5_t04', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.8', subtopic_name: 'Impulse', tier: 'T', exam_board: 'AQA',
    q: 'Define **impulse** and state the equation linking force, time and momentum.',
    a: ['**Impulse = force × time = change in momentum**; F × t = Δp', 'Units: **N⋅s** (newton seconds) = **kg⋅m/s** (same unit as momentum)', 'Rearranged: **F = Δp/Δt** (force = rate of change of momentum) — Newton\'s Second Law in terms of momentum', 'A larger force or a longer time produces a greater change in momentum'],
    hint: 'Impulse = Ft = Δp. Units: N⋅s = kg⋅m/s. F = Δp/Δt. Longer time = less force for same impulse.',
    exam_q: 'A force of 500 N acts on an object for 0.4 s. Calculate the impulse and the change in momentum.',
    examMarks: 2,
    examA: 'Impulse = F × t = 500 × 0.4 (1) = **200 N⋅s** / change in momentum = 200 kg⋅m/s (1).' },

  { id: 'p5_t05', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.8', subtopic_name: 'Impulse', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **extending the time of a collision** reduces force using the impulse equation.',
    a: ['**F = Δp/Δt**: for a fixed change in momentum (Δp), increasing the time (Δt) **reduces the force** required', 'This is why safety features in vehicles increase collision time: **crumple zones, airbags, seatbelts** all extend Δt → reduce force on occupants', 'Examples: catching a cricket ball with cupped hands pulled back (extends time → reduces sting); gymnastics foam mats; helmets', 'The impulse (Ft) remains the same, but is spread over a longer time → smaller peak force'],
    hint: 'Same Δp. Longer time → less force. F = Δp/Δt. Crumple zones, airbags, padding — all increase collision time.',
    exam_q: 'Explain why crumple zones in cars reduce injury in a collision.',
    examMarks: 2,
    examA: 'reduce force on occupants - Examples: catching a cricket ball with cupped hands pulled back (extends time → reduces sting); gymnastics foam mats; helmets - The impulse (Ft) remains the same, but is spread over a longer time → smaller peak force Hint: Same Δp. Longer time → less force. F = Δp/Δt. Crumple zones, airbags, padding — all increase collision time. Exam Q: "Explain why crumple zones in cars reduce injury in a collision." [2 marks] → Crumple zones increase the time over which the car decelerates (1) + so the force on the occupants is reduced for the same change in momentum / F = Δp/Δt so larger Δt means smaller F (1).' },

  { id: 'p5_t06', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.9', subtopic_name: 'Pressure in Fluids', tier: 'T', exam_board: 'AQA',
    q: 'State and use the equation **P = F/A** for pressure.',
    a: ['**Pressure (P) = Force (F) ÷ Area (A)**; P = F/A', 'Units: **Pa (Pascals)** = **N/m²** (newtons per square metre)', 'A smaller area for the same force gives a **higher pressure** (e.g. stiletto heels, knife blades, drawing pins)'],
    hint: 'P = F/A. Pa = N/m². Smaller area = higher pressure for same force. Sharp things cut better.',
    exam_q: 'A force of 200 N acts on an area of 0.05 m². Calculate the pressure.',
    examMarks: 2,
    examA: 'P = F/A = 200 ÷ 0.05 (1) = **4000 Pa** (1).' },

  { id: 'p5_t07', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.9', subtopic_name: 'Pressure in Fluids', tier: 'T', exam_board: 'AQA',
    q: 'State and use the equation for **pressure due to a column of fluid**: P = hρg.',
    a: ['**P = hρg** where: P = pressure (Pa), h = depth/height of fluid (m), ρ = density of fluid (kg/m³), g = gravitational field strength (N/kg, ≈ 10 N/kg)', 'Pressure **increases with depth** — greater column of fluid above → greater weight pressing down', 'Pressure acts in **all directions** in a fluid (not just downward)', 'A fluid at the same depth is at the same pressure regardless of direction'],
    hint: 'P = hρg. Pressure = depth × density × gravity. Deeper = higher pressure. Acts in all directions.',
    exam_q: 'Calculate the pressure at a depth of 5 m in seawater. [Density of seawater = 1025 kg/m³, g = 10 N/kg]',
    examMarks: 2,
    examA: 'greater weight pressing down - Pressure acts in **all directions** in a fluid (not just downward) - A fluid at the same depth is at the same pressure regardless of direction Hint: P = hρg. Pressure = depth × density × gravity. Deeper = higher pressure. Acts in all directions. Exam Q: "Calculate the pressure at a depth of 5 m in seawater. [Density of seawater = 1025 kg/m³, g = 10 N/kg]" [2 marks] → P = hρg = 5 × 1025 × 10 (1) = **51,250 Pa** (1).' },

  { id: 'p5_t08', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.9', subtopic_name: 'Pressure in Fluids', tier: 'T', exam_board: 'AQA',
    q: 'Explain **upthrust** and the conditions for **floating**.',
    a: ['**Upthrust**: an upward force on any object submerged in (or floating on) a fluid, caused by pressure being greater at the bottom of the object than at the top', 'Upthrust = **weight of fluid displaced** by the object (Archimedes\' principle)', 'An object **floats** if upthrust ≥ weight (i.e. it displaces a volume of fluid whose weight equals its own weight)', 'An object **sinks** if its weight > upthrust (i.e. it is denser than the fluid)'],
    hint: 'Upthrust = weight of fluid displaced. Float when upthrust = weight. Sink when object denser than fluid.',
    exam_q: 'Explain why a steel ship can float even though steel is denser than water.',
    examMarks: 2,
    examA: 'The hollow shape of the ship displaces a large volume of water (1) + the upthrust from this displaced water equals the weight of the ship so it floats (1).' },

  { id: 'p5_t09', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.10', subtopic_name: 'Circular Motion', tier: 'T', exam_board: 'AQA',
    q: 'Explain why an object moving in a circle is **accelerating** even at constant speed.',
    a: ['**Velocity** is a vector — it has both magnitude (speed) and direction', 'In circular motion, the **direction of velocity** continuously changes (always tangential to the circle) even if speed is constant', 'Since velocity is changing, the object is **accelerating** — this acceleration is directed **toward the centre** of the circle (**centripetal acceleration**)'],
    hint: 'Velocity is a vector. Direction changes = velocity changes = acceleration. Acceleration is always toward the centre.',
    exam_q: 'A ball moves at constant speed in a circle. Explain why the ball is accelerating.',
    examMarks: 2,
    examA: 'Velocity is a vector quantity with direction (1) + as the direction of motion continuously changes, the velocity changes even though speed is constant, so the ball is accelerating (1).' },

  { id: 'p5_t10', subject: 'Physics', topic: 'P5', topic_name: 'Forces', subtopic: 'P5.10', subtopic_name: 'Circular Motion', tier: 'T', exam_board: 'AQA',
    q: 'Explain what **centripetal force** is and give examples of what provides it.',
    a: ['**Centripetal force** is the resultant force that causes circular motion — it always acts **toward the centre** of the circle', 'It is not a new type of force — it is always provided by an existing force', 'Examples: **tension** in a string (ball on a string); **gravity** (planets orbiting the Sun, Moon orbiting Earth); **friction** (car going round a bend); **magnetic force** (charged particle in a magnetic field)', 'Without centripetal force, the object would move in a **straight line** (tangent to the circle)'],
    hint: 'Centripetal force = force toward centre. Not a new force — provided by tension, gravity, or friction. Without it → straight line.',
    exam_q: 'A car moves around a circular roundabout. What provides the centripetal force, and in which direction does it act?',
    examMarks: 2,
    examA: 'straight line. Exam Q: "A car moves around a circular roundabout. What provides the centripetal force, and in which direction does it act?" [2 marks] → Friction between the tyres and the road provides the centripetal force (1) + directed toward the centre of the circular path / inward (1).' },


  // Physics P6 — Waves (Triple-only additions)
  { id: 'p6_t01', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.4', subtopic_name: 'Electromagnetic Waves: Uses and Hazards', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **uses and hazards of ultraviolet (UV) radiation**.',
    a: ['**Uses**: detecting forged banknotes (security ink fluoresces under UV); sterilisation of water/surfaces (UV kills bacteria); causes skin to produce **vitamin D**; fluorescent lamps', '**Hazards**: UV from the Sun causes **sunburn** and can damage DNA in skin cells → **skin cancer (melanoma)**; UV also damages the **cornea and lens** of the eye → cataracts and blindness', 'UV is partially blocked by the **ozone layer** in the atmosphere — ozone depletion increases UV risk', 'Protection: SPF sunscreen, UV-blocking glasses, protective clothing'],
    hint: 'UV uses: detect forgeries, sterilise, vitamin D. Hazards: skin cancer, eye damage. Ozone blocks some UV.',
    exam_q: 'Give one use and one hazard of ultraviolet radiation.',
    examMarks: 2,
    examA: '**skin cancer (melanoma)**; UV also damages the **cornea and lens** of the eye → cataracts and blindness - UV is partially blocked by the **ozone layer** in the atmosphere — ozone depletion increases UV risk - Protection: SPF sunscreen, UV-blocking glasses, protective clothing Hint: UV uses: detect forgeries, sterilise, vitamin D. Hazards: skin cancer, eye damage. Ozone blocks some UV. Exam Q: "Give one use and one hazard of ultraviolet radiation." [2 marks] → Use: any 1 from: detecting forged banknotes / sterilisation / security markings / vitamin D production (1) + Hazard: any 1 from: skin cancer / burns / eye damage / cataracts (1).' },

  { id: 'p6_t02', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.4', subtopic_name: 'Electromagnetic Waves: Uses and Hazards', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **uses and hazards of X-rays**.',
    a: ['**Uses**: **medical imaging** — bones absorb X-rays but soft tissue transmits them → shadow image on detector; **CT scans** use rotating X-ray beams for 3D images; **airport security** scanners; detecting cracks in metals (industrial radiography)', '**Hazards**: X-rays are **ionising radiation** — they can damage DNA → mutations → cancer; high dose increases cancer risk', 'Medical staff leave the room or stand behind a lead screen during X-ray procedures', '**Lead aprons** and **limited exposure** reduce dose for patients'],
    hint: 'X-rays: medical imaging (bones absorb), airport security, industrial checks. Hazard: ionising → cancer. Use lead protection.',
    exam_q: 'Explain why X-rays are useful for medical imaging of bones.',
    examMarks: 2,
    examA: 'shadow image on detector; **CT scans** use rotating X-ray beams for 3D images; **airport security** scanners; detecting cracks in metals (industrial radiography) - **Hazards**: X-rays are **ionising radiation** — they can damage DNA → mutations → cancer; high dose increases cancer risk - Medical staff leave the room or stand behind a lead screen during X-ray procedures - **Lead aprons** and **limited exposure** reduce dose for patients Hint: X-rays: medical imaging (bones absorb), airport security, industrial checks. Hazard: ionising → cancer. Use lead protection. Exam Q: "Explain why X-rays are useful for medical imaging of bones." [2 marks] → X-rays are absorbed by dense material such as bone but transmitted through softer tissue (1) + so bones appear as a shadow image/lighter on the detector (1).' },

  { id: 'p6_t03', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.4', subtopic_name: 'Electromagnetic Waves: Uses and Hazards', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **uses and hazards of gamma rays**.',
    a: ['**Uses**: **sterilising medical equipment** (kills bacteria without heating); **cancer treatment** (radiotherapy — focused gamma beams destroy tumour cells); **medical tracers** (gamma cameras, PET scans); checking welds and castings for internal cracks (industrial)', '**Hazards**: highly **penetrating ionising radiation** — can pass through the body and damage DNA in cells → mutations and cancer; requires thick **lead or concrete** shielding', 'Handled by remote control; workers wear **dosimeters** to monitor cumulative exposure', 'Short half-life isotopes used in medicine to minimise ongoing exposure'],
    hint: 'Gamma uses: sterilise equipment, radiotherapy, tracers. Hazards: penetrating ionising radiation → cancer. Shield with lead/concrete.',
    exam_q: 'Explain why gamma radiation is used to sterilise medical equipment rather than ultraviolet radiation.',
    examMarks: 2,
    examA: 'mutations and cancer; requires thick **lead or concrete** shielding - Handled by remote control; workers wear **dosimeters** to monitor cumulative exposure - Short half-life isotopes used in medicine to minimise ongoing exposure Hint: Gamma uses: sterilise equipment, radiotherapy, tracers. Hazards: penetrating ionising radiation → cancer. Shield with lead/concrete. Exam Q: "Explain why gamma radiation is used to sterilise medical equipment rather than ultraviolet radiation." [2 marks] → Gamma radiation is more penetrating than UV (1) + so it can sterilise sealed/packaged equipment by passing through the packaging / whereas UV can only sterilise surfaces (1).' },

  { id: 'p6_t04', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.4', subtopic_name: 'Electromagnetic Waves: Uses and Hazards', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **uses of radio waves and microwaves** in communication.',
    a: ['**Radio waves**: long wavelength → **diffract** over hills and around buildings (long-wave radio); used for AM/FM radio broadcasting, TV, Wi-Fi; very long waves used for **submarine communication** (penetrate water)', '**Microwaves**: used for **satellite communications** (pass through atmosphere without being absorbed); **mobile phones** (3G/4G/5G); **radar** (detect aircraft/ships); **cooking** (absorbed by water molecules → heats food)', 'Radio waves are reflected by the **ionosphere** at certain frequencies → can reach over the horizon', 'Microwaves can cause **heating of body tissue** — there is ongoing research into health effects of prolonged mobile phone use, though current evidence does not confirm harm at normal exposure levels'],
    hint: 'Radio: broadcasting, diffraction, submarines. Microwaves: satellites, mobile phones, cooking, radar. Both used in communication.',
    exam_q: 'Explain why microwaves are used for satellite communication rather than radio waves.',
    examMarks: 2,
    examA: '**diffract** over hills and around buildings (long-wave radio); used for AM/FM radio broadcasting, TV, Wi-Fi; very long waves used for **submarine communication** (penetrate water) - **Microwaves**: used for **satellite communications** (pass through atmosphere without being absorbed); **mobile phones** (3G/4G/5G); **radar** (detect aircraft/ships); **cooking** (absorbed by water molecules → heats food) - Radio waves are reflected by the **ionosphere** at certain frequencies → can reach over the horizon - Microwaves can cause **heating of body tissue** — there is ongoing research into health effects of prolonged mobile phone use, though current evidence does not confirm harm at normal exposure levels Hint: Radio: broadcasting, diffraction, submarines. Microwaves: satellites, mobile phones, cooking, radar. Both used in communication. Exam Q: "Explain why microwaves are used for satellite communication rather than radio waves." [2 marks] → Microwaves can pass through the Earth\'s atmosphere without significant absorption (1) + whereas some radio wavelengths are reflected by the ionosphere and cannot reach satellites (1).' },

  { id: 'p6_t05', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.5', subtopic_name: 'Lenses', tier: 'T', exam_board: 'AQA',
    q: 'Describe a **convex (converging) lens** — shape, effect on light, and focal point.',
    a: ['A **convex lens** is thicker in the middle than at the edges — it **converges** (bends inward) parallel rays of light', 'Parallel rays passing through a convex lens converge to a single point on the other side: the **principal focus (F)** or **focal point**', 'The distance from the lens to the focal point is the **focal length (f)** — shorter focal length = more powerful (more curved) lens'],
    hint: 'Convex = fat in middle = converging = real focal point on far side. Focal length = distance lens to F.',
    exam_q: 'Describe the effect of a convex lens on a beam of parallel light rays.',
    examMarks: 2,
    examA: 'The convex lens refracts / converges the light rays (1) + so they meet at a single point, the principal focus / focal point, on the other side of the lens (1).' },

  { id: 'p6_t06', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.5', subtopic_name: 'Lenses', tier: 'T', exam_board: 'AQA',
    q: 'Describe a **concave (diverging) lens** — shape, effect on light, and virtual focal point.',
    a: ['A **concave lens** is thinner in the middle than at the edges — it **diverges** (spreads outward) parallel rays of light', 'After passing through a concave lens, rays spread apart and appear to come from a **virtual focal point** on the same side as the incoming light', 'The image formed by a concave lens is always **virtual, upright and diminished** (smaller than object)'],
    hint: 'Concave = thin in middle = diverging = virtual focal point (rays don\'t actually meet). Image always virtual, smaller, upright.',
    exam_q: 'Describe the effect of a concave lens on parallel light rays.',
    examMarks: 2,
    examA: 'The concave lens diverges / spreads out the rays (1) + they appear to come from a virtual focal point on the same side as the incident light (1).' },

  { id: 'p6_t07', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.5', subtopic_name: 'Lenses', tier: 'T', exam_board: 'AQA',
    q: 'Distinguish between **real and virtual images** formed by lenses.',
    a: ['**Real image**: formed where rays of light **actually converge** on the other side of the lens from the object; can be projected on a screen; always **inverted** (upside down)', '**Virtual image**: formed where rays appear to diverge **from** — rays don\'t actually meet there; cannot be projected on a screen; always **upright**', 'Convex lens: produces a **real image** when object is beyond the focal point; produces a **virtual image** when object is within the focal length (used as a magnifying glass)', 'Concave lens: always produces a **virtual, upright, diminished** image'],
    hint: 'Real = rays meet = can project on screen = inverted. Virtual = rays don\'t meet = cannot project = upright.',
    exam_q: 'Explain the difference between a real and a virtual image.',
    examMarks: 2,
    examA: 'A real image is formed where light rays actually converge / can be projected onto a screen (1) + a virtual image is where rays appear to come from but do not actually meet / cannot be projected onto a screen (1).' },

  { id: 'p6_t08', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.5', subtopic_name: 'Lenses', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **three standard rays** used in a lens ray diagram.',
    a: ['**Ray 1**: parallel to the principal axis → after the lens, passes through the **principal focus (F)** (for convex); for concave, appears to come from F on same side', '**Ray 2**: through the **centre of the lens** → travels straight through without bending', '**Ray 3**: through the **focal point F on the object side** → emerges parallel to the principal axis (convex lens only)', 'Where any two of these rays intersect → the **image** is located'],
    hint: 'Three rays: (1) parallel → through F; (2) through centre → straight; (3) through near F → parallel. Image where rays meet.',
    exam_q: 'Describe two rays used to locate an image in a ray diagram for a convex lens.',
    examMarks: 2,
    examA: 'after the lens, passes through the **principal focus (F)** (for convex); for concave, appears to come from F on same side - **Ray 2**: through the **centre of the lens** → travels straight through without bending - **Ray 3**: through the **focal point F on the object side** → emerges parallel to the principal axis (convex lens only) - Where any two of these rays intersect → the **image** is located Hint: Three rays: (1) parallel → through F; (2) through centre → straight; (3) through near F → parallel. Image where rays meet. Exam Q: "Describe two rays used to locate an image in a ray diagram for a convex lens." [2 marks] → Any 2 from: a ray parallel to the axis is refracted through the focal point (1) + a ray through the centre of the lens is undeviated (1) + a ray through the near focal point emerges parallel to the axis (1).' },

  { id: 'p6_t09', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.6', subtopic_name: 'Visible Light and Colour', tier: 'T', exam_board: 'AQA',
    q: 'Explain how a **prism** disperses white light and why.',
    a: ['When white light enters a glass prism, each wavelength is **refracted by a different amount** — this is called **dispersion**', '**Violet light** (shorter wavelength) is refracted the **most**; **red light** (longer wavelength) is refracted the **least**', 'This spreads white light into a **continuous spectrum**: Red → Orange → Yellow → Green → Blue → Indigo → Violet (ROYGBIV)'],
    hint: 'Prism disperses white light → spectrum. Violet most refracted. Red least. ROYGBIV in order of refraction (V most to R least).',
    exam_q: 'Explain why a prism disperses white light into a spectrum of colours.',
    examMarks: 2,
    examA: 'Orange → Yellow → Green → Blue → Indigo → Violet (ROYGBIV) Hint: Prism disperses white light → spectrum. Violet most refracted. Red least. ROYGBIV in order of refraction (V most to R least). Exam Q: "Explain why a prism disperses white light into a spectrum of colours." [2 marks] → Different wavelengths of light are refracted by different amounts (1) + violet (shorter wavelength) is refracted more than red (longer wavelength), separating the colours into a spectrum (1).' },

  { id: 'p6_t10', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.6', subtopic_name: 'Visible Light and Colour', tier: 'T', exam_board: 'AQA',
    q: 'Distinguish between **specular** and **diffuse reflection**, and explain **colour filters**.',
    a: ['**Specular reflection**: occurs from a **smooth, flat surface** (e.g. mirror, calm water) — parallel incident rays reflect as parallel rays → clear image formed', '**Diffuse reflection**: occurs from a **rough surface** (e.g. paper, wood) — parallel incident rays reflect in **many different directions** → no clear image, but object is visible from all angles', '**Colour filter**: transmits only certain wavelengths and **absorbs** the rest; a red filter transmits red light and absorbs all other colours', 'An object appears a certain **colour** because it reflects that wavelength and absorbs all others'],
    hint: 'Specular = mirror (smooth, parallel → parallel). Diffuse = rough surface (parallel → scattered). Filter = lets one colour through, absorbs rest.',
    exam_q: 'A white shirt is viewed through a red filter. What colour does the shirt appear? Explain.',
    examMarks: 2,
    examA: 'clear image formed - **Diffuse reflection**: occurs from a **rough surface** (e.g. paper, wood) — parallel incident rays reflect in **many different directions** → no clear image, but object is visible from all angles - **Colour filter**: transmits only certain wavelengths and **absorbs** the rest; a red filter transmits red light and absorbs all other colours - An object appears a certain **colour** because it reflects that wavelength and absorbs all others Hint: Specular = mirror (smooth, parallel → parallel). Diffuse = rough surface (parallel → scattered). Filter = lets one colour through, absorbs rest. Exam Q: "A white shirt is viewed through a red filter. What colour does the shirt appear? Explain." [2 marks] → The shirt appears red (1) + because the red filter only transmits red light / absorbs all other wavelengths — the shirt reflects all colours but only the red light passes through the filter to reach the eye (1).' },

  { id: 'p6_t11', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.7', subtopic_name: 'Black Body Radiation', tier: 'T', exam_board: 'AQA',
    q: 'Define a **perfect black body** and explain its absorption and emission properties.',
    a: ['A **perfect (ideal) black body** is an object that **absorbs all** electromagnetic radiation incident on it — it reflects none and transmits none', 'A perfect black body is also the **best possible emitter** of radiation at any given temperature — it emits more radiation than any other object at the same temperature', 'The radiation emitted by a black body depends only on its **temperature**, not on its material or colour'],
    hint: 'Perfect black body = absorbs ALL radiation, emits MAXIMUM radiation. Properties depend only on temperature.',
    exam_q: 'State two properties of a perfect black body.',
    examMarks: 2,
    examA: 'Absorbs all electromagnetic radiation that falls on it / reflects and transmits none (1) + is the best possible emitter of radiation at a given temperature (1).' },

  { id: 'p6_t12', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.7', subtopic_name: 'Black Body Radiation', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **temperature affects the radiation** emitted by a black body.',
    a: ['All objects **above absolute zero** emit electromagnetic radiation (thermal radiation)', 'As temperature increases, **total power emitted increases** (much greater at high temperature)', 'As temperature increases, the **peak wavelength** of emitted radiation **decreases** (shifts to shorter wavelength / higher frequency)', 'Example: a very hot star emits **blue/white light** (short wavelength peak); a cooler star emits **red light**; the human body emits mainly **infrared** (peak wavelength ~9 μm)'],
    hint: 'Hotter = more radiation + shorter peak wavelength. Sun (very hot) peaks in visible. Humans peak in infrared. Cooler → longer wavelength.',
    exam_q: 'Explain how the peak wavelength of radiation emitted by a black body changes as its temperature increases.',
    examMarks: 2,
    examA: 'longer wavelength. Exam Q: "Explain how the peak wavelength of radiation emitted by a black body changes as its temperature increases." [2 marks] → As temperature increases, the peak wavelength decreases / shifts to shorter wavelengths (1) + so a hotter object emits radiation at higher frequencies / more towards visible light (1).' },

  { id: 'p6_t13', subject: 'Physics', topic: 'P6', topic_name: 'Waves', subtopic: 'P6.7', subtopic_name: 'Black Body Radiation', tier: 'T', exam_board: 'AQA',
    q: 'Explain how the Earth\'s temperature is linked to **emission and absorption** of radiation.',
    a: ['The Earth **absorbs radiation** from the Sun (mainly visible and UV wavelengths)', 'The Earth also **emits radiation** back into space (mainly infrared, because Earth is cooler than the Sun)', 'When **absorbed power = emitted power**, the Earth is in **thermal equilibrium** — its temperature remains constant', 'Greenhouse gases absorb some of the Earth\'s infrared emissions → re-emit some back toward Earth → **greenhouse effect** → temperature rises until new equilibrium is reached'],
    hint: 'Sun in (visible) → Earth absorbed → Earth emits infrared out → equilibrium when in = out. Greenhouse gases trap infrared → warmer equilibrium.',
    exam_q: 'Explain why the Earth\'s surface temperature remains approximately constant over time.',
    examMarks: 2,
    examA: 're-emit some back toward Earth → **greenhouse effect** → temperature rises until new equilibrium is reached Hint: Sun in (visible) → Earth absorbed → Earth emits infrared out → equilibrium when in = out. Greenhouse gases trap infrared → warmer equilibrium. Exam Q: "Explain why the Earth\'s surface temperature remains approximately constant over time." [2 marks] → The Earth absorbs radiation from the Sun (1) + and emits an equal amount of radiation back into space / absorbed power equals emitted power so the temperature is stable (1).' },


  // Physics P7 — Magnetism and Electromagnetism (Triple-only additions)
  { id: 'p7_t01', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.3', subtopic_name: 'Magnetic Fields', tier: 'T', exam_board: 'AQA',
    q: 'Describe the magnetic field pattern around a **bar magnet**.',
    a: ['Magnetic field lines run from **north pole to south pole** outside the magnet (field lines enter the south pole)', 'Lines are **closer together** near the poles → stronger field near the poles; lines spread out away from the magnet', 'Lines never **cross** each other', 'The direction of a field line shows the direction a **free north pole** would move at that point (same as direction a compass needle points)'],
    hint: 'N → S outside magnet. Closer = stronger. Never cross. Compass aligns along field lines.',
    exam_q: 'Describe two features of magnetic field lines around a bar magnet.',
    examMarks: 2,
    examA: 'stronger field near the poles; lines spread out away from the magnet - Lines never **cross** each other - The direction of a field line shows the direction a **free north pole** would move at that point (same as direction a compass needle points) Hint: N → S outside magnet. Closer = stronger. Never cross. Compass aligns along field lines. Exam Q: "Describe two features of magnetic field lines around a bar magnet." [2 marks] → Any 2 from: run from north to south outside the magnet (1) + closer together near the poles (stronger field) (1) + lines never cross (1).' },

  { id: 'p7_t02', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.3', subtopic_name: 'Magnetic Fields', tier: 'T', exam_board: 'AQA',
    q: 'Describe the magnetic field pattern around a **straight current-carrying wire** and around a **solenoid**.',
    a: ['**Straight wire**: magnetic field consists of **concentric circles** centred on the wire; direction given by the **right-hand grip rule** (thumb points in direction of current → fingers curl in direction of field)', '**Solenoid**: the coiled wire creates a field pattern resembling a **bar magnet** — with a north pole at one end and a south pole at the other; field is uniform and strong inside', 'Adding an **iron core** increases field strength significantly (electromagnet)', 'Reversing the **current** reverses the direction of the magnetic field'],
    hint: 'Wire → concentric circles (right-hand rule). Solenoid → like a bar magnet. Iron core = stronger. Reverse current = reverse field.',
    exam_q: 'Describe the shape of the magnetic field around a straight wire carrying a current.',
    examMarks: 2,
    examA: 'fingers curl in direction of field) - **Solenoid**: the coiled wire creates a field pattern resembling a **bar magnet** — with a north pole at one end and a south pole at the other; field is uniform and strong inside - Adding an **iron core** increases field strength significantly (electromagnet) - Reversing the **current** reverses the direction of the magnetic field Hint: Wire → concentric circles (right-hand rule). Solenoid → like a bar magnet. Iron core = stronger. Reverse current = reverse field. Exam Q: "Describe the shape of the magnetic field around a straight wire carrying a current." [2 marks] → Concentric circles centred on the wire (1) + the direction is given by the right-hand grip rule / reversing current reverses the field direction (1).' },

  { id: 'p7_t03', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.3', subtopic_name: 'Magnetic Fields', tier: 'T', exam_board: 'AQA',
    q: 'Explain how to determine the **direction of a magnetic field** around a wire using the **right-hand grip rule**.',
    a: ['**Right-hand grip rule**: imagine gripping the wire with the **right hand**, with the thumb pointing in the direction of the **conventional current** (positive to negative)', 'The **fingers curl** around the wire in the direction of the **magnetic field** (field lines)', 'If the current direction is reversed, the field direction **reverses**'],
    hint: 'Right hand: thumb = current direction, fingers = field direction (curling around). Reverse current = reverse field.',
    exam_q: 'A wire carries a current upward (from bottom to top). Using the right-hand grip rule, describe the direction of the magnetic field at a point to the right of the wire.',
    examMarks: 1,
    examA: 'The field direction is into the page (using right-hand rule: thumb up/current up, fingers show field going clockwise when viewed from above — so to the right, field points away/into page).' },

  { id: 'p7_t04', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.4', subtopic_name: 'The Motor Effect', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **motor effect** and state the equation **F = BIL**.',
    a: ['When a **current-carrying conductor** is placed in a **magnetic field**, it experiences a **force** (unless the conductor is parallel to the field)', '**F = BIL** where: F = force (N), B = magnetic flux density (T, teslas), I = current (A), L = length of conductor in the field (m)', 'The force is **perpendicular** to both the current direction and the magnetic field direction', 'The force is **maximised** when the current is at right angles to the field'],
    hint: 'F = BIL. Motor effect = force on current in magnetic field. Force is perpendicular to both current and field.',
    exam_q: 'A wire of length 0.3 m carries a current of 4 A in a magnetic field of 0.5 T. Calculate the force on the wire.',
    examMarks: 2,
    examA: 'F = BIL = 0.5 × 4 × 0.3 (1) = **0.6 N** (1).' },

  { id: 'p7_t05', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.4', subtopic_name: 'The Motor Effect', tier: 'T', exam_board: 'AQA',
    q: 'Describe **Fleming\'s left-hand rule** and apply it to find force direction.',
    a: ['**Fleming\'s left-hand rule**: hold the left hand with the thumb, first finger and second finger all at right angles to each other:'],
    hint: 'Left hand: First = Field. seCond = Current. thuMb = Motion. "FBI" with the Left hand. All at right angles.',
    exam_q: 'A horizontal wire carries a current to the right in a magnetic field directed into the page. In which direction does the wire experience a force?',
    examMarks: 2,
    examA: 'direction of **Field** (B) - **seCond finger** → direction of **Current** (I) (conventional, from + to −) - **thuMb** → direction of **Motion/Force** (F) - If any two directions are known, the rule gives the third - The rule only applies when current and field are **not parallel** to each other Hint: Left hand: First = Field. seCond = Current. thuMb = Motion. "FBI" with the Left hand. All at right angles. Exam Q: "A horizontal wire carries a current to the right in a magnetic field directed into the page. In which direction does the wire experience a force?" [2 marks] → Using Fleming\'s left-hand rule: field into page (first finger), current to the right (second finger) (1) + force is directed **upward** (thumb) (1).' },

  { id: 'p7_t06', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.4', subtopic_name: 'The Motor Effect', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 ways** to increase the force on a current-carrying conductor in a magnetic field.',
    a: ['**Increase the magnetic flux density (B)**: use a stronger magnet → greater force for same current and length', '**Increase the current (I)**: larger current → greater force → used in electric motor speed control', '**Increase the length of conductor (L)**: more wire in the field → greater total force → done by using many turns of wire in a motor coil'],
    hint: 'F = BIL — to increase F, increase B, I or L. Stronger magnet, more current, or more wire in the field.',
    exam_q: 'Give two ways to increase the force on a current-carrying wire in a magnetic field.',
    examMarks: 2,
    examA: 'greater force for same current and length - **Increase the current (I)**: larger current → greater force → used in electric motor speed control - **Increase the length of conductor (L)**: more wire in the field → greater total force → done by using many turns of wire in a motor coil Hint: F = BIL — to increase F, increase B, I or L. Stronger magnet, more current, or more wire in the field. Exam Q: "Give two ways to increase the force on a current-carrying wire in a magnetic field." [2 marks] → Any 2 from: increase magnetic flux density / use a stronger magnet (1) + increase the current (1) + increase the length of wire in the field (1).' },

  { id: 'p7_t07', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.5', subtopic_name: 'The Generator Effect', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **generator effect** and the conditions needed for it.',
    a: ['An **EMF (electromotive force)** is induced in a conductor when there is **relative movement** between the conductor and a magnetic field (or when the magnetic field through a coil changes)', 'This is called **electromagnetic induction**', 'If the conductor is part of a complete circuit, an **induced current** flows', 'The effect works whether the conductor moves and the field is stationary, or the magnet moves and the conductor is stationary — only **relative motion** matters'],
    hint: 'EMF induced when magnetic field through conductor changes. Generator effect = opposite of motor effect. Relative motion = key.',
    exam_q: 'State the conditions needed for an EMF to be induced in a coil.',
    examMarks: 2,
    examA: 'The coil must be in a changing magnetic field / the magnetic flux through the coil must be changing (1) + this occurs when the coil moves relative to the magnet or when the current in a nearby coil changes (1).' },

  { id: 'p7_t08', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.5', subtopic_name: 'The Generator Effect', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 factors** that affect the **magnitude of the induced EMF**.',
    a: ['**Speed of relative movement**: faster movement → greater rate of change of field → larger induced EMF', '**Number of turns** in the coil: more turns → each turn contributes to the EMF → larger total EMF', '**Strength of the magnetic field**: stronger field → greater flux change → larger induced EMF', '**Reversing** the direction of movement (or reversing the magnet poles) **reverses** the direction of the induced current/EMF'],
    hint: 'EMF ↑ with speed, more turns, stronger magnet. Reverse direction = reverse current. Same as a transformer\'s core principles.',
    exam_q: 'Describe two ways to increase the size of the induced EMF when a magnet is moved into a coil.',
    examMarks: 2,
    examA: 'greater rate of change of field → larger induced EMF - **Number of turns** in the coil: more turns → each turn contributes to the EMF → larger total EMF - **Strength of the magnetic field**: stronger field → greater flux change → larger induced EMF - **Reversing** the direction of movement (or reversing the magnet poles) **reverses** the direction of the induced current/EMF Hint: EMF ↑ with speed, more turns, stronger magnet. Reverse direction = reverse current. Same as a transformer\'s core principles. Exam Q: "Describe two ways to increase the size of the induced EMF when a magnet is moved into a coil." [2 marks] → Any 2 from: move the magnet faster (1) + use more turns on the coil (1) + use a stronger magnet (1).' },

  { id: 'p7_t09', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.6', subtopic_name: 'Transformers', tier: 'T', exam_board: 'AQA',
    q: 'Explain **how a transformer works**.',
    a: ['AC in the **primary coil** creates a **continuously changing magnetic field** in the **iron core**', 'The changing magnetic flux passes through the iron core to the **secondary coil**', 'A **changing magnetic field** induces an **EMF** in the secondary coil (electromagnetic induction)', 'Transformers **only work with AC** — DC creates a constant field → no change → no induced EMF in secondary'],
    hint: 'AC in primary → changing B in iron core → changing flux in secondary → EMF induced. Only AC works (DC = no change = no induction).',
    exam_q: 'Explain why a transformer only works with alternating current.',
    examMarks: 2,
    examA: 'no change → no induced EMF in secondary Hint: AC in primary → changing B in iron core → changing flux in secondary → EMF induced. Only AC works (DC = no change = no induction). Exam Q: "Explain why a transformer only works with alternating current." [2 marks] → The primary coil must produce a changing magnetic field in the iron core (1) + DC produces a constant field / only AC produces a changing field that can induce an EMF in the secondary coil (1).' },

  { id: 'p7_t10', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.6', subtopic_name: 'Transformers', tier: 'T', exam_board: 'AQA',
    q: 'State and use the **transformer equation**: Vp/Vs = Np/Ns.',
    a: ['**Vp/Vs = Np/Ns** where: Vp = primary voltage (V), Vs = secondary voltage (V), Np = number of turns on primary, Ns = number of turns on secondary', '**Step-up transformer**: Ns > Np → Vs > Vp (secondary voltage is higher)', '**Step-down transformer**: Np > Ns → Vp > Vs (secondary voltage is lower)', 'Rearrangements: Vs = Vp × (Ns/Np); Ns = Np × (Vs/Vp)'],
    hint: 'Vp/Vs = Np/Ns. More turns → higher voltage. Step up: more turns on secondary. Step down: fewer turns on secondary.',
    exam_q: 'A transformer has 200 turns on the primary and 50 turns on the secondary. The primary voltage is 240 V. Calculate the secondary voltage.',
    examMarks: 2,
    examA: 'Vs > Vp (secondary voltage is higher) - **Step-down transformer**: Np > Ns → Vp > Vs (secondary voltage is lower) - Rearrangements: Vs = Vp × (Ns/Np); Ns = Np × (Vs/Vp) Hint: Vp/Vs = Np/Ns. More turns → higher voltage. Step up: more turns on secondary. Step down: fewer turns on secondary. Exam Q: "A transformer has 200 turns on the primary and 50 turns on the secondary. The primary voltage is 240 V. Calculate the secondary voltage." [2 marks] → Vs = Vp × (Ns/Np) = 240 × (50/200) (1) = 240 × 0.25 = **60 V** (1).' },

  { id: 'p7_t11', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.6', subtopic_name: 'Transformers', tier: 'T', exam_board: 'AQA',
    q: 'Apply the **power equation** for an ideal transformer: Vp × Ip = Vs × Is.',
    a: ['An **ideal (100% efficient) transformer** transfers all input power to the output: **Vp × Ip = Vs × Is**', 'When voltage is stepped **up**, current is stepped **down** (and vice versa) — power is conserved', 'Example: step-up transformer doubles voltage → current is halved → power in = power out'],
    hint: 'Vp × Ip = Vs × Is (ideal transformer). Voltage up → current down. Power in = power out (100% efficient).',
    exam_q: 'A step-up transformer increases voltage from 25 V to 250 V. If the primary current is 10 A, calculate the secondary current (assume 100% efficiency).',
    examMarks: 2,
    examA: 'current is halved → power in = power out Hint: Vp × Ip = Vs × Is (ideal transformer). Voltage up → current down. Power in = power out (100% efficient). Exam Q: "A step-up transformer increases voltage from 25 V to 250 V. If the primary current is 10 A, calculate the secondary current (assume 100% efficiency)." [2 marks] → Vp × Ip = Vs × Is → 25 × 10 = 250 × Is (1) + Is = 250/250 = **1 A** (1).' },

  { id: 'p7_t12', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', subtopic: 'P7.7', subtopic_name: 'Microphones and Loudspeakers', tier: 'T', exam_board: 'AQA',
    q: 'Explain how a **loudspeaker** converts electrical signals into sound using the **motor effect**.',
    a: ['The loudspeaker contains a **coil of wire** attached to a **paper/plastic cone**, sitting in a **magnetic field** from a permanent magnet', 'An **alternating current** (the electrical audio signal) flows through the coil → produces a **force** on the coil (motor effect) that alternates in direction', 'The **coil and cone vibrate** back and forth at the same frequency as the AC signal', 'The vibrating cone creates **compressions and rarefactions** in the air → **sound waves** at the same frequency as the original signal'],
