// ── Parent feed: renders hardcoded immediately, then upgrades from Supabase ───
async function loadParentFeedContent(_, showSavedOnly) {
  const el = document.getElementById('pcontent-feed');
  if (!el) return;
  if (!STATE.parentSavedTips) STATE.parentSavedTips = new Set();

  function renderFeed(tips) {
    const savedSet = STATE.parentSavedTips;
    const display  = showSavedOnly ? tips.filter(function(t) { return savedSet.has(t.id); }) : tips;
    const toggleBar = '<div style="display:flex;gap:8px;margin-bottom:16px;">'
      + '<button onclick="loadParentFeedContent(null,false)" style="flex:1;padding:9px;border-radius:8px;border:none;'
      + (!showSavedOnly ? 'background:#7C3AED;color:white;' : 'background:#F5F0E8;color:#5D4037;border:1.5px solid #C4A882;')
      + 'font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">All Insights</button>'
      + '<button onclick="loadParentFeedContent(null,true)" style="flex:1;padding:9px;border-radius:8px;border:none;'
      + (showSavedOnly ? 'background:#7C3AED;color:white;' : 'background:#F5F0E8;color:#5D4037;border:1.5px solid #C4A882;')
      + 'font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;">🔖 Saved</button></div>';
    if (display.length === 0) {
      el.innerHTML = toggleBar + '<div style="text-align:center;padding:40px 20px;color:#7B5E45;"><div style="font-size:36px;margin-bottom:12px;">🔖</div><div style="font-size:15px;font-weight:700;">No saved insights yet</div><div style="font-size:13px;margin-top:6px;">Tap 🔖 on any card to save it here.</div></div>';
      return;
    }
    el.innerHTML = toggleBar + display.map(function(t) { return buildFeedCard(t, savedSet.has(t.id), 'feed-hdr-purple'); }).join('');
  }

  // Render hardcoded tips immediately — no blank / loading state
  renderFeed(PARENT_TIPS);

  const token = STATE.user?.token;
  const userId = STATE.user?.id;
  if (!token || !userId) return;

  // Background: fetch bookmarks then Supabase tips, re-render with real data
  try {
    const bRes = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/tip_bookmarks?user_id=eq.' + userId + '&select=tip_id',
      { headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token } });
    if (bRes.ok) {
      const bRows = await bRes.json();
      STATE.parentSavedTips = new Set(bRows.map(function(b) { return b.tip_id; }));
    }
  } catch(e) {}

  try {
    const res = await fetch(
      CONFIG.SUPABASE_URL + '/rest/v1/tips?audience=eq.parent&active=eq.true&select=id,headline,body,reflection_questions,notification_headline&order=created_at.desc&limit=30',
      { headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token } });
    if (res.ok) {
      const rows = await res.json();
      if (rows && rows.length > 0) { renderFeed(rows); return; }
    }
  } catch(e) {}

  // Supabase empty / unavailable — re-render hardcoded with up-to-date bookmarks
  renderFeed(PARENT_TIPS);
}

async function showParentPortal() {

    STATE._parentLastInsightAt = pp[0]?.parent_last_insight_at || null;
    STATE._parentHasPushSub   = !!(pp[0]?.push_subscription);
  } catch(e) { console.error('[ParentPortal] parent profile fetch error:', e); }

  // ── 3. Fetch child profile + history ──
  let child = { name: 'Your Child', streak: 0, xp: 0, level: 1, tier: '', year_group: null, exam_board: 'AQA', user_id: null };
  let childHistory = [];

  if (linkedStudentId) {
    try {

      console.log('[ParentPortal] fetching child profile:', cUrl);
      const cRes = await fetch(cUrl, { headers });
      const cProfiles = cRes.ok ? await cRes.json() : [];
      console.log('[ParentPortal] child profile response (status', cRes.status, '):', JSON.stringify(cProfiles));
      if (cProfiles[0]) {
        const cp = cProfiles[0];
        child = {
          name: cp.display_name || 'Your Child',
          streak: cp.streak || 0,
          xp: cp.xp || 0,
          level: cp.level || Math.floor((cp.xp || 0) / 200) + 1,
          tier: cp.tier || '',
          year_group: cp.year_group,
          exam_board: cp.exam_board || 'AQA',
          user_id: cp.user_id,
          locked_topics: Array.isArray(cp.locked_topics) ? cp.locked_topics : [],
          schedule_locked: cp.schedule_locked || false

      } else {
        console.warn('[ParentPortal] child profile returned empty — RLS may be blocking or wrong user_id');

    } catch(e) { console.error('[ParentPortal] child profile fetch error:', e); }

    if (child.user_id) {
      try {
        const hRes = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/study_history?user_id=eq.' + child.user_id + '&select=card_id,question,subject,topic_name,grade,created_at&order=created_at.desc', { headers });

  } else {

  // ── 4. Compute stats + topics from history ──

    if (!h.topic_name) return;

// ── Shared helper: call link RPC, return {userId} or {error:'not_found'|'limit'|'network'} ──
async function callLinkParentRPC(code) {
  const token = STATE.user?.token;
  if (!token) return { error: 'network' };
  const headers = { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  try {
    const res = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/rpc/link_parent_to_student',
      { method: 'POST', headers, body: JSON.stringify({ p_code: code }) });
    if (!res.ok) {
      const err = await res.json().catch(function() { return {}; });
      const msg = (err.message || err.hint || '').toUpperCase();
      return msg.includes('PARENT_LIMIT_REACHED') ? { error: 'limit' } : { error: 'network' };
    }
    const userId = await res.json().catch(function() { return null; });
    return userId ? { userId } : { error: 'not_found' };
  } catch(e) {
    return { error: 'network' };
  }
}

function handleLinkError(error) {
  if (error === 'limit')     showToast('This code has already been used. Please contact your child to check their parent code.');
  else if (error === 'not_found') showToast('Code not found — check with your child');
  else                       showToast('Could not link — check your connection');
}

async function linkParentAccount() {
  const code = (document.getElementById('parent-link-input')?.value || '').trim().toUpperCase();
  if (!code) { showToast('Enter your child\'s parent code'); return; }
  showToast('Linking...');
  const result = await callLinkParentRPC(code);
  if (result.userId) {
    STATE.user.linked_student_id = result.userId;
    STATE.parentActiveChildId = result.userId;
    showToast('Account linked! ✅');
    showParentPortal();
  } else {
    handleLinkError(result.error);
  }
}

function loadParentTrackerContent() {
  const el = document.getElementById('pcontent-tracker');
  if (!el) return;
  if (el.dataset.loaded) return; // don't reload on repeat clicks

  const child   = STATE._parentChildProfile;
  const history = STATE._parentChildHistory || [];

  if (!child) {
    el.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#94A3B8;font-weight:700;">No child data available.</div>';
    return;
  }

  // Show loading immediately
  el.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#64748B;"><div style="font-size:32px;margin-bottom:12px;">⏳</div><div style="font-size:15px;font-weight:700;">Building progress tracker…</div></div>';

  // Build per-card stats from study_history (grade 3 = easy)
  const cardStats = {};
  history.forEach(function(h) {
    if (!h.card_id) return;
    if (!cardStats[h.card_id]) cardStats[h.card_id] = { attempts: 0, good: 0 };
    cardStats[h.card_id].attempts++;
    if (h.grade >= 3) cardStats[h.card_id].good++;
  });

  const allCards = getCardsForUser(child);
  if (allCards.length === 0) {
    el.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#94A3B8;font-weight:700;">No cards available for ' + (child.name || 'this child') + '\'s tier/settings.</div>';
    return;
  }

  const SUBJ_ORDER = ['Biology','Chemistry','Physics'];
  const SUBJ_EMOJI = { Biology:'🌿', Chemistry:'⚗️', Physics:'⚡' };
  const hier = {};
  SUBJ_ORDER.forEach(function(s) { hier[s] = { topics: {}, mem: 0, mas: 0, total: 0 }; });

  allCards.forEach(function(card) {
    const s = card.subject;
    if (!hier[s]) return;
    const t = card.topic;
    if (!hier[s].topics[t]) hier[s].topics[t] = { name: card.topic_name || t, cards: [], mem: 0, mas: 0 };
    const st  = cardStats[card.id] || { attempts: 0, good: 0 };
    const mem = st.good >= 1;
    const mas = st.good >= 3;
    const q   = (card.q || '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1').trim();
    hier[s].topics[t].cards.push({ q, mem, mas });
    if (mem) { hier[s].topics[t].mem++; hier[s].mem++; }
    if (mas) { hier[s].topics[t].mas++; hier[s].mas++; }
    hier[s].total++;
  });

  const topicSort = function(a, b) { const n = function(k) { const m = k.match(/(\d+)$/); return m ? +m[1] : 0; }; return n(a) - n(b); };

  let h = '<div class="pt-wrap">';
  h += '<div class="pt-legend"><span style="font-weight:700;color:#475569;">Tap subject to expand</span>';
  h += '<span class="pt-pip" style="background:#64D870;color:#14532D;">✓ Memorised (1+ correct)</span>';
  h += '<span class="pt-pip" style="background:#007D0C;color:#fff;">★ Mastered (3+ correct)</span>';
  h += '<span class="pt-pip" style="background:#F1F5F9;color:#475569;">○ Not yet studied</span></div>';

  SUBJ_ORDER.forEach(function(subj, si) {
    const sd = hier[subj];
    if (!sd || sd.total === 0) return;
    const eid = 'ppt-s' + si;
    h += '<div class="pt-entry" id="' + eid + '">';
    h += '<div class="pt-row pt-subject-row" onclick="ptToggle(\'' + eid + '\')">';
    h += '<span class="pt-chevron">▶</span><span>' + SUBJ_EMOJI[subj] + ' ' + subj + '</span>';
    h += '<div class="pt-counts"><span class="pt-badge pt-badge-m">✓ ' + sd.mem + ' Memorised</span>';
    h += '<span class="pt-badge pt-badge-s">★ ' + sd.mas + ' Mastered</span>';
    h += '<span class="pt-badge-t">' + sd.total + '</span></div></div>';
    h += '<div class="pt-children">';
    Object.keys(sd.topics).sort(topicSort).forEach(function(topicCode, ti) {
      const td = sd.topics[topicCode];
      const teid = 'ppt-s' + si + 't' + ti;
      h += '<div class="pt-entry" id="' + teid + '">';
      h += '<div class="pt-row pt-topic-row" onclick="ptToggle(\'' + teid + '\')">';
      h += '<span class="pt-chevron">▶</span><span>' + topicCode + ' — ' + td.name + '</span>';
      h += '<div class="pt-counts"><span class="pt-badge pt-badge-m">✓ ' + td.mem + '</span>';
      h += '<span class="pt-badge pt-badge-s">★ ' + td.mas + '</span>';
      h += '<span class="pt-badge-t">/ ' + td.cards.length + '</span></div></div>';
      h += '<div class="pt-children">';
      td.cards.forEach(function(c) {
        h += '<div class="pt-card-item ' + (c.mas ? 'pt-mas' : c.mem ? 'pt-mem' : '') + '">' + c.q + '</div>';
      });
      h += '</div></div>';
    });
    h += '</div></div>';
  });

  h += '</div>';
  el.innerHTML = h;
  el.dataset.loaded = '1';
}

function toggleParentAccountDetails() {
  const body = document.getElementById('parent-acct-body');
  const chev = document.getElementById('parent-acct-chevron');
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? '' : 'rotate(180deg)';
}

async function saveParentDisplayName() {
  const name = (document.getElementById('parent-edit-name')?.value || '').trim();
  if (!name) { showToast('Please enter a name'); return; }
  const user = STATE.user;
  if (!user?.token || !user?.id) { showToast('Not logged in'); return; }
  try {
    const res = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + user.id, {
      method: 'PATCH',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + user.token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ display_name: name })
    });
    if (res.ok || res.status === 204) {
      STATE.user.display_name = name;
      showToast('Name saved! ✅');
    } else {
      showToast('Could not save — try again');
    }
  } catch(e) {
    showToast('Could not save — check connection');
  }
}

async function saveParentPassword() {
  const pw  = (document.getElementById('parent-new-password')?.value  || '').trim();
  const pw2 = (document.getElementById('parent-confirm-password')?.value || '').trim();
  if (!pw) { showToast('Enter a new password'); return; }
  if (pw.length < 6) { showToast('Password must be at least 6 characters'); return; }
  if (pw !== pw2) { showToast('Passwords don\'t match'); return; }
  const token = STATE.user?.token;
  if (!token) { showToast('Not logged in'); return; }
  try {
    const res = await fetch(CONFIG.SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
      showToast('Password updated! ✅');
      const p1 = document.getElementById('parent-new-password');
      const p2 = document.getElementById('parent-confirm-password');
      if (p1) p1.value = '';
      if (p2) p2.value = '';
    } else {
      const err = await res.json().catch(function() { return {}; });
      showToast(err.message || 'Could not update password — try again');
    }
  } catch(e) {
    showToast('Could not update — check connection');
  }
}

function viewChildProgress(childId) {
  STATE.parentActiveChildId = childId;
  showParentPortal();
}

// ── Notifications section (shared by parent + student profiles) ───────────────
function buildNotifSectionHTML(context, childName, hasPushSub, dailyTipsOn, studyAlertsOn) {
  const permission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
  // When hasPushSub is not passed, use STATE (parent) or Notification.permission as proxy (student).
  // refreshNotifSection() always passes the real DB-fetched value.
  const isOn = permission === 'granted' && (hasPushSub !== undefined ? !!hasPushSub : (context === 'parent' ? !!STATE._parentHasPushSub : true));
  const isParent = context === 'parent';
  const cardStyle = isParent
    ? 'background:white;border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid #E2E8F0;box-shadow:0 1px 6px rgba(0,0,0,.06);'
    : 'background:white;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #E2E8F0;';
  const labelStyle = 'font-size:11px;font-weight:800;color:#64748B;letter-spacing:.08em;margin-bottom:12px;';
  const cName = childName || 'your child';
  const enableFn  = isParent ? 'enableParentNotifications()'  : 'enableStudentNotifications()';
  const disableFn = isParent ? 'disableParentNotifications()' : 'disableStudentNotifications()';

  let h = '<div style="' + cardStyle + '">';
  h += '<div style="' + labelStyle + '">NOTIFICATIONS</div>';

  if (permission === 'unsupported') {
    h += '<div style="font-size:13px;color:#64748B;font-weight:600;line-height:1.5;">Push notifications aren\'t supported in this browser. Try adding the app to your home screen for full notification support.</div>';

  } else if (permission === 'denied') {
    h += '<div style="display:flex;gap:12px;align-items:flex-start;">'
      + '<div style="font-size:22px;flex-shrink:0;">🔕</div>'
      + '<div><div style="font-size:14px;font-weight:800;color:#EF4444;margin-bottom:5px;">Notifications blocked</div>'
      + '<div style="font-size:13px;color:#64748B;font-weight:600;line-height:1.55;">Your browser is blocking notifications for this site. Open your browser or device <strong>Settings → Notifications</strong> and allow them for this site, then come back here.</div>'
      + '</div></div>';

  } else {
    // Toggle row — tapping switches on/off
    const toggleFn = isOn ? disableFn : enableFn;
    const trackColor = isOn ? '#22C55E' : '#CBD5E1';
    const knobPos    = isOn ? 'right:3px' : 'left:3px';
    h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">'
      + '<div>'
      + '<div style="font-size:14px;font-weight:800;color:#0F172A;margin-bottom:3px;">Push notifications</div>'
      + '<div style="font-size:12px;font-weight:600;color:' + (isOn ? '#16A34A' : '#94A3B8') + ';">'
      + (isOn ? 'On — active on this device' : 'Off') + '</div>'
      + '</div>'
      + '<div onclick="' + toggleFn + '" style="flex-shrink:0;width:46px;height:26px;border-radius:13px;background:' + trackColor + ';position:relative;cursor:pointer;transition:background .2s;">'
      + '<div style="position:absolute;' + knobPos + ';top:3px;width:20px;height:20px;border-radius:50%;background:white;box-shadow:0 1px 3px rgba(0,0,0,.2);"></div>'
      + '</div>'
      + '</div>';

    if (isOn) {
      h += '<div style="border-top:1px solid #F1F5F9;padding-top:16px;margin-top:16px;">'
        + '<div style="font-size:12px;font-weight:800;color:#64748B;margin-bottom:12px;">WHAT YOU\'LL RECEIVE</div>';
      if (isParent) {
        const dOn = dailyTipsOn !== undefined ? !!dailyTipsOn : true;
        const sOn = studyAlertsOn !== undefined ? !!studyAlertsOn : true;
        const safeCName = String(cName).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        h += buildNotifToggleRow('Daily learning tips', 'A personalised insight about how ' + cName + ' learns best, every 3 days', dOn,
          "toggleNotifPref('parent','notif_daily_tips'," + dOn + ",'parent-notif-section','" + safeCName + "')");
        h += buildNotifToggleRow('Study alerts for ' + cName, 'An evening nudge if ' + cName + ' hasn\'t studied yet', sOn,
          "toggleNotifPref('parent','notif_study_alerts'," + sOn + ",'parent-notif-section','" + safeCName + "')");
      } else {
        h += buildNotifToggleRow('Study reminders', 'Daily prompt to review your flashcards', true);
        h += buildNotifToggleRow('Streak alerts', 'A warning before you lose your study streak', false);
      }
      h += '</div>';
    }
  }

  h += '</div>';
  return h;
}

function buildNotifToggleRow(label, description, enabled, onclickAttr) {

  return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;' + (clickable ? 'cursor:pointer;' : '') + '"' + (clickable ? ' onclick="' + onclickAttr + '"' : '') + '>'
    + '<div style="flex:1;min-width:0;">'
    + '<div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;">'
    + '<div style="font-size:13px;font-weight:800;color:' + (enabled ? '#0F172A' : '#94A3B8') + ';">' + label + '</div>'
    + (!enabled && !clickable ? '<span style="font-size:10px;font-weight:800;color:#94A3B8;background:#F1F5F9;padding:2px 7px;border-radius:10px;">COMING SOON</span>' : '')
    + '</div>'
    + '<div style="font-size:12px;color:#94A3B8;font-weight:600;line-height:1.4;">' + description + '</div>'
    + '</div>'
    + (enabled
      ? '<div style="flex-shrink:0;width:40px;height:22px;border-radius:11px;background:#22C55E;position:relative;margin-top:2px;">'
        + '<div style="position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:white;"></div>'
        + '</div>'
      : '<div style="flex-shrink:0;width:40px;height:22px;border-radius:11px;background:#E2E8F0;position:relative;margin-top:2px;' + (clickable ? '' : 'opacity:0.5;') + '">'

    + '</div>';
}

// Single source of truth: fetches push_subscription + pref columns from Supabase and re-renders.
// Called on every profile-tab open AND after every enable/disable action.
async function refreshNotifSection(context, sectionId, childName) {
  const sec = document.getElementById(sectionId);
  if (!sec) return;

  const permission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
  if (permission === 'unsupported' || permission === 'denied') {
    sec.innerHTML = buildNotifSectionHTML(context, childName, false);
    return;
  }

  const user = STATE.user;
  let hasPushSub = false, dailyTipsOn = true, studyAlertsOn = true;
  if (user?.token && user?.id) {
    try {
      const res = await fetch(
        CONFIG.SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + user.id + '&select=push_subscription,notif_daily_tips,notif_study_alerts',
        { headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + user.token } }
      );
      if (res.ok) {
        const rows = await res.json();
        hasPushSub     = !!(rows[0]?.push_subscription);
        dailyTipsOn    = rows[0]?.notif_daily_tips !== false;
        studyAlertsOn  = rows[0]?.notif_study_alerts !== false;
      }
    } catch(_) {}
  }

  sec.innerHTML = buildNotifSectionHTML(context, childName, hasPushSub, dailyTipsOn, studyAlertsOn);
}

async function toggleNotifPref(context, prefKey, currentValue, sectionId, childName) {
  const user = STATE.user;
  if (!user?.token || !user?.id) return;
  const newValue = !currentValue;
  try {
    const res = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + user.id, {
      method: 'PATCH',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + user.token, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ [prefKey]: newValue })
    });
    if (!res.ok) { showToast('Could not save — please try again'); return; }
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) { showToast('Could not save — please try again'); return; }
    showToast(newValue ? 'Turned on' : 'Turned off');
  } catch(e) { showToast('Could not save — please try again'); return; }
  await refreshNotifSection(context, sectionId, childName);
}

async function enableParentNotifications() {
  if (typeof Notification === 'undefined' || !('serviceWorker' in navigator)) {
    showToast('Notifications not supported in this browser'); return;
  }
  if (Notification.permission === 'denied') {
    showToast('Notifications are blocked — please enable them in your browser or device settings'); return;
  }
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  const cName = STATE._parentChildProfile?.name ? STATE._parentChildProfile.name.split(' ')[0] : null;
  const sec = document.getElementById('parent-notif-section');
  if (perm !== 'granted') {
    if (sec) sec.innerHTML = buildNotifSectionHTML('parent', cName, false);
    return;
  }
  const saved = await registerPushSubscription();
  if (saved) {
    STATE._parentHasPushSub = true;
    if (sec) sec.innerHTML = buildNotifSectionHTML('parent', cName, true);
    showToast('Notifications enabled! 🔔');
  } else {
    if (sec) sec.innerHTML = buildNotifSectionHTML('parent', cName, false);
    showToast('Could not save — please try again');
  }
}

async function disableParentNotifications() {
  const user = STATE.user;
  const cName = STATE._parentChildProfile?.name ? STATE._parentChildProfile.name.split(' ')[0] : null;
  if (!user?.token || !user?.id) return;
  try {
    await fetch(CONFIG.SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + user.id, {
      method: 'PATCH',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + user.token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ push_subscription: null })
    });
  } catch(_) {}
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch(_) {}
  STATE._parentHasPushSub = false;
  const sec = document.getElementById('parent-notif-section');
  if (sec) sec.innerHTML = buildNotifSectionHTML('parent', cName, false);
  showToast('Notifications turned off');
}

async function enableStudentNotifications() {
  if (typeof Notification === 'undefined' || !('serviceWorker' in navigator)) {
    showToast('Notifications not supported in this browser'); return;
  }
  if (Notification.permission === 'denied') {
    showToast('Notifications are blocked — please enable them in your browser or device settings'); return;
  }
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  const sec = document.getElementById('student-notif-section');
  if (perm !== 'granted') {
    if (sec) sec.innerHTML = buildNotifSectionHTML('student', null, false);
    return;

async function init() {
  // Handle Stripe redirect
  if (window.location.search.includes('upgraded=true')) {
    const saved = LS.get('demo_user');
    if (saved && saved.id) {
      STATE.user = saved;
      STATE.role = saved.role || 'student';
      showUpgradedCelebration();
      return;
    }
  }

  function _clearAllStorage() {
    try {
      [localStorage, sessionStorage].forEach(store => {
        Object.keys(store).filter(k => k.startsWith('ss_')).forEach(k => store.removeItem(k));
      });
      Object.keys(localStorage).filter(k => k.startsWith('sb-') && k.endsWith('-auth-token')).forEach(k => localStorage.removeItem(k));
    } catch(e) {}
  }

  const saved = LS.get('demo_user');

  const _urlScreen = new URLSearchParams(window.location.search).get('screen') || null;

  if (saved && saved.id && saved.refresh_token) {
    // Restore session immediately so there's no blank screen
    STATE.user = saved;
    STATE.role = saved.role || 'student';
    afterLogin(_urlScreen);
    // Validate token in background — redirect to auth silently if expired
    fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token: saved.refresh_token })
    }).then(r => r.json()).then(data => {
      if (data.access_token) {
        STATE.user = { ...STATE.user, token: data.access_token, refresh_token: data.refresh_token };
        LS.set('demo_user', STATE.user);
      } else {
        // Token rejected by server — log out cleanly
        _clearAllStorage();
        STATE.user = null; STATE.role = null;
        showAuth();
      }
    }).catch(() => {
      // Network error — keep showing app (user may be offline)
    });
    return;
  }

  // Try reading Supabase native session from localStorage
  try {
    const sbKey = Object.keys(localStorage).find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
    if (sbKey) {
      const sbSession = JSON.parse(localStorage.getItem(sbKey));
      if (sbSession && sbSession.access_token && sbSession.user) {
        const u = sbSession.user;
        const meta = u.user_metadata || {};
        STATE.user = {
          id: u.id, email: u.email,
          token: sbSession.access_token, refresh_token: sbSession.refresh_token,
          display_name: meta.display_name || u.email,
          role: meta.role || 'student',
          year_group: meta.year_group || 11,
          tier: meta.tier || 'combined_higher',
          exam_board: meta.exam_board || 'AQA',
          class_code: meta.class_code || null,
          parent_code: meta.parent_code || null,
          xp: meta.xp || 0, streak: meta.streak || 0, level: meta.level || 1,
          ai_mode: meta.ai_mode !== false,
        };
        STATE.role = STATE.user.role;
        LS.set('demo_user', STATE.user);
        afterLogin(_urlScreen);
        return;
      }
    }
  } catch(e) {}

  showAuth();
}

function renderMarkdown(text) {
  // Escape HTML so AI can't inject tags
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = esc(text).split('\n');
  let html = '';
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Table: current line has pipes and next is a separator row
    if (line.trim().startsWith('|') && i + 1 < lines.length && /^\|[\s\-:|]+\|/.test(lines[i+1].trim())) {
      const cols = line.split('|').slice(1,-1);
      let t = '<table style="border-collapse:collapse;width:100%;font-size:0.82rem;margin:6px 0;">';
      t += '<thead><tr>' + cols.map(h => `<th style="border:1px solid #e2e8f0;padding:5px 8px;background:#f1f5f9;font-weight:800;text-align:left;">${h.trim()}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        const cells = lines[i].split('|').slice(1,-1);
        t += '<tr>' + cells.map(c => `<td style="border:1px solid #e2e8f0;padding:5px 8px;">${c.trim()}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      html += t;
      continue;
    }
    // Headings
    if (/^### /.test(line)) {
      html += `<div style="font-size:0.88rem;font-weight:800;color:#1e293b;margin:8px 0 3px;">${line.slice(4)}</div>`;
    } else if (/^## /.test(line)) {
      html += `<div style="font-size:0.93rem;font-weight:800;color:#1e293b;margin:10px 0 4px;">${line.slice(3)}</div>`;
    } else if (/^# /.test(line)) {
      html += `<div style="font-size:1rem;font-weight:900;color:#1e293b;margin:12px 0 5px;">${line.slice(2)}</div>`;
    } else if (line.trim() === '') {
      html += '<br>';
    } else {
      const inline = line
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
      html += inline + '<br>';
    }
    i++;
  }
  return html.trimEnd().replace(/(<br>)+$/, '');
}
