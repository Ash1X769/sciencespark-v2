    a: ['**Nylon** (polyamide): monomers are a **diamine** (–NH₂ at both ends) and a **dicarboxylic acid** (–COOH at both ends); bond formed = **amide bond (–CO–NH–)**; water is eliminated', '**Polyester** (e.g. Terylene/PET): monomers are a **diol** (–OH at both ends) and a **dicarboxylic acid** (–COOH at both ends); bond formed = **ester bond (–COO–)**; water is eliminated', 'Each is formed by the reaction of functional groups on alternating monomers along the chain', 'Both are **thermoplastic** — can be melted and reformed'],
    hint: 'Nylon = diamine + diacid → amide bond. Polyester = diol + diacid → ester bond. Both lose water.',
    exam_q: 'Name the type of bond formed between monomers in nylon.',
    examMarks: 1,
    examA: 'amide bond. Polyester = diol + diacid → ester bond. Both lose water. Exam Q: "Name the type of bond formed between monomers in nylon." [1 mark] → Amide bond / peptide bond.' },

  { id: 'c7_t14', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.6', subtopic_name: 'Condensation Polymers', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 examples of natural condensation polymers**.',
    a: ['**Proteins**: formed from **amino acid** monomers linked by **peptide bonds** (which are amide bonds –CO–NH–) — the same type of bond as in nylon', '**DNA**: formed from **nucleotide** monomers linked by **phosphodiester bonds** via condensation reactions', '**Starch and cellulose**: formed from **glucose** monomers linked by **glycosidic bonds** (condensation of –OH groups); water is eliminated with each bond'],
    hint: 'Proteins (amino acids → peptide bonds). DNA (nucleotides). Starch (glucose monomers). All natural condensation polymers.',
    exam_q: 'Give two examples of naturally occurring condensation polymers.',
    examMarks: 2,
    examA: 'peptide bonds). DNA (nucleotides). Starch (glucose monomers). All natural condensation polymers. Exam Q: "Give two examples of naturally occurring condensation polymers." [2 marks] → Any 2 from: proteins (amino acids joined by peptide bonds) / DNA (nucleotides) / starch or cellulose (glucose monomers).' },


  // Chemistry C8 — Chemical Analysis (Triple-only additions)
  { id: 'c8_t01', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.2', subtopic_name: 'Chromatography and Rf Values', tier: 'T', exam_board: 'AQA',
    q: 'Define **Rf value** and state the formula used to calculate it.',
    a: ['**Rf value** (retardation factor) = **distance moved by substance ÷ distance moved by solvent front**', 'Rf values are always between **0 and 1** (the substance can never travel further than the solvent)', 'Rf is characteristic for a particular substance in a given solvent and stationary phase — can be used to **identify unknown substances** by comparison with reference Rf values'],
    hint: 'Rf = spot distance ÷ solvent front distance. Always 0–1. Same substance = same Rf in same conditions.',
    exam_q: 'A spot travels 4.8 cm and the solvent front travels 8.0 cm. Calculate the Rf value.',
    examMarks: 2,
    examA: 'Rf = 4.8 ÷ 8.0 (1) = **0.60** (1).' },

  { id: 'c8_t02', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.2', subtopic_name: 'Chromatography and Rf Values', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **Rf values** are used to identify substances.',
    a: ['After running a chromatogram, measure the distance each spot travelled from the baseline and the distance the solvent front travelled', 'Calculate Rf for each spot: **Rf = distance of spot ÷ distance of solvent front**', 'Compare the calculated Rf values to a **reference table** or run known reference substances alongside — matching Rf values indicates the same substance'],
    hint: 'Calculate each spot\'s Rf. Compare to known values. Match = same substance. Works if same solvent and conditions used.',
    exam_q: 'Explain how a student could use Rf values to identify the components in an ink sample.',
    examMarks: 3,
    examA: 'Run the ink sample alongside known reference dyes on chromatography paper using the same solvent (1) + calculate Rf value for each spot = distance moved by spot ÷ distance moved by solvent front (1) + spots with the same Rf as a reference dye are the same substance (1).' },

  { id: 'c8_t03', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.2', subtopic_name: 'Chromatography and Rf Values', tier: 'T', exam_board: 'AQA',
    q: 'Describe **gas chromatography (GC)** — how it works and how it identifies substances.',
    a: ['A **vaporised** mixture is carried by an inert **carrier gas** (e.g. nitrogen or helium) through a long column packed with a solid or liquid stationary phase', 'Substances travel through the column at different speeds depending on their attraction to the stationary phase → they are **separated in time**', 'Each substance exits the column at a characteristic **retention time** — used to identify the substance', 'GC can be linked to a **mass spectrometer (GC-MS)** to identify substances even more precisely by their mass spectra'],
    hint: 'Vaporise → carrier gas pushes through column → each substance exits at different time (retention time) → identifies each one.',
    exam_q: 'Describe how gas chromatography separates a mixture.',
    examMarks: 2,
    examA: 'they are **separated in time** - Each substance exits the column at a characteristic **retention time** — used to identify the substance - GC can be linked to a **mass spectrometer (GC-MS)** to identify substances even more precisely by their mass spectra Hint: Vaporise → carrier gas pushes through column → each substance exits at different time (retention time) → identifies each one. Exam Q: "Describe how gas chromatography separates a mixture." [2 marks] → The vaporised mixture is carried through a column by an inert gas (1) + different substances interact differently with the column material / travel at different speeds / exit at different retention times (1).' },

  { id: 'c8_t04', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.3', subtopic_name: 'Flame Emission Spectroscopy', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **flame emission spectroscopy** works.',
    a: ['A **solution** of the sample is introduced into a hot flame', 'Metal ions absorb energy from the flame and electrons are excited to higher energy levels; when they fall back, they **emit light** of specific wavelengths', 'This light is passed through a **prism or diffraction grating** and split into a **line spectrum** — a pattern of coloured lines at specific wavelengths', 'Each element produces a **unique line spectrum** — a "fingerprint" for that element'],
    hint: 'Sample in flame → electrons excited → fall back → emit light → split into line spectrum. Each element has a unique pattern.',
    exam_q: 'Describe how flame emission spectroscopy is used to identify metal ions.',
    examMarks: 3,
    examA: 'electrons excited → fall back → emit light → split into line spectrum. Each element has a unique pattern. Exam Q: "Describe how flame emission spectroscopy is used to identify metal ions." [3 marks] → Sample introduced into a flame (1) + metal ions emit light of characteristic wavelengths / specific line spectrum produced (1) + spectrum compared to reference spectra to identify the metal ion(s) present (1).' },

  { id: 'c8_t05', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.3', subtopic_name: 'Flame Emission Spectroscopy', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 advantages** of flame emission spectroscopy over simple flame tests.',
    a: ['Can detect **multiple metal ions simultaneously** in the same sample — whereas a flame test only shows the colour of the most prominent ion', 'Can be used **quantitatively** — the intensity of lines in the spectrum indicates the **concentration** of each metal ion, not just its identity'],
    hint: 'FES: multiple ions at once + tells you concentration too. Simple flame test: just one colour, qualitative only.',
    exam_q: 'Give one advantage of flame emission spectroscopy over a simple flame test.',
    examMarks: 1,
    examA: 'Any 1 from: can detect multiple metals simultaneously / can give quantitative information (concentration) / more accurate identification.' },


  // Chemistry C9 — Chemistry of the Atmosphere (Triple-only additions)
  { id: 'c9_t01', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', subtopic: 'C9.3', subtopic_name: 'Atmospheric Pollutants in Detail', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **carbon monoxide (CO)** is formed and its effect on health.',
    a: ['Formed by **incomplete combustion** of fossil fuels when there is insufficient oxygen (e.g. in car engines, gas boilers)', 'Equation: 2C + O₂ → 2CO (limited oxygen)', 'CO is a **colourless, odourless** toxic gas — it cannot be detected by smell', 'In the blood, CO binds to **haemoglobin** (forming carboxyhaemoglobin) much more strongly than oxygen → reduces the blood\'s ability to carry oxygen → can cause death'],
    hint: 'Incomplete combustion → CO. Colourless, odourless. Binds haemoglobin → blocks O₂ transport → toxic.',
    exam_q: 'Explain why carbon monoxide is dangerous to health.',
    examMarks: 2,
    examA: '2CO (limited oxygen) - CO is a **colourless, odourless** toxic gas — it cannot be detected by smell - In the blood, CO binds to **haemoglobin** (forming carboxyhaemoglobin) much more strongly than oxygen → reduces the blood\'s ability to carry oxygen → can cause death Hint: Incomplete combustion → CO. Colourless, odourless. Binds haemoglobin → blocks O₂ transport → toxic. Exam Q: "Explain why carbon monoxide is dangerous to health." [2 marks] → Carbon monoxide binds to haemoglobin more strongly than oxygen (1) + this reduces the blood\'s ability to carry oxygen to body cells / can be fatal (1).' },

  { id: 'c9_t02', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', subtopic: 'C9.3', subtopic_name: 'Atmospheric Pollutants in Detail', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **sulfur dioxide (SO₂)** is formed and its effects on the environment.',
    a: ['Formed when **fossil fuels containing sulfur impurities** (e.g. coal, heavy oil) are burned: S + O₂ → SO₂', 'SO₂ dissolves in water in clouds and rainwater → forms **sulfurous and sulfuric acid** → **acid rain**', 'Effects of acid rain: **corrodes limestone and marble** buildings/statues; **kills aquatic organisms** in lakes; **damages forests** (leaches minerals from soil)', 'Can be removed from power station emissions by **scrubbing** with calcium oxide or calcium hydroxide'],
    hint: 'Sulfur in fuel → burns → SO₂ → acid rain → corrodes stone, kills fish, damages trees.',
    exam_q: 'Describe how sulfur dioxide causes acid rain and one effect of acid rain.',
    examMarks: 3,
    examA: 'SO₂ - SO₂ dissolves in water in clouds and rainwater → forms **sulfurous and sulfuric acid** → **acid rain** - Effects of acid rain: **corrodes limestone and marble** buildings/statues; **kills aquatic organisms** in lakes; **damages forests** (leaches minerals from soil) - Can be removed from power station emissions by **scrubbing** with calcium oxide or calcium hydroxide Hint: Sulfur in fuel → burns → SO₂ → acid rain → corrodes stone, kills fish, damages trees. Exam Q: "Describe how sulfur dioxide causes acid rain and one effect of acid rain." [3 marks] → Sulfur dioxide dissolves in water in clouds / reacts with water and oxygen (1) + to form sulfuric/sulfurous acid which falls as acid rain (1) + corrodes limestone buildings / kills aquatic life / damages trees (1).' },

  { id: 'c9_t03', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', subtopic: 'C9.3', subtopic_name: 'Atmospheric Pollutants in Detail', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **nitrogen oxides (NOₓ)** are formed and their effects.',
    a: ['Formed when nitrogen and oxygen in air react at **very high temperatures** (e.g. in car engines, lightning): N₂ + O₂ → 2NO', 'NO is then oxidised in the atmosphere: 2NO + O₂ → 2NO₂', 'Effects: NO₂ dissolves in rainwater to form **nitric acid** → acid rain; contributes to **photochemical smog** in cities; causes **respiratory irritation** and lung damage', 'Catalytic converters in car exhausts convert NOₓ back to N₂: 2NO + 2CO → N₂ + 2CO₂'],
    hint: 'High temperature → N₂ + O₂ → NO → NO₂ → acid rain + smog. Catalytic converter removes it.',
    exam_q: 'Describe how nitrogen oxides are formed in car engines.',
    examMarks: 2,
    examA: '2NO - NO is then oxidised in the atmosphere: 2NO + O₂ → 2NO₂ - Effects: NO₂ dissolves in rainwater to form **nitric acid** → acid rain; contributes to **photochemical smog** in cities; causes **respiratory irritation** and lung damage - Catalytic converters in car exhausts convert NOₓ back to N₂: 2NO + 2CO → N₂ + 2CO₂ Hint: High temperature → N₂ + O₂ → NO → NO₂ → acid rain + smog. Catalytic converter removes it. Exam Q: "Describe how nitrogen oxides are formed in car engines." [2 marks] → At the high temperatures in car engines, nitrogen and oxygen from the air react (1) + to form nitrogen monoxide / nitrogen oxides (N₂ + O₂ → 2NO) (1).' },

  { id: 'c9_t04', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', subtopic: 'C9.3', subtopic_name: 'Atmospheric Pollutants in Detail', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **particulates** are formed and their effects on health and climate.',
    a: ['Formed by **incomplete combustion** of fossil fuels (diesel engines, coal burning), as well as from dust, pollen, and industrial processes', 'Health effects: fine particulates can be **inhaled deep into the lungs** → respiratory and cardiovascular disease; ultrafine nanoparticles can cross into the **bloodstream** and reach the brain', 'Climate effect: particulates reflect and scatter sunlight → **global dimming** (reduced solar radiation reaching Earth\'s surface)', 'Larger particulates settle out quickly; fine **PM2.5** particles (< 2.5 μm) remain airborne longest and are most harmful'],
    hint: 'Incomplete combustion → soot particles. Breathe in → lung damage. Block sunlight → global dimming.',
    exam_q: 'Give two harmful effects of particulates released into the atmosphere.',
    examMarks: 2,
    examA: 'respiratory and cardiovascular disease; ultrafine nanoparticles can cross into the **bloodstream** and reach the brain - Climate effect: particulates reflect and scatter sunlight → **global dimming** (reduced solar radiation reaching Earth\'s surface) - Larger particulates settle out quickly; fine **PM2.5** particles (< 2.5 μm) remain airborne longest and are most harmful Hint: Incomplete combustion → soot particles. Breathe in → lung damage. Block sunlight → global dimming. Exam Q: "Give two harmful effects of particulates released into the atmosphere." [2 marks] → Any 2 from: cause respiratory disease / can be inhaled into lungs and damage them (1) + cause global dimming / reduce sunlight reaching Earth\'s surface (1) + cardiovascular disease.' },

  { id: 'c9_t05', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', subtopic: 'C9.4', subtopic_name: 'Carbon Footprint and Life Cycle Assessment', tier: 'T', exam_board: 'AQA',
    q: 'Define **carbon footprint** and identify ways to reduce it.',
    a: ['**Carbon footprint**: the total amount of **greenhouse gases** (measured as CO₂ equivalent) produced directly and indirectly by a person, product, company or activity over its lifetime', 'Includes CO₂, methane (CH₄), nitrous oxide (N₂O), and other greenhouse gases — all converted to **CO₂ equivalent**', 'Reduction methods: using **renewable energy**, improving energy efficiency, using **less fossil fuel**, changing diet (less meat), **carbon offsetting** (e.g. planting trees)'],
    hint: 'Total GHG emissions in CO₂ equivalent. Includes indirect emissions (e.g. from manufacturing your phone). Reduce = less fossil fuel, renewable energy.',
    exam_q: 'What is a carbon footprint?',
    examMarks: 2,
    examA: 'The total amount of greenhouse gases / carbon dioxide equivalent emitted (1) + directly and indirectly by a person, product or activity (1).' },

  { id: 'c9_t06', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', subtopic: 'C9.4', subtopic_name: 'Carbon Footprint and Life Cycle Assessment', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **four stages** of a Life Cycle Assessment (LCA).',
    a: ['**Stage 1 — Extracting and processing raw materials**: energy used in mining, quarrying, refining; pollution from extraction', '**Stage 2 — Manufacturing and packaging**: energy and water used in production; emissions and waste from factories', '**Stage 3 — Use and maintenance**: energy consumed during the product\'s lifetime; emissions from using the product', '**Stage 4 — Disposal**: landfill space; emissions from incineration; recycling energy and emissions'],
    hint: 'Extract → Make → Use → Dispose. Four stages, each with energy use and environmental impact.',
    exam_q: 'State the four stages assessed in a life cycle assessment (LCA).',
    examMarks: 4,
    examA: 'Make → Use → Dispose. Four stages, each with energy use and environmental impact. Exam Q: "State the four stages assessed in a life cycle assessment (LCA)." [4 marks] → Extracting raw materials (1) + manufacturing/packaging (1) + use of the product (1) + disposal of the product (1).' },

  { id: 'c9_t07', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', subtopic: 'C9.4', subtopic_name: 'Carbon Footprint and Life Cycle Assessment', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 limitations** of life cycle assessments.',
    a: ['Some data is **difficult to obtain** — particularly for international supply chains or long product lifetimes', 'Some environmental impacts are **hard to quantify** (e.g. effect on biodiversity, noise pollution) → subjective judgements must be made', '**Bias**: LCAs are often commissioned by companies to support a particular product — selective use of data can lead to conclusions that favour the company\'s product (greenwashing)'],
    hint: 'Hard to get data. Hard to measure some impacts. Biased if company pays for it. Three limitations.',
    exam_q: 'Give one limitation of using life cycle assessments to compare the environmental impact of two products.',
    examMarks: 1,
    examA: 'subjective judgements must be made - **Bias**: LCAs are often commissioned by companies to support a particular product — selective use of data can lead to conclusions that favour the company\'s product (greenwashing) Hint: Hard to get data. Hard to measure some impacts. Biased if company pays for it. Three limitations. Exam Q: "Give one limitation of using life cycle assessments to compare the environmental impact of two products." [1 mark] → Any 1 from: some data is difficult to obtain / some impacts are difficult to quantify / results can be subjective or biased.' },


  // Chemistry C10 — Using Resources (Triple-only additions)
  { id: 'c10_t01', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.2', subtopic_name: 'Water Treatment', tier: 'T', exam_board: 'AQA',
    q: 'Define **potable water** and explain why it is NOT the same as pure water.',
    a: ['**Potable water**: water that is **safe to drink** — it does not contain harmful levels of microorganisms, pollutants, or dissolved substances', 'It is **NOT** chemically pure — it contains dissolved ions (minerals), and may contain small amounts of added chlorine or fluoride', 'Chemically **pure water** (H₂O only) is not produced by normal water treatment — distillation would be required'],
    hint: 'Potable = safe to drink, NOT pure. Still has dissolved ions in it. Safe ≠ pure.',
    exam_q: 'Explain the difference between potable water and pure water.',
    examMarks: 2,
    examA: 'Potable water is safe to drink but still contains dissolved substances / minerals (1) + pure water contains only H₂O / no dissolved substances (1).' },

  { id: 'c10_t02', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.2', subtopic_name: 'Water Treatment', tier: 'T', exam_board: 'AQA',
    q: 'Describe the stages used to **treat fresh water** to make it potable.',
    a: ['**Sedimentation / settling**: water is stored in large tanks; large suspended particles settle to the bottom', '**Filtration**: water is passed through layers of **gravel and sand** — removes smaller particles and some microorganisms', '**Sterilisation**: **chlorine gas** is added (or UV light, or ozone) → kills remaining microorganisms and pathogens', 'pH may also be adjusted; for drinking, water is tested to ensure it meets safety standards'],
    hint: 'Settle → filter (gravel/sand) → sterilise (chlorine). Three stages. Sometimes pH correction too.',
    exam_q: 'Describe how fresh water is treated to make it safe to drink.',
    examMarks: 3,
    examA: 'kills remaining microorganisms and pathogens - pH may also be adjusted; for drinking, water is tested to ensure it meets safety standards Hint: Settle → filter (gravel/sand) → sterilise (chlorine). Three stages. Sometimes pH correction too. Exam Q: "Describe how fresh water is treated to make it safe to drink." [3 marks] → Sedimentation / settling to remove large particles (1) + filtration through sand/gravel to remove smaller particles (1) + sterilisation with chlorine / UV / ozone to kill pathogens (1).' },

  { id: 'c10_t03', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.2', subtopic_name: 'Water Treatment', tier: 'T', exam_board: 'AQA',
    q: 'Describe **desalination** — what it is, the methods used, and its limitations.',
    a: ['**Desalination** is the removal of dissolved salts from **seawater** or brackish water to produce potable water', 'Method 1 — **Distillation**: seawater is heated → water evaporates → condensed → collected (salt left behind)', 'Method 2 — **Reverse osmosis**: seawater is forced through a **semi-permeable membrane** under high pressure → water molecules pass through, salt ions do not', '**Limitation**: both methods require large amounts of **energy**, making them expensive — used mainly in water-scarce regions (e.g. Middle East)'],
    hint: 'Seawater → potable water. Two methods: distillation (boil and condense) or reverse osmosis (force through membrane). Both expensive — need lots of energy.',
    exam_q: 'Why is desalination not widely used to provide potable water in the UK?',
    examMarks: 1,
    examA: 'water evaporates → condensed → collected (salt left behind) - Method 2 — **Reverse osmosis**: seawater is forced through a **semi-permeable membrane** under high pressure → water molecules pass through, salt ions do not - **Limitation**: both methods require large amounts of **energy**, making them expensive — used mainly in water-scarce regions (e.g. Middle East) Hint: Seawater → potable water. Two methods: distillation (boil and condense) or reverse osmosis (force through membrane). Both expensive — need lots of energy. Exam Q: "Why is desalination not widely used to provide potable water in the UK?" [1 mark] → It requires large amounts of energy / is expensive / the UK has sufficient fresh water from rainfall.' },

  { id: 'c10_t04', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.3', subtopic_name: 'Life Cycle Assessment of Materials', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **LCA is used to compare the environmental impact** of different materials.',
    a: ['An LCA considers the impact at each stage: extracting raw material → manufacturing → use → disposal', 'Different materials have different impacts at different stages — e.g. aluminium requires large amounts of electricity to extract, but is lightweight and highly recyclable', 'Comparing LCAs allows manufacturers and consumers to choose **more sustainable** options, but results depend on the assumptions and boundaries of the assessment'],
    hint: 'LCA = total environmental cost across all stages. Compare two materials → choose the one with lower total impact. Results depend on assumptions.',
    exam_q: 'A company uses LCA to compare plastic and glass packaging. Suggest why the results might be misleading.',
    examMarks: 2,
    examA: 'manufacturing → use → disposal - Different materials have different impacts at different stages — e.g. aluminium requires large amounts of electricity to extract, but is lightweight and highly recyclable - Comparing LCAs allows manufacturers and consumers to choose **more sustainable** options, but results depend on the assumptions and boundaries of the assessment Hint: LCA = total environmental cost across all stages. Compare two materials → choose the one with lower total impact. Results depend on assumptions. Exam Q: "A company uses LCA to compare plastic and glass packaging. Suggest why the results might be misleading." [2 marks] → LCA results can be influenced by which data is included / boundaries chosen (1) + some impacts are difficult to quantify or may be left out / results can be subjective or biased (1).' },

  { id: 'c10_t05', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.3', subtopic_name: 'Life Cycle Assessment of Materials', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **recycling** reduces the environmental impact at different stages of the LCA.',
    a: ['Recycling **reduces the need to extract raw materials** → less mining, quarrying, habitat destruction', 'Recycling often requires **less energy** than producing from raw materials (e.g. recycling aluminium uses ~5% of the energy of extracting it from ore)', '**Disposal stage** impact is reduced — less material goes to landfill or incineration'],
    hint: 'Recycle → less extraction, less energy, less waste. LCA improves at raw materials stage AND disposal stage.',
    exam_q: 'Explain how recycling aluminium reduces its carbon footprint compared to producing aluminium from its ore.',
    examMarks: 2,
    examA: 'less mining, quarrying, habitat destruction - Recycling often requires **less energy** than producing from raw materials (e.g. recycling aluminium uses ~5% of the energy of extracting it from ore) - **Disposal stage** impact is reduced — less material goes to landfill or incineration Hint: Recycle → less extraction, less energy, less waste. LCA improves at raw materials stage AND disposal stage. Exam Q: "Explain how recycling aluminium reduces its carbon footprint compared to producing aluminium from its ore." [2 marks] → Recycling requires much less energy than electrolysis of aluminium ore (1) + so less fossil fuel is burned / less CO₂ emitted during the extraction stage (1).' },

  { id: 'c10_t06', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.4', subtopic_name: 'Alloys', tier: 'T', exam_board: 'AQA',
    q: 'Explain why **alloys are harder than pure metals**.',
    a: ['In a pure metal, all atoms are the **same size** → layers of atoms can slide over each other easily → metal is soft/malleable', 'In an alloy, atoms of a **different element** (different size) are introduced into the lattice → **distort the regular arrangement**', 'The differently sized atoms **prevent layers from sliding** → the alloy is harder and stronger than the pure metal'],
    hint: 'Pure metal = same size atoms = layers slide = soft. Alloy = different size atoms = can\'t slide = hard.',
    exam_q: 'Explain why steel is harder than pure iron.',
    examMarks: 2,
    examA: 'layers of atoms can slide over each other easily → metal is soft/malleable - In an alloy, atoms of a **different element** (different size) are introduced into the lattice → **distort the regular arrangement** - The differently sized atoms **prevent layers from sliding** → the alloy is harder and stronger than the pure metal Hint: Pure metal = same size atoms = layers slide = soft. Alloy = different size atoms = can\'t slide = hard. Exam Q: "Explain why steel is harder than pure iron." [2 marks] → Steel contains carbon atoms of a different size to iron atoms (1) + these distort the iron lattice and prevent layers from sliding easily, making it harder (1).' },

  { id: 'c10_t07', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.4', subtopic_name: 'Alloys', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 examples** of alloys and state what each is made from and used for.',
    a: ['**Steel**: iron + carbon (0.1–2%) → used in construction, vehicles, tools (stainless steel adds Cr/Ni for corrosion resistance)', '**Brass**: copper + zinc → used in musical instruments, electrical fittings, plumbing', '**Bronze**: copper + tin → used in medals, statues, bearings', '**Solder**: tin + lead (or tin + silver) → used to join electrical components'],
    hint: 'Steel (Fe + C), brass (Cu + Zn), bronze (Cu + Sn), solder (Sn + Pb). Four alloys and their elements.',
    exam_q: 'Name the two main elements in brass and state one use of brass.',
    examMarks: 2,
    examA: 'used in construction, vehicles, tools (stainless steel adds Cr/Ni for corrosion resistance) - **Brass**: copper + zinc → used in musical instruments, electrical fittings, plumbing - **Bronze**: copper + tin → used in medals, statues, bearings - **Solder**: tin + lead (or tin + silver) → used to join electrical components Hint: Steel (Fe + C), brass (Cu + Zn), bronze (Cu + Sn), solder (Sn + Pb). Four alloys and their elements. Exam Q: "Name the two main elements in brass and state one use of brass." [2 marks] → Copper and zinc (1) + any 1 use from: musical instruments / plumbing / electrical fittings (1).' },

  { id: 'c10_t08', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.5', subtopic_name: 'Ceramics, Polymers and Composites', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **properties and uses** of ceramics.',
    a: ['Ceramics are **hard**, **stiff**, and **brittle** — they do not deform easily but crack rather than bend', 'High **melting points** — can withstand very high temperatures', '**Electrical and thermal insulators** — do not conduct electricity or heat well', 'Examples and uses: **glass** (windows, optical fibres); **porcelain/clay** (tableware, sanitary ware); **cement** (construction); **silicon carbide** (cutting tools, abrasives)'],
    hint: 'Hard, brittle, high melting point, insulator. Glass, pottery, cement. Cannot conduct heat or electricity.',
    exam_q: 'Give two properties of ceramics.',
    examMarks: 2,
    examA: 'Any 2 from: hard / brittle / high melting point / poor conductors of heat and electricity / stiff.' },

  { id: 'c10_t09', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.5', subtopic_name: 'Ceramics, Polymers and Composites', tier: 'T', exam_board: 'AQA',
    q: 'Distinguish between **thermosoftening** and **thermosetting** polymers in terms of structure and properties.',
    a: ['**Thermosoftening polymers**: long polymer chains with **no cross-links** between them; weak intermolecular forces; soften and can be **reshaped when heated**; can be **recycled**; examples: HDPE, PET, polystyrene', '**Thermosetting polymers**: extensive **covalent cross-links** between polymer chains; form a rigid 3D network; do **not soften on heating** (may char instead); **cannot be recycled**; examples: Bakelite, epoxy resin, melamine', 'Thermosetting polymers are harder and more heat-resistant than thermosoftening polymers', 'The cross-links prevent chain movement — hence rigid and heat-stable'],
    hint: 'Thermosoftening = no cross-links = melt and reform (recyclable). Thermosetting = cross-links = cannot melt (non-recyclable).',
    exam_q: 'Explain why thermosetting polymers cannot be recycled.',
    examMarks: 2,
    examA: 'Thermosetting polymers have extensive covalent cross-links between chains (1) + these prevent the chains from moving / the polymer does not soften or melt when heated so cannot be reshaped (1).' },

  { id: 'c10_t10', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.5', subtopic_name: 'Ceramics, Polymers and Composites', tier: 'T', exam_board: 'AQA',
    q: 'Define a **composite material** and give **3 examples** with their properties.',
    a: ['A **composite** is a material made from **two or more different materials**, each retaining its own properties; the combination has properties better than either alone', '**Carbon fibre reinforced polymer (CFRP)**: carbon fibres (strong, stiff) in a polymer matrix → very strong, very light; used in aircraft, racing cars, sports equipment', '**Fibreglass (GFRP)**: glass fibres in a polymer resin matrix → strong, lightweight, corrosion-resistant; used in boat hulls, car bodies', '**Concrete**: gravel/stone aggregate in a cement matrix → high compressive strength; reinforced with steel rods (rebar) to improve tensile strength'],
    hint: 'Composite = two materials combined, better than either alone. CFRP (carbon + polymer), fibreglass (glass + resin), concrete (stone + cement).',
    exam_q: 'What is a composite material?',
    examMarks: 2,
    examA: 'very strong, very light; used in aircraft, racing cars, sports equipment - **Fibreglass (GFRP)**: glass fibres in a polymer resin matrix → strong, lightweight, corrosion-resistant; used in boat hulls, car bodies - **Concrete**: gravel/stone aggregate in a cement matrix → high compressive strength; reinforced with steel rods (rebar) to improve tensile strength Hint: Composite = two materials combined, better than either alone. CFRP (carbon + polymer), fibreglass (glass + resin), concrete (stone + cement). Exam Q: "What is a composite material?" [2 marks] → A material made from two or more different materials (1) + combined so that the composite has properties that are better than either material alone (1).' },

  { id: 'c10_t11', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.6', subtopic_name: 'Haber Process: Evaluating Compromise Conditions', tier: 'T', exam_board: 'AQA',
    q: 'Explain why the **overall conversion** in the Haber process is low and how this is managed industrially.',
    a: ['Under the compromise conditions (450°C, 200 atm), only approximately **15%** of the N₂ and H₂ is converted to NH₃ per pass through the reactor', 'Ammonia is removed by **liquefaction** (cooling — NH₃ has a higher boiling point than N₂ and H₂)', 'Unreacted N₂ and H₂ are **recycled** back into the reactor — overall, very little gas is wasted', 'This continuous recycling makes the process economically viable despite the low single-pass yield'],
    hint: 'Only ~15% converted per pass. But → cool to liquefy NH₃ → recycle N₂ and H₂ → overall efficient. Recycling is the key.',
    exam_q: 'Explain how the Haber process is made economically viable despite the low conversion per pass.',
    examMarks: 2,
    examA: 'cool to liquefy NH₃ → recycle N₂ and H₂ → overall efficient. Recycling is the key. Exam Q: "Explain how the Haber process is made economically viable despite the low conversion per pass." [2 marks] → Ammonia is liquefied and removed from the equilibrium mixture (1) + unreacted hydrogen and nitrogen are recycled back into the reactor (1).' },

  { id: 'c10_t12', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.6', subtopic_name: 'Haber Process: Evaluating Compromise Conditions', tier: 'T', exam_board: 'AQA',
    q: 'Evaluate the **environmental and social impact** of the Haber process.',
    a: ['**Positive social impact**: enables production of nitrogen **fertilisers** → supports global food production for ~8 billion people; without it, global food supply would collapse', '**Environmental concern**: hydrogen is currently made mainly by **steam reforming of methane** (CH₄ + H₂O → CO + 3H₂) → releases large amounts of CO₂', '**Sustainable future**: green hydrogen produced by **electrolysis of water** using renewable electricity would make the process carbon-neutral', '**Overuse of fertilisers**: excess nitrogen washes into waterways → **eutrophication** (algal bloom → depletes O₂ → kills aquatic life)'],
    hint: 'Essential for food (positive). H₂ from methane = CO₂ (environmental problem). Green H₂ = solution. Fertiliser overuse = eutrophication.',
    exam_q: 'Give one environmental concern associated with the Haber process.',
    examMarks: 1,
    examA: 'supports global food production for ~8 billion people; without it, global food supply would collapse - **Environmental concern**: hydrogen is currently made mainly by **steam reforming of methane** (CH₄ + H₂O → CO + 3H₂) → releases large amounts of CO₂ - **Sustainable future**: green hydrogen produced by **electrolysis of water** using renewable electricity would make the process carbon-neutral - **Overuse of fertilisers**: excess nitrogen washes into waterways → **eutrophication** (algal bloom → depletes O₂ → kills aquatic life) Hint: Essential for food (positive). H₂ from methane = CO₂ (environmental problem). Green H₂ = solution. Fertiliser overuse = eutrophication. Exam Q: "Give one environmental concern associated with the Haber process." [1 mark] → Any 1 from: hydrogen is produced from fossil fuels / releases CO₂ / high energy consumption / fertilisers can cause eutrophication if overused.' },


  // Chemistry C1 — Atomic Structure (Triple-only additions)
  { id: 'c1_t08', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.5', subtopic_name: 'Transition Metals', tier: 'T', exam_board: 'AQA',
    q: 'Compare the **properties of transition metals** with Group 1 alkali metals. *(5 properties)*',
    a: ['**Melting points**: transition metals have much **higher melting points** than Group 1 (e.g. iron melts at 1538 °C; lithium at 180 °C)', '**Density**: transition metals are much **denser** (e.g. iron = 7.9 g/cm³; sodium = 0.97 g/cm³)', '**Strength and hardness**: transition metals are **strong and hard**; Group 1 metals are **soft** and can be cut with a knife', '**Reactivity with water**: Group 1 metals react **vigorously**; transition metals are generally **much less reactive** with water (iron slowly rusts, copper does not react at all)', '**Reactivity with oxygen**: Group 1 metals react rapidly to form oxides; transition metals react **slowly** or require heating (iron rusts; copper forms a green patina)'],
    hint: 'Transition metals: high MP, high density, strong, hard, less reactive with water/O₂. Group 1: low MP, low density, soft, very reactive with water.',
    exam_q: 'Give two differences between a transition metal and a Group 1 alkali metal.',
    examMarks: 2,
    examA: '1 mark each: any 2 from: higher melting point / greater density / harder and stronger / less reactive with water and oxygen.' },

  { id: 'c1_t09', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.5', subtopic_name: 'Transition Metals', tier: 'T', exam_board: 'AQA',
    q: 'What are **variable oxidation states** and which transition metals show them? Give examples of **coloured compounds**.',
    a: ['Transition metals can form ions with **different oxidation states** (different positive charges) — unlike Group 1 (which only form 1+ ions)', '**Iron**: forms Fe²⁺ (iron(II), in FeSO₄ — pale green) and Fe³⁺ (iron(III), in Fe₂O₃ — red/brown)', '**Copper**: forms Cu⁺ (copper(I)) and Cu²⁺ (copper(II), in CuSO₄ — blue)', '**Chromium**: forms Cr³⁺ (green) and Cr⁶⁺ (in K₂Cr₂O₇ — orange)', 'Transition metal compounds are **coloured** due to partially filled d-subshell electrons absorbing specific wavelengths of visible light'],
    hint: 'Fe²⁺ = green, Fe³⁺ = brown. Cu²⁺ = blue (CuSO₄). Cr³⁺ = green, Cr⁶⁺ = orange. Variable oxidation states = multiple charges possible.',
    exam_q: 'Give the colours of the precipitates formed when NaOH is added to iron(II) sulfate and iron(III) chloride.',
    examMarks: 2,
    examA: 'Fe²⁺ + NaOH → green precipitate (1). Fe³⁺ + NaOH → brown/rust precipitate (1).' },

  { id: 'c1_t10', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.5', subtopic_name: 'Transition Metals', tier: 'T', exam_board: 'AQA',
    q: 'Explain how **transition metals act as catalysts**. Give four named examples.',
    a: ['Transition metals (and their compounds) can act as **catalysts** because their variable oxidation states allow them to accept and donate electrons in intermediate steps', '**Iron (Fe)**: catalyst in the **Haber process** (N₂ + 3H₂ ⇌ 2NH₃)', '**Manganese(IV) oxide (MnO₂)**: catalyst in the decomposition of hydrogen peroxide (2H₂O₂ → 2H₂O + O₂)', '**Nickel (Ni)**: catalyst in **hydrogenation** of vegetable oils to make margarine (C=C + H₂ → C-C)', '**Vanadium(V) oxide (V₂O₅)**: catalyst in the **Contact process** for making sulfuric acid (2SO₂ + O₂ ⇌ 2SO₃)'],
    hint: 'Iron = Haber. MnO₂ = H₂O₂ decomp. Nickel = hydrogenation. V₂O₅ = Contact process (SO₃). Variable oxidation states explain catalytic activity.',
    exam_q: 'Identify the catalyst used in the Haber process and explain why transition metals make good catalysts.',
    examMarks: 2,
    examA: '2H₂O + O₂) - **Nickel (Ni)**: catalyst in **hydrogenation** of vegetable oils to make margarine (C=C + H₂ → C-C) - **Vanadium(V) oxide (V₂O₅)**: catalyst in the **Contact process** for making sulfuric acid (2SO₂ + O₂ ⇌ 2SO₃) Hint: Iron = Haber. MnO₂ = H₂O₂ decomp. Nickel = hydrogenation. V₂O₅ = Contact process (SO₃). Variable oxidation states explain catalytic activity. Exam Q: "Identify the catalyst used in the Haber process and explain why transition metals make good catalysts." [2 marks] → Iron / Fe (1). Variable oxidation states allow transition metals to donate and receive electrons in intermediate reaction steps (1).' },


  // Chemistry C5 — Energy Changes (Triple-only additions)
  { id: 'c5_t07', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.5', subtopic_name: 'Chemical Cells and Batteries', tier: 'T', exam_board: 'AQA',
    q: 'Explain how a **simple chemical cell** works and what determines its voltage.',
    a: ['A simple chemical cell consists of **two different metals** (electrodes) in contact with an **electrolyte solution** (e.g. dilute acid or salt solution)', '**Electrons flow** through the external circuit from the **more reactive metal** (negative electrode) to the less reactive metal (positive electrode)', 'The **more reactive metal** is the **negative electrode** (it loses electrons by oxidation)', '**Voltage (EMF)** depends on the **difference in reactivity** between the two metals: a greater reactivity difference → higher voltage', 'Over time, the cell **loses voltage** as one electrode is used up / chemical energy is depleted'],
    hint: 'Two metals + electrolyte = cell. More reactive = negative. Current flows from less reactive to more reactive in external circuit. Bigger reactivity difference = bigger voltage.',
    exam_q: 'Explain why a cell made from zinc and copper electrodes produces a larger voltage than one made from iron and copper electrodes.',
    examMarks: 2,
    examA: 'higher voltage - Over time, the cell **loses voltage** as one electrode is used up / chemical energy is depleted Hint: Two metals + electrolyte = cell. More reactive = negative. Current flows from less reactive to more reactive in external circuit. Bigger reactivity difference = bigger voltage. Exam Q: "Explain why a cell made from zinc and copper electrodes produces a larger voltage than one made from iron and copper electrodes." [2 marks] → Zinc is more reactive than iron / greater difference in reactivity between Zn and Cu than Fe and Cu (1). Greater reactivity difference produces greater EMF / voltage (1).' },

  { id: 'c5_t08', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.5', subtopic_name: 'Chemical Cells and Batteries', tier: 'T', exam_board: 'AQA',
    q: 'Compare **non-rechargeable cells**, **rechargeable cells** and **fuel cells**. *(3 comparisons)*',
    a: ['**Non-rechargeable cells**: once the chemical reactants are used up, the cell is **flat** and cannot be recharged; e.g. standard alkaline AA battery; convenient but produces waste', '**Rechargeable cells**: electrical energy applied in reverse re-forms the original chemicals (reversible reactions); can be charged hundreds of times; e.g. lithium-ion battery; less waste over lifetime', '**Fuel cells**: fuel (e.g. hydrogen) is fed **continuously** to the cell; as long as fuel is supplied the cell operates; products are water (H₂/O₂ fuel cell); very efficient; no recharging but needs fuel supply infrastructure', '**Environmental comparison**: rechargeable > non-rechargeable > (fuel cell depends on fuel source); all produce less waste than disposable cells'],
    hint: 'Non-rechargeable: flat → bin. Rechargeable: electrical energy reverses reaction. Fuel cell: fuel fed continuously → H₂O product. Fuel cell = cleanest (if green H₂).',
    exam_q: 'Give one advantage of a rechargeable cell over a non-rechargeable cell.',
    examMarks: 1,
    examA: 'bin. Rechargeable: electrical energy reverses reaction. Fuel cell: fuel fed continuously → H₂O product. Fuel cell = cleanest (if green H₂). Exam Q: "Give one advantage of a rechargeable cell over a non-rechargeable cell." [1 mark] → Any 1 from: can be recharged/reused hundreds of times / produces less waste / more cost-effective over lifetime.' },

  { id: 'c5_t09', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.5', subtopic_name: 'Chemical Cells and Batteries', tier: 'T', exam_board: 'AQA',
    q: 'Write the **half equations for the hydrogen-oxygen fuel cell**.',
    a: ['**Anode** (negative, oxidation — fuel side): **2H₂ → 4H⁺ + 4e⁻**', '**Cathode** (positive, reduction — oxygen side): **O₂ + 4H⁺ + 4e⁻ → 2H₂O**', '**Overall reaction**: 2H₂ + O₂ → 2H₂O', 'The hydrogen fuel is **oxidised** at the anode (loses electrons); oxygen is **reduced** at the cathode (gains electrons)'],
    hint: 'Anode: 2H₂ → 4H⁺ + 4e⁻ (oxidation, electrons leave). Cathode: O₂ + 4H⁺ + 4e⁻ → 2H₂O (reduction, electrons arrive). Overall: H₂ + O₂ → H₂O.',
    exam_q: 'Write the half equation for the reaction occurring at the cathode in a hydrogen fuel cell.',
    examMarks: 2,
    examA: '4H⁺ + 4e⁻** - **Cathode** (positive, reduction — oxygen side): **O₂ + 4H⁺ + 4e⁻ → 2H₂O** - **Overall reaction**: 2H₂ + O₂ → 2H₂O - The hydrogen fuel is **oxidised** at the anode (loses electrons); oxygen is **reduced** at the cathode (gains electrons) Hint: Anode: 2H₂ → 4H⁺ + 4e⁻ (oxidation, electrons leave). Cathode: O₂ + 4H⁺ + 4e⁻ → 2H₂O (reduction, electrons arrive). Overall: H₂ + O₂ → H₂O. Exam Q: "Write the half equation for the reaction occurring at the cathode in a hydrogen fuel cell." [2 marks] → O₂ + 4H⁺ + 4e⁻ → 2H₂O (1 mark atoms balanced, 1 mark electrons balanced).' },


  // Chemistry C7 — Organic Chemistry (Triple-only additions)
  { id: 'c7_t15', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alkene Addition Reactions', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **hydrogenation** and **hydration** of alkenes with conditions and equations.',
    a: ['**Hydrogenation**: alkene + H₂ → alkane; catalyst = **nickel (Ni)**, temperature ~**150 °C**; converts double bond to single bond'],
    hint: 'Hydrogenation: alkene + H₂ → alkane (Ni, 150°C). Hydration: ethene + H₂O → ethanol (H₃PO₄, 300°C, 60 atm). Hydration = industrial ethanol route.',
    exam_q: 'Describe the conditions for the hydration of ethene to produce ethanol.',
    examMarks: 2,
    examA: 'alkane; catalyst = **nickel (Ni)**, temperature ~**150 °C**; converts double bond to single bond - Example: CH₂=CH₂ + H₂ → CH₃CH₃ (ethene + hydrogen → ethane) - Used to **harden vegetable oils** into margarine - **Hydration** (industrial production of ethanol): CH₂=CH₂ + H₂O → C₂H₅OH - Catalyst: **phosphoric acid (H₃PO₄)**, temperature ~**300 °C**, pressure ~**60–70 atm** - This is the **industrial** route to ethanol (alternative to fermentation) Hint: Hydrogenation: alkene + H₂ → alkane (Ni, 150°C). Hydration: ethene + H₂O → ethanol (H₃PO₄, 300°C, 60 atm). Hydration = industrial ethanol route. Exam Q: "Describe the conditions for the hydration of ethene to produce ethanol." [2 marks] → Phosphoric acid (H₃PO₄) catalyst (1). High temperature (~300 °C) and pressure (~60–70 atm) (1).' },

  { id: 'c7_t16', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alkene Addition Reactions', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **addition of halogens** to alkenes. Give the product names and a displayed formula example.',
    a: ['Alkenes undergo **addition reactions** with halogens (Cl₂, Br₂, I₂) at room temperature in an organic solvent', 'The halogen adds **across the double bond** (one halogen atom to each carbon): CH₂=CH₂ + Br₂ → CH₂BrCH₂Br (1,2-dibromoethane)', '**Displayed formula of product**: H-C(Br)-C(Br)-H with all H bonds shown — carbon atoms now have 4 single bonds each', 'Cl₂ produces a **dichloroalkane** (e.g. 1,2-dichloroethane); I₂ produces a **diiodoalkane**', 'These are **electrophilic addition** reactions — the double bond acts as an electron donor to the electrophilic halogen'],
    hint: 'Alkene + X₂ → dihalogenoalkane (X adds to each C of double bond). CH₂=CH₂ + Br₂ → CH₂BrCH₂Br. Room temperature. Organic solvent. Bromine water decolourises = test for alkene.',
    exam_q: 'Name the product of the reaction between ethene and chlorine. Write its molecular formula.',
    examMarks: 2,
    examA: 'CH₂BrCH₂Br (1,2-dibromoethane) - **Displayed formula of product**: H-C(Br)-C(Br)-H with all H bonds shown — carbon atoms now have 4 single bonds each - Cl₂ produces a **dichloroalkane** (e.g. 1,2-dichloroethane); I₂ produces a **diiodoalkane** - These are **electrophilic addition** reactions — the double bond acts as an electron donor to the electrophilic halogen Hint: Alkene + X₂ → dihalogenoalkane (X adds to each C of double bond). CH₂=CH₂ + Br₂ → CH₂BrCH₂Br. Room temperature. Organic solvent. Bromine water decolourises = test for alkene. Exam Q: "Name the product of the reaction between ethene and chlorine. Write its molecular formula." [2 marks] → 1,2-dichloroethane (1). C₂H₄Cl₂ (1).' },

  { id: 'c7_t17', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alkene Addition Reactions', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **reaction of alcohols with sodium metal** and write the equation.',
    a: ['Alcohols react with **sodium metal** to produce a **sodium alkoxide** and **hydrogen gas**', 'Equation: **2ROH + 2Na → 2RONa + H₂** (where R = alkyl group)', 'Example for ethanol: **2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂**', 'The reaction is **similar to sodium reacting with water** but **slower** (alcohols are weaker acids than water); fizzing is observed but less vigorously than with water', 'Product: **sodium ethoxide** (C₂H₅ONa) — a white solid'],
    hint: '2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂. Produces sodium alkoxide + hydrogen. Slower than Na + water (alcohol is weaker acid). Fizzes gently.',
    exam_q: 'Write the equation for the reaction between sodium and ethanol. What gas is produced?',
    examMarks: 2,
    examA: '2RONa + H₂** (where R = alkyl group) - Example for ethanol: **2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂** - The reaction is **similar to sodium reacting with water** but **slower** (alcohols are weaker acids than water); fizzing is observed but less vigorously than with water - Product: **sodium ethoxide** (C₂H₅ONa) — a white solid Hint: 2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂. Produces sodium alkoxide + hydrogen. Slower than Na + water (alcohol is weaker acid). Fizzes gently. Exam Q: "Write the equation for the reaction between sodium and ethanol. What gas is produced?" [2 marks] → 2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂ (1). Hydrogen gas (1).' },

  { id: 'c7_t18', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alkene Addition Reactions', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **structure of amino acids** and how they polymerise to form proteins.',
    a: ['Every amino acid contains two functional groups: an **amino group (−NH₂)** and a **carboxyl group (−COOH)** on the same carbon', 'General formula: **H₂N−CHR−COOH** (where R = variable side chain that distinguishes different amino acids)', '**Glycine** is the simplest amino acid: R = H → H₂N−CH₂−COOH', 'Amino acids link together by **condensation polymerisation**: the −NH₂ of one reacts with the −COOH of another → forms a **peptide bond (amide bond)** and releases **water**', 'The resulting polymer is a **polypeptide** → folds into a **protein**'],
    hint: 'Amino acid = -NH₂ + -COOH on same carbon. R group = varies. Link by condensation → peptide bond (amide bond) + H₂O. Chain = polypeptide = protein.',
    exam_q: 'Identify the two functional groups present in all amino acids.',
    examMarks: 2,
    examA: 'H₂N−CH₂−COOH - Amino acids link together by **condensation polymerisation**: the −NH₂ of one reacts with the −COOH of another → forms a **peptide bond (amide bond)** and releases **water** - The resulting polymer is a **polypeptide** → folds into a **protein** Hint: Amino acid = -NH₂ + -COOH on same carbon. R group = varies. Link by condensation → peptide bond (amide bond) + H₂O. Chain = polypeptide = protein. Exam Q: "Identify the two functional groups present in all amino acids." [2 marks] → Amino group (−NH₂) (1). Carboxyl group (−COOH) (1).' },


  // Chemistry C8 — Chemical Analysis (Triple-only additions)
  { id: 'c8_t06', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.3', subtopic_name: 'Metal Ion Tests by Precipitation', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **NaOH precipitation tests** for identifying metal ions in solution. *(6 ions)*',
    a: ['Add a few drops of **dilute sodium hydroxide (NaOH)** solution to the test solution and observe the precipitate colour', '**Aluminium Al³⁺**: **white** precipitate; **dissolves** in excess NaOH (amphoteric hydroxide)', '**Calcium Ca²⁺**: **white** precipitate; does **not** dissolve in excess NaOH', '**Magnesium Mg²⁺**: **white** precipitate; does **not** dissolve in excess NaOH', '**Copper(II) Cu²⁺**: **blue** precipitate (Cu(OH)₂)', '**Iron(II) Fe²⁺**: **green** precipitate (Fe(OH)₂)', '**Iron(III) Fe³⁺**: **brown/rust** precipitate (Fe(OH)₃)'],
    hint: 'NaOH test: Al³⁺=white (dissolves in excess). Ca²⁺/Mg²⁺=white (stays). Cu²⁺=blue. Fe²⁺=green. Fe³⁺=brown. White precipitates can be distinguished by adding excess NaOH (Al dissolves, Ca/Mg don\'t).',
    exam_q: 'Describe how to distinguish between solutions of Al³⁺ and Ca²⁺ ions using NaOH solution.',
    examMarks: 2,
    examA: 'Both give white precipitates with NaOH (1). Add excess NaOH: Al³⁺ precipitate dissolves; Ca²⁺ precipitate does not dissolve (1).' },

  { id: 'c8_t07', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.3', subtopic_name: 'Metal Ion Tests by Precipitation', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **test for carbonate ions (CO₃²⁻)**. *(3 steps)*',
    a: ['Add **dilute hydrochloric acid (HCl)** to the sample → if carbonate is present, **effervescence** (fizzing) occurs as **CO₂ gas** is produced', 'Equation: CO₃²⁻ + 2H⁺ → H₂O + CO₂', '**Confirm CO₂** by bubbling the gas through **limewater** → limewater turns **milky/cloudy** (white precipitate of CaCO₃ forms)', 'Equation: CO₂ + Ca(OH)₂ → CaCO₃ + H₂O'],
    hint: 'Add dilute HCl → fizzing = CO₂ produced. Bubble through limewater → turns milky = confirms CO₂ = confirms carbonate. Two steps: acid test then limewater confirm.',
    exam_q: 'Describe the test for carbonate ions in a solution. Include a confirmation step.',
    examMarks: 3,
    examA: 'if carbonate is present, **effervescence** (fizzing) occurs as **CO₂ gas** is produced - Equation: CO₃²⁻ + 2H⁺ → H₂O + CO₂ - **Confirm CO₂** by bubbling the gas through **limewater** → limewater turns **milky/cloudy** (white precipitate of CaCO₃ forms) - Equation: CO₂ + Ca(OH)₂ → CaCO₃ + H₂O Hint: Add dilute HCl → fizzing = CO₂ produced. Bubble through limewater → turns milky = confirms CO₂ = confirms carbonate. Two steps: acid test then limewater confirm. Exam Q: "Describe the test for carbonate ions in a solution. Include a confirmation step." [3 marks] → Add dilute acid (1). Effervescence/bubbling (1). Bubble gas through limewater — turns milky/cloudy (1).' },

  { id: 'c8_t08', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', subtopic: 'C8.3', subtopic_name: 'Metal Ion Tests by Precipitation', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **halide ion tests** (Cl⁻, Br⁻, I⁻) and the **sulfate ion test** (SO₄²⁻). *(4 tests)*',
    a: ['**Halide ion test**: add **dilute nitric acid (HNO₃)** first (to remove carbonate/sulfate ions that could interfere), then add **silver nitrate solution (AgNO₃)**'],
    hint: 'Halides: HNO₃ then AgNO₃ → Cl⁻=white, Br⁻=cream, I⁻=yellow. Sulfate: HCl then BaCl₂ → SO₄²⁻=white (BaSO₄). Acid first to remove interference.',
    exam_q: 'Describe the test for chloride ions in solution.',
    examMarks: 2,
    examA: 'Cl⁻=white, Br⁻=cream, I⁻=yellow. Sulfate: HCl then BaCl₂ → SO₄²⁻=white (BaSO₄). Acid first to remove interference. Exam Q: "Describe the test for chloride ions in solution." [2 marks] → Add dilute nitric acid then silver nitrate solution (1). White precipitate of silver chloride (AgCl) forms (1).' },


  // Chemistry C10 — Using Resources (Triple-only additions)
  { id: 'c10_t13', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.7', subtopic_name: 'NPK Fertilisers and Sources of Reactants', tier: 'T', exam_board: 'AQA',
    q: 'What are **NPK fertilisers** and how are the three main nutrients provided?',
    a: ['**N = Nitrogen**: supplied as **ammonium nitrate (NH₄NO₃)**, ammonium sulfate ((NH₄)₂SO₄), urea, or ammonia solution; promotes leafy growth', '**P = Phosphorus**: from **phosphate rock** (Ca₃(PO₄)₂) treated with acid to make it soluble (as ammonium phosphate or superphosphate); promotes root growth', '**K = Potassium**: from **potassium chloride (KCl)** or **potassium sulfate (K₂SO₄)** mined from natural deposits; promotes flowering and fruit', 'NPK fertilisers are **salts** — produced by reacting acids with ammonia or phosphate rock', '**Industrial production**: large-scale, continuous process; **laboratory preparation**: titration (e.g. NH₃ + HNO₃ → NH₄NO₃) then crystallisation'],
    hint: 'N = ammonium salts (NH₄NO₃ etc.) from Haber. P = phosphate rock + acid. K = KCl or K₂SO₄ (mined). NPK = all three together. Plants need all three for growth.',
    exam_q: 'Give the source of potassium used in NPK fertilisers.',
    examMarks: 1,
    examA: 'NH₄NO₃) then crystallisation Hint: N = ammonium salts (NH₄NO₃ etc.) from Haber. P = phosphate rock + acid. K = KCl or K₂SO₄ (mined). NPK = all three together. Plants need all three for growth. Exam Q: "Give the source of potassium used in NPK fertilisers." [1 mark] → Potassium chloride or potassium sulfate (mined from natural mineral deposits).' },

  { id: 'c10_t14', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.7', subtopic_name: 'NPK Fertilisers and Sources of Reactants', tier: 'T', exam_board: 'AQA',
    q: 'Where do the **nitrogen and hydrogen** for the Haber process come from?',
    a: ['**Nitrogen (N₂)**: obtained by **fractional distillation of liquefied air** — air is cooled and liquefied; components separated by their different boiling points; nitrogen (bp −196 °C) is collected', '**Hydrogen (H₂)**: mainly from **steam reforming of methane** (natural gas): **CH₄ + H₂O ⇌ CO + 3H₂** (carried out at high temperature with a catalyst); also from cracking of hydrocarbons or electrolysis of water', 'The mixture of N₂ and H₂ is fed into the Haber process at ratio approximately **1:3** (N₂:H₂)'],
    hint: 'N₂: fractional distillation of liquid air. H₂: steam reforming of methane (CH₄ + H₂O → CO + 3H₂) or cracking. Mix 1:3 (N₂:H₂) for Haber.',
    exam_q: 'State one source of hydrogen for use in the Haber process.',
    examMarks: 1,
    examA: 'CO + 3H₂) or cracking. Mix 1:3 (N₂:H₂) for Haber. Exam Q: "State one source of hydrogen for use in the Haber process." [1 mark] → Steam reforming of methane (natural gas) / CH₄ + H₂O → CO + 3H₂ / cracking of hydrocarbons.' },

  { id: 'c10_t15', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', subtopic: 'C10.7', subtopic_name: 'NPK Fertilisers and Sources of Reactants', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **laboratory preparation of ammonium sulfate** (an NPK nitrogen source). *(4 steps)*',
    a: ['**Add ammonia solution** to a burette; **add dilute sulfuric acid** to a conical flask with indicator', '**Carry out a rough titration** to find approximate endpoint; then a precise titration without indicator', 'Run **exactly the right amount** of ammonia into the acid until the endpoint (neutral pH 7.0 = ammonium sulfate)', 'Equation: **2NH₃(aq) + H₂SO₄(aq) → (NH₄)₂SO₄(aq)**', '**Evaporate** the solution in an evaporating basin to obtain **ammonium sulfate crystals**; dry gently'],
    hint: 'Titrate ammonia + sulfuric acid → ammonium sulfate + water. 2NH₃ + H₂SO₄ → (NH₄)₂SO₄. No indicator in final run (would contaminate). Evaporate to crystallise.',
    exam_q: 'Write the equation for the reaction between ammonia and sulfuric acid in the preparation of ammonium sulfate.',
    examMarks: 1,
    examA: '(NH₄)₂SO₄(aq)** - **Evaporate** the solution in an evaporating basin to obtain **ammonium sulfate crystals**; dry gently Hint: Titrate ammonia + sulfuric acid → ammonium sulfate + water. 2NH₃ + H₂SO₄ → (NH₄)₂SO₄. No indicator in final run (would contaminate). Evaporate to crystallise. Exam Q: "Write the equation for the reaction between ammonia and sulfuric acid in the preparation of ammonium sulfate." [1 mark] → 2NH₃ + H₂SO₄ → (NH₄)₂SO₄.' },


  // Physics P1 — Energy (Triple-only additions)
  { id: 'p1_t01', subject: 'Physics', topic: 'P1', topic_name: 'Energy', subtopic: 'P1.5', subtopic_name: 'Calculating Power', tier: 'T', exam_board: 'AQA',
    q: 'State the equation linking **power**, **energy transferred** and **time**, and give the units of each.',
    a: ['**Power (P) = energy transferred (E) ÷ time (t)**; equivalently **P = W/t** where W = work done', 'Units: power in **watts (W)**, energy in **joules (J)**, time in **seconds (s)**', '1 watt = 1 joule per second; a 1000 W device transfers 1000 J every second'],
    hint: 'P = E/t. Power is the rate of energy transfer. Watts = joules per second. 1 W = 1 J/s.',
    exam_q: 'A motor transfers 6000 J of energy in 30 seconds. Calculate the power of the motor.',
    examMarks: 2,
    examA: 'P = E/t = 6000 ÷ 30 (1) = **200 W** (1).' },

  { id: 'p1_t02', subject: 'Physics', topic: 'P1', topic_name: 'Energy', subtopic: 'P1.5', subtopic_name: 'Calculating Power', tier: 'T', exam_board: 'AQA',
    q: 'Rearrange **P = E/t** to find energy transferred or time, and apply to calculations.',
    a: ['**Energy transferred (E) = P × t** (power × time)', '**Time (t) = E ÷ P** (energy ÷ power)', 'Units must be consistent: if power is in kW, convert to W first; if time is in minutes, convert to seconds'],
    hint: 'P = E/t → E = P × t, t = E/P. Triangle: E on top, P and t on bottom. Keep units consistent.',
    exam_q: 'A 2500 W kettle is on for 4 minutes. Calculate the energy transferred.',
    examMarks: 2,
    examA: 'E = P × t, t = E/P. Triangle: E on top, P and t on bottom. Keep units consistent. Exam Q: "A 2500 W kettle is on for 4 minutes. Calculate the energy transferred." [2 marks] → t = 4 × 60 = 240 s (1) + E = 2500 × 240 = **600,000 J** / 600 kJ (1).' },

  { id: 'p1_t03', subject: 'Physics', topic: 'P1', topic_name: 'Energy', subtopic: 'P1.6', subtopic_name: 'Efficiency', tier: 'T', exam_board: 'AQA',
    q: 'Define **efficiency** and give the two equations used to calculate it.',
    a: ['**Efficiency** measures what fraction of the total input energy is transferred to a **useful** output', '**Efficiency = useful output energy transfer ÷ total input energy transfer** (gives a decimal, multiply by 100 for a percentage)', 'Alternatively: **efficiency = useful power output ÷ total power input**', 'Efficiency has no units; it is always between 0 and 1 (or 0% and 100%) — no device can be more than 100% efficient'],
    hint: 'Efficiency = useful out ÷ total in. Always ≤ 1. Multiply by 100 for %. Two versions: energy or power.',
    exam_q: 'A light bulb takes in 100 J of electrical energy and transfers 5 J as light. Calculate its efficiency.',
    examMarks: 2,
    examA: 'Efficiency = 5 ÷ 100 (1) = **0.05** (or 5%) (1).' },

  { id: 'p1_t04', subject: 'Physics', topic: 'P1', topic_name: 'Energy', subtopic: 'P1.6', subtopic_name: 'Efficiency', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 ways** to improve the efficiency of energy transfers.',
    a: ['**Lubrication**: reduces friction between moving parts → less energy transferred to heat', '**Thermal insulation**: reduces unwanted heat loss from devices or buildings (e.g. lagging pipes, loft insulation)', '**Using more efficient components**: e.g. **LED bulbs** instead of filament bulbs (filament bulbs waste ~95% of input energy as heat; LEDs waste far less)'],
    hint: 'Lubricate (reduce friction), insulate (reduce heat loss), use efficient components (LEDs). Three ways, three marks.',
    exam_q: 'Give two ways to improve the efficiency of an electric motor.',
    examMarks: 2,
    examA: 'less energy transferred to heat - **Thermal insulation**: reduces unwanted heat loss from devices or buildings (e.g. lagging pipes, loft insulation) - **Using more efficient components**: e.g. **LED bulbs** instead of filament bulbs (filament bulbs waste ~95% of input energy as heat; LEDs waste far less) Hint: Lubricate (reduce friction), insulate (reduce heat loss), use efficient components (LEDs). Three ways, three marks. Exam Q: "Give two ways to improve the efficiency of an electric motor." [2 marks] → Any 2 from: lubrication to reduce friction (1) + better insulation to reduce heat loss (1) + use of more efficient / modern components (1).' },

  { id: 'p1_t05', subject: 'Physics', topic: 'P1', topic_name: 'Energy', subtopic: 'P1.7', subtopic_name: 'The National Grid', tier: 'T', exam_board: 'AQA',
    q: 'Explain why electricity is transmitted at **high voltage and low current** in the National Grid.',
    a: ['Power transmitted = **P = IV** → for a fixed amount of power, high voltage means low current', 'Power lost in cables = **P = I²R** → power loss depends on the **square** of the current, so low current dramatically reduces heat losses in cables', 'Example: doubling voltage halves current → power loss reduced to one **quarter**', 'Cables have resistance; if current is high, significant energy is lost as **heat** in the cables — high voltage/low current minimises this'],
    hint: 'P = I²R → low I means tiny loss. Double V → half I → quarter loss. High voltage = less wasted heat.',
    exam_q: 'Explain why electricity is transmitted at high voltage across the National Grid.',
    examMarks: 3,
    examA: 'for a fixed amount of power, high voltage means low current - Power lost in cables = **P = I²R** → power loss depends on the **square** of the current, so low current dramatically reduces heat losses in cables - Example: doubling voltage halves current → power loss reduced to one **quarter** - Cables have resistance; if current is high, significant energy is lost as **heat** in the cables — high voltage/low current minimises this Hint: P = I²R → low I means tiny loss. Double V → half I → quarter loss. High voltage = less wasted heat. Exam Q: "Explain why electricity is transmitted at high voltage across the National Grid." [3 marks] → For a given power, high voltage means low current (1) + power lost in cables = I²R, so lower current means much less power wasted as heat (1) + this makes transmission more efficient / economical (1).' },

  { id: 'p1_t06', subject: 'Physics', topic: 'P1', topic_name: 'Energy', subtopic: 'P1.7', subtopic_name: 'The National Grid', tier: 'T', exam_board: 'AQA',
    q: 'Describe the role of **step-up transformers** in the National Grid.',
    a: ['**Step-up transformers** are located at **power stations**', 'They increase the voltage from the generator output (~25 kV) to the **transmission voltage (~400 kV)**', 'Increasing voltage reduces current → reduces energy lost as heat in transmission cables'],
    hint: 'Step-up at power station. Voltage up → current down → less heat wasted. 25 kV → 400 kV.',
    exam_q: 'Where in the National Grid are step-up transformers located, and what do they do?',
    examMarks: 2,
    examA: 'reduces energy lost as heat in transmission cables Hint: Step-up at power station. Voltage up → current down → less heat wasted. 25 kV → 400 kV. Exam Q: "Where in the National Grid are step-up transformers located, and what do they do?" [2 marks] → At power stations (1) + they increase voltage for transmission / reduce current to reduce energy losses in cables (1).' },

  { id: 'p1_t07', subject: 'Physics', topic: 'P1', topic_name: 'Energy', subtopic: 'P1.7', subtopic_name: 'The National Grid', tier: 'T', exam_board: 'AQA',
    q: 'Describe the role of **step-down transformers** in the National Grid.',
    a: ['**Step-down transformers** are located at **local substations** (near homes and businesses)', 'They reduce the high transmission voltage (~400 kV or 33 kV) back to the **safe mains voltage (230 V)** for homes', 'Multiple stages of step-down are used — extra-high voltage → high voltage → medium voltage → 230 V'],
    hint: 'Step-down at substations. Voltage down → safe for homes. 400 kV → 33 kV → 11 kV → 230 V (in stages).',
    exam_q: 'Explain the role of step-down transformers in the National Grid.',
    examMarks: 2,
    examA: 'high voltage → medium voltage → 230 V Hint: Step-down at substations. Voltage down → safe for homes. 400 kV → 33 kV → 11 kV → 230 V (in stages). Exam Q: "Explain the role of step-down transformers in the National Grid." [2 marks] → Located at substations (1) + reduce the transmission voltage to a safe level (230 V) for use in homes and businesses (1).' },


  // Physics P2 — Electricity (Triple-only additions)
  { id: 'p2_t01', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.5', subtopic_name: 'Alternating and Direct Current', tier: 'T', exam_board: 'AQA',
    q: 'Distinguish between **alternating current (AC)** and **direct current (DC)**.',
    a: ['**Direct current (DC)**: current flows in **one direction only** — produced by cells and batteries; voltage is constant', '**Alternating current (AC)**: current **reverses direction** periodically — produced by generators and used in mains electricity', 'The **frequency** of AC is how many complete cycles per second (Hz)', 'DC is used in electronic devices (phones, computers); AC is used for power transmission because transformers only work with AC'],
    hint: 'DC = one direction (battery). AC = back and forth (mains). Transformers only work with AC — why mains uses AC.',
    exam_q: 'State the difference between alternating current and direct current.',
    examMarks: 2,
    examA: 'Direct current flows in one direction only (1) + alternating current periodically reverses direction (1).' },

  { id: 'p2_t02', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.5', subtopic_name: 'Alternating and Direct Current', tier: 'T', exam_board: 'AQA',
    q: 'State the **frequency and voltage of UK mains electricity** and explain what they mean.',
    a: ['UK mains frequency: **50 Hz** — the current reverses direction **50 times per second** (50 complete cycles per second)', 'UK mains voltage: approximately **230 V** — this is the **r.m.s. (root mean square)** value, equivalent to the effective DC voltage', 'The **peak voltage** of UK mains is approximately **325 V** (higher than the 230 V r.m.s. because AC voltage oscillates between +325 V and −325 V)'],
    hint: 'UK mains: 50 Hz frequency, 230 V (rms). Peak voltage ≈ 325 V. The 230 V is the effective "equivalent DC" voltage.',
    exam_q: 'State the frequency and voltage of the UK mains electricity supply.',
    examMarks: 2,
    examA: 'Frequency = 50 Hz (1) + voltage = 230 V (1).' },

  { id: 'p2_t03', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.6', subtopic_name: 'Mains Electricity and Wiring', tier: 'T', exam_board: 'AQA',
    q: 'State the **colour, voltage and function** of each wire in a three-pin plug.',
    a: ['**Live wire** (brown): carries the **alternating current** at **~230 V**; dangerous — can cause electric shock', '**Neutral wire** (blue): completes the circuit; held at approximately **0 V** (earth potential)', '**Earth wire** (green and yellow stripes): a **safety wire** normally carrying no current; connected to the metal case of the appliance'],
    hint: 'Brown = Live (BroLi). Blue = Neutral. Green/yellow = Earth. Remember: "Brown Live, Blue Neutral, Green/Yellow Earth."',
    exam_q: 'State the colour and function of the live wire in a mains plug.',
    examMarks: 2,
    examA: 'Brown (1) + carries alternating current at mains voltage (~230 V) / is the wire that supplies electrical energy to the appliance (1).' },

  { id: 'p2_t04', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.6', subtopic_name: 'Mains Electricity and Wiring', tier: 'T', exam_board: 'AQA',
    q: 'Explain the function and importance of the **earth wire** in mains appliances.',
    a: ['The earth wire is connected to the **metal casing** of an appliance and to the earth (ground) via the plug', 'In normal operation, **no current flows** through the earth wire', 'If a fault develops (e.g. live wire touches the metal casing), current surges through the **earth wire** → this causes the **fuse to blow** or the circuit breaker to trip → disconnects the circuit', 'Without an earth wire, the metal casing could become live at 230 V → anyone touching it could receive a **fatal electric shock**'],
    hint: 'Earth wire = safety backup. Fault → current → earth wire → fuse blows → circuit off. Prevents metal case becoming live.',
    exam_q: 'Explain why the earth wire in a mains plug is a safety feature.',
    examMarks: 3,
    examA: 'this causes the **fuse to blow** or the circuit breaker to trip → disconnects the circuit - Without an earth wire, the metal casing could become live at 230 V → anyone touching it could receive a **fatal electric shock** Hint: Earth wire = safety backup. Fault → current → earth wire → fuse blows → circuit off. Prevents metal case becoming live. Exam Q: "Explain why the earth wire in a mains plug is a safety feature." [3 marks] → If a fault causes the live wire to touch the metal casing (1) + a large current flows through the earth wire / the fuse blows / circuit breaker trips (1) + this disconnects the circuit before a person can be electrocuted / prevents the casing remaining live (1).' },

  { id: 'p2_t05', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.6', subtopic_name: 'Mains Electricity and Wiring', tier: 'T', exam_board: 'AQA',
    q: 'Explain how a **fuse** and a **circuit breaker (RCD)** protect against electrical faults.',
    a: ['**Fuse**: contains a thin wire rated at a specific current; if current exceeds this rating, the wire **melts** → breaks the circuit; must be **replaced** after it blows', '**Circuit breaker**: an electromagnetic switch that **trips** (opens) when current exceeds a set value; can be **reset** by pressing a button — more convenient than replacing fuses', '**RCD (Residual Current Device)**: detects any **difference in current** between the live and neutral wires (which indicates current is leaking to earth through a person) → disconnects within **30 ms** — faster protection than a fuse', 'Fuses and circuit breakers protect wiring and equipment; RCDs specifically protect **people** from electrocution'],
    hint: 'Fuse = melts (replace). Circuit breaker = trips (reset). RCD = detects current leakage instantly (30 ms) = protects people.',
    exam_q: 'Explain how an RCD provides better protection against electric shock than a fuse.',
    examMarks: 2,
    examA: 'breaks the circuit; must be **replaced** after it blows - **Circuit breaker**: an electromagnetic switch that **trips** (opens) when current exceeds a set value; can be **reset** by pressing a button — more convenient than replacing fuses - **RCD (Residual Current Device)**: detects any **difference in current** between the live and neutral wires (which indicates current is leaking to earth through a person) → disconnects within **30 ms** — faster protection than a fuse - Fuses and circuit breakers protect wiring and equipment; RCDs specifically protect **people** from electrocution Hint: Fuse = melts (replace). Circuit breaker = trips (reset). RCD = detects current leakage instantly (30 ms) = protects people. Exam Q: "Explain how an RCD provides better protection against electric shock than a fuse." [2 marks] → An RCD detects a difference in current between live and neutral wires / detects current flowing to earth through a person (1) + and disconnects the circuit much faster than a fuse melts (1).' },

  { id: 'p2_t06', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.7', subtopic_name: 'Electrical Power: P = IV and P = I²R', tier: 'T', exam_board: 'AQA',
    q: 'State and use the equation **P = IV**, giving the units of each quantity.',
    a: ['**P = IV** where P = power (W), I = current (A), V = potential difference / voltage (V)', 'Rearrangements: **I = P/V** (current = power ÷ voltage); **V = P/I** (voltage = power ÷ current)', 'Used to find the correct fuse rating for an appliance: calculate I = P/V → choose fuse rated just above this current'],
    hint: 'P = IV. Power = current × voltage. Rearrange for fuse rating: I = P/V. Plug in numbers, check units.',
    exam_q: 'A 1150 W microwave is connected to a 230 V supply. Calculate the current it draws.',
    examMarks: 2,
    examA: 'choose fuse rated just above this current Hint: P = IV. Power = current × voltage. Rearrange for fuse rating: I = P/V. Plug in numbers, check units. Exam Q: "A 1150 W microwave is connected to a 230 V supply. Calculate the current it draws." [2 marks] → I = P/V = 1150 ÷ 230 (1) = **5 A** (1).' },

  { id: 'p2_t07', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', subtopic: 'P2.7', subtopic_name: 'Electrical Power: P = IV and P = I²R', tier: 'T', exam_board: 'AQA',
    q: 'State and use the equation **P = I²R**, and explain when it is most useful.',
    a: ['Derived by substituting **V = IR** into **P = IV**: P = I × (IR) = **I²R**', 'P = power (W), I = current (A), R = resistance (Ω)', 'Most useful when the **resistance and current** are known but voltage is not given; also explains why power loss in cables is proportional to **I²** (doubling current → four times the power loss)'],
    hint: 'P = I²R. Derived from P = IV and V = IR. Most useful when you have current and resistance. Explains cable heating.',
    exam_q: 'A resistor has resistance 20 Ω and carries a current of 3 A. Calculate the power dissipated.',
    examMarks: 2,
