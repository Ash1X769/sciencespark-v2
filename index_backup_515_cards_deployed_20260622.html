  { id: 'c4_029', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'F', exam_board: 'AQA',
    q: 'How do you **deduce the formula of a salt** from the charges of its ions?',
    a: ['Write the **ions and their charges** (e.g. Ca²⁺ and SO₄²⁻)', 'The total positive charge must equal the total negative charge → **charges must balance**', 'Choose the simplest whole number ratio: Ca²⁺ + SO₄²⁻ → **CaSO₄** (1:1 balances 2+ and 2−)', 'Al³⁺ + Cl⁻ → **AlCl₃** (one Al³⁺ balances three Cl⁻); Mg²⁺ + OH⁻ → **Mg(OH)₂**'],

  { id: 'c5_014', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 4** for measuring temperature changes in reactions.',
    a: ['Place a **polystyrene cup** in a beaker (as insulator); measure and record **initial temperature** of solution', 'Add the second reagent (e.g. acid + metal, acid + carbonate, or acid + alkali for neutralisation)', '**Stir** continuously; record the **highest** (exothermic) or **lowest** (endothermic) temperature reached', 'Calculate **temperature change** (ΔT = T_final − T_initial)', 'Control variables: volume of solution, concentration, starting temperature; repeat for reliability'],

  { id: 'c7_021', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', tier: 'F', exam_board: 'AQA',
    q: 'Write **balanced symbol equations for the complete combustion** of the first four alkanes.',
    a: ['**Methane**: CH₄ + 2O₂ → CO₂ + 2H₂O', '**Ethane**: C₂H₆ + 3½O₂ → 2CO₂ + 3H₂O', '**Propane**: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O', '**Butane**: C₄H₁₀ + 6½O₂ → 4CO₂ + 5H₂O', 'Method: balance **C** first (gives CO₂), then **H** (gives H₂O), then count **O**'],
    hint: 'CₙH₂ₙ₊₂ + O₂ → CO₂ + H₂O. Balance C first → CO₂. Then H → H₂O. Then count O atoms on right. CH₄+2O₂, C₂H₆+3.5O₂, C₃H₈+5O₂, C₄H₁₀+6.5O₂.',
    exam_q: 'Write a balanced equation for the complete combustion of propane (C₃H₈). [2 marks]',
    examMarks: 2,
    examA: '1 mark: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. 1 mark: fully balanced (all coefficients correct).' },

  { id: 'c10_020', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 8** for analysis and purification of water samples.',
    a: ['**pH test**: dip universal indicator paper into water sample; compare colour to chart to record pH', '**Dissolved solids test**: filter a sample then evaporate to dryness in an evaporating basin; weigh residue', '**Purification by distillation**: heat water sample in flask with thermometer; vapour passes through condenser; collect distillate in separate flask; pure water distils at 100°C', '**Compare**: distilled sample has no dissolved solids; check boiling point to confirm purity'],
    hint: 'pH: indicator paper. Dissolved solids: evaporate and weigh. Purification: distil at 100°C. Pure water: no residue, boils at exactly 100°C.',
    exam_q: 'Describe how you would test a water sample for dissolved solids and then purify it. [4 marks]',
    examMarks: 4,
    examA: '1 mark each: filter / evaporate to dryness / weigh residue to determine dissolved solids / purify by distillation / collect distillate at 100°C.' },

  { id: 'c4_030', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'F', exam_board: 'AQA',
    q: 'Describe the reaction of **calcium with water** and with **dilute acid**.',
    a: ['**Calcium + water**: Ca + 2H₂O → Ca(OH)₂ + H₂ — produces **calcium hydroxide** (a white cloudiness) and **hydrogen gas**; fizzes less vigorously than sodium', '**Calcium + dilute acid** (e.g. HCl): Ca + 2HCl → CaCl₂ + H₂ — produces **calcium chloride** salt and **hydrogen gas**', 'Calcium is less reactive than sodium but more reactive than magnesium'],
    hint: 'Ca + water → Ca(OH)₂ + H₂ (fizzes, white cloudiness). Ca + HCl → CaCl₂ + H₂. Less vigorous than Na but more than Mg.',
    exam_q: 'Write a word equation for calcium reacting with water. [1 mark]',
    examMarks: 1,
    examA: '1 mark: calcium + water → calcium hydroxide + hydrogen.' },

  { id: 'c4_031', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'F', exam_board: 'AQA',
    q: 'Explain **reactivity in the metal reactivity series** in terms of forming positive ions.',
    a: ['More reactive metals **lose electrons more easily** to form positive ions', 'The more readily a metal loses electrons → the higher it is in the reactivity series', 'Example: Na loses electrons very easily (Na → Na⁺ + e⁻) → very reactive; Cu loses electrons less readily → less reactive', 'Metals near the top of the series displace those below in solution because they more easily form ions'],
    hint: 'Reactivity = ease of losing electrons. Reactive metals → ions easily (high up reactivity series). Less reactive = less willing to form ions.',
    exam_q: 'Explain why sodium is more reactive than copper in terms of electrons. [2 marks]',
    examMarks: 2,
    examA: '1 mark: sodium loses electrons more easily than copper. 1 mark: sodium forms positive ions more readily / more easily oxidised.' },

  { id: 'c6_019', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate of Reaction', tier: 'F', exam_board: 'AQA',
    q: 'Explain the effect of **surface area to volume ratio** on rate of reaction.',
    a: ['When a solid is broken into **smaller pieces**, the **surface area increases** but total volume stays the same', '**SA:V ratio increases** → more surface exposed → **more reactant particles available** for collisions per unit volume', 'More frequent **collisions with greater probability** of reaction → **faster rate**', 'Example: powdered chalk reacts faster with HCl than a marble chip of the same mass'],
    hint: 'Smaller pieces → higher SA:Vol ratio → more surface exposed → more collisions per second → faster rate. Same mass, higher ratio = faster.',
    exam_q: 'Explain why powdered marble reacts faster with hydrochloric acid than marble chips of the same mass. [3 marks]',
    examMarks: 3,
    examA: '1 mark: powder has greater surface area to volume ratio. 1 mark: more acid particles can contact marble at once. 1 mark: more frequent collisions / faster rate of reaction.' },

  { id: 'c7_022', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', tier: 'F', exam_board: 'AQA',

    examMarks: 2,
    examA: '1 mark each: any 2 from: solvents / lubricants / polymers/plastics / detergents / cosmetics.' },

  { id: 'c9_018', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', tier: 'F', exam_board: 'AQA',

  { id: 'c10_021', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', tier: 'F', exam_board: 'AQA',

  { id: 'c1_038', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', tier: 'H', exam_board: 'AQA',
    q: 'How do you write a **balanced half equation**? Give the step-by-step method.',
    a: ['Write the species involved on each side (e.g. Cl₂ → Cl⁻)', 'Balance the **atoms** first (e.g. Cl₂ → 2Cl⁻)', 'Balance the **charge** by adding **electrons (e⁻)**: total charge on left must equal right', 'For **cathode (reduction)**: electrons are on the LEFT (e.g. 2H⁺ + 2e⁻ → H₂)', 'For **anode (oxidation)**: electrons are on the RIGHT (e.g. 2Cl⁻ → Cl₂ + 2e⁻)'],
    hint: 'Balance atoms → balance charge by adding e⁻. Cathode: e⁻ on left (reduction = REduction = Receives Electrons). Anode: e⁻ on right (oxidation = OIL).',
    exam_q: 'Write the half equation for the formation of hydrogen gas at the cathode during electrolysis. [2 marks]',
    examMarks: 2,
    examA: '1 mark: 2H⁺ + 2e⁻ → H₂. 1 mark: balanced (correct atoms and electrons, correct direction).' },

  { id: 'c4_032', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'H', exam_board: 'AQA',
    q: 'How do you write **ionic equations for metal displacement reactions**?',
    a: ['Write the full balanced equation (e.g. Zn + CuSO₄ → ZnSO₄ + Cu)', 'Split soluble ionic compounds into separate ions (spectator ions)', 'Remove **spectator ions** (ions that appear unchanged on both sides)', 'Write the **net ionic equation**: e.g. **Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)**', 'The oxidised species loses electrons (Zn → Zn²⁺); the reduced species gains electrons (Cu²⁺ → Cu)'],
    hint: 'Cancel spectators. Zn + Cu²⁺ → Zn²⁺ + Cu. Zn is oxidised (loses 2e⁻). Cu²⁺ is reduced (gains 2e⁻). State symbols matter.',
    exam_q: 'Write the ionic equation for the reaction of iron with copper(II) sulfate solution. [2 marks]',
    examMarks: 2,
    examA: '1 mark: Fe(s) + Cu²⁺(aq) → Fe²⁺(aq) + Cu(s). 1 mark: balanced with correct state symbols.' },

  { id: 'c4_033', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'H', exam_board: 'AQA',
    q: 'What is the difference between **dilute/concentrated** and **strong/weak** for acids?',
    a: ['**Dilute vs concentrated**: refers to the **amount of acid dissolved** in a given volume of solvent — a dilute acid has few moles of acid per dm³; a concentrated acid has many moles per dm³', '**Strong vs weak**: refers to the **degree of ionisation** — a strong acid (e.g. HCl) is **fully dissociated** into ions; a weak acid (e.g. CH₃COOH) is **partially dissociated**', 'A **concentrated weak acid** is possible (many acid molecules, but few dissociate): has low pH but not as low as strong acid at same concentration'],
    hint: 'Dilute/concentrated = how much acid per dm³. Strong/weak = how much dissociates. Strong: fully ionised. Weak: partially ionised. These are independent properties.',
    exam_q: 'Explain the difference between a dilute acid and a weak acid. [2 marks]',
    examMarks: 2,
    examA: '1 mark: dilute refers to the concentration (amount of solute per volume). 1 mark: weak refers to the degree of ionisation / partial dissociation of the acid.' },

  { id: 'c6_020', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate of Reaction', tier: 'H', exam_board: 'AQA',
    q: 'How do you **draw a tangent to a rate-of-reaction graph** and calculate the instantaneous rate?',
    a: ['At the required time point, draw a **straight line** that just touches the curve (tangent) without cutting through it', '**Extend the tangent** across a wide range to make calculation easier', 'Calculate the **gradient** of the tangent: gradient = rise ÷ run = (change in y) ÷ (change in x)', 'Units of rate: if y = volume (cm³) and x = time (s), then rate = **cm³/s**; if y = moles → rate in **mol/s**', 'Steeper tangent = faster rate at that moment'],
    hint: 'Tangent = straight line touching curve at one point. Gradient = rise/run. Units: (y units)/(x units) = cm³/s or g/s or mol/s. Steeper = faster rate.',
    exam_q: 'Describe how to use a tangent drawn to a concentration-time graph to find the rate of reaction at a specific time. [3 marks]',
    examMarks: 3,
    examA: '1 mark: draw tangent (straight line touching curve at that point). 1 mark: calculate gradient = rise ÷ run. 1 mark: state appropriate units (mol/s or mol/dm³/s or cm³/s).' },

  { id: 'c2_034', subject: 'Chemistry', topic: 'C2', topic_name: 'Bonding and Structure', tier: 'H', exam_board: 'AQA',
    q: 'What are the **limitations of the particle model** of matter?',
    a: ['The particle model **does not account for forces between particles** — it treats particles as independent, but in reality they attract and repel each other', 'Particles are assumed to have **no volume** — in practice, particles occupy space and this affects pressure/volume', 'The model **cannot explain** anomalous properties such as water **expanding** on freezing (instead of contracting like most substances)', 'It treats all particles as identical spheres — actual shapes and polarities affect properties'],
    hint: 'Limitations: ignores inter-particle forces, assumes zero particle volume, cannot explain why water expands on freezing, treats all particles as identical spheres.',
    exam_q: 'Give one limitation of the simple particle model of matter. [1 mark]',
    examMarks: 1,
    examA: '1 mark: any valid limitation — does not account for forces between particles / particles assumed to have no volume / cannot explain why water expands when it freezes.' },

  { id: 'c3_023', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', tier: 'H', exam_board: 'AQA',
    q: 'How do you **balance an equation from experimental masses** (working backwards from data)?',
    a: ['Given masses of reactants and products, **convert each mass to moles**: moles = mass ÷ Mr', 'Divide all mole values by the **smallest** value to get the simplest whole number ratio', 'Use this ratio as the **balancing coefficients** in the equation', 'Example: 56 g Fe reacts with 32 g S → moles Fe = 56/56 = 1; moles S = 32/32 = 1 → ratio 1:1 → Fe + S → FeS'],
    hint: 'Mass ÷ Mr = moles for each substance. Divide all by smallest mole value. Those numbers = balancing coefficients. Works backwards from real data.',
    exam_q: '4.0 g of calcium reacts with 3.2 g of oxygen. Find the simplest formula. (Ar: Ca=40, O=16) [3 marks]',
    examMarks: 3,
    examA: '1 mark: moles Ca = 4/40 = 0.1 mol; moles O = 3.2/16 = 0.2 mol. 1 mark: ratio Ca:O = 0.1:0.2 = 1:2. 1 mark: formula = CaO₂ / empirical formula CaO₂.' },

  { id: 'c3_024', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', tier: 'H', exam_board: 'AQA',
    q: 'How do you identify **outliers** in titration and what are **concordant results**?',
    a: ['Perform the titration **at least three times** and record all titre values', 'An **outlier** (anomalous result) differs significantly from the others — typically by more than **0.10 cm³** from the others', '**Concordant results** are those that agree within **0.10 cm³** of each other', 'Calculate the **mean titre** using only concordant results (exclude the outlier)', 'First titration is a rough titre to estimate the endpoint; not used in calculating the mean'],
    hint: 'Do ≥3 titrations. Concordant = within 0.10 cm³ of each other. Outlier = more than 0.10 cm³ different. Mean = average of concordant only. First = rough.',
    exam_q: 'A student gets titres of 24.75, 24.80, 24.70, 25.40 cm³. Which is the outlier? Calculate the mean. [2 marks]',
    examMarks: 2,
    examA: '1 mark: 25.40 cm³ is the outlier (more than 0.10 cm³ from others). 1 mark: mean = (24.75 + 24.80 + 24.70) ÷ 3 = 24.75 cm³.' },

  { id: 'c4_034', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'H', exam_board: 'AQA',
    q: 'How do you **identify the oxidised and reduced species** in a redox equation?',
    a: ['In **OIL RIG**: Oxidation Is Loss of electrons; Reduction Is Gain of electrons', 'Find species whose **oxidation state increases** → that species is **oxidised** (it is the reducing agent)', 'Find species whose **oxidation state decreases** → that species is **reduced** (it is the oxidising agent)', 'Example: Zn + Cu²⁺ → Zn²⁺ + Cu: Zn goes 0 → +2 (loses 2e⁻ → oxidised); Cu²⁺ goes +2 → 0 (gains 2e⁻ → reduced)'],
    hint: 'OIL RIG. Oxidation = charge goes up (loses electrons). Reduction = charge goes down (gains electrons). Oxidised species = reducing agent. Reduced species = oxidising agent.',
    exam_q: 'In the reaction Fe + Cu²⁺ → Fe²⁺ + Cu, identify which species is oxidised. Explain. [2 marks]',
    examMarks: 2,
    examA: '1 mark: iron (Fe) is oxidised. 1 mark: its oxidation state increases from 0 to +2 / it loses 2 electrons.' },

  { id: 'c6_021', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate of Reaction', tier: 'H', exam_board: 'AQA',

  { id: 'b14_001', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', tier: 'H', exam_board: 'AQA', q: 'What is the difference between **Type 1** and **Type 2** diabetes?', a: ['**Type 1**: pancreas produces **no insulin** — treated with **insulin injections**', '**Type 2**: body cells **do not respond** to insulin — linked to **obesity** — managed by diet'], hint: 'Type 1 = no insulin made. Type 2 = insulin ignored', exam_q: 'State two differences between Type 1 and Type 2 diabetes. [2 marks]', examMarks: 2, examA: '1 mark each: Type 1 no insulin produced / Type 2 cells resistant to insulin / different treatments.' },
  { id: 'b15_001', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', tier: 'F', exam_board: 'AQA', q: 'How is **sex determined** in humans?', a: ['Females = **XX**, males = **XY**', '**Y chromosome** determines male sex', '50:50 chance of male or female offspring'], hint: 'XX = female. XY = male. Y from dad determines boy', exam_q: 'Explain how sex is determined in humans. [2 marks]', examMarks: 2, examA: '1 mark: females XX, males XY. 1 mark: Y chromosome determines male sex.' },
  { id: 'b15_002', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', tier: 'T', exam_board: 'AQA', q: 'What is **sex-linked inheritance**?', a: ['Gene located on the **X chromosome**', 'Males (XY) only have **one copy** — if they inherit the allele, they show the condition', 'Examples: **colour blindness**, **haemophilia**', 'More common in **males**'], hint: 'Gene on X. Males only have one X so one copy = condition shows', exam_q: 'Explain why sex-linked conditions are more common in males. [2 marks]', examMarks: 2, examA: '1 mark: gene on X chromosome. 1 mark: males only have one X / only need one copy to show condition.' },
  { id: 'c11_001', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', tier: 'H', exam_board: 'AQA', q: 'What is **collision theory**?', a: ['Reactions occur when particles **collide** with **sufficient energy**', 'Minimum energy needed = **activation energy**', 'More frequent and more energetic collisions = **faster rate**'], hint: 'Particles must collide AND have enough energy', exam_q: 'Explain rate of reaction in terms of collision theory. [2 marks]', examMarks: 2, examA: '1 mark: particles must collide. 1 mark: must have sufficient energy / activation energy.' },
  { id: 'c11_002', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', tier: 'H', exam_board: 'AQA', q: 'What is **dynamic equilibrium**?', a: ['Forward and reverse reaction rates are **equal**', 'Concentrations of reactants and products remain **constant**', 'Only reached in a **closed system**'], hint: 'Both reactions at same rate. Concentrations constant, not equal', exam_q: 'What is meant by dynamic equilibrium? [2 marks]', examMarks: 2, examA: '1 mark: forward and reverse reactions at equal rates. 1 mark: concentrations remain constant.' },
  { id: 'c12_001', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', tier: 'H', exam_board: 'AQA', q: 'What are **alcohols** — functional group and properties?', a: ['Contain an **-OH** functional group', 'Soluble in water, **flammable**', 'Used as **fuels** and **solvents**', 'First member: **methanol** (CH₃OH)'], hint: 'Alcohols end in -ol. OH group is the key', exam_q: 'What functional group is present in alcohols? [1 mark]', examMarks: 1, examA: '1 mark: -OH (hydroxyl group).' },
  { id: 'c12_002', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', tier: 'H', exam_board: 'AQA', q: 'How are **esters** made?', a: ['Reacting an **alcohol** with a **carboxylic acid**', 'Requires an **acid catalyst**', 'Also produces **water**', 'Used as **flavourings** and **perfumes**'], hint: 'Alcohol + carboxylic acid = ester + water. Sweet smells = esters', exam_q: 'How are esters formed? [2 marks]', examMarks: 2, examA: '1 mark: alcohol reacts with carboxylic acid. 1 mark: acid catalyst / produces water.' },
  { id: 'c13_001', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', tier: 'H', exam_board: 'AQA', q: 'What are the **flame test colours** for common metal ions?', a: ['**Li⁺**: crimson/red', '**Na⁺**: yellow/orange', '**K⁺**: lilac/purple', '**Ca²⁺**: orange-red', '**Cu²⁺**: blue-green'], hint: 'Little Suzy Kissed Copper Carelessly: Li=crimson, Na=yellow, K=lilac, Ca=orange-red, Cu=blue-green', exam_q: 'State the flame test colours for sodium and potassium ions. [2 marks]', examMarks: 2, examA: '1 mark: sodium = yellow/orange. 1 mark: potassium = lilac/purple.' },
  { id: 'c13_002', subject: 'Chemistry', topic: 'C8', topic_name: 'Chemical Analysis', tier: 'H', exam_board: 'AQA', q: 'How do you test for **halide ions**?', a: ['Add **dilute nitric acid** then **silver nitrate** solution', '**Chloride**: white precipitate', '**Bromide**: cream precipitate', '**Iodide**: yellow precipitate'], hint: 'Silver nitrate test: White=Cl, Cream=Br, Yellow=I', exam_q: 'Describe how to test for chloride ions. [2 marks]', examMarks: 2, examA: '1 mark: add dilute nitric acid then silver nitrate. 1 mark: white precipitate formed.' },
  { id: 'c15_001', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', tier: 'H', exam_board: 'AQA', q: 'How does **temperature** affect equilibrium position?', a: ['Increase temperature → shifts in **endothermic direction**', 'Decrease temperature → shifts in **exothermic direction**'], hint: 'Heat added = endothermic direction. Heat removed = exothermic direction', exam_q: 'Explain how increasing temperature affects an exothermic reaction at equilibrium. [2 marks]', examMarks: 2, examA: '1 mark: equilibrium shifts in endothermic direction. 1 mark: yield of products decreases.' },
  { id: 'c16_001', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'H', exam_board: 'AQA', q: 'What are the products of **electrolysis of brine**?', a: ['**Chlorine gas** at the anode', '**Hydrogen gas** at the cathode', '**Sodium hydroxide** solution remains'], hint: 'Brine gives Cl2 + H2 + NaOH. Three useful products', exam_q: 'State the three products of the electrolysis of brine. [3 marks]', examMarks: 3, examA: '1 mark each: chlorine gas / hydrogen gas / sodium hydroxide solution.' },
  { id: 'p8_001', subject: 'Physics', topic: 'P8', topic_name: 'Space Physics', tier: 'T', exam_board: 'AQA', q: 'What is the **life cycle of a star** like our Sun?', a: ['**Nebula** → **protostar** → **main sequence star** → **red giant** → **white dwarf** → **black dwarf**'], hint: 'Our Sun is in main sequence. After: red giant, white dwarf, black dwarf', exam_q: 'Describe the life cycle of a star similar in size to our Sun. [3 marks]', examMarks: 3, examA: '1 mark each: nebula/protostar / main sequence / red giant / white dwarf / black dwarf (in order).' },
  { id: 'p8_002', subject: 'Physics', topic: 'P8', topic_name: 'Space Physics', tier: 'T', exam_board: 'AQA', q: 'What is the **life cycle of a massive star**?', a: ['**Nebula** → **protostar** → **main sequence** → **red supergiant** → **supernova** → **neutron star** or **black hole**'], hint: 'Massive stars end dramatically — supernova then neutron star or black hole', exam_q: 'Describe the life cycle of a star much more massive than our Sun. [3 marks]', examMarks: 3, examA: '1 mark each: main sequence / red supergiant / supernova / neutron star or black hole (in order).' },
  { id: 'p8_003', subject: 'Physics', topic: 'P8', topic_name: 'Space Physics', tier: 'T', exam_board: 'AQA', q: 'What is the evidence for the **Big Bang theory**?', a: ['**Red shift** — distant galaxies moving away, light shifted towards red', '**Cosmic microwave background radiation (CMBR)** — afterglow of the Big Bang'], hint: 'Red shift = galaxies moving away. CMBR = leftover heat from Big Bang', exam_q: 'State two pieces of evidence for the Big Bang theory. [2 marks]', examMarks: 2, examA: '1 mark each: red shift of distant galaxies / cosmic microwave background radiation.' },
  { id: 'p9_001', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'H', exam_board: 'AQA', q: 'What is the **principle of moments**?', a: ['For an object in **equilibrium**: sum of **clockwise moments** = sum of **anticlockwise moments**', '**Moment = force × perpendicular distance** from pivot (Nm)'], hint: 'Balanced seesaw: clockwise = anticlockwise moments', exam_q: 'State the principle of moments. [1 mark]', examMarks: 1, examA: '1 mark: sum of clockwise moments = sum of anticlockwise moments.' },
  { id: 'p9_002', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA', q: "What is **Hooke's Law** and the formula?", a: ['**Extension** is directly proportional to **force** applied', '**F = ke** — k = spring constant (N/m), e = extension (m)', 'Only applies up to the **limit of proportionality**'], hint: 'F = ke. Double force = double extension. Until you stretch too far', exam_q: "State Hooke's Law and write the formula. [2 marks]", examMarks: 2, examA: '1 mark: extension proportional to force. 1 mark: F = ke.' },
  { id: 'p10_001', subject: 'Physics', topic: 'P6', topic_name: 'Waves', tier: 'F', exam_board: 'AQA', q: 'What is **refraction** and why does it occur?', a: ['**Bending** of waves at boundary between two media', 'Caused by a change in **wave speed**', 'Slows down → bends **towards normal**. Speeds up → bends **away from normal**'], hint: 'Light slows in glass = bends towards normal. Speeds up leaving = bends away', exam_q: 'Explain why refraction occurs when light passes from air into glass. [2 marks]', examMarks: 2, examA: '1 mark: light slows down. 1 mark: change in speed causes change in direction / bends towards normal.' },
  { id: 'p10_002', subject: 'Physics', topic: 'P6', topic_name: 'Waves', tier: 'H', exam_board: 'AQA', q: 'What is **total internal reflection**?', a: ['When light hits a boundary at an angle **greater than** the **critical angle**', 'All light is **reflected back** — none passes through', 'Used in **optical fibres**'], hint: 'Past critical angle = all reflected. Optical fibres and diamonds use this', exam_q: 'Explain what is meant by total internal reflection. [2 marks]', examMarks: 2, examA: '1 mark: angle greater than critical angle. 1 mark: all light reflected / none transmitted.' },
  { id: 'p11_001', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism and Electromagnetism', tier: 'H', exam_board: 'AQA', q: 'How does an **electric motor** work?', a: ['**Current-carrying coil** in a **magnetic field**', 'Forces on opposite sides of coil act in **opposite directions** → **rotation**', '**Split-ring commutator** reverses current every half turn to keep rotation continuous'], hint: 'Current + field = force. Opposite sides spin the coil. Commutator keeps it going', exam_q: 'Explain how a simple electric motor works. [3 marks]', examMarks: 3, examA: '1 mark each: current-carrying coil in field / forces in opposite directions / coil rotates / commutator reverses current.' },
  { id: 'p12_001', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'H', exam_board: 'AQA', q: 'What happens in **alpha decay**?', a: ['Nucleus emits an **alpha particle** (2 protons + 2 neutrons)', '**Mass number −4**, **atomic number −2**', 'A new element is formed'], hint: 'Alpha decay: lose 4 mass, lose 2 atomic number. Ejects helium nucleus', exam_q: 'Describe what happens to the nucleus during alpha decay. [2 marks]', examMarks: 2, examA: '1 mark: emits alpha particle. 1 mark: mass number -4, atomic number -2.' },
  { id: 'p12_002', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'H', exam_board: 'AQA', q: 'What is a **chain reaction** in nuclear fission?', a: ['**Uranium-235** absorbs a neutron and splits', 'Releases **energy** and **2-3 more neutrons**', 'These cause **further fission** — self-sustaining', 'Controlled in **nuclear reactors**, uncontrolled = **explosion**'], hint: 'One split gives neutrons that cause more splits. Exponential. Controlled in reactors', exam_q: 'Explain what is meant by a chain reaction in nuclear fission. [3 marks]', examMarks: 3, examA: '1 mark each: fission releases neutrons / neutrons cause further fission / self-sustaining / exponential increase.' },
  { id: 'p13_001', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'T', exam_board: 'AQA', q: 'What is **antimatter**?', a: ['Every particle has a corresponding **antiparticle** — same mass, **opposite charge**', 'When particle meets antiparticle they **annihilate** — releasing **gamma rays**', 'Example: **positron** is the antiparticle of the electron'], hint: 'Antiparticle = same mass, opposite charge. Meet = annihilate = energy', exam_q: 'What happens when a particle meets its antiparticle? [2 marks]', examMarks: 2, examA: '1 mark: they annihilate. 1 mark: energy/gamma rays released.' },

  { id: 'p1_020', subject: 'Physics', topic: 'P1', topic_name: 'Energy', tier: 'F', exam_board: 'AQA',
    q: 'State the **elastic potential energy equation** (Ee = ½ke²) and define each term.',
    a: ['**Ee = ½ke²** where: Ee = elastic potential energy stored (J); k = spring constant (N/m); e = extension or compression (m)', '**k** measures the stiffness of the spring — a higher k means a stiffer spring', 'The equation also equals the **work done** in stretching/compressing the spring (assuming elastic deformation)', 'Units: if k in N/m and e in m → Ee in joules (J)'],
    hint: 'Ee = ½ke². k = spring constant (N/m). e = extension (m). Result in joules. Only valid within the limit of proportionality.',
    exam_q: 'A spring with spring constant 40 N/m is extended by 0.05 m. Calculate the elastic PE stored. [2 marks]',
    examMarks: 2,
    examA: '1 mark: Ee = ½ × 40 × (0.05)². 1 mark: = ½ × 40 × 0.0025 = 0.05 J.' },

  { id: 'p2_019', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'What are the **standard circuit symbols** you need to know?',
    a: ['**Cell**: one long and one short line (+ and −). **Battery**: multiple cells in series', '**Switch** (open): gap in line; **switch** (closed): line connects', '**Fixed resistor**: rectangle; **variable resistor**: rectangle with arrow through it', '**Lamp**: circle with X inside; **LED**: triangle with arrow pointing right with two arrows out (light emitting)', '**Ammeter**: circle with A (connected in series); **voltmeter**: circle with V (connected in parallel)', '**Diode**: triangle pointing right with bar. **Fuse**: rectangle. **Thermistor**: rectangle with T. **LDR**: rectangle with arrows pointing in'],
    hint: 'Cell (one short/long line). Resistor (rectangle). Lamp (circle X). Ammeter A (series). Voltmeter V (parallel). Thermistor = resistor + T. LDR = resistor + arrows in.',
    exam_q: 'Draw the circuit symbol for: (a) a thermistor (b) an LDR. [2 marks]',
    examMarks: 2,
    examA: '1 mark each: thermistor = resistor symbol (rectangle) with T above / LDR = resistor symbol with arrows pointing toward it (indicating light).' },

  { id: 'p2_020', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 15** for investigating what affects resistance.',
    a: ['**Effect of wire length**: connect a length of resistance wire to a circuit with ammeter and voltmeter; measure current (A) and voltage (V); calculate R = V/I; change length and repeat', '**Series and parallel combinations**: build circuits with different numbers/arrangements of resistors; measure total resistance each time', 'Control variables: temperature, wire diameter/material, voltage; repeat readings for reliability', '**Result**: longer wire → greater resistance; more resistors in series → greater resistance; more in parallel → lower resistance'],
    hint: 'RP15: measure R=V/I for different wire lengths (longer → higher R) and for series/parallel combinations. Control temperature and wire material.',
    exam_q: 'Describe how to investigate how wire length affects resistance. [4 marks]',
    examMarks: 4,
    examA: '1 mark each: set up circuit with ammeter in series and voltmeter in parallel / measure V and I for different wire lengths / calculate R = V/I each time / keep temperature and wire material constant.' },

  { id: 'p2_021', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Describe how a **thermistor** works and how it is used in a **thermostat**.',
    a: ['A **thermistor** is a component whose **resistance decreases as temperature increases** (most common type: NTC — negative temperature coefficient)', 'At high temperature: low resistance → high current flows. At low temperature: high resistance → low current flows', 'In a **thermostat circuit**: as temperature rises → thermistor resistance falls → voltage across it falls → this change is used to switch off a heater', '**Uses**: thermostats in central heating, temperature sensors in electronic devices, fire alarms'],
    hint: 'Thermistor: hotter → resistance falls. NTC = Negative Temperature Coefficient. In thermostat: low resistance at high temp → sensor detects warmth → heater switches off.',
    exam_q: 'Describe the relationship between temperature and resistance for a thermistor. [2 marks]',
    examMarks: 2,
    examA: '1 mark: as temperature increases, resistance decreases. 1 mark: this is a non-linear relationship / the component has a negative temperature coefficient.' },

  { id: 'p2_022', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Describe how an **LDR (light-dependent resistor)** works and give an application.',
    a: ['An **LDR** is a component whose **resistance decreases as light intensity increases**', 'In bright light: low resistance → high current. In dim light: high resistance → low current', '**In automatic lighting circuits**: in darkness, LDR resistance is high → voltage across LDR is high → circuit detects this and **switches on the light**; in daylight, resistance falls, voltage falls, light switches off', '**Other uses**: camera light meters, automatic street lights, burglar alarms'],
    hint: 'LDR: brighter → resistance falls. Dark → high resistance → circuit activates. Automatic street lights: dark → LDR high R → light turns on. Bright → low R → light stays off.',
    exam_q: 'Explain how an LDR could be used in an automatic street lighting circuit. [3 marks]',
    examMarks: 3,
    examA: '1 mark: in darkness LDR has high resistance. 1 mark: high resistance gives high voltage across LDR / triggers switching circuit. 1 mark: light switches on / as it gets light the resistance falls and the lamp switches off.' },

  { id: 'p2_023', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Why is the **live wire dangerous** even when a switch is open? What happens when live wire touches earth?',
    a: ['The **live wire** is at 230 V (alternating, dangerous voltage) relative to earth — this is maintained by the power station **even when the switch is open**', 'The switch interrupts the **circuit path** but does NOT disconnect the live wire from its source of voltage', 'If the switch is in the **neutral wire** instead of the live, the appliance is disconnected from current flow but the live wire terminal is still at 230 V → touching it causes **electric shock** or **death**', 'If live wire touches **earth**: huge current flows → fuse blows or circuit breaker trips → circuit disconnected for safety'],
    hint: 'Live wire = always at 230 V (even switch open). Switch in circuit breaks current flow, not the live voltage. Live + earth = short circuit → massive current → fuse blows.',
    exam_q: 'Explain why the live wire is dangerous even when the switch in a circuit is open. [2 marks]',
    examMarks: 2,
    examA: '1 mark: the live wire remains at 230 V even when the switch is open. 1 mark: contact with the live wire can cause electric shock / the switch interrupts current flow but not the voltage on the live wire.' },

  { id: 'p3_015', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 17** for measuring density of regular, irregular, and liquid samples.',
    a: ['**Regular solid** (e.g. cuboid): measure dimensions with ruler/callipers (length l, width w, height h); volume V = l × w × h; weigh on balance; ρ = m/V', '**Irregular solid** (e.g. rock): weigh on balance; fill measuring cylinder with water; submerge solid; volume = increase in water level (displacement)', '**Liquid**: use a measuring cylinder to measure volume; weigh empty container then container + liquid; mass of liquid = difference; ρ = m/V', 'All densities in g/cm³ or kg/m³'],
    hint: 'Regular: measure dimensions → V = l×w×h. Irregular: displace water → V = water rise. Liquid: measure volume in cylinder; weigh. ρ = m/V for all.',
    exam_q: 'Describe how to find the density of an irregularly shaped stone. [3 marks]',
    examMarks: 3,
    examA: '1 mark: measure mass using balance. 1 mark: partially fill measuring cylinder with water; record volume. 1 mark: lower stone in; volume = new reading minus old reading; density = mass ÷ volume.' },

  { id: 'p3_016', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model', tier: 'F', exam_board: 'AQA',
    q: 'Describe the required practical to **measure latent heat of fusion** for water (ice).',
    a: ['Set up crushed ice in a **funnel** over a beaker; connect an **immersion heater** (known power P) to melt the ice; collect melt water', 'Record the **mass of water collected** (m) over a known time (t): energy supplied E = P × t', 'Control experiment: set up identical funnel without heater to measure water collected by natural melting (subtract from total)', 'Calculate **Lf = E/m** = (P × t) / m. Units: J/kg', 'Or plot E against m: gradient = Lf'],
    hint: 'Heater in ice → melt water collected. E = Pt. Subtract control (no heater). Lf = E/m = Pt/m. Or: gradient of E vs m graph = Lf.',
    exam_q: 'A 50 W heater melts 0.025 kg of ice in 5 minutes. Calculate the specific latent heat of fusion. [3 marks]',
    examMarks: 3,
    examA: '1 mark: E = 50 × 300 = 15 000 J. 1 mark: Lf = E/m = 15 000 ÷ 0.025. 1 mark: = 600 000 J/kg.' },

  { id: 'p4_016', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'F', exam_board: 'AQA',
    q: 'Define **atomic number**, **mass number** and **isotopes**.',
    a: ['**Atomic number** (proton number): the number of **protons** in the nucleus; defines which element it is; equal to the number of electrons in a neutral atom', '**Mass number** (nucleon number): the total number of **protons + neutrons** in the nucleus', '**Number of neutrons** = mass number − atomic number', '**Isotopes**: atoms of the **same element** (same atomic number) but with **different numbers of neutrons** (different mass numbers). Example: carbon-12 and carbon-14 are isotopes'],
    hint: 'Atomic number = protons (= electrons in neutral atom). Mass number = protons + neutrons. Neutrons = mass − atomic. Isotopes = same protons, different neutrons.',
    exam_q: 'Carbon-12 has atomic number 6. State the number of protons and neutrons. [2 marks]',
    examMarks: 2,
    examA: '1 mark: protons = 6. 1 mark: neutrons = 12 − 6 = 6.' },

  { id: 'p4_017', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'F', exam_board: 'AQA',
    q: 'Write **balanced nuclear equations** for alpha and beta decay.',
    a: ['**Alpha decay** (⁴₂α): mass number decreases by 4; atomic number decreases by 2. Example: ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He', '**Beta decay** (⁰₋₁β): mass number unchanged; atomic number increases by 1 (a neutron converts to proton + electron). Example: ¹⁴₆C → ¹⁴₇N + ⁰₋₁e', 'Check: **top numbers** (mass) must balance on both sides; **bottom numbers** (atomic number) must balance', 'Nuclear equations always have both numbers: superscript = mass number, subscript = atomic number'],
    hint: 'Alpha: -4 mass, -2 atomic. Beta: 0 mass, +1 atomic. Top numbers balance. Bottom numbers balance. Alpha particle = ⁴₂He. Beta particle = ⁰₋₁e.',
    exam_q: 'Complete the nuclear equation for alpha decay: ²²⁶₈₈Ra → ? + ⁴₂He. [2 marks]',
    examMarks: 2,
    examA: '1 mark: correct mass number = 226 − 4 = 222. 1 mark: correct atomic number = 88 − 2 = 86, so ²²²₈₆Rn.' },

  { id: 'p5_022', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'State the equation **v² = u² + 2as** and explain when to use it.',
    a: ['**v² = u² + 2as** where: v = final velocity (m/s); u = initial velocity (m/s); a = acceleration (m/s²); s = distance/displacement (m)', 'Use when you know or want to find **velocity, initial speed, acceleration, and distance** but do NOT know the time', 'If object starts from rest: u = 0 → v² = 2as', 'Rearrangements: a = (v² − u²) ÷ 2s; s = (v² − u²) ÷ 2a'],
    hint: 'v² = u² + 2as. Use when time is unknown. u=0 (from rest) → v²=2as. Rearrange: a=(v²-u²)/2s, s=(v²-u²)/2a.',
    exam_q: 'A car accelerates from 10 m/s to 30 m/s over 200 m. Calculate the acceleration. [3 marks]',
    examMarks: 3,
    examA: '1 mark: v² = u² + 2as → 900 = 100 + 2a(200). 1 mark: 800 = 400a. 1 mark: a = 2 m/s².' },

  { id: 'p5_023', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 18** for investigating the force-extension relationship for a spring.',
    a: ['Set up a **clamp stand** with a spring hanging vertically; attach a **pointer** to the bottom of the spring and a ruler alongside', 'Add masses one at a time (e.g. 100 g each); record the **extension** (final length − original length) for each mass', 'Calculate **force** = mass × g (N); plot **force (N)** on y-axis vs **extension (m)** on x-axis', 'Below the **limit of proportionality**: straight line through origin (Hooke\'s Law obeyed)', 'Spring constant k = gradient of the straight-line section'],
    hint: 'Clamp stand. Hang spring. Add masses. Measure extension each time. Plot F vs extension. Straight line = Hooke\'s Law. k = gradient. Kink = limit of proportionality.',
    exam_q: 'Describe how to investigate the relationship between force and extension of a spring. [4 marks]',
    examMarks: 4,
    examA: '1 mark each: clamp spring vertically / add masses and record extension for each / calculate force = mg / plot force vs extension / identify limit of proportionality / spring constant = gradient of linear section.' },

  { id: 'p5_024', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 19** for investigating Newton\'s Second Law (F = ma).',
    a: ['Set up a **trolley** on a smooth ramp connected to a hanging mass via a string over a pulley', '**Light gates** (or a ticker timer) measure the acceleration of the trolley', 'To investigate **force vs acceleration** (constant mass): increase the hanging mass (increasing force F); measure acceleration each time', 'To investigate **mass vs acceleration** (constant force): keep hanging mass constant; add masses to trolley (increasing m); measure acceleration', 'Plot F vs a (constant m) → straight line. Plot 1/m vs a (constant F) → straight line. Both verify F = ma'],
    hint: 'Trolley + pulley + hanging mass. Light gates measure acceleration. Test 1: vary force (hanging mass) → constant total mass. Test 2: vary trolley mass → constant force. F=ma verified.',
    exam_q: 'Describe how to investigate the effect of force on acceleration. [4 marks]',
    examMarks: 4,
    examA: '1 mark each: trolley on ramp with string over pulley to hanging mass / measure acceleration using light gates / keep total mass constant / increase hanging mass to vary force / plot force vs acceleration — straight line through origin verifies F=ma.' },

  { id: 'p6_017', subject: 'Physics', topic: 'P6', topic_name: 'Waves', tier: 'F', exam_board: 'AQA',
    q: 'State the equation **T = 1/f** and explain what it means.',
    a: ['**T = 1/f** where T = period (s) and f = frequency (Hz)', 'The **period** is the time for one complete wave cycle; **frequency** is the number of cycles per second', 'They are **inversely related**: higher frequency → shorter period; lower frequency → longer period', 'Example: mains electricity at 50 Hz → T = 1/50 = **0.02 s**; sound at 440 Hz → T = 1/440 ≈ **0.0023 s**'],
    hint: 'T = 1/f. Period and frequency are reciprocals. High frequency → short period. 50 Hz → T = 0.02 s. 440 Hz → T ≈ 0.0023 s.',
    exam_q: 'A wave has a frequency of 200 Hz. Calculate its period. [2 marks]',
    examMarks: 2,
    examA: '1 mark: T = 1/f. 1 mark: T = 1/200 = 0.005 s.' },

  { id: 'p6_018', subject: 'Physics', topic: 'P6', topic_name: 'Waves', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 20** for measuring waves in a ripple tank or on a string.',
    a: ['**Ripple tank**: fill with water; use a vibrating bar to create waves; measure **wavelength** (distance between wave crests) with a ruler from a photograph or stroboscope image; count **frequency** from the motor speed/stroboscope; calculate **wave speed** v = fλ', '**Waves on a string**: create stationary waves using a signal generator and string over a pulley; measure the **wavelength** = 2 × distance between nodes; read **frequency** from the signal generator; calculate v = fλ', 'Control: tension in string, frequency of source'],
    hint: 'Ripple tank: photograph → measure λ, read f from motor → v=fλ. String: stationary wave, measure node-to-node distance ×2 = λ, read f from generator → v=fλ.',
    exam_q: 'Describe how to measure the speed of waves in a ripple tank. [3 marks]',
    examMarks: 3,
    examA: '1 mark: measure wavelength between wave crests (from photograph/stroboscope). 1 mark: determine frequency from motor or stroboscope frequency. 1 mark: calculate wave speed using v = fλ.' },

  { id: 'p6_019', subject: 'Physics', topic: 'P6', topic_name: 'Waves', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 21** for investigating infrared absorption and emission by different surfaces.',
    a: ['Fill a **Leslie cube** (metal cube) with hot water; set up an **infrared detector** at equal distances from each surface', 'Compare **infrared radiation emitted** from: matt black surface; shiny silver surface; white surface; matt white surface', 'Measure the **detector reading** (infrared intensity) from each surface at the same distance', '**Result**: matt black emits the most infrared; shiny silver emits the least; dull dark surfaces are the best absorbers and emitters of infrared', 'Safety: hot water — use insulated gloves'],
    hint: 'Leslie cube (4 surfaces). IR detector at equal distance. Compare readings. Matt black = best emitter/absorber. Shiny silver = worst emitter/absorber.',
    exam_q: 'A student uses a Leslie cube. Which surface emits the most infrared? Explain. [2 marks]',
    examMarks: 2,
    examA: '1 mark: matt black surface. 1 mark: dark, dull surfaces are the best emitters of infrared radiation.' },

  { id: 'p7_004', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **magnetic field pattern around a straight current-carrying wire**.',
    a: ['The field consists of **concentric circles** centred on the wire, arranged in planes **perpendicular** to the current', 'The field direction is given by the **right-hand grip rule**: point thumb in direction of conventional current; fingers curl in the direction of the magnetic field', 'The field is **stronger** closer to the wire (field lines closer together); **weaker** further away', 'Reversing the current direction **reverses** the field direction'],
    hint: 'Concentric circles perpendicular to wire. Right-hand grip rule: thumb = current, fingers = field direction. Closer to wire = stronger. Reverse current = reverse field.',
    exam_q: 'Describe the shape of the magnetic field around a long straight wire carrying current. [2 marks]',
    examMarks: 2,
    examA: '1 mark: concentric circles centred on the wire. 1 mark: circles in planes perpendicular to the wire / stronger (closer together) near the wire.' },

  { id: 'p1_021', subject: 'Physics', topic: 'P1', topic_name: 'Energy', tier: 'F', exam_board: 'AQA',
    q: 'How does **thermal conductivity** affect the rate of energy transfer through a building wall?',
    a: ['**Higher thermal conductivity** = material transfers thermal energy more quickly for a given temperature difference', 'A **thicker wall** reduces the rate of energy transfer (longer path for heat to travel)', 'Rate of energy transfer ∝ **thermal conductivity × area × temperature difference ÷ thickness**', 'Double glazing (air gap) reduces conductivity; cavity wall insulation reduces convection and conductivity; loft insulation slows transfer'],
    hint: 'High conductivity = fast heat transfer. Thick wall = slower. Insulation reduces conductivity. Rate ∝ conductivity × area × ΔT / thickness.',
    exam_q: 'Explain why a building with thicker walls loses heat more slowly. [2 marks]',
    examMarks: 2,
    examA: '1 mark: thicker walls increase the path length for heat to travel. 1 mark: rate of energy transfer decreases with thickness / there is greater thermal resistance.' },

  { id: 'p5_025', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'What is the difference between **distance** and **displacement**?',
    a: ['**Distance** is a **scalar** quantity — it has magnitude only; it is the total length of path travelled regardless of direction', '**Displacement** is a **vector** quantity — it has both magnitude and direction; it is the straight-line distance from start to finish point in a specified direction', 'A person walks 4 km north then 4 km south: **distance** = 8 km; **displacement** = 0 (back at start)', 'When calculating velocity and acceleration, always use **displacement** (not distance)'],
    hint: 'Distance = total path (scalar). Displacement = straight line from start to end (vector). 4 km north, 4 km back → distance 8 km, displacement 0.',
    exam_q: 'A car travels 6 km east then 6 km west. What is its displacement? [1 mark]',
    examMarks: 1,
    examA: '1 mark: displacement = 0 km (back at starting point) / zero displacement.' },

  { id: 'p5_026', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'State **typical speed values** for common movements.',
    a: ['**Walking**: ~1.5 m/s; **running**: ~3 m/s; **cycling**: ~6 m/s', '**Car** on road: ~13–30 m/s (30–70 mph); **train**: ~55 m/s; **aeroplane**: ~250 m/s', '**Speed of sound** in air: ~330 m/s; **speed of sound** in water: ~1500 m/s', '**Speed of light** (and all EM waves): 3 × 10⁸ m/s in a vacuum'],
    hint: 'Walk ~1.5, run ~3, cycle ~6, car ~13-30, train ~55, plane ~250, sound ~330, light ~3×10⁸ m/s. Learn walking/running/cycling/sound/light.',
    exam_q: 'A person walks 120 m in 80 s. State whether this is a typical walking speed. [2 marks]',
    examMarks: 2,
    examA: '1 mark: speed = 120 ÷ 80 = 1.5 m/s. 1 mark: yes, this is a typical walking speed (approximately 1.5 m/s).' },

  { id: 'p6_020', subject: 'Physics', topic: 'P6', topic_name: 'Waves', tier: 'F', exam_board: 'AQA',
    q: 'How is **visible light** used in **optical fibre communications**?',
    a: ['Optical fibres carry **visible light** (or infrared) pulses along a thin glass or plastic fibre', '**Total internal reflection** keeps the light inside the fibre even as it bends — light reflects off the inner boundary at angles greater than the critical angle', 'The light pulses represent **digital signals** (1s and 0s); these travel at the speed of light', '**Advantages**: very high data capacity; no electrical interference; low energy loss over long distances compared to electrical cables'],
    hint: 'Optical fibre: light pulses bounced along glass by total internal reflection. Digital signals. Advantages: fast, high capacity, no EMI, low loss.',
    exam_q: 'Explain how total internal reflection is used in optical fibre communications. [2 marks]',
    examMarks: 2,
    examA: '1 mark: light travels along the fibre by total internal reflection at the boundary. 1 mark: light pulses carry digital signals / travel at the speed of light with minimal energy loss.' },

  { id: 'p7_005', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism', tier: 'F', exam_board: 'AQA',
    q: 'How do you **plot a magnetic field pattern** using a compass?',
    a: ['Place the magnet on paper; mark the **north** and **south** poles', 'Place compass near one pole; mark a dot at the **tail** and **tip** of the compass needle', 'Move compass so **tail** is at the previous **tip**; mark new tip position', 'Continue until you reach the opposite pole — join all dots to form a **field line**', 'Repeat at different starting positions to build the full field pattern; add arrows showing direction (N→S outside magnet)'],
    hint: 'Start near N pole. Dot at tail, dot at tip of needle. Move tail to last tip. Join dots. Arrows: N to S outside. Repeat at different positions to map the full field.',
    exam_q: 'Describe how to plot a magnetic field line using a plotting compass. [3 marks]',
    examMarks: 3,
    examA: '1 mark: place compass near pole and mark dot at tip. 1 mark: move compass so tail is at last dot; mark new tip. 1 mark: continue until reaching opposite pole; join dots to form field line.' },

  { id: 'p2_024', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'H', exam_board: 'AQA',
    q: 'State the **transformer power equation** (Vp × Ip = Vs × Is) and use it.',
    a: ['**Vp × Ip = Vs × Is** — for an ideal (100% efficient) transformer, input power equals output power', 'Vp = primary voltage (V); Ip = primary current (A); Vs = secondary voltage (V); Is = secondary current (A)', 'A **step-up** transformer increases voltage → **decreases** current (power constant)', 'Example: if Vp = 11 000 V, Ip = 2 A, Vs = 230 V → Is = (11 000 × 2) ÷ 230 = **95.7 A**'],
    hint: 'Vp×Ip = Vs×Is (ideal transformer, 100% efficient). Rearrange: Is = VpIp/Vs. Step-up voltage → step-down current. Same power both sides.',
    exam_q: 'A transformer has Vp = 240 V, Vs = 12 V. If the primary current is 0.5 A, find the secondary current. [2 marks]',
    examMarks: 2,
    examA: '1 mark: Vp × Ip = Vs × Is → 240 × 0.5 = 12 × Is. 1 mark: Is = 120 ÷ 12 = 10 A.' },

  { id: 'p4_019', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'H', exam_board: 'AQA',
    q: 'How do you calculate **remaining activity** after several half-lives? (N = N₀ × (½)ⁿ)',
    a: ['**N = N₀ × (½)ⁿ** where N = remaining activity/count/number of nuclei; N₀ = initial value; n = number of half-lives elapsed', 'Each half-life → remaining = **half** of previous: after 1 half-life → ½ N₀; after 2 → ¼ N₀; after 3 → ⅛ N₀', 'To find n: time elapsed ÷ half-life = n. Then N = N₀ × (0.5)ⁿ', 'Example: N₀ = 800 Bq, T½ = 3 hours, t = 9 hours → n = 9/3 = 3 → N = 800 × (½)³ = **100 Bq**'],
    hint: 'N = N₀ × (½)ⁿ. n = time/half-life. After n half-lives: divide by 2 n times. 3 half-lives: 800→400→200→100.',
    exam_q: 'A radioactive source has activity 6400 Bq and half-life 2 hours. What is its activity after 8 hours? [3 marks]',
    examMarks: 3,
    examA: '1 mark: n = 8 ÷ 2 = 4 half-lives. 1 mark: N = 6400 × (½)⁴ = 6400 × 1/16. 1 mark: N = 400 Bq.' },

  { id: 'p5_027', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'H', exam_board: 'AQA',
    q: 'How do you find **instantaneous speed** from a curved distance-time graph?',
    a: ['Draw a **tangent** to the curve at the required time point (a straight line just touching the curve without crossing it)', 'Calculate the **gradient** of the tangent: gradient = vertical change ÷ horizontal change = Δdistance ÷ Δtime', 'The gradient = **instantaneous speed** at that moment (m/s)', 'Extend the tangent across a wide range (larger triangle) for greater accuracy in gradient calculation'],
    hint: 'Tangent at required point. Gradient = rise/run = Δd/Δt = instantaneous speed. Use large triangle for accuracy. Units: m/s.',
    exam_q: 'Describe how to use a distance-time graph to find the speed of an accelerating object at t=5 s. [3 marks]',
    examMarks: 3,
    examA: '1 mark: draw tangent to the curve at t=5 s. 1 mark: calculate gradient of tangent (rise ÷ run). 1 mark: gradient = instantaneous speed at that point (m/s).' },

  { id: 'p5_028', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'H', exam_board: 'AQA',
    q: 'How do you calculate **displacement** from the area under a velocity-time graph?',
    a: ['**Displacement = area under the velocity-time graph**', 'For a **uniform section** (rectangle): area = length × height = time × velocity', 'For a **triangular section** (uniform acceleration from rest): area = ½ × base × height = ½ × time × velocity', 'For **non-uniform** shapes: estimate by **counting squares** on graph paper (calculate the value of one square first)', 'Total displacement = sum of all areas (treat areas below v=0 axis as negative displacement)'],
    hint: 'Displacement = area under v-t graph. Rectangle = t × v. Triangle = ½ × t × v. Non-uniform = count squares. Area below axis = negative (moving back).',
    exam_q: 'A v-t graph shows velocity increasing from 0 to 20 m/s over 10 s. Calculate the displacement. [2 marks]',
    examMarks: 2,
    examA: '1 mark: shape is a triangle; area = ½ × base × height. 1 mark: displacement = ½ × 10 × 20 = 100 m.' },

  { id: 'p5_029', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'H', exam_board: 'AQA',
    q: 'How do you draw and interpret a **free body diagram** for multiple forces?',
    a: ['Draw the **object** as a box or dot; draw **arrows** representing each force, with arrow length proportional to magnitude and pointing in the direction of the force', 'Label each arrow with the **force name and size** (e.g. Weight 500 N downward; Normal reaction 500 N upward; Friction 80 N left)', 'Find the **resultant force**: if forces balance (equal and opposite) → resultant = 0 → **equilibrium** (no acceleration)', 'If forces are unbalanced → resultant ≠ 0 → object **accelerates** in direction of resultant (F = ma)'],
    hint: 'Draw object. Arrows = forces (length = size). Label name and size. If all balanced → equilibrium, no acceleration. If unbalanced → resultant force → acceleration.',
    exam_q: 'A box has weight 300 N, normal force 300 N, and a push of 50 N. Draw a free body diagram and state the resultant force. [3 marks]',
    examMarks: 3,
    examA: '1 mark: box with four labelled arrows (weight down, normal up, push left/right). 1 mark: vertical forces balance (300 N up = 300 N down). 1 mark: resultant = 50 N in direction of push (unbalanced horizontally).' },

  { id: 'p5_030', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'H', exam_board: 'AQA',
    q: 'How do you **resolve a force into two perpendicular components** and draw vector diagrams?',
    a: ['A single force F at angle θ to horizontal can be resolved into: **horizontal component** = F cos θ; **vertical component** = F sin θ', 'For a **vector diagram** of equilibrium: draw forces head-to-tail; if they form a **closed triangle** → resultant = 0 → equilibrium', 'To find **resultant** of two forces at an angle: draw scale vector diagram (head-to-tail); resultant = closing vector from tail of first to head of last', 'In scale drawings: measure the resultant with a ruler and convert back using the scale'],
    hint: 'Horizontal component = F cosθ. Vertical = F sinθ. Vector diagram: head-to-tail. Closed triangle = equilibrium. Open = resultant = closing line.',
    exam_q: 'A 50 N force acts at 30° to the horizontal. Calculate its horizontal component. [2 marks]',
    examMarks: 2,
    examA: '1 mark: horizontal component = F cos θ. 1 mark: = 50 × cos 30° = 50 × 0.866 = 43.3 N.' },

  { id: 'p5_031', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'H', exam_board: 'AQA',
    q: 'State and apply the **principle of conservation of momentum**.',
    a: ['**Total momentum before a collision = total momentum after the collision** (in a closed system with no external forces)', 'p = mv (kg m/s); momentum is a **vector** (has direction)', 'In collisions: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂', 'Example: 2 kg trolley at 3 m/s collides with stationary 1 kg trolley and they stick together: (2×3) + (1×0) = (2+1)×v → v = 6/3 = **2 m/s**', 'Sign convention: choose positive direction; velocities in opposite direction are negative'],
    hint: 'Total p before = total p after. m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂. Stick together: (m₁+m₂)v. Direction matters — use + and − for direction.',
    exam_q: 'A 5 kg object moving at 4 m/s collides with a stationary 3 kg object. They stick together. Find the final velocity. [3 marks]',
    examMarks: 3,
    examA: '1 mark: total p before = 5 × 4 + 3 × 0 = 20 kg m/s. 1 mark: (5 + 3) × v = 20. 1 mark: v = 20 ÷ 8 = 2.5 m/s.' },

  { id: 'p7_006', subject: 'Physics', topic: 'P7', topic_name: 'Magnetism', tier: 'H', exam_board: 'AQA',
    q: 'State the equation **F = BIl** and explain what each term means.',
    a: ['**F = BIl** where: F = force on conductor (N); B = magnetic flux density (T, tesla); I = current (A); l = length of conductor in the field (m)', 'The force is **perpendicular** to both the current direction and the magnetic field direction (Fleming\'s Left-Hand Rule)', '**Increase force** by: increasing B (stronger magnet); increasing I (more current); increasing l (longer wire in field)', 'If conductor is **parallel** to the field: F = 0 (no force when current parallel to field)'],
    hint: 'F = BIl. B = field strength (T). I = current (A). l = length (m). Force perpendicular to both B and I (LHR). F=0 if wire parallel to field.',
    exam_q: 'A wire of length 0.3 m carries 5 A in a field of 0.2 T. Calculate the force on the wire. [2 marks]',
    examMarks: 2,
    examA: '1 mark: F = BIl. 1 mark: F = 0.2 × 5 × 0.3 = 0.3 N.' },

  { id: 'p5_032', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'H', exam_board: 'AQA',
    q: 'Explain why an object moving in a **circle at constant speed** is still accelerating.',
    a: ['**Velocity is a vector** — it has both magnitude and direction', 'In circular motion, the **speed** (magnitude) is constant but the **direction** continuously changes', 'Since velocity = speed + direction, changing direction = changing velocity = **acceleration**', 'This acceleration is directed **towards the centre** of the circle (centripetal acceleration)', 'The **centripetal force** providing this acceleration points inward (e.g. gravity for orbits, tension for a conker on a string)'],
    hint: 'Speed constant, direction changes → velocity changes → acceleration exists. Centripetal acceleration = towards centre. Centripetal force = towards centre.',
    exam_q: 'Explain why a car moving in a circle at constant speed is accelerating. [2 marks]',
    examMarks: 2,
    examA: '1 mark: the direction of the car\'s velocity is constantly changing. 1 mark: changing velocity means acceleration / acceleration is towards the centre of the circle.' },

  { id: 'p6_021', subject: 'Physics', topic: 'P6', topic_name: 'Waves', tier: 'H', exam_board: 'AQA',
    q: 'Explain WHY each type of **EM wave is suited to its application** (property-use link).',
    a: ['**Radio waves**: long wavelength → **diffract** around hills and buildings; low frequency → can modulate signals → used in broadcasting', '**Microwaves**: specific frequency absorbed by water molecules → heats food; **penetrates** atmosphere → satellite communication', '**Infrared**: absorbed by skin as heat → electric heaters, thermal imaging; near-IR travels through optical fibres → fibre optic comms', '**X-rays**: high penetration through soft tissue but absorbed by **bone and metal** → medical imaging (different absorption creates contrast)', '**Gamma rays**: very high energy → penetrate deeply → kill cancer cells / sterilise medical equipment'],
    hint: 'Radio: diffracts → broadcasting. Microwaves: absorbed by H₂O → cooking + through atmosphere → satellites. IR: heating + fibre optics. X-ray: differential absorption → imaging. Gamma: deep penetration + cell killing.',
    exam_q: 'Explain why microwaves are suitable for cooking food. [2 marks]',
    examMarks: 2,
    examA: '1 mark: microwaves at the right frequency are absorbed by water molecules in food. 1 mark: this causes the molecules to vibrate / produces heat / cooks the food from the inside.' },

  { id: 'p1_023', subject: 'Physics', topic: 'P1', topic_name: 'Energy', tier: 'H', exam_board: 'AQA',
    q: 'State **specific ways to improve energy efficiency** beyond lubrication and insulation.',
    a: ['**LED bulbs**: convert a much higher proportion of electrical energy to light (less wasted as heat) compared to filament bulbs', '**Regenerative braking** (in electric/hybrid vehicles): converts KE back to electrical energy during braking instead of wasting it as heat', '**Better motor design**: reducing electrical resistance in coils reduces I²R heating losses; using **superconductors** reduces resistance to zero', '**Heat exchangers**: recover waste heat from industrial processes and reuse it for heating spaces or pre-heating inputs'],
    hint: 'LED (less heat wasted). Regenerative braking (KE→electricity). Low-resistance coils/superconductors (less I²R loss). Heat exchangers (recover waste heat). All reduce wasted energy.',
    exam_q: 'Describe one way of improving the efficiency of an electrical motor, other than lubrication. [2 marks]',
    examMarks: 2,
    examA: '1 mark: reduce the electrical resistance of the coils/windings. 1 mark: this reduces the energy wasted as heat in the coils / less I²R losses.' },

  { id: 'b1_t01', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'What is **binary fission** and how quickly do bacteria reproduce?',
    a: ['**Binary fission** is asexual reproduction in bacteria — one cell splits into **two identical daughter cells**', 'Under **ideal conditions**, bacteria can divide approximately every **20 minutes**', 'This is asexual reproduction — all offspring are **genetically identical** to the parent'],
    hint: 'Binary = two. Fission = split. Every 20 minutes, double the number. Exponential growth.',
    exam_q: 'Describe how bacteria reproduce.',
    examMarks: 2,
    examA: 'Binary fission / cell splits into two (1) + produces genetically identical cells / asexual reproduction (1).' },

  { id: 'b1_t02', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Calculate the **number of bacteria** after a given time period, if they divide every 20 minutes.',
    a: ['Number of divisions = total time (minutes) ÷ **20**', 'Number of bacteria = starting number × **2ⁿ** (where n = number of divisions)', 'Example: 1 bacterium after 3 hours (180 min) → 9 divisions → 1 × 2⁹ = **512 bacteria**'],
    hint: 'Divide time by 20 = number of doublings. Then 2 to the power of that. 3 hours = 9 doublings = 512.',
    exam_q: 'A bacterium divides every 20 minutes. Calculate the number of bacteria after 2 hours, starting from 1 bacterium.',
    examMarks: 2,
    examA: '9 divisions → 1 × 2⁹ = **512 bacteria** Hint: Divide time by 20 = number of doublings. Then 2 to the power of that. 3 hours = 9 doublings = 512. Exam Q: "A bacterium divides every 20 minutes. Calculate the number of bacteria after 2 hours, starting from 1 bacterium." [2 marks] → 2 hours = 120 min ÷ 20 = 6 divisions (1) + 2⁶ = **64 bacteria** (1).' },

  { id: 'b1_t03', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 differences** between **nutrient broth** and **agar plates** as growth media.',
    a: ['**Nutrient broth** — liquid medium — bacteria are suspended throughout and cannot form distinct colonies', '**Agar plates** — solid medium — bacteria form visible, separate **colonies** on the surface; each colony starts from a single bacterium'],
    hint: 'Broth = liquid, no colonies. Agar = solid, grows discrete colonies. Agar plates allow you to count and identify bacteria.',
    exam_q: 'Give one advantage of using an agar plate rather than nutrient broth to culture bacteria.',
    examMarks: 1,
    examA: 'Any 1 from: bacteria form individual colonies that can be counted / identified / isolated from each other.' },

  { id: 'b1_t04', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Describe the key steps of **aseptic technique** when inoculating an agar plate.',
    a: ['**Flame the inoculating loop** until red hot — kills all existing microorganisms on the loop', 'Work near a **Bunsen burner** — rising hot air reduces contamination from airborne microbes', 'Lift the Petri dish lid at a **shallow angle and briefly** — minimises exposure of the medium to the air', '**Tape the lid to the base** but do not completely seal — allows gas exchange, prevents build-up of anaerobic bacteria'],
    hint: 'Flame loop → Bunsen nearby → angle lid briefly → tape (don\'t seal). Four steps, four marks.',
    exam_q: 'Describe two steps of aseptic technique used when transferring bacteria to an agar plate.',
    examMarks: 2,
    examA: 'Bunsen nearby → angle lid briefly → tape (don\'t seal). Four steps, four marks. Exam Q: "Describe two steps of aseptic technique used when transferring bacteria to an agar plate." [2 marks] → Any 2 from: flame inoculating loop (1) + work near a Bunsen burner (1) + lift lid at an angle briefly (1) + tape lid on (don\'t seal) (1).' },

  { id: 'b1_t05', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 reasons** why Petri dishes and glassware are **sterilised** before use.',
    a: ['To kill any **pre-existing microorganisms** on the equipment', 'Prevents **contamination** of the bacterial culture with unwanted species that could interfere with results'],
    hint: 'Sterilise = kill everything first. Otherwise unknown microbes could grow and ruin the experiment.',
    exam_q: 'Explain why Petri dishes are sterilised before use in a microbiology experiment.',
    examMarks: 2,
    examA: 'To kill any microorganisms already on the dish (1) + prevents contamination of the culture with unwanted bacteria (1).' },

  { id: 'b1_t06', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 reasons** why the **inoculating loop is flamed** before and after use.',
    a: ['**Before**: kills any microorganisms on the loop — prevents introducing unwanted bacteria into the culture', '**After**: kills the bacteria on the loop — prevents accidental contamination of the environment or the scientist'],
    hint: 'Before = sterilise the tool. After = don\'t spread bacteria around. Always flame before AND after.',
    exam_q: 'Explain why the inoculating loop is heated in a Bunsen burner flame before use.',
    examMarks: 2,
    examA: 'To sterilise it / kill any microorganisms on the loop (1) + so they are not introduced into the culture / do not contaminate the plate (1).' },

  { id: 'b1_t07', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Give **2 reasons** why agar plates are **stored upside down** after inoculation.',
    a: ['Prevents **condensation** forming on the lid from dripping down onto the colonies', 'Falling water droplets would **spread colonies** and make it impossible to identify or count individual colonies accurately'],
    hint: 'Upside down = lid underneath. Condensation drips onto the lid, not onto the agar. Colonies stay separate.',
    exam_q: 'Explain why agar plates are stored upside down after being inoculated.',
    examMarks: 2,
    examA: 'Prevents condensation on the lid from dripping onto the colonies (1) + which would cause colonies to spread / merge and be difficult to count (1).' },

  { id: 'b1_t08', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'Explain why school microbiology cultures are **incubated at 25°C** rather than 37°C.',
    a: ['At **37°C** (human body temperature), harmful **pathogens** would grow more vigorously — posing a safety risk', 'At **25°C**, bacteria grow more slowly and are less likely to include dangerous pathogens — safer for a school environment'],
    hint: '37°C = body temperature = pathogens thrive. 25°C = safe for schools. Lower temperature = safer bacteria.',
    exam_q: 'Explain why school microbiology experiments should be incubated at no more than 25°C.',
    examMarks: 2,
    examA: 'Higher temperatures encourage growth of harmful pathogens (1) + 25°C is below body temperature so dangerous microorganisms are less likely to grow (1).' },

  { id: 'b1_t09', subject: 'Biology', topic: 'B1', topic_name: 'Cell Biology', subtopic: 'B1.2', subtopic_name: 'Culturing Microorganisms', tier: 'T', exam_board: 'AQA',
    q: 'How do you calculate the **cross-sectional area** of an **inhibition zone** using πr²?',
    a: ['The inhibition zone is the **clear area** around an antibiotic disc where bacteria have not grown', 'Measure the **diameter** of the clear zone using a ruler, then calculate r = diameter ÷ 2', '**Area = πr²** — a larger area indicates a **more effective** antibiotic'],
    hint: 'Measure diameter → halve it to get r → Area = πr². Bigger clear zone = better antibiotic.',
    exam_q: 'An inhibition zone has a diameter of 14 mm. Calculate its cross-sectional area. [π = 3.14]',
    examMarks: 2,
    examA: 'halve it to get r → Area = πr². Bigger clear zone = better antibiotic. Exam Q: "An inhibition zone has a diameter of 14 mm. Calculate its cross-sectional area. [π = 3.14]" [2 marks] → r = 14 ÷ 2 = 7 mm (1) + Area = 3.14 × 7² = 3.14 × 49 = **153.86 mm²** (1).' },


  // Biology B2 — Organisation (Triple-only additions)
  { id: 'b2_t01', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.3', subtopic_name: 'The Heart (Detailed Structure)', tier: 'T', exam_board: 'AQA',
    q: 'Name the **four major blood vessels** connected to the heart and state what each carries.',
    a: ['**Aorta** — carries **oxygenated blood** from the **left ventricle** to the body (largest artery)', '**Vena cava** — carries **deoxygenated blood** from the body to the **right atrium** (largest vein)', '**Pulmonary artery** — carries **deoxygenated blood** from the **right ventricle** to the lungs', '**Pulmonary vein** — carries **oxygenated blood** from the lungs to the **left atrium**'],
    hint: 'Pulmonary artery = the one artery that carries deoxygenated blood. Pulmonary vein = the one vein that carries oxygenated blood. Remember: arteries LEAVE the heart.',
    exam_q: 'Name the blood vessel that carries oxygenated blood from the heart to the body.',
    examMarks: 1,
    examA: 'Aorta.' },

  { id: 'b2_t02', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.3', subtopic_name: 'The Heart (Detailed Structure)', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **double circulation** of the heart.',
    a: ['**Pulmonary circulation**: right side of heart → **pulmonary artery** → lungs (picks up O₂, loses CO₂) → **pulmonary vein** → left side of heart', '**Systemic circulation**: left side of heart → **aorta** → body (delivers O₂, picks up CO₂) → **vena cava** → right side of heart', 'Blood passes through the **heart twice** per complete circuit — maintaining high blood pressure throughout'],
    hint: 'Two circuits. Right → lungs → left → body → right. Blood visits the heart twice. Keeps pressure high.',
    exam_q: 'Describe the pathway of blood from the right ventricle back to the right atrium.',
    examMarks: 3,
    examA: '**pulmonary artery** → lungs (picks up O₂, loses CO₂) → **pulmonary vein** → left side of heart - **Systemic circulation**: left side of heart → **aorta** → body (delivers O₂, picks up CO₂) → **vena cava** → right side of heart - Blood passes through the **heart twice** per complete circuit — maintaining high blood pressure throughout Hint: Two circuits. Right → lungs → left → body → right. Blood visits the heart twice. Keeps pressure high. Exam Q: "Describe the pathway of blood from the right ventricle back to the right atrium." [3 marks] → Right ventricle → pulmonary artery → lungs (1) → pulmonary vein → left atrium / left ventricle (1) → aorta → body → vena cava → right atrium (1).' },

  { id: 'b2_t03', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.9', subtopic_name: 'Transpiration (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 factors** that affect the **rate of transpiration** and explain the effect of each.',
    a: ['**Light intensity**: more light → stomata open wider → more water vapour lost → **faster** transpiration', '**Temperature**: higher temperature → faster evaporation of water from cells → **faster** transpiration', '**Humidity**: lower humidity → steeper concentration gradient for water vapour → **faster** transpiration', '**Wind speed**: more wind → water vapour carried away from leaf surface → concentration gradient maintained → **faster** transpiration'],
    hint: 'Light, temperature, low humidity, wind all increase transpiration rate. Remember LTHW — any one of them is a possible exam variable.',
    exam_q: 'Explain how wind speed affects the rate of transpiration.',
    examMarks: 2,
    examA: 'stomata open wider → more water vapour lost → **faster** transpiration - **Temperature**: higher temperature → faster evaporation of water from cells → **faster** transpiration - **Humidity**: lower humidity → steeper concentration gradient for water vapour → **faster** transpiration - **Wind speed**: more wind → water vapour carried away from leaf surface → concentration gradient maintained → **faster** transpiration Hint: Light, temperature, low humidity, wind all increase transpiration rate. Remember LTHW — any one of them is a possible exam variable. Exam Q: "Explain how wind speed affects the rate of transpiration." [2 marks] → Wind removes water vapour from around the leaf surface (1) + maintains a steep concentration gradient for water to diffuse out / increases rate of water loss (1).' },

  { id: 'b2_t04', subject: 'Biology', topic: 'B2', topic_name: 'Organisation', subtopic: 'B2.9', subtopic_name: 'Transpiration (Detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **structure and function of stomata and guard cells**.',
    a: ['**Stomata** are tiny pores in the leaf epidermis — allow gas exchange (CO₂ in, O₂ out) and water vapour to escape', 'Each stoma is surrounded by a pair of **guard cells** — kidney-shaped cells that control pore size', 'Guard cells have **unevenly thickened walls** — when turgid, they curve outwards, opening the pore'],
    hint: 'Stomata = holes. Guard cells = gatekeepers. Turgid guard cells = pore open. Flaccid = closed.',
    exam_q: 'Describe the function of stomata in a leaf.',
    examMarks: 2,
    examA: 'Allow gas exchange — CO₂ diffuses in for photosynthesis / O₂ diffuses out (1) + water vapour diffuses out (transpiration) (1).' },
