  // Biology B4 — Bioenergetics (Triple-only additions)
  { id: 'b4_t06', subject: 'Biology', topic: 'B4', topic_name: 'Bioenergetics', subtopic: 'B4.1', subtopic_name: 'Photosynthesis', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **structure of a chloroplast** and link each structure to its function. *(3 structures)*',
    a: ['**Thylakoid membranes** (stacked into grana): contain **chlorophyll** and enzymes — site of **light-dependent reactions**; large surface area to absorb light', '**Stroma**: fluid-filled matrix — site of **light-independent reactions** (Calvin cycle) where CO₂ is fixed into glucose', '**Double membrane (envelope)**: controls entry/exit of substances; maintains internal environment for photosynthesis'],
    hint: 'Thylakoids (grana) = light reactions + chlorophyll. Stroma = CO₂ fixation (Calvin cycle). Double membrane = protection + transport.',
    exam_q: 'State the function of the thylakoid membranes in a chloroplast.',
    examMarks: 2,
    examA: 'Contain chlorophyll / absorb light energy (1) + site of light-dependent reactions (1).' },

  { id: 'b4_t07', subject: 'Biology', topic: 'B4', topic_name: 'Bioenergetics', subtopic: 'B4.6', subtopic_name: 'Aerobic vs Anaerobic', tier: 'T', exam_board: 'AQA',
    q: 'Compare the **ATP yield** of aerobic and anaerobic respiration and explain why aerobic produces more.',
    a: ['**Aerobic respiration** produces approximately **36–38 ATP** per glucose molecule', '**Anaerobic respiration** produces only **2 ATP** per glucose molecule', 'Aerobic is more efficient because glucose is **completely oxidised** to CO₂ and H₂O — all available energy extracted; anaerobic only partially breaks down glucose → lactate or ethanol retains chemical energy'],
    hint: 'Aerobic ~38 ATP per glucose. Anaerobic ~2 ATP. Aerobic: complete oxidation. Anaerobic: partial breakdown, energy wasted in product.',
    exam_q: 'Explain why aerobic respiration releases more energy per glucose than anaerobic respiration.',
    examMarks: 2,
    examA: 'lactate or ethanol retains chemical energy Hint: Aerobic ~38 ATP per glucose. Anaerobic ~2 ATP. Aerobic: complete oxidation. Anaerobic: partial breakdown, energy wasted in product. Exam Q: "Explain why aerobic respiration releases more energy per glucose than anaerobic respiration." [2 marks] → Aerobic respiration completely oxidises glucose to CO₂ and H₂O (1) + anaerobic only partially breaks down glucose so less energy is released / lactate/ethanol still contains energy (1).' },


  // Biology B5 — Homeostasis and Response (Triple-only additions)
  { id: 'b5_t17', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.2', subtopic_name: 'The Brain', tier: 'T', exam_board: 'AQA',
    q: 'Describe **two technologies** used to study the brain and state one limitation of each.',
    a: ['**fMRI (functional MRI)**: detects increased blood flow to active brain regions — maps which areas are active during specific tasks; non-invasive; **limitation**: expensive, only shows which region is active not mechanism', '**CT (computed tomography) scan**: X-rays from multiple angles produce a 3D image of brain structure — identifies tumours, strokes, bleeds; **limitation**: shows anatomy, not function; involves ionising radiation'],
    hint: 'fMRI = blood flow = functional activity map. CT = X-ray slices = structural image. Both help understand brain without surgery.',
    exam_q: 'Explain one advantage of using fMRI scans to study the brain compared to traditional methods.',
    examMarks: 2,
    examA: 'fMRI is non-invasive (1) + shows which parts of the brain are active during specific tasks / maps brain function (1).' },

  { id: 'b5_t18', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.3', subtopic_name: 'The Eye', tier: 'T', exam_board: 'AQA',
    q: 'Describe how **laser eye surgery** treats myopia (short-sightedness).',
    a: ['Myopia = eyeball is too long or cornea is too curved → light focuses **in front** of the retina', '**Laser reshapes the cornea** — makes it less curved → increases the focal length → light now focuses **on** the retina', 'The procedure is permanent; it **avoids the need for glasses or contact lenses**'],
    hint: 'Myopia = focus in front of retina. Laser flattens cornea → increases focal length → focus on retina. Permanent correction.',
    exam_q: 'Explain how laser eye surgery corrects myopia.',
    examMarks: 2,
    examA: 'light focuses **in front** of the retina - **Laser reshapes the cornea** — makes it less curved → increases the focal length → light now focuses **on** the retina - The procedure is permanent; it **avoids the need for glasses or contact lenses** Hint: Myopia = focus in front of retina. Laser flattens cornea → increases focal length → focus on retina. Permanent correction. Exam Q: "Explain how laser eye surgery corrects myopia." [2 marks] → Laser is used to reshape / flatten the cornea (1) + this increases focal length so light now focuses on the retina instead of in front of it (1).' },

  { id: 'b5_t19', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.5', subtopic_name: 'Thermoregulation', tier: 'T', exam_board: 'AQA',
    q: 'Explain why maintaining **core body temperature at 37 °C** is important for enzyme function.',
    a: ['Enzymes have an **optimum temperature** — for human enzymes this is approximately **37 °C**', 'Above 37 °C: enzymes begin to **denature** — active site changes shape → substrates cannot bind → reactions slow or stop', 'Below 37 °C: enzyme-substrate **collision rate** decreases → reactions proceed more slowly', 'Thermoregulation maintains conditions for **maximum enzyme efficiency** throughout the body'],
    hint: '37 °C = human enzyme optimum. Too hot → denature. Too cold → fewer collisions → slower reactions. Thermoregulation keeps enzymes working.',
    exam_q: 'Explain why it is important to maintain body temperature close to 37 °C.',
    examMarks: 2,
    examA: 'substrates cannot bind → reactions slow or stop - Below 37 °C: enzyme-substrate **collision rate** decreases → reactions proceed more slowly - Thermoregulation maintains conditions for **maximum enzyme efficiency** throughout the body Hint: 37 °C = human enzyme optimum. Too hot → denature. Too cold → fewer collisions → slower reactions. Thermoregulation keeps enzymes working. Exam Q: "Explain why it is important to maintain body temperature close to 37 °C." [2 marks] → 37 °C is the optimum temperature for enzymes (1) + higher temperature denatures enzymes / lower temperature reduces reaction rates (1).' },

  { id: 'b5_t20', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.6', subtopic_name: 'Kidneys', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **structure of a nephron** and label its key regions. *(5 parts)*',
    a: ['**Bowman\'s capsule**: cup-shaped structure surrounding the glomerulus — filtrate enters here during ultrafiltration', '**Glomerulus**: knot of capillaries inside the Bowman\'s capsule where high-pressure filtration occurs', '**Proximal convoluted tubule (PCT)**: first region of tubule — most selective reabsorption of glucose, ions, water', '**Loop of Henle**: hairpin loop descending into medulla — creates an osmotic gradient; important for concentrating urine', '**Collecting duct**: carries filtrate to the renal pelvis; controlled by ADH for final water reabsorption'],
    hint: 'Bowman\'s capsule → glomerulus (filter) → PCT (reabsorb most) → Loop of Henle (concentrate) → collecting duct (ADH adjusts water).',
    exam_q: 'State the function of the Bowman\'s capsule.',
    examMarks: 1,
    examA: 'glomerulus (filter) → PCT (reabsorb most) → Loop of Henle (concentrate) → collecting duct (ADH adjusts water). Exam Q: "State the function of the Bowman\'s capsule." [1 mark] → Surrounds the glomerulus / collects the filtrate produced by ultrafiltration.' },

  { id: 'b5_t21', subject: 'Biology', topic: 'B5', topic_name: 'Homeostasis and Response', subtopic: 'B5.6', subtopic_name: 'Kidneys', tier: 'T', exam_board: 'AQA',
    q: 'Explain the role of the **loop of Henle** in producing concentrated urine.',
    a: ['The loop of Henle descends into the **medulla** and creates a region of **high salt concentration** in surrounding tissue', 'As the filtrate passes back up, **water moves out** by osmosis (especially in the collecting duct) into this high-salt tissue', 'This allows production of **concentrated urine** — more water is reabsorbed when ADH levels are high, increasing concentration further'],
    hint: 'Loop of Henle = creates high-salt zone in medulla → water leaves collecting duct by osmosis → concentrated urine.',
    exam_q: 'Explain the role of the loop of Henle in the kidney.',
    examMarks: 2,
    examA: 'water leaves collecting duct by osmosis → concentrated urine. Exam Q: "Explain the role of the loop of Henle in the kidney." [2 marks] → Creates an osmotic gradient / high solute concentration in the medulla (1) + allows water to be reabsorbed from the collecting duct by osmosis (1).' },


  // Biology B6 — Inheritance, Variation and Evolution (Triple-only additions)
  { id: 'b6_t12', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.1', subtopic_name: 'Reproduction', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 examples of organisms** that can reproduce both **sexually and asexually**, with one advantage of each method for that organism.',
    a: ['**Strawberry plants**: asexual via **runners** (stolons) → rapid cloning of successful parent; sexual via **flowers/seeds** → genetic variation for adaptation', '**Yeast**: asexual by **budding** → rapid population growth in stable conditions; sexual when stressed → variation helps survival in changing environment', '**Hydra (simple animal)**: asexual by **budding**; sexual when conditions deteriorate → variation in offspring'],
    hint: 'Strawberry (runners/seeds), yeast (budding/sexual under stress), Hydra (budding/sexual). Asexual = fast clones. Sexual = variation.',
    exam_q: 'Suggest why strawberry plants reproduce asexually using runners in summer but produce seeds in autumn.',
    examMarks: 2,
    examA: 'rapid cloning of successful parent; sexual via **flowers/seeds** → genetic variation for adaptation - **Yeast**: asexual by **budding** → rapid population growth in stable conditions; sexual when stressed → variation helps survival in changing environment - **Hydra (simple animal)**: asexual by **budding**; sexual when conditions deteriorate → variation in offspring Hint: Strawberry (runners/seeds), yeast (budding/sexual under stress), Hydra (budding/sexual). Asexual = fast clones. Sexual = variation. Exam Q: "Suggest why strawberry plants reproduce asexually using runners in summer but produce seeds in autumn." [2 marks] → Runners (asexual) produce identical offspring rapidly when conditions are favourable (1) + seeds (sexual) produce variation — offspring may be better adapted to survive winter / changing conditions (1).' },

  { id: 'b6_t13', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.11', subtopic_name: 'Mendel', tier: 'T', exam_board: 'AQA',
    q: 'Describe **Mendel\'s contribution** to genetics and why his work was not accepted at the time.',
    a: ['Mendel crossed pea plants and recorded **phenotypic ratios** over many generations (1860s)', 'He proposed that characteristics are controlled by discrete **\'units of inheritance\'** (now called genes/alleles) that are passed from parents to offspring', 'He identified **dominant and recessive** traits and the **3:1 ratio** in F₂ generations', 'His work was **not accepted** because: scientists did not understand the mechanism (chromosomes/DNA not yet discovered); his work was published in a minor journal and largely ignored until rediscovered in 1900'],
    hint: 'Mendel: peas → ratios → units of inheritance → dominant/recessive. Ignored because: no knowledge of DNA/chromosomes; obscure publication.',
    exam_q: 'Suggest why Mendel\'s conclusions were not accepted by scientists at the time.',
    examMarks: 2,
    examA: 'ratios → units of inheritance → dominant/recessive. Ignored because: no knowledge of DNA/chromosomes; obscure publication. Exam Q: "Suggest why Mendel\'s conclusions were not accepted by scientists at the time." [2 marks] → Scientists did not understand the mechanism for inheritance (1) + chromosomes / DNA had not been discovered (1) / published in an obscure journal and not widely read.' },

  { id: 'b6_t14', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.12', subtopic_name: 'DNA Structure', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **structure of a DNA nucleotide** and state the **base-pairing rules**.',
    a: ['A DNA nucleotide consists of three parts: a **deoxyribose sugar**, a **phosphate group**, and a **nitrogenous base**', 'Four bases: **Adenine (A)**, **Thymine (T)**, **Cytosine (C)**, **Guanine (G)**', 'Base-pairing rules: **A pairs with T** (2 hydrogen bonds); **C pairs with G** (3 hydrogen bonds) — complementary base pairing', 'DNA is a **double helix**: two strands run antiparallel, held together by hydrogen bonds between complementary bases; sugar-phosphate backbone on the outside'],
    hint: 'Nucleotide = deoxyribose + phosphate + base. A-T, C-G (complementary). Double helix: sugar-phosphate backbone, H-bonds between bases.',
    exam_q: 'Describe the structure of a DNA nucleotide.',
    examMarks: 2,
    examA: 'Contains a deoxyribose sugar (1) + phosphate group and a nitrogenous base (1).' },

  { id: 'b6_t15', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', subtopic: 'B6.13', subtopic_name: 'Protein Synthesis', tier: 'T', exam_board: 'AQA',
    q: 'Give an overview of **protein synthesis** — transcription then translation. *(5 steps)*',
    a: ['**Transcription** (in nucleus): the relevant section of DNA unwinds; **mRNA** is built using one strand as a template (complementary base pairing; A↔U, T↔A, C↔G, G↔C in mRNA)', 'mRNA leaves the nucleus through the **nuclear pore** and attaches to a **ribosome**', '**Translation** (at ribosome): tRNA molecules bring **amino acids** to the ribosome; each tRNA has an anticodon matching a 3-base codon on mRNA', 'Amino acids are joined by **peptide bonds** in the order specified by the mRNA sequence', 'The completed **polypeptide chain** folds into a functional protein'],
    hint: 'Transcription (nucleus): DNA → mRNA. mRNA → ribosome. Translation: tRNA brings amino acids → peptide bonds form → polypeptide.',
    exam_q: 'Describe the role of mRNA in protein synthesis.',
    examMarks: 2,
    examA: 'mRNA. mRNA → ribosome. Translation: tRNA brings amino acids → peptide bonds form → polypeptide. Exam Q: "Describe the role of mRNA in protein synthesis." [2 marks] → mRNA is a copy of the gene / carries the genetic code from the nucleus to the ribosome (1) + the sequence of bases on mRNA determines the order of amino acids in the protein (1).' },


  // Biology B7 — Ecology (Triple-only additions)
  { id: 'b7_t08', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.10', subtopic_name: 'Nitrogen Cycle (detailed)', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **detailed nitrogen cycle** including the names and roles of four types of bacteria.',
    a: ['**Nitrogen fixation**: *Rhizobium* (in legume root nodules) and *Azotobacter* (free-living in soil) fix atmospheric N₂ → ammonium compounds', '**Nitrification** step 1: *Nitrosomonas* converts ammonium (NH₄⁺) → nitrite (NO₂⁻)', '**Nitrification** step 2: *Nitrobacter* converts nitrite (NO₂⁻) → nitrate (NO₃⁻) — absorbed by plant roots to synthesise proteins', '**Denitrification**: denitrifying bacteria in **anaerobic** (waterlogged) soil convert nitrates → N₂ gas (back to atmosphere)', '**Decomposition**: decomposers break down proteins in dead organisms → **ammonium compounds** released into soil'],
    hint: 'Fix (Rhizobium/Azotobacter: N₂→NH₄). Nitrify (Nitrosomonas: NH₄→NO₂; Nitrobacter: NO₂→NO₃). Denitrify (NO₃→N₂). Decompose (dead→NH₄).',
    exam_q: 'Name the type of bacteria that converts ammonium compounds to nitrates and explain their importance.',
    examMarks: 2,
    examA: 'ammonium compounds - **Nitrification** step 1: *Nitrosomonas* converts ammonium (NH₄⁺) → nitrite (NO₂⁻) - **Nitrification** step 2: *Nitrobacter* converts nitrite (NO₂⁻) → nitrate (NO₃⁻) — absorbed by plant roots to synthesise proteins - **Denitrification**: denitrifying bacteria in **anaerobic** (waterlogged) soil convert nitrates → N₂ gas (back to atmosphere) - **Decomposition**: decomposers break down proteins in dead organisms → **ammonium compounds** released into soil Hint: Fix (Rhizobium/Azotobacter: N₂→NH₄). Nitrify (Nitrosomonas: NH₄→NO₂; Nitrobacter: NO₂→NO₃). Denitrify (NO₃→N₂). Decompose (dead→NH₄). Exam Q: "Name the type of bacteria that converts ammonium compounds to nitrates and explain their importance." [2 marks] → Nitrifying bacteria — Nitrosomonas and Nitrobacter (1) + they produce nitrates that can be absorbed by plant roots to make amino acids/proteins (1).' },

  { id: 'b7_t09', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.11', subtopic_name: 'Mycoprotein', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **production of mycoprotein** from *Fusarium* and evaluate it as a food source.',
    a: ['*Fusarium venenatum* (a fungus) is grown in a **fermenter** with glucose syrup (from starch hydrolysis) as a carbon source; with ammonium (nitrogen), minerals, and oxygen', 'The fungus grows rapidly; **mycoprotein** is harvested, heat-treated (to remove excess RNA), and processed into meat-alternative food (e.g. Quorn™)', '**Advantages**: high protein content; low fat; sustainable (less land, water, greenhouse gas than meat); can be grown year-round indoors', '**Disadvantage**: requires processed inputs (glucose syrup from starch); some people are allergic to fungal proteins'],
    hint: 'Fusarium + glucose + ammonium + O₂ in fermenter → mycoprotein → harvested → meat alternative. High protein, low fat, sustainable.',
    exam_q: 'Give two advantages of mycoprotein as a food source compared to beef.',
    examMarks: 2,
    examA: 'mycoprotein → harvested → meat alternative. High protein, low fat, sustainable. Exam Q: "Give two advantages of mycoprotein as a food source compared to beef." [2 marks] → 1 mark each: any 2 from: high protein / low fat / requires less land / produces fewer greenhouse gases / can be produced year-round.' },

  { id: 'b7_t10', subject: 'Biology', topic: 'B7', topic_name: 'Ecology', subtopic: 'B7.12', subtopic_name: 'Biodiversity Conservation', tier: 'T', exam_board: 'AQA',
    q: 'Evaluate **biodiversity conservation methods** using data and consider their effectiveness.',
    a: ['**Protected areas / National parks**: preserve habitat in situ; effective for large mammals and migratory species; **limited by**: funding, human encroachment, climate change', '**Seed banks (e.g. Svalbard Global Seed Vault)**: preserve genetic diversity of plant species ex situ; important insurance against extinction; **limited by**: does not protect whole ecosystems, only seeds of viable species', '**Captive breeding programmes**: breed endangered species in zoos; can increase numbers before reintroduction; **limited by**: loss of genetic diversity, animals may not survive reintroduction, expensive', '**International agreements** (e.g. Convention on Biological Diversity, CITES): regulate trade in endangered species; **limited by**: enforcement challenges'],
    hint: 'In situ (protected areas, best for ecosystems). Ex situ (zoos, seed banks, good for specific species). Each has limitations. Use data: compare species numbers before/after conservation.',
    exam_q: 'Suggest one limitation of captive breeding programmes as a conservation method.',
    examMarks: 1,
    examA: 'Any 1 from: expensive / animals may lack survival skills for reintroduction / genetic diversity may be limited / reintroduction success not guaranteed.' },


  // Chemistry C1 — Atomic Structure (Triple-only additions)
  { id: 'c1_t01', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.3', subtopic_name: 'History of the Atomic Model', tier: 'T', exam_board: 'AQA',
    q: 'Describe **Dalton\'s** model of the atom (early 1800s).',
    a: ['Atoms are tiny, **solid spheres** — indivisible and indestructible', 'All atoms of the same element are **identical** in mass and properties', 'Atoms of different elements have **different masses** — chemical reactions involve rearranging atoms'],
    hint: 'Dalton = solid sphere. Simple, no internal structure. Everything is just little balls.',
    exam_q: 'Describe the key features of Dalton\'s model of the atom.',
    examMarks: 2,
    examA: 'Atoms are solid, indivisible spheres (1) + all atoms of the same element are identical / atoms of different elements have different masses (1).' },

  { id: 'c1_t02', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.3', subtopic_name: 'History of the Atomic Model', tier: 'T', exam_board: 'AQA',
    q: 'Describe **Thomson\'s plum pudding** model and what discovery led to it.',
    a: ['Thomson discovered **electrons** using cathode ray tubes (1897) — particles with a negative charge', 'Proposed the **plum pudding model**: a sphere of **diffuse positive charge** with negatively charged electrons embedded throughout', 'Revised Dalton\'s model by showing atoms DO have **internal structure**'],
    hint: 'Plum pudding = positive dough with electron raisins. Thomson discovered electrons and had to fit them inside the atom somehow.',
    exam_q: 'Describe Thomson\'s plum pudding model of the atom.',
    examMarks: 2,
    examA: 'A sphere of positive charge (1) + with electrons embedded throughout / scattered within the positive sphere (1).' },

  { id: 'c1_t03', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.3', subtopic_name: 'History of the Atomic Model', tier: 'T', exam_board: 'AQA',
    q: 'Describe **Rutherford\'s nuclear model** and the experiment that led to it.',
    a: ['Rutherford fired **alpha particles** at a thin gold foil and observed where they went', '**Most passed straight through** → atom is mostly **empty space**', '**A small number deflected** at large angles → small, dense, positively charged **nucleus** at the centre', '**Very few bounced back** → nucleus is extremely small relative to the atom', 'This **disproved** Thomson\'s plum pudding model — the positive charge is concentrated, not spread out'],
    hint: 'Gold foil. Most go through (empty space). Some deflect (nucleus exists). Few bounce back (nucleus tiny and dense).',
    exam_q: 'Explain what Rutherford concluded from the alpha particle scattering experiment.',
    examMarks: 3,
    examA: 'atom is mostly **empty space** - **A small number deflected** at large angles → small, dense, positively charged **nucleus** at the centre - **Very few bounced back** → nucleus is extremely small relative to the atom - This **disproved** Thomson\'s plum pudding model — the positive charge is concentrated, not spread out Hint: Gold foil. Most go through (empty space). Some deflect (nucleus exists). Few bounce back (nucleus tiny and dense). Exam Q: "Explain what Rutherford concluded from the alpha particle scattering experiment." [3 marks] → Most of the atom is empty space / most alpha particles passed through (1) + there is a small, dense, positively charged nucleus (1) + the nucleus is very small compared to the whole atom / most mass is concentrated in the nucleus (1).' },

  { id: 'c1_t04', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.3', subtopic_name: 'History of the Atomic Model', tier: 'T', exam_board: 'AQA',
    q: 'Describe **Bohr\'s model** of the atom and how it improved on Rutherford\'s.',
    a: ['Bohr proposed that electrons orbit the nucleus in **fixed shells (energy levels)**', 'Each shell has a **fixed energy** — electrons do not lose energy while in a stable orbit', 'Electrons can **move between shells** by absorbing or emitting specific amounts of energy — this explained atomic line spectra'],
    hint: 'Bohr = shells. Electrons in fixed orbits at fixed energies. Moving between shells releases or absorbs light.',
    exam_q: 'Describe one way Bohr\'s model improved on Rutherford\'s model.',
    examMarks: 1,
    examA: 'Bohr proposed electrons occupy fixed shells / energy levels rather than orbiting randomly.' },

  { id: 'c1_t05', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.3', subtopic_name: 'History of the Atomic Model', tier: 'T', exam_board: 'AQA',
    q: 'Describe **Chadwick\'s discovery** of the neutron and why it was important.',
    a: ['Chadwick (1932) bombarded **beryllium** with alpha particles → detected a neutral radiation', 'He identified this as **neutrons** — particles with a mass similar to a proton but with **no charge**', 'This explained why atomic mass is greater than proton number alone — neutrons contribute mass without charge'],
    hint: 'Chadwick = neutron. Before him, atoms were missing mass that couldn\'t be explained by protons alone.',
    exam_q: 'Explain why the discovery of the neutron was important to the model of the atom.',
    examMarks: 2,
    examA: 'detected a neutral radiation - He identified this as **neutrons** — particles with a mass similar to a proton but with **no charge** - This explained why atomic mass is greater than proton number alone — neutrons contribute mass without charge Hint: Chadwick = neutron. Before him, atoms were missing mass that couldn\'t be explained by protons alone. Exam Q: "Explain why the discovery of the neutron was important to the model of the atom." [2 marks] → Neutrons have mass but no charge (1) + they explain why the mass number is greater than the atomic/proton number / account for the \'missing mass\' in the nucleus (1).' },

  { id: 'c1_t06', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.4', subtopic_name: 'Relative Atomic Mass from Isotopes', tier: 'T', exam_board: 'AQA',
    q: 'Define **relative atomic mass (Ar)** and explain how **isotopes** affect it.',
    a: ['**Relative atomic mass (Ar)** is the **weighted mean mass** of all the isotopes of an element, relative to 1/12 the mass of ¹²C', '**Isotopes** are atoms of the same element with the **same number of protons** but **different numbers of neutrons**', 'Because different isotopes have different masses and different natural abundances, Ar is rarely a whole number'],
    hint: 'Ar = average of all isotopes weighted by how common each one is. Chlorine\'s Ar is 35.5 because it\'s a mix of ³⁵Cl and ³⁷Cl.',
    exam_q: 'Explain why the relative atomic mass of chlorine is 35.5 rather than a whole number.',
    examMarks: 2,
    examA: 'Chlorine exists as two isotopes with different masses (1) + Ar is a weighted mean of all isotopes based on their relative abundances (1).' },

  { id: 'c1_t07', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', subtopic: 'C1.4', subtopic_name: 'Relative Atomic Mass from Isotopes', tier: 'T', exam_board: 'AQA',
    q: 'Calculate the **relative atomic mass** from isotopic data.',
    a: ['Formula: **Ar = Σ(isotope mass × % abundance) ÷ 100**', 'Example: chlorine has ³⁵Cl (75%) and ³⁷Cl (25%)', 'Ar = (35 × 75 + 37 × 25) ÷ 100 = (2625 + 925) ÷ 100 = **35.5**'],
    hint: 'Multiply each mass by its percentage, add the products, divide by 100. Heavier isotopes pull the average up.',
    exam_q: 'Boron has two isotopes: ¹⁰B (20%) and ¹¹B (80%). Calculate the relative atomic mass of boron.',
    examMarks: 2,
    examA: 'Ar = (10 × 20 + 11 × 80) ÷ 100 = (200 + 880) ÷ 100 = 1080 ÷ 100 = **10.8** (1 for correct method, 1 for correct answer).' },


  // Chemistry C2 — Bonding, Structure and Properties (Triple-only additions)
  { id: 'c2_t01', subject: 'Chemistry', topic: 'C2', topic_name: 'Bonding, Structure and Properties', subtopic: 'C2.4', subtopic_name: 'Giant Metallic Structures', tier: 'T', exam_board: 'AQA',
    q: 'Describe the structure of a **giant metallic lattice** and what holds it together.',
    a: ['Metal atoms are arranged in a **regular giant lattice** of positive ions (cations)', 'Metal atoms lose their outer electrons, forming a **\'sea\' of delocalised electrons** that are free to move throughout the structure', 'The **electrostatic attraction** between the positive metal ions and the surrounding sea of negative electrons holds the structure together', 'This is called **metallic bonding** — it is strong, which explains high melting points of most metals'],
    hint: 'Giant lattice of positive ions in a sea of free electrons. Attraction between opposites holds it all together.',
    exam_q: 'Describe metallic bonding.',
    examMarks: 3,
    examA: 'Metal atoms lose outer electrons / form positive ions (1) + creating a \'sea\' of delocalised electrons free to move throughout the structure (1) + held together by strong electrostatic attraction between positive ions and delocalised electrons (1).' },

  { id: 'c2_t02', subject: 'Chemistry', topic: 'C2', topic_name: 'Bonding, Structure and Properties', subtopic: 'C2.4', subtopic_name: 'Giant Metallic Structures', tier: 'T', exam_board: 'AQA',
    q: 'Use the **sea of delocalised electrons** to explain why metals **conduct electricity and heat**.',
    a: ['**Electrical conductivity**: the delocalised electrons are **free to move** throughout the lattice; when a potential difference is applied, they move in one direction, carrying **charge** through the metal', '**Thermal conductivity**: delocalised electrons **gain kinetic energy** when heated and rapidly transfer that energy to other parts of the metal by colliding with and exciting neighbouring electrons and ions', 'Both properties arise because the electrons are **not fixed** to any particular atom', 'Metals conduct in both **solid and liquid** states (delocalised electrons remain free)'],
    hint: 'Free electrons = carry charge (electricity) and carry kinetic energy (heat). Same electrons, two jobs.',
    exam_q: 'Explain why metals are good conductors of electricity.',
    examMarks: 2,
    examA: 'Metals have delocalised electrons that are free to move throughout the structure (1) + these electrons carry charge through the metal when a potential difference is applied (1).' },

  { id: 'c2_t03', subject: 'Chemistry', topic: 'C2', topic_name: 'Bonding, Structure and Properties', subtopic: 'C2.5', subtopic_name: 'Nanoparticles', tier: 'T', exam_board: 'AQA',
    q: 'Define **nanoparticles** and explain the significance of their **surface area to volume ratio**.',
    a: ['**Nanoparticles** are particles with dimensions in the range **1–100 nm** (1 nanometre = 10⁻⁹ m)', 'As particle size decreases, the **surface area to volume ratio** increases dramatically', 'A nanoparticle has a much higher proportion of atoms on its **surface** compared to bulk material', 'This makes nanoparticles much more **reactive** and effective as **catalysts** than the same material in bulk form'],
    hint: 'Smaller particles = more surface for the same amount of material. Nanoparticles are so small almost all atoms are on the surface.',
    exam_q: 'Explain why nanoparticles of a material are more effective as catalysts than the same mass of the material in bulk form.',
    examMarks: 2,
    examA: 'Nanoparticles have a much greater surface area to volume ratio (1) + so more active sites are available for reactant molecules to bind to (1).' },

  { id: 'c2_t04', subject: 'Chemistry', topic: 'C2', topic_name: 'Bonding, Structure and Properties', subtopic: 'C2.5', subtopic_name: 'Nanoparticles', tier: 'T', exam_board: 'AQA',
    q: 'Give **4 uses** of nanoparticles.',
    a: ['**Catalysts**: high surface area to volume ratio makes them more efficient (e.g. gold nanoparticles in industrial chemistry)', '**Drug delivery**: nanoparticles can be targeted to specific cells (e.g. cancer cells) to deliver drugs with fewer side effects', '**Sun cream**: titanium dioxide (TiO₂) or zinc oxide (ZnO) nanoparticles absorb UV radiation without leaving a visible white layer', '**Antimicrobial coatings**: silver nanoparticles kill bacteria — used in wound dressings, socks, food packaging'],
    hint: 'Catalysts, drugs, sun cream, antibacterials. Four uses — four marks.',
    exam_q: 'Give two uses of nanoparticles.',
    examMarks: 2,
    examA: 'Any 2 from: catalysts / targeted drug delivery / sun cream (UV protection) / antimicrobial coatings / electronics / sensors.' },

  { id: 'c2_t05', subject: 'Chemistry', topic: 'C2', topic_name: 'Bonding, Structure and Properties', subtopic: 'C2.5', subtopic_name: 'Nanoparticles', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 potential risks** associated with the use of nanoparticles.',
    a: ['**Lung damage**: nanoparticles are small enough to be **inhaled** and penetrate deep into lung tissue, potentially causing damage', '**Unknown long-term health effects**: not enough research has been done on how nanoparticles behave inside the body over time', '**Environmental risks**: nanoparticles released into the environment could accumulate in organisms and ecosystems with unknown consequences'],
    hint: 'Inhaled (lungs), unknown health effects, unknown environmental effects. We don\'t fully know the risks yet.',
    exam_q: 'Give two potential risks of using nanoparticles.',
    examMarks: 2,
    examA: 'Any 2 from: can be inhaled and cause lung damage / unknown long-term effects on health / unknown effects on ecosystems / can penetrate cell membranes.' },


  // Chemistry C3 — Quantitative Chemistry (Triple-only additions)
  { id: 'c3_t01', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', subtopic: 'C3.4', subtopic_name: 'Molar Volume of Gases', tier: 'T', exam_board: 'AQA',
    q: 'State the **molar volume of a gas at room temperature and pressure (RTP)**.',
    a: ['At **RTP** (room temperature and pressure: 20°C, 1 atmosphere / 101 kPa), one mole of ANY gas occupies **24 dm³** (24,000 cm³)', 'This applies to all gases regardless of their identity — the molar volume is the same for all gases at the same conditions', 'This is called the **molar volume at RTP**'],
    hint: '24 dm³ per mole at RTP. This is a given constant — memorise it. All gases: same volume, same conditions.',
    exam_q: 'What volume does 1 mole of carbon dioxide gas occupy at room temperature and pressure?',
    examMarks: 1,
    examA: '24 dm³ (or 24,000 cm³).' },

  { id: 'c3_t02', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', subtopic: 'C3.4', subtopic_name: 'Molar Volume of Gases', tier: 'T', exam_board: 'AQA',
    q: 'Use the **molar volume** to calculate volumes and moles of gases.',
    a: ['**Volume (dm³) = moles × 24**', '**Moles = volume (dm³) ÷ 24**', 'To convert from cm³ to dm³ first: **dm³ = cm³ ÷ 1000**; then calculate moles = (cm³ ÷ 1000) ÷ 24'],
    hint: '24 dm³ per mole. If volume is in cm³, divide by 1000 first. Then multiply or divide by 24.',
    exam_q: 'Calculate the volume of 0.25 mol of oxygen gas at RTP.',
    examMarks: 1,
    examA: '0.25 × 24 = **6 dm³**.' },

  { id: 'c3_t03', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', subtopic: 'C3.5', subtopic_name: 'Concentration Calculations', tier: 'T', exam_board: 'AQA',
    q: 'State and use the formula for **concentration** in mol/dm³.',
    a: ['**Concentration (mol/dm³) = moles (mol) ÷ volume (dm³)**', 'Rearrangements: moles = concentration × volume; volume (dm³) = moles ÷ concentration', 'Units: concentration is in **mol/dm³** (moles per decimetre cubed); volume must be in **dm³**'],
    hint: 'c = n/V. Triangle: moles at top, concentration and volume at bottom. Volume MUST be in dm³.',
    exam_q: 'Calculate the concentration of a solution containing 0.5 mol of sodium hydroxide in 250 cm³ of solution.',
    examMarks: 2,
    examA: 'Convert: 250 cm³ = 0.25 dm³ (1) + concentration = 0.5 ÷ 0.25 = **2.0 mol/dm³** (1).' },

  { id: 'c3_t04', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', subtopic: 'C3.5', subtopic_name: 'Concentration Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Convert between **cm³ and dm³**.',
    a: ['1 dm³ = **1000 cm³**, so to convert: **dm³ = cm³ ÷ 1000**', 'Always convert to dm³ before using in concentration calculations'],
    hint: '1 dm³ = 1 litre = 1000 mL = 1000 cm³. Divide cm³ by 1000 to get dm³. 250 cm³ = 0.25 dm³.',
    exam_q: 'A student has 500 cm³ of a solution. Convert this to dm³.',
    examMarks: 1,
    examA: '500 ÷ 1000 = **0.5 dm³**.' },

  { id: 'c3_t05', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', subtopic: 'C3.5', subtopic_name: 'Concentration Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Use **concentration and volume** to calculate the number of moles.',
    a: ['**Moles = concentration (mol/dm³) × volume (dm³)**', 'Must convert volume to dm³ before multiplying', 'Example: 40 cm³ of 0.1 mol/dm³ HCl → moles = 0.1 × (40/1000) = 0.1 × 0.04 = **0.004 mol**'],
    hint: 'n = c × V. Volume in dm³. Concentration in mol/dm³. Multiply them together.',
    exam_q: 'How many moles of HCl are in 25 cm³ of 2.0 mol/dm³ hydrochloric acid?',
    examMarks: 2,
    examA: 'moles = 0.1 × (40/1000) = 0.1 × 0.04 = **0.004 mol** Hint: n = c × V. Volume in dm³. Concentration in mol/dm³. Multiply them together. Exam Q: "How many moles of HCl are in 25 cm³ of 2.0 mol/dm³ hydrochloric acid?" [2 marks] → 25 cm³ = 0.025 dm³ (1) + moles = 2.0 × 0.025 = **0.05 mol** (1).' },

  { id: 'c3_t06', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', subtopic: 'C3.6', subtopic_name: 'Percentage Yield and Atom Economy', tier: 'T', exam_board: 'AQA',
    q: 'Define and calculate **percentage yield**.',
    a: ['**Percentage yield = (actual yield ÷ theoretical yield) × 100**', 'Theoretical yield = the maximum mass of product calculated from the balanced equation', 'Percentage yield is always ≤ 100%; reasons for less than 100%: reversible reactions, side reactions, losses during purification'],
    hint: '% yield = (what you got ÷ what you could get) × 100. Always a percentage. Never over 100%.',
    exam_q: 'A reaction produces 4.8 g of a product. The theoretical yield is 6.0 g. Calculate the percentage yield.',
    examMarks: 2,
    examA: '% yield = (4.8 ÷ 6.0) × 100 (1) = **80%** (1).' },

  { id: 'c3_t07', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', subtopic: 'C3.6', subtopic_name: 'Percentage Yield and Atom Economy', tier: 'T', exam_board: 'AQA',
    q: 'Define and calculate **atom economy** and explain why a high atom economy is desirable.',
    a: ['**Atom economy = (Mr of desired products ÷ total Mr of all reactants) × 100**', 'A reaction with **100% atom economy** produces only the desired product — no waste', 'High atom economy is desirable because: less raw materials wasted, less waste to dispose of, more sustainable, more economical', 'Example: addition reactions (like polymerisation) have 100% atom economy; substitution reactions have lower atom economy'],
    hint: 'Atom economy = useful product mass out of total reactant mass in. High = efficient. Green chemistry aims for 100%.',
    exam_q: 'Explain why a high atom economy is important in industrial processes.',
    examMarks: 2,
    examA: 'Less waste is produced / more of the atoms in reactants end up in the desired product (1) + reduces raw material costs and is more sustainable / less environmental impact from waste disposal (1).' },


  // Chemistry C4 — Chemical Changes (Triple-only additions)
  { id: 'c4_t01', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', subtopic: 'C4.4', subtopic_name: 'Electrolysis of Aqueous Solutions', tier: 'T', exam_board: 'AQA',
    q: 'Explain which ions are **discharged at the cathode** during electrolysis of aqueous solutions.',
    a: ['In aqueous solution, **H⁺ ions** (from water) compete with metal ions for discharge at the cathode', 'If the metal ion is **less reactive than hydrogen** (e.g. Cu²⁺, Ag⁺) → the **metal is deposited** at the cathode', 'If the metal ion is **more reactive than hydrogen** (e.g. Na⁺, Ca²⁺) → **hydrogen gas (H₂)** is produced at the cathode instead'],
    hint: 'Cathode = reduction. Cu²⁺ wins over H⁺ (copper less reactive). Na⁺ loses to H⁺ (sodium more reactive than H).',
    exam_q: 'What is produced at the cathode during electrolysis of copper sulfate solution?',
    examMarks: 1,
    examA: 'the **metal is deposited** at the cathode - If the metal ion is **more reactive than hydrogen** (e.g. Na⁺, Ca²⁺) → **hydrogen gas (H₂)** is produced at the cathode instead Hint: Cathode = reduction. Cu²⁺ wins over H⁺ (copper less reactive). Na⁺ loses to H⁺ (sodium more reactive than H). Exam Q: "What is produced at the cathode during electrolysis of copper sulfate solution?" [1 mark] → Copper / Cu is deposited (copper is less reactive than hydrogen so Cu²⁺ is preferentially reduced).' },

  { id: 'c4_t02', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', subtopic: 'C4.4', subtopic_name: 'Electrolysis of Aqueous Solutions', tier: 'T', exam_board: 'AQA',
    q: 'Explain which ions are **discharged at the anode** during electrolysis of aqueous solutions.',
    a: ['At the anode, **OH⁻ ions** (from water) compete with negative ions from the dissolved salt', 'If **halide ions** (Cl⁻, Br⁻, I⁻) are present in **high (concentrated)** solution → the **halogen gas** is preferentially discharged (e.g. Cl₂)', 'If the halide concentration is **low (dilute)** or no halide ions are present → **oxygen gas (O₂)** is produced (from OH⁻ ions)'],
    hint: 'Anode = oxidation. Concentrated Cl⁻ → Cl₂ (beats OH⁻). Dilute Cl⁻ or no halide → O₂. Concentration matters.',
    exam_q: 'What gas is produced at the anode during electrolysis of concentrated sodium chloride solution?',
    examMarks: 1,
    examA: 'the **halogen gas** is preferentially discharged (e.g. Cl₂) - If the halide concentration is **low (dilute)** or no halide ions are present → **oxygen gas (O₂)** is produced (from OH⁻ ions) Hint: Anode = oxidation. Concentrated Cl⁻ → Cl₂ (beats OH⁻). Dilute Cl⁻ or no halide → O₂. Concentration matters. Exam Q: "What gas is produced at the anode during electrolysis of concentrated sodium chloride solution?" [1 mark] → Chlorine gas / Cl₂.' },

  { id: 'c4_t03', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', subtopic: 'C4.4', subtopic_name: 'Electrolysis of Aqueous Solutions', tier: 'T', exam_board: 'AQA',
    q: 'State the **products of electrolysis of aqueous sodium chloride** and give one use of each product.',
    a: ['**Cathode**: hydrogen gas (H₂) — used as a fuel and to make ammonia (Haber process)', '**Anode**: chlorine gas (Cl₂) — used to make bleach and PVC plastic', '**Remaining solution**: sodium hydroxide (NaOH) — used in soap manufacture, paper making, and to make bleach (with Cl₂)', 'This process is called the **chloralkali process** — industrially important'],
    hint: 'Brine electrolysis: H₂ at cathode, Cl₂ at anode, NaOH left in solution. Three useful products. Chloralkali industry.',
    exam_q: 'State the three useful products obtained by electrolysis of concentrated sodium chloride solution.',
    examMarks: 3,
    examA: 'Hydrogen (1) + chlorine (1) + sodium hydroxide (1).' },

  { id: 'c4_t04', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', subtopic: 'C4.4', subtopic_name: 'Electrolysis of Aqueous Solutions', tier: 'T', exam_board: 'AQA',
    q: 'State the products of electrolysis of **copper sulfate solution** and explain why.',
    a: ['**Cathode**: copper (Cu) is deposited — Cu²⁺ ions are discharged in preference to H⁺ (copper is less reactive than hydrogen)', '**Anode** (inert electrode): oxygen gas (O₂) — no halide ions present, so OH⁻ ions are oxidised', 'If a **copper anode** is used instead: the anode dissolves (Cu → Cu²⁺ + 2e⁻), keeping the Cu²⁺ concentration constant — used in **electroplating**'],
    hint: 'CuSO₄: copper deposits at cathode, oxygen at anode. If copper anode used → anode dissolves, cathode gains copper. Electroplating.',
    exam_q: 'What is produced at the cathode when copper sulfate solution is electrolysed using inert electrodes?',
    examMarks: 1,
    examA: 'Cu²⁺ + 2e⁻), keeping the Cu²⁺ concentration constant — used in **electroplating** Hint: CuSO₄: copper deposits at cathode, oxygen at anode. If copper anode used → anode dissolves, cathode gains copper. Electroplating. Exam Q: "What is produced at the cathode when copper sulfate solution is electrolysed using inert electrodes?" [1 mark] → Copper / copper is deposited.' },

  { id: 'c4_t05', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', subtopic: 'C4.5', subtopic_name: 'Electrode Half Equations', tier: 'T', exam_board: 'AQA',
    q: 'State what **OIL RIG** means and apply it to electrolysis.',
    a: ['**OIL RIG**: Oxidation Is Loss (of electrons); Reduction Is Gain (of electrons)', 'At the **anode**: oxidation occurs — negative ions **lose electrons** to the anode (ANOX — ANOde = OXidation)', 'At the **cathode**: reduction occurs — positive ions **gain electrons** from the cathode (CROC — CAthode = Reduction)', 'Electrons flow from anode (where they are released) through the external circuit to the cathode'],
    hint: 'OIL RIG. ANOX CROC. Anode = oxidation = loss of electrons. Cathode = reduction = gain of electrons.',
    exam_q: 'At which electrode does oxidation occur during electrolysis? What does this mean in terms of electrons?',
    examMarks: 2,
    examA: 'Oxidation occurs at the anode (1) + ions lose electrons / electrons are removed from ions at the anode (1).' },

  { id: 'c4_t06', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', subtopic: 'C4.5', subtopic_name: 'Electrode Half Equations', tier: 'T', exam_board: 'AQA',
    q: 'Write and balance **half equations at the cathode** for common products.',
    a: ['**Hydrogen produced**: 2H⁺(aq) + 2e⁻ → H₂(g)', '**Copper deposited**: Cu²⁺(aq) + 2e⁻ → Cu(s)', 'Rules: include **state symbols**, balance atoms first then balance charge by adding electrons to the MORE positive side'],
    hint: 'Cathode = reduction = add electrons to LEFT of arrow. H⁺ needs 2e⁻ to make H₂. Cu²⁺ needs 2e⁻ to make Cu.',
    exam_q: 'Write the half equation for the reaction at the cathode when hydrogen is produced during electrolysis.',
    examMarks: 2,
    examA: 'H₂(g) - **Copper deposited**: Cu²⁺(aq) + 2e⁻ → Cu(s) - Rules: include **state symbols**, balance atoms first then balance charge by adding electrons to the MORE positive side Hint: Cathode = reduction = add electrons to LEFT of arrow. H⁺ needs 2e⁻ to make H₂. Cu²⁺ needs 2e⁻ to make Cu. Exam Q: "Write the half equation for the reaction at the cathode when hydrogen is produced during electrolysis." [2 marks] → 2H⁺(aq) + 2e⁻ → H₂(g) — correct formula and balancing (1) + correct state symbols (1).' },

  { id: 'c4_t07', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', subtopic: 'C4.5', subtopic_name: 'Electrode Half Equations', tier: 'T', exam_board: 'AQA',
    q: 'Write and balance **half equations at the anode** for common products.',
    a: ['**Chlorine produced**: 2Cl⁻(aq) → Cl₂(g) + 2e⁻', '**Oxygen produced**: 4OH⁻(aq) → 2H₂O(l) + O₂(g) + 4e⁻', 'Rules: electrons are on the **RIGHT** of the arrow (they are released from ions at the anode); include state symbols'],
    hint: 'Anode = oxidation = electrons on RIGHT. Cl⁻ loses one electron each (×2 for Cl₂). OH⁻ four go in, O₂ comes out.',
    exam_q: 'Write the half equation for the production of chlorine at the anode.',
    examMarks: 2,
    examA: 'Cl₂(g) + 2e⁻ - **Oxygen produced**: 4OH⁻(aq) → 2H₂O(l) + O₂(g) + 4e⁻ - Rules: electrons are on the **RIGHT** of the arrow (they are released from ions at the anode); include state symbols Hint: Anode = oxidation = electrons on RIGHT. Cl⁻ loses one electron each (×2 for Cl₂). OH⁻ four go in, O₂ comes out. Exam Q: "Write the half equation for the production of chlorine at the anode." [2 marks] → 2Cl⁻(aq) → Cl₂(g) + 2e⁻ — correct formula and balancing (1) + correct state symbols (1).' },


  // Chemistry C5 — Energy Changes (Triple-only additions)
  { id: 'c5_t01', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.3', subtopic_name: 'Bond Energy Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Explain the energy changes involved in **breaking and making chemical bonds**.',
    a: ['**Breaking bonds** requires energy — it is always **endothermic** (energy is taken in from surroundings)', '**Making bonds** releases energy — it is always **exothermic** (energy is given out to surroundings)', 'The overall energy change of a reaction depends on the **balance** between energy in (breaking) and energy out (making)'],
    hint: 'BREAK = in (endothermic). MAKE = out (exothermic). Overall reaction: if making releases more than breaking needs = exothermic overall.',
    exam_q: 'Explain, in terms of bond breaking and bond making, why a reaction is exothermic.',
    examMarks: 2,
    examA: 'Bond breaking requires energy / is endothermic (1) + energy released by bond making is greater than energy needed to break bonds / more energy released making bonds than absorbed breaking bonds (1).' },

  { id: 'c5_t02', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.3', subtopic_name: 'Bond Energy Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Use bond energies to **calculate the overall energy change** of a reaction.',
    a: ['**ΔH = Σ(bond energies of bonds broken) − Σ(bond energies of bonds made)**', 'Sum all the bond energies for bonds broken in reactants (energy IN)', 'Sum all the bond energies for bonds made in products (energy OUT)', 'If ΔH is **negative** → exothermic; if ΔH is **positive** → endothermic'],
    hint: 'ΔH = in − out. Draw out all the bonds. Add up breaking. Add up making. Subtract. Negative = exothermic.',
    exam_q: 'Using bond energies, calculate ΔH for: H₂ + Cl₂ → 2HCl. [Bond energies: H–H = 436, Cl–Cl = 243, H–Cl = 432 kJ/mol]',
    examMarks: 3,
    examA: 'exothermic; if ΔH is **positive** → endothermic Hint: ΔH = in − out. Draw out all the bonds. Add up breaking. Add up making. Subtract. Negative = exothermic. Exam Q: "Using bond energies, calculate ΔH for: H₂ + Cl₂ → 2HCl. [Bond energies: H–H = 436, Cl–Cl = 243, H–Cl = 432 kJ/mol]" [3 marks] → Energy in = 436 + 243 = 679 kJ/mol (1) + energy out = 2 × 432 = 864 kJ/mol (1) + ΔH = 679 − 864 = **−185 kJ/mol** (exothermic) (1).' },

  { id: 'c5_t03', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.3', subtopic_name: 'Bond Energy Calculations', tier: 'T', exam_board: 'AQA',
    q: 'Identify whether a reaction is **exothermic or endothermic** from bond energy data.',
    a: ['If **energy out > energy in** (bonds made release more energy than bonds broken absorb) → reaction is **exothermic**, ΔH is **negative**', 'If **energy in > energy out** (bonds broken absorb more energy than bonds made release) → reaction is **endothermic**, ΔH is **positive**', 'Bond energy calculations give an **approximate** ΔH — actual values may differ slightly from experimental data'],
    hint: 'More out than in = exothermic (negative ΔH). More in than out = endothermic (positive ΔH). Simple comparison.',
    exam_q: 'In a reaction, energy needed to break bonds = 800 kJ/mol. Energy released making bonds = 950 kJ/mol. Is the reaction exothermic or endothermic?',
    examMarks: 2,
    examA: 'reaction is **exothermic**, ΔH is **negative** - If **energy in > energy out** (bonds broken absorb more energy than bonds made release) → reaction is **endothermic**, ΔH is **positive** - Bond energy calculations give an **approximate** ΔH — actual values may differ slightly from experimental data Hint: More out than in = exothermic (negative ΔH). More in than out = endothermic (positive ΔH). Simple comparison. Exam Q: "In a reaction, energy needed to break bonds = 800 kJ/mol. Energy released making bonds = 950 kJ/mol. Is the reaction exothermic or endothermic?" [2 marks] → ΔH = 800 − 950 = −150 kJ/mol (1) + exothermic (energy released > energy absorbed) (1).' },

  { id: 'c5_t04', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.4', subtopic_name: 'Hydrogen Fuel Cells', tier: 'T', exam_board: 'AQA',
    q: 'Describe how a **hydrogen fuel cell** generates electricity.',
    a: ['**Hydrogen** enters at the **anode** → hydrogen is oxidised: 2H₂ → 4H⁺ + 4e⁻', 'Electrons flow through the **external circuit** → generating an **electric current**', 'H⁺ ions migrate through the electrolyte (often an acid or membrane) to the **cathode**', 'At cathode, oxygen is **reduced**: O₂ + 4H⁺ + 4e⁻ → 2H₂O — **water** is the only product'],
    hint: 'H₂ in at anode → electrons out through circuit → H⁺ across to cathode → O₂ + H⁺ + e⁻ → H₂O. Only product = water.',
    exam_q: 'What is the only product of a hydrogen fuel cell?',
    examMarks: 1,
    examA: 'hydrogen is oxidised: 2H₂ → 4H⁺ + 4e⁻ - Electrons flow through the **external circuit** → generating an **electric current** - H⁺ ions migrate through the electrolyte (often an acid or membrane) to the **cathode** - At cathode, oxygen is **reduced**: O₂ + 4H⁺ + 4e⁻ → 2H₂O — **water** is the only product Hint: H₂ in at anode → electrons out through circuit → H⁺ across to cathode → O₂ + H⁺ + e⁻ → H₂O. Only product = water. Exam Q: "What is the only product of a hydrogen fuel cell?" [1 mark] → Water / H₂O.' },

  { id: 'c5_t05', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.4', subtopic_name: 'Hydrogen Fuel Cells', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 advantages** of hydrogen fuel cells compared to batteries and combustion engines.',
    a: ['**Clean**: the only product is **water** — no CO₂ or other pollutants produced during operation', '**Efficient**: fuel cells convert chemical energy directly to electrical energy — more efficient than combustion engines which lose energy as heat', '**Continuous operation**: fuel cells can be **continuously refuelled** (unlike batteries which must be recharged or replaced)'],
    hint: 'Water only product (clean). More efficient than engines. Refuel continuously (not recharge). Three advantages.',
    exam_q: 'Give two advantages of hydrogen fuel cells over petrol engines.',
    examMarks: 2,
    examA: 'Any 2 from: only product is water / no CO₂ produced during operation (1) + more energy efficient / less energy wasted as heat (1) + can be continuously refuelled.' },

  { id: 'c5_t06', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', subtopic: 'C5.4', subtopic_name: 'Hydrogen Fuel Cells', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 disadvantages** of hydrogen fuel cells.',
    a: ['**Hydrogen storage**: hydrogen gas is difficult and potentially dangerous to store — requires high-pressure tanks or cryogenic temperatures', '**Production of hydrogen**: most hydrogen is made by **steam reforming of methane** (a fossil fuel) which produces CO₂ — not truly clean unless made from renewable electricity (electrolysis)', '**Infrastructure and cost**: hydrogen fuelling stations are rare; fuel cells are currently expensive to manufacture'],
    hint: 'Hard to store (pressurised). Made from methane (still produces CO₂). Expensive and no infrastructure yet.',
    exam_q: 'Give one disadvantage of using hydrogen fuel cells to power vehicles.',
    examMarks: 1,
    examA: 'Any 1 from: hydrogen is difficult/dangerous to store / hydrogen is mainly produced from fossil fuels (not truly clean) / expensive / lack of refuelling infrastructure.' },


  // Chemistry C6 — Rate and Extent of Chemical Change (Triple-only additions)
  { id: 'c6_t01', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', subtopic: 'C6.3', subtopic_name: 'Reversible Reactions and Equilibrium', tier: 'T', exam_board: 'AQA',
    q: 'State **Le Chatelier\'s Principle** and explain what it predicts.',
    a: ['**Le Chatelier\'s Principle**: if a system at dynamic equilibrium is subjected to a change in conditions, the equilibrium will **shift in the direction that opposes the change**', 'A **dynamic equilibrium** exists when the forward and reverse reactions occur at the same rate — concentrations remain constant', 'The principle allows prediction of how equilibrium position changes when temperature, pressure, or concentration is altered'],
    hint: 'Change the conditions → equilibrium shifts to OPPOSE the change. It\'s a system trying to restore balance.',
    exam_q: 'What is Le Chatelier\'s Principle?',
    examMarks: 2,
    examA: 'equilibrium shifts to OPPOSE the change. It\'s a system trying to restore balance. Exam Q: "What is Le Chatelier\'s Principle?" [2 marks] → If a system at equilibrium is disturbed by a change in conditions (1) + the equilibrium shifts in the direction that opposes / counteracts the change (1).' },

  { id: 'c6_t02', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', subtopic: 'C6.3', subtopic_name: 'Reversible Reactions and Equilibrium', tier: 'T', exam_board: 'AQA',
    q: 'Predict the effect of **temperature** on equilibrium position using Le Chatelier\'s Principle.',
    a: ['**Increase temperature**: equilibrium shifts in the **endothermic** direction (absorbs heat to oppose the increase) → favours the reaction that takes in heat', '**Decrease temperature**: equilibrium shifts in the **exothermic** direction (releases heat to oppose the decrease) → favours the reaction that gives out heat', 'For an **exothermic** forward reaction: increasing temperature **decreases yield** of products', 'For an **endothermic** forward reaction: increasing temperature **increases yield** of products'],
    hint: 'Temperature up → shift to ENDOTHERMIC side (absorbs it). Temperature down → shift to EXOTHERMIC side (releases it).',
    exam_q: 'N₂ + 3H₂ ⇌ 2NH₃ (ΔH = −92 kJ/mol). Predict and explain the effect of increasing temperature on the equilibrium yield of NH₃.',
    examMarks: 3,
    examA: 'favours the reaction that takes in heat - **Decrease temperature**: equilibrium shifts in the **exothermic** direction (releases heat to oppose the decrease) → favours the reaction that gives out heat - For an **exothermic** forward reaction: increasing temperature **decreases yield** of products - For an **endothermic** forward reaction: increasing temperature **increases yield** of products Hint: Temperature up → shift to ENDOTHERMIC side (absorbs it). Temperature down → shift to EXOTHERMIC side (releases it). Exam Q: "N₂ + 3H₂ ⇌ 2NH₃ (ΔH = −92 kJ/mol). Predict and explain the effect of increasing temperature on the equilibrium yield of NH₃." [3 marks] → Equilibrium shifts to the left / towards reactants (1) + because the forward reaction is exothermic / reverse reaction is endothermic (1) + so yield of NH₃ decreases (1).' },

  { id: 'c6_t03', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', subtopic: 'C6.3', subtopic_name: 'Reversible Reactions and Equilibrium', tier: 'T', exam_board: 'AQA',
    q: 'Predict the effect of **pressure** on equilibrium position using Le Chatelier\'s Principle.',
    a: ['**Increase pressure**: equilibrium shifts to the side with **fewer moles of gas** (to reduce pressure and oppose the change)', '**Decrease pressure**: equilibrium shifts to the side with **more moles of gas**', 'Only affects equilibrium if there are **different numbers of moles of gas** on each side', 'No effect if moles of gas are equal on both sides, or if no gases are involved'],
    hint: 'Pressure up → fewer moles gas side wins. Count the moles of gas on each side of the equation.',
    exam_q: 'N₂(g) + 3H₂(g) ⇌ 2NH₃(g). What effect does increasing pressure have on the equilibrium yield of ammonia? Explain.',
    examMarks: 2,
    examA: 'fewer moles gas side wins. Count the moles of gas on each side of the equation. Exam Q: "N₂(g) + 3H₂(g) ⇌ 2NH₃(g). What effect does increasing pressure have on the equilibrium yield of ammonia? Explain." [2 marks] → Equilibrium shifts to the right / towards products (1) + because the right-hand side has fewer moles of gas (2 mol vs 4 mol), so increasing pressure favours the side with fewer moles (1).' },

  { id: 'c6_t04', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', subtopic: 'C6.3', subtopic_name: 'Reversible Reactions and Equilibrium', tier: 'T', exam_board: 'AQA',
    q: 'Predict the effect of **concentration** on equilibrium position.',
    a: ['**Increase concentration of a reactant**: equilibrium shifts **towards products** (to consume the added reactant and oppose the change)', '**Increase concentration of a product** (or remove products): if products are removed, equilibrium shifts **towards products** to replace them', 'Adding a **catalyst** does NOT shift the equilibrium position — it speeds up both forward and reverse reactions equally'],
    hint: 'Add reactant → more product made. Remove product → equilibrium shifts right to replace it. Catalyst = no shift.',
    exam_q: 'Explain the effect of increasing the concentration of a reactant on the equilibrium position.',
    examMarks: 2,
    examA: 'more product made. Remove product → equilibrium shifts right to replace it. Catalyst = no shift. Exam Q: "Explain the effect of increasing the concentration of a reactant on the equilibrium position." [2 marks] → The equilibrium shifts towards the products / to the right (1) + to oppose the increase / to consume the added reactant (1).' },

  { id: 'c6_t05', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', subtopic: 'C6.4', subtopic_name: 'The Haber Process', tier: 'T', exam_board: 'AQA',
    q: 'Write the **equation** for the Haber process and state the **conditions** used.',
    a: ['**N₂(g) + 3H₂(g) ⇌ 2NH₃(g)** (ΔH = −92 kJ/mol, exothermic)', 'Temperature: **450°C**', 'Pressure: **200 atm**', 'Catalyst: **iron** (with potassium hydroxide as a promoter)'],
    hint: 'N₂ + 3H₂ ⇌ 2NH₃. 450°C, 200 atm, iron catalyst. All four are exam-ready facts.',
    exam_q: 'State the conditions used in the Haber process.',
    examMarks: 3,
    examA: 'Temperature of approximately 450°C (1) + pressure of approximately 200 atm (1) + iron catalyst (1).' },

  { id: 'c6_t06', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', subtopic: 'C6.4', subtopic_name: 'The Haber Process', tier: 'T', exam_board: 'AQA',
    q: 'Explain why **450°C** is used as a **compromise temperature** in the Haber process.',
    a: ['The forward reaction (making NH₃) is **exothermic**', 'Lower temperature → equilibrium shifts right → **higher yield** of NH₃, but very **slow rate** of reaction', 'Higher temperature → faster rate but equilibrium shifts left → **lower yield** of NH₃', '450°C is a **compromise**: gives a **reasonable rate** and **acceptable yield** in a practical time period'],
    hint: 'Exothermic forward → cool = more NH₃ but too slow. Hot = fast but little NH₃. 450°C = compromise.',
    exam_q: 'Explain why a temperature of 450°C is used in the Haber process rather than a lower temperature.',
    examMarks: 2,
    examA: 'equilibrium shifts right → **higher yield** of NH₃, but very **slow rate** of reaction - Higher temperature → faster rate but equilibrium shifts left → **lower yield** of NH₃ - 450°C is a **compromise**: gives a **reasonable rate** and **acceptable yield** in a practical time period Hint: Exothermic forward → cool = more NH₃ but too slow. Hot = fast but little NH₃. 450°C = compromise. Exam Q: "Explain why a temperature of 450°C is used in the Haber process rather than a lower temperature." [2 marks] → A lower temperature gives a higher equilibrium yield of NH₃ (1) + but the rate of reaction would be too slow to be economically viable / 450°C gives a reasonable rate (1).' },

  { id: 'c6_t07', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate and Extent of Chemical Change', subtopic: 'C6.4', subtopic_name: 'The Haber Process', tier: 'T', exam_board: 'AQA',
    q: 'Explain why **200 atm** is used as a **compromise pressure** in the Haber process.',
    a: ['The forward reaction produces **fewer moles of gas** (4 mol → 2 mol) — higher pressure shifts equilibrium right → **higher yield** of NH₃', 'Very high pressure → better yield BUT equipment is **extremely expensive** to build and maintain, and higher safety risks', '200 atm gives a **good yield** while remaining **economically viable**', 'Unreacted N₂ and H₂ are **recycled** back into the reactor — minimising waste'],
    hint: 'Higher pressure = higher yield (fewer moles product side). But expensive and dangerous. 200 atm = compromise. Recycle unreacted gases.',
    exam_q: 'Explain why the highest possible pressure is not used in the Haber process.',
    examMarks: 2,
    examA: '2 mol) — higher pressure shifts equilibrium right → **higher yield** of NH₃ - Very high pressure → better yield BUT equipment is **extremely expensive** to build and maintain, and higher safety risks - 200 atm gives a **good yield** while remaining **economically viable** - Unreacted N₂ and H₂ are **recycled** back into the reactor — minimising waste Hint: Higher pressure = higher yield (fewer moles product side). But expensive and dangerous. 200 atm = compromise. Recycle unreacted gases. Exam Q: "Explain why the highest possible pressure is not used in the Haber process." [2 marks] → Very high pressure would give a higher yield of ammonia (1) + but would require extremely expensive / energy-intensive equipment and poses safety risks — 200 atm is a compromise (1).' },


  // Chemistry C7 — Organic Chemistry (Triple-only additions)
  { id: 'c7_t01', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alcohols', tier: 'T', exam_board: 'AQA',

  { id: 'c7_t02', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alcohols', tier: 'T', exam_board: 'AQA',
    q: 'Give the **uses** of methanol and ethanol.',

    exam_q: 'Give two uses of ethanol.',
    examMarks: 2,

  { id: 'c7_t03', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alcohols', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **combustion** and **oxidation** of ethanol.',
    a: ['**Complete combustion**: C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O (burns cleanly with sufficient oxygen)', '**Incomplete combustion** (insufficient oxygen): produces CO and/or carbon (soot) instead of CO₂', '**Oxidation to carboxylic acid**: ethanol + [O] → **ethanoic acid** + water (using an oxidising agent such as acidified K₂Cr₂O₇, which turns from orange to green)', 'This is why wine turns to vinegar — bacteria oxidise ethanol to ethanoic acid in air'],
    hint: 'Combustion = CO₂ + H₂O. Oxidation = ethanol → ethanoic acid (vinegar). Dichromate turns orange → green.',
    exam_q: 'Describe what happens when ethanol is oxidised.',
    examMarks: 2,
    examA: '2CO₂ + 3H₂O (burns cleanly with sufficient oxygen) - **Incomplete combustion** (insufficient oxygen): produces CO and/or carbon (soot) instead of CO₂ - **Oxidation to carboxylic acid**: ethanol + [O] → **ethanoic acid** + water (using an oxidising agent such as acidified K₂Cr₂O₇, which turns from orange to green) - This is why wine turns to vinegar — bacteria oxidise ethanol to ethanoic acid in air Hint: Combustion = CO₂ + H₂O. Oxidation = ethanol → ethanoic acid (vinegar). Dichromate turns orange → green. Exam Q: "Describe what happens when ethanol is oxidised." [2 marks] → Ethanol is oxidised to ethanoic acid (1) + using an oxidising agent / acidified potassium dichromate (1).' },

  { id: 'c7_t04', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.2', subtopic_name: 'Alcohols', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **fermentation** of glucose to produce ethanol and the conditions required.',
    a: ['Reaction: **glucose → ethanol + carbon dioxide** (C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂)', 'Carried out by **yeast** (containing the enzyme zymase) — an **anaerobic** process', 'Conditions: **warm temperature** (~30°C), **no oxygen (anaerobic)**, aqueous solution, yeast present', 'Product is dilute ethanol (wine/beer); **distillation** concentrates it further'],
    hint: 'Glucose → ethanol + CO₂. Yeast, warm, no oxygen. Anaerobic fermentation. Distil to concentrate.',
    exam_q: 'Write the word equation for fermentation of glucose.',
    examMarks: 1,
    examA: 'ethanol + carbon dioxide** (C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂) - Carried out by **yeast** (containing the enzyme zymase) — an **anaerobic** process - Conditions: **warm temperature** (~30°C), **no oxygen (anaerobic)**, aqueous solution, yeast present - Product is dilute ethanol (wine/beer); **distillation** concentrates it further Hint: Glucose → ethanol + CO₂. Yeast, warm, no oxygen. Anaerobic fermentation. Distil to concentrate. Exam Q: "Write the word equation for fermentation of glucose." [1 mark] → Glucose → ethanol + carbon dioxide.' },

  { id: 'c7_t05', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.3', subtopic_name: 'Carboxylic Acids', tier: 'T', exam_board: 'AQA',
    q: 'Give the **functional group**, first three members, and properties of **carboxylic acids**.',
    a: ['Functional group: **–COOH** (carboxyl group)', 'Methanoic acid (HCOOH), ethanoic acid (CH₃COOH — vinegar), propanoic acid (C₂H₅COOH)', '**Weak acids**: only partially dissociate in water — lower pH than strong acids of the same concentration', 'Dissolve in water to form an **acidic solution**; react with indicators, metals, alkalis, and carbonates'],
    hint: '-COOH group. Methanoic, ethanoic, propanoic. Weak acid — partially ionised. Vinegar is ethanoic acid.',
    exam_q: 'What is the functional group present in carboxylic acids?',
    examMarks: 1,
    examA: '–COOH / carboxyl group.' },

  { id: 'c7_t06', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.3', subtopic_name: 'Carboxylic Acids', tier: 'T', exam_board: 'AQA',
    q: 'Describe the reaction of **carboxylic acids with carbonates** and write a word equation.',
    a: ['Carboxylic acids react with metal **carbonates** to produce a **salt**, **water**, and **carbon dioxide**', 'Word equation: carboxylic acid + metal carbonate → metal carboxylate salt + water + carbon dioxide', 'Example: ethanoic acid + sodium carbonate → sodium ethanoate + water + carbon dioxide (effervescence observed — CO₂ bubbles)'],
    hint: 'Acid + carbonate → salt + water + CO₂. Same as mineral acids. The CO₂ bubbles are the test — carboxylic acid confirmed.',
    exam_q: 'Write a word equation for the reaction of ethanoic acid with sodium carbonate.',
    examMarks: 2,
    examA: 'metal carboxylate salt + water + carbon dioxide - Example: ethanoic acid + sodium carbonate → sodium ethanoate + water + carbon dioxide (effervescence observed — CO₂ bubbles) Hint: Acid + carbonate → salt + water + CO₂. Same as mineral acids. The CO₂ bubbles are the test — carboxylic acid confirmed. Exam Q: "Write a word equation for the reaction of ethanoic acid with sodium carbonate." [2 marks] → Ethanoic acid + sodium carbonate → sodium ethanoate + water + carbon dioxide (1 per correct reactants/products pair, max 2).' },

  { id: 'c7_t07', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.3', subtopic_name: 'Carboxylic Acids', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **esterification** reaction between a carboxylic acid and an alcohol.',
    a: ['Carboxylic acid + alcohol ⇌ **ester** + water (a **reversible** reaction)', 'Catalyst: **concentrated sulfuric acid (H₂SO₄)**, heat applied', 'The –OH from the acid and the H from the alcohol –OH combine to form water; the remaining parts join to form the ester –COO– linkage', 'Example: ethanoic acid + ethanol ⇌ **ethyl ethanoate** + water'],
    hint: 'Acid + alcohol → ester + water. Concentrated H₂SO₄ catalyst. Reversible (⇌). Product is an ester.',
    exam_q: 'Name the catalyst used in esterification reactions.',
    examMarks: 1,
    examA: 'ester + water. Concentrated H₂SO₄ catalyst. Reversible (⇌). Product is an ester. Exam Q: "Name the catalyst used in esterification reactions." [1 mark] → Concentrated sulfuric acid / H₂SO₄.' },

  { id: 'c7_t08', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.4', subtopic_name: 'Esters', tier: 'T', exam_board: 'AQA',
    q: 'Describe the **structure, naming and formation** of esters.',
    a: ['Functional group: **–COO–** (ester linkage)', 'Formed by: carboxylic acid + alcohol → ester + water', 'Naming: [alkyl group from alcohol]-[acid root + -oate]; e.g. ethanol + ethanoic acid → **ethyl ethanoate**', 'Properties: often volatile (low boiling point), fruity/pleasant smell, largely **insoluble** in water'],
    hint: '-COO- group. Name: alcohol part first (ethyl), then acid part (-oate). Ethanol + ethanoic → ethyl ethanoate.',
    exam_q: 'Name the ester formed from methanol and ethanoic acid.',
    examMarks: 1,
    examA: 'ester + water - Naming: [alkyl group from alcohol]-[acid root + -oate]; e.g. ethanol + ethanoic acid → **ethyl ethanoate** - Properties: often volatile (low boiling point), fruity/pleasant smell, largely **insoluble** in water Hint: -COO- group. Name: alcohol part first (ethyl), then acid part (-oate). Ethanol + ethanoic → ethyl ethanoate. Exam Q: "Name the ester formed from methanol and ethanoic acid." [1 mark] → Methyl ethanoate.' },

  { id: 'c7_t09', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.4', subtopic_name: 'Esters', tier: 'T', exam_board: 'AQA',
    q: 'Give **3 uses** of esters.',
    a: ['**Perfumes and fragrances**: volatile esters evaporate easily and have characteristic fruity smells', '**Food flavourings**: used to mimic fruit flavours (e.g. pentyl ethanoate = banana flavour, methyl butanoate = pineapple)', '**Solvents**: esters dissolve many organic compounds — used in nail varnish remover, paints and adhesives'],
    hint: 'Perfumes (volatile + smell). Food flavourings (fruity). Solvents (nail varnish, paint). Three uses.',
    exam_q: 'Give two uses of esters.',
    examMarks: 2,
    examA: 'Any 2 from: perfumes / food flavourings / solvents / plasticisers.' },

  { id: 'c7_t10', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.5', subtopic_name: 'Addition Polymers', tier: 'T', exam_board: 'AQA',
    q: 'Describe the process of **addition polymerisation** and identify the monomer from a polymer structure.',
    a: ['**Addition polymerisation**: many small **unsaturated monomers** (containing a C=C double bond) join together; the C=C bond opens and monomers link into a long chain', 'No atoms are lost — all monomer atoms are in the polymer (**100% atom economy**)', 'To find the monomer from the polymer: locate the repeat unit and add a C=C between the two carbons of the backbone', 'Example: poly(ethene) repeat unit –(CH₂–CH₂)ₙ– → monomer ethene CH₂=CH₂'],
    hint: 'C=C opens → chain forms. All atoms kept (100% atom economy). Monomer: add double bond back to repeat unit.',
    exam_q: 'Draw the monomer used to make poly(propene), where the repeat unit is –[CH₂–CH(CH₃)]–.',
    examMarks: 1,
    examA: 'monomer ethene CH₂=CH₂ Hint: C=C opens → chain forms. All atoms kept (100% atom economy). Monomer: add double bond back to repeat unit. Exam Q: "Draw the monomer used to make poly(propene), where the repeat unit is –[CH₂–CH(CH₃)]–." [1 mark] → CH₂=CHCH₃ / propene (draw with C=C double bond).' },

  { id: 'c7_t11', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.5', subtopic_name: 'Addition Polymers', tier: 'T', exam_board: 'AQA',
    q: 'Explain how the **structure** of addition polymers determines their **properties**.',
    a: ['**Low-density polyethene (LDPE)**: branched chains → chains cannot pack closely → **lower density**, more flexible, lower melting point', '**High-density polyethene (HDPE)**: unbranched (linear) chains → chains pack closely → **higher density**, stiffer, higher melting point', '**Thermosoftening polymers**: long chains with no cross-links; weak intermolecular forces — soften on heating, can be reshaped and recycled', '**Thermosetting polymers**: extensive cross-links between chains — do NOT soften on heating; stronger and more rigid'],
    hint: 'Branched = flexible/lower density (LDPE). Linear = stiffer/higher density (HDPE). Cross-linked = thermosetting (cannot remelt).',
    exam_q: 'Explain why low-density polyethene is more flexible than high-density polyethene.',
    examMarks: 2,
    examA: 'chains cannot pack closely → **lower density**, more flexible, lower melting point - **High-density polyethene (HDPE)**: unbranched (linear) chains → chains pack closely → **higher density**, stiffer, higher melting point - **Thermosoftening polymers**: long chains with no cross-links; weak intermolecular forces — soften on heating, can be reshaped and recycled - **Thermosetting polymers**: extensive cross-links between chains — do NOT soften on heating; stronger and more rigid Hint: Branched = flexible/lower density (LDPE). Linear = stiffer/higher density (HDPE). Cross-linked = thermosetting (cannot remelt). Exam Q: "Explain why low-density polyethene is more flexible than high-density polyethene." [2 marks] → LDPE has branched chains that cannot pack closely together (1) + HDPE has linear/unbranched chains that pack more closely, making it stiffer (1).' },

  { id: 'c7_t12', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.6', subtopic_name: 'Condensation Polymers', tier: 'T', exam_board: 'AQA',
    q: 'Describe the key features of **condensation polymerisation** and how it differs from addition polymerisation.',
    a: ['Requires **two different monomers** (or one monomer with two different functional groups)', 'Each monomer has **two functional groups** — one at each end — allowing it to bond to two others', 'A **small molecule** (usually **water**, or HCl with diacid chlorides) is released with each bond formed', 'Unlike addition polymers, atom economy is **less than 100%** (atoms lost as water)'],
    hint: 'Condensation = two monomer types + lose small molecule (water). Addition = one monomer, no loss, 100% atom economy.',
    exam_q: 'State two differences between addition and condensation polymerisation.',
    examMarks: 2,
    examA: 'Any 2 from: condensation uses two monomers / addition uses one (1) + condensation produces a small molecule (water) as a by-product / addition does not (1) + addition uses monomers with C=C bonds.' },

  { id: 'c7_t13', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', subtopic: 'C7.6', subtopic_name: 'Condensation Polymers', tier: 'T', exam_board: 'AQA',
    q: 'Describe the formation of **nylon** and **polyester** — monomers and bonds formed.',
