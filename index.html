function formatAIResponse(text) {
  if (!text) return '';
  return text
    .replace(/^### (.+)$/gm, '<div style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--ss-green);margin:10px 0 4px;">$1</div>')
    .replace(/^## (.+)$/gm, '<div style="font-size:15px;font-weight:800;color:var(--text);margin:10px 0 4px;">$1</div>')
    .replace(/^# (.+)$/gm, '<div style="font-size:17px;font-weight:900;margin:10px 0 6px;">$1</div>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<div style="display:flex;gap:8px;margin:3px 0;"><span style="color:var(--ss-green);font-weight:800;">&bull;</span><span>$1</span></div>')
    .replace(/^\* (.+)$/gm, '<div style="display:flex;gap:8px;margin:3px 0;"><span style="color:var(--ss-green);font-weight:800;">&bull;</span><span>$1</span></div>')
    .replace(/^\d+\. /gm, (m) => '<span style="font-weight:800;color:var(--ss-blue);">' + m + '</span>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

  return SAMPLE_CARDS.filter(c => {

    if (tier === 'combined_higher') return (c.tier === 'F' || c.tier === 'H') && !c.triple_only;

function getDueCards(user) {
  const cards = getCardsForUser(user);
  const progress = LS.get('card_progress') || {};
  const now = new Date();
  const today = new Date().toDateString();

  // Reset daily counts if new day
  const sessionState = LS.get('session_state') || {};
  if (sessionState.date !== today) {
    LS.set('session_state', { date: today, cardsStudied: 0 });
  }

  // Separate due reviews and new cards
  const due = [];
  const newCards = [];
  cards.forEach(c => {
    if (!progress[c.id]) {
      newCards.push(c);
    } else if (new Date(progress[c.id].nextReview) <= now) {
      due.push(c);
    }
  });

  // Pick up to 4 review cards and 6 new cards
  const reviewPick = due.slice(0, CONFIG.REVIEW_CARDS_PER_SESSION);
  const newSlots = Math.max(CONFIG.NEW_CARDS_PER_SESSION, CONFIG.CARDS_PER_SESSION - reviewPick.length);
  const newPick = newCards.slice(0, newSlots);
  const combined = [...reviewPick, ...newPick];

  // Group by topic so the session feels coherent
  // Find the most common topic in the combined set
  const topicCounts = {};
  combined.forEach(c => { topicCounts[c.topic] = (topicCounts[c.topic] || 0) + 1; });
  const primaryTopic = Object.entries(topicCounts).sort((a,b) => b[1]-a[1])[0]?.[0];

  // Put primary topic cards first
  if (primaryTopic) {
    combined.sort((a, b) => {
      if (a.topic === primaryTopic && b.topic !== primaryTopic) return -1;
      if (b.topic === primaryTopic && a.topic !== primaryTopic) return 1;
      return 0;
    });
  }

  return combined;
}

function getTodaysCardCount() {
  const sessionState = LS.get('session_state') || {};
  const today = new Date().toDateString();
  if (sessionState.date !== today) return 0;
  return sessionState.cardsStudied || 0;
}

function incrementCardCount() {
  const today = new Date().toDateString();
  const sessionState = LS.get('session_state') || { date: today, cardsStudied: 0 };
  if (sessionState.date !== today) {
    LS.set('session_state', { date: today, cardsStudied: 1 });
  } else {
    sessionState.cardsStudied = (sessionState.cardsStudied || 0) + 1;
    LS.set('session_state', sessionState);
  }
}

}

function flipCard() {
  if (STATE.flashcardFlipped) return;
  STATE.flashcardFlipped = true;
  document.getElementById('card-answer')?.classList.remove('hidden');
  document.getElementById('self-rate-area')?.classList.remove('hidden');
  document.getElementById('flip-hint')?.classList.add('hidden');
}

function selfGrade(cardId, grade) {
  recordGrade(cardId, grade);
  nextCard();
}

async function submitAIAnswer(cardId) {
  const card = STATE.cardQueue[STATE.currentCardIndex];
  const answer = document.getElementById('student-answer')?.value?.trim();
  if (!answer) { showToast('Please type an answer first'); return; }

  const timeSeconds = Math.round((Date.now() - STATE.pendingAnswerTime) / 1000);
  const btn = document.querySelector('.ai-answer-input .btn');
  if (btn) { btn.textContent = 'Grading...'; btn.disabled = true; }

  const result = await gradeAnswer(card.question, card.answer, answer, timeSeconds);

  const gradeNum = { 'again': 0, 'hard': 1, 'good': 2, 'easy': 3 }[result.grade] ?? 2;
  recordGrade(cardId, gradeNum);

  // Show feedback
  const feedbackArea = document.getElementById('ai-feedback-area');
  if (feedbackArea) {
    feedbackArea.classList.remove('hidden');
    feedbackArea.innerHTML = `
      <div class="ai-feedback">
        ${result.copy_paste_suspected ? '⚠️ Looks like a very fast answer — make sure you\'re really thinking it through! ' : ''}
        ${result.feedback}
      </div>
      <div class="flashcard" style="margin-top:0;">
        <div style="font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">Correct Answer</div>
        <div style="font-size:15px;font-weight:600;line-height:1.5;">${card.answer}</div>
      </div>
      <div class="grade-buttons">
        <button class="btn btn-grade-${result.grade}" style="flex:none;width:100%;" onclick="nextCard()">
          ${result.grade.toUpperCase()} — Next Card →
        </button>
      </div>`;

    // Hide AI input
    document.querySelector('.ai-answer-input')?.classList.add('hidden');
  }
}

function recordGrade(cardId, grade) {
  const progress = LS.get('card_progress') || {};
  const existing = progress[cardId] || {};
  progress[cardId] = { ...existing, ...sm2Next(existing, grade), cardId };
  LS.set('card_progress', progress);

  // Increment daily card count
  incrementCardCount();

  // Record history
  const card = STATE.cardQueue[STATE.currentCardIndex];
  const history = LS.get('card_history') || [];
  history.unshift({
    cardId, question: card?.question, subject: card?.subject,
    topic: card?.topic_name, grade, date: new Date().toISOString()
  });
  LS.set('card_history', history.slice(0, 200));
}

function nextCard() {
  STATE.currentCardIndex++;
  if (STATE.currentCardIndex >= STATE.cardQueue.length) {
    showSessionEnd();
  } else {
    renderFlashcard();
  }
}

let mcqState = {};
function renderMCQs() {
  mcqState = {};
  // Only use cards from the primary topic of this session
  const primaryTopic = STATE.cardQueue[0]?.topic;
  const topicCards = STATE.cardQueue.filter(c => c.topic === primaryTopic);
  const cards = topicCards.slice(0, 4);
  if (cards.length === 0) return '<p style="color:var(--text-secondary);font-weight:600;">No questions available</p>';

  return cards.map((card, i) => {
    // Get wrong options ONLY from same topic to avoid cross-subject confusion
    const sameTopicPool = SAMPLE_CARDS.filter(c => c.id !== card.id && c.topic === card.topic);
    const fallbackPool = SAMPLE_CARDS.filter(c => c.id !== card.id && c.subject === card.subject);
    const pool = sameTopicPool.length >= 3 ? sameTopicPool : fallbackPool;
    const others = pool.slice(0, 3).map(c => c.answer);
    const opts = shuffle([card.answer, ...others]);
    mcqState[`q${i}`] = { correct: card.answer, done: false };

    return `
<div style="margin-bottom:20px;">
  <div style="font-size:14px;font-weight:700;margin-bottom:10px;">${i+1}. ${card.question}</div>
  <div style="display:flex;flex-direction:column;gap:8px;" id="mcq-opts-${i}">
    ${opts.map(opt => `
      <button class="mcq-option" onclick="selectMCQ(${i}, '${escapeAttr(opt)}', '${escapeAttr(card.answer)}')">${opt}</button>
    `).join('')}
  </div>
</div>`;
  }).join('');
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function escapeAttr(str) {
  return str.replace(/'/g, "&#39;").replace(/"/g, '&quot;');
}

function selectMCQ(qIdx, selected, correct) {
  if (mcqState[`q${qIdx}`]?.done) return;
  const container = document.getElementById(`mcq-opts-${qIdx}`);
  if (!container) return;
  const isCorrect = selected === correct;
  container.querySelectorAll('.mcq-option').forEach(btn => {
    const text = btn.textContent.trim();
    if (text === correct) btn.classList.add('correct');
    else if (text === selected && !isCorrect) btn.classList.add('wrong');
    btn.disabled = true;
  });
  if (isCorrect) {
    mcqState[`q${qIdx}`].done = true;
    checkAllMCQsDone();
  }
}

function checkAllMCQsDone() {
  const allDone = Object.values(mcqState).every(s => s.done);
  if (allDone) {
    const btn = document.getElementById('continue-btn');
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.textContent = '🎉 All correct! Continue →';
    }
  }
}

function sendTutorFromInput() {

async function sendTutorMessage(message) {
  STATE.tutorHistory.push({ role: 'user', content: message });
  showAITutor();

  // Add loading indicator
  const chat = document.getElementById('tutor-chat');
  if (chat) {
    const loading = document.createElement('div');
    loading.className = 'chat-bubble ai loading';
    loading.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    loading.id = 'tutor-loading';
    chat.appendChild(loading);
    scrollChatToBottom();
  }

  // Build messages for Claude
  const messages = STATE.tutorHistory.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));

  try {
    const res = await fetch('https://sciencespark-worker.sciencespark.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: CONFIG.CLAUDE_MODEL,
        max_tokens: 600,
        system: TUTOR_SYSTEM,
        messages,
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || "Sorry, I couldn't get a response. Try again!";

    document.getElementById('tutor-loading')?.remove();
    STATE.tutorHistory.push({ role: 'ai', content: reply });
    showAITutor();
  } catch (e) {
    document.getElementById('tutor-loading')?.remove();
    // Offline fallback
    const fallback = "I'm having trouble connecting right now. Check that the Claude API key is configured and try again!";
    STATE.tutorHistory.push({ role: 'ai', content: fallback });
    showAITutor();
  }
}

function clearTutorChat() {
  STATE.tutorHistory = [];
  showAITutor();
}

function scrollChatToBottom() {
  const chat = document.getElementById('tutor-chat');
  if (chat) setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}

function copyParentCode(code) {
  const msg = `Hi! I'm using ScienceSpark for GCSE revision. You can track my progress using this code: ${code}. Download ScienceSpark and sign up as a parent, then enter this code.`;
  navigator.clipboard?.writeText(msg).then(() => showToast('Message copied to clipboard! 📋'));
}

function saveProfile() {
  const name = document.getElementById('edit-name')?.value?.trim();
  const board = document.getElementById('edit-board')?.value;
  const tier = document.getElementById('edit-tier')?.value;

  if (STATE.user) {
    STATE.user.display_name = name || STATE.user.display_name;
    STATE.user.exam_board = board;
    STATE.user.tier = tier;
    LS.set('demo_user', STATE.user);
  }
  showToast('Profile saved! ✓');
}

function doLogout() {
  STATE.user = null;
  STATE.role = null;
  STATE.tutorHistory = [];
  LS.del('demo_user');
  showAuth();
}

// ============================================================
// MODAL
// ============================================================
function showModal(content) {
  const existing = document.getElementById('modal-backdrop');
  if (existing) existing.remove();

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">${content}</div>`;
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.body.appendChild(backdrop);
}

function closeModal() {
  document.getElementById('modal-backdrop')?.remove();
}

// ============================================================
// INIT
// ============================================================
function init() {
  // Check for saved session
  const saved = LS.get('demo_user');
  if (saved) {
    STATE.user = saved;
    STATE.role = saved.role;
    afterLogin();
  } else {
    showAuth();
  }
}

// Start app
init();
</script>
