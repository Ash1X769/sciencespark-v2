  { id: 'b6_016', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', tier: 'H', exam_board: 'AQA',
    q: 'How do you **construct a Punnett square** for a monohybrid cross (Higher)?',
    a: ['Write parental **genotypes** and split alleles along top and left side of the 2×2 grid', 'Fill each box combining **column allele + row allele**', 'Heterozygous × heterozygous → **3:1** phenotype ratio; homozygous dominant × heterozygous → **1:1** ratio', 'For **sex-linked** traits use X^A/X^a symbols; for **codominance** both alleles are shown (e.g. C^R C^W)'],
    hint: 'Set up grid → fill boxes (column × row) → read genotype and phenotype ratios. 3:1 from Aa×Aa. 1:1 from Aa×aa. Sex-linked: use X^allele notation.',
    exam_q: 'A woman carrier for haemophilia (X^H X^h) has children with an unaffected man (X^H Y). What is the probability of a son having haemophilia? [3 marks]',
    examMarks: 3,
    examA: '1 mark: correct Punnett square (X^H and X^h from mother, X^H and Y from father). 1 mark: offspring X^H X^H, X^H X^h, X^H Y, X^h Y. 1 mark: probability son affected = 1 in 2 (50% of sons) / 25% overall.' },

  { id: 'b6_017', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', tier: 'H', exam_board: 'AQA',
    q: 'How do you **predict ratios and probabilities** from genetic crosses?',
    a: ['Each of the 4 Punnett square boxes = **25% probability**', 'Count boxes with each genotype: e.g. 1 TT + 2 Tt + 1 tt → 25% TT, 50% Tt, 25% tt', '**Phenotype probability**: count dominant phenotype boxes (TT + Tt) = 3 = 75%; recessive (tt) = 1 = 25% → **3:1 ratio**', '**Back-cross**: cross unknown genotype with homozygous recessive → all dominant offspring = parent was homozygous; 1:1 ratio = parent was heterozygous'],
    hint: '4 boxes = 4 equally likely outcomes. Each = 25%. 3:1 phenotype from Aa×Aa. Back-cross to aa reveals unknown genotype.',
    exam_q: 'A plant T? is crossed with tt. All offspring show the dominant phenotype. What is the parent\'s genotype? Explain. [2 marks]',
    examMarks: 2,
    examA: '1 mark: TT (homozygous dominant). 1 mark: if the plant were Tt, 50% of offspring would be recessive; all dominant offspring means the parent must be TT.' },

  { id: 'b6_018', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', tier: 'H', exam_board: 'AQA',
    q: 'How do you **interpret a family tree (pedigree diagram)** for an inherited condition?',
    a: ['Circles = females; squares = males; **filled** = affected; lines connect parents and offspring', 'Condition **skips generations** and ~25% affected → likely **recessive** (parents are carriers)', 'Condition in **every generation**, ~50% affected → likely **dominant**', 'Condition only in **males**, passed through unaffected females → likely **X-linked recessive**'],
    hint: 'Skips generations = recessive. Every generation = dominant. Only males, through females = X-linked. Use Punnett squares to verify predicted ratios.',
    exam_q: 'Two unaffected parents have an affected child. What does this tell you about the condition? Explain. [2 marks]',
    examMarks: 2,
    examA: '1 mark: the condition is recessive. 1 mark: dominant conditions require at least one affected parent / both parents are carriers (Ff×Ff) so recessive condition can appear.' },

  { id: 'b6_019', subject: 'Biology', topic: 'B6', topic_name: 'Inheritance, Variation and Evolution', tier: 'H', exam_board: 'AQA',
    q: 'Describe the detailed mechanism of **restriction enzymes, sticky ends and DNA ligase** in genetic engineering.',
    a: ['**Restriction enzymes** cut DNA at specific recognition sequences at **staggered positions** → leaving single-stranded **sticky ends**', 'The **same restriction enzyme** cuts both the donor gene and the **plasmid** → both have complementary sticky ends', 'Sticky ends of the gene and plasmid **join by complementary base pairing** (hydrogen bonds)', '**DNA ligase** seals the sugar-phosphate backbone → creates a stable **recombinant plasmid**'],
    hint: 'Restriction enzyme → cuts → sticky ends. Same enzyme on gene + plasmid → complementary ends. Sticky ends join (base pair). Ligase seals backbone. Recombinant DNA formed.',
    exam_q: 'Describe the role of restriction enzymes and DNA ligase in producing recombinant DNA. [4 marks]',
    examMarks: 4,
    examA: '1 mark: restriction enzymes cut DNA at specific sequences. 1 mark: leaving sticky ends (unpaired single-stranded bases). 1 mark: complementary sticky ends of gene and plasmid join by base pairing. 1 mark: DNA ligase seals the backbone / joins the fragments permanently.' },

    exam_q: 'Explain the role of nitrifying bacteria in the nitrogen cycle. [2 marks]',

  { id: 'c3_021', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', tier: 'F', exam_board: 'AQA',

  { id: 'c3_022', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', tier: 'F', exam_board: 'AQA',
    q: 'What is **concentration** in g/dm³ and how do you calculate it?',
    a: ['**Concentration (g/dm³) = mass of solute (g) ÷ volume of solution (dm³)**', 'Convert cm³ to dm³ first: divide by 1000 (e.g. 500 cm³ = 0.5 dm³)', 'Example: 4 g NaCl in 500 cm³ → c = 4 ÷ 0.5 = **8 g/dm³**', 'To find mass: mass = concentration × volume (in dm³)'],

  { id: 'c4_029', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'F', exam_board: 'AQA',
    q: 'How do you **deduce the formula of a salt** from the charges of its ions?',
    a: ['Write the **ions and their charges** (e.g. Ca²⁺ and SO₄²⁻)', 'The total positive charge must equal the total negative charge → **charges must balance**', 'Choose the simplest whole number ratio: Ca²⁺ + SO₄²⁻ → **CaSO₄** (1:1 balances 2+ and 2−)', 'Al³⁺ + Cl⁻ → **AlCl₃** (one Al³⁺ balances three Cl⁻); Mg²⁺ + OH⁻ → **Mg(OH)₂**'],
    hint: 'Balance the charges. Ca²⁺ + SO₄²⁻ = CaSO₄. Al³⁺ + 3Cl⁻ = AlCl₃. Mg²⁺ + 2OH⁻ = Mg(OH)₂. Use brackets for polyatomic ions.',

  { id: 'c5_014', subject: 'Chemistry', topic: 'C5', topic_name: 'Energy Changes', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 4** for measuring temperature changes in reactions.',
    a: ['Place a **polystyrene cup** in a beaker (as insulator); measure and record **initial temperature** of solution', 'Add the second reagent (e.g. acid + metal, acid + carbonate, or acid + alkali for neutralisation)', '**Stir** continuously; record the **highest** (exothermic) or **lowest** (endothermic) temperature reached', 'Calculate **temperature change** (ΔT = T_final − T_initial)', 'Control variables: volume of solution, concentration, starting temperature; repeat for reliability'],

  { id: 'c7_021', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', tier: 'F', exam_board: 'AQA',
    q: 'Write **balanced symbol equations for the complete combustion** of the first four alkanes.',
    a: ['**Methane**: CH₄ + 2O₂ → CO₂ + 2H₂O', '**Ethane**: C₂H₆ + 3½O₂ → 2CO₂ + 3H₂O', '**Propane**: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O', '**Butane**: C₄H₁₀ + 6½O₂ → 4CO₂ + 5H₂O', 'Method: balance **C** first (gives CO₂), then **H** (gives H₂O), then count **O**'],
    hint: 'CₙH₂ₙ₊₂ + O₂ → CO₂ + H₂O. Balance C first → CO₂. Then H → H₂O. Then count O atoms on right. CH₄+2O₂, C₂H₆+3.5O₂, C₃H₈+5O₂, C₄H₁₀+6.5O₂.',
    exam_q: 'Write a balanced equation for the complete combustion of propane (C₃H₈). [2 marks]',
    examMarks: 2,
    examA: '1 mark: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. 1 mark: fully balanced (all coefficients correct).' },

  { id: 'c10_020', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 8** for analysis and purification of water samples.',
    a: ['**pH test**: dip universal indicator paper into water sample; compare colour to chart to record pH', '**Dissolved solids test**: filter a sample then evaporate to dryness in an evaporating basin; weigh residue', '**Purification by distillation**: heat water sample in flask with thermometer; vapour passes through condenser; collect distillate in separate flask; pure water distils at 100°C', '**Compare**: distilled sample has no dissolved solids; check boiling point to confirm purity'],
    hint: 'pH: indicator paper. Dissolved solids: evaporate and weigh. Purification: distil at 100°C. Pure water: no residue, boils at exactly 100°C.',
    exam_q: 'Describe how you would test a water sample for dissolved solids and then purify it. [4 marks]',
    examMarks: 4,
    examA: '1 mark each: filter / evaporate to dryness / weigh residue to determine dissolved solids / purify by distillation / collect distillate at 100°C.' },

  { id: 'c4_030', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'F', exam_board: 'AQA',
    q: 'Describe the reaction of **calcium with water** and with **dilute acid**.',
    a: ['**Calcium + water**: Ca + 2H₂O → Ca(OH)₂ + H₂ — produces **calcium hydroxide** (a white cloudiness) and **hydrogen gas**; fizzes less vigorously than sodium', '**Calcium + dilute acid** (e.g. HCl): Ca + 2HCl → CaCl₂ + H₂ — produces **calcium chloride** salt and **hydrogen gas**', 'Calcium is less reactive than sodium but more reactive than magnesium'],
    hint: 'Ca + water → Ca(OH)₂ + H₂ (fizzes, white cloudiness). Ca + HCl → CaCl₂ + H₂. Less vigorous than Na but more than Mg.',
    exam_q: 'Write a word equation for calcium reacting with water. [1 mark]',
    examMarks: 1,
    examA: '1 mark: calcium + water → calcium hydroxide + hydrogen.' },

  { id: 'c4_031', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'F', exam_board: 'AQA',
    q: 'Explain **reactivity in the metal reactivity series** in terms of forming positive ions.',
    a: ['More reactive metals **lose electrons more easily** to form positive ions', 'The more readily a metal loses electrons → the higher it is in the reactivity series', 'Example: Na loses electrons very easily (Na → Na⁺ + e⁻) → very reactive; Cu loses electrons less readily → less reactive', 'Metals near the top of the series displace those below in solution because they more easily form ions'],
    hint: 'Reactivity = ease of losing electrons. Reactive metals → ions easily (high up reactivity series). Less reactive = less willing to form ions.',
    exam_q: 'Explain why sodium is more reactive than copper in terms of electrons. [2 marks]',
    examMarks: 2,
    examA: '1 mark: sodium loses electrons more easily than copper. 1 mark: sodium forms positive ions more readily / more easily oxidised.' },

  { id: 'c6_019', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate of Reaction', tier: 'F', exam_board: 'AQA',
    q: 'Explain the effect of **surface area to volume ratio** on rate of reaction.',
    a: ['When a solid is broken into **smaller pieces**, the **surface area increases** but total volume stays the same', '**SA:V ratio increases** → more surface exposed → **more reactant particles available** for collisions per unit volume', 'More frequent **collisions with greater probability** of reaction → **faster rate**', 'Example: powdered chalk reacts faster with HCl than a marble chip of the same mass'],
    hint: 'Smaller pieces → higher SA:Vol ratio → more surface exposed → more collisions per second → faster rate. Same mass, higher ratio = faster.',
    exam_q: 'Explain why powdered marble reacts faster with hydrochloric acid than marble chips of the same mass. [3 marks]',
    examMarks: 3,
    examA: '1 mark: powder has greater surface area to volume ratio. 1 mark: more acid particles can contact marble at once. 1 mark: more frequent collisions / faster rate of reaction.' },

  { id: 'c7_022', subject: 'Chemistry', topic: 'C7', topic_name: 'Organic Chemistry', tier: 'F', exam_board: 'AQA',

  { id: 'c9_018', subject: 'Chemistry', topic: 'C9', topic_name: 'Chemistry of the Atmosphere', tier: 'F', exam_board: 'AQA',

  { id: 'c10_021', subject: 'Chemistry', topic: 'C10', topic_name: 'Using Resources', tier: 'F', exam_board: 'AQA',

  { id: 'c1_038', subject: 'Chemistry', topic: 'C1', topic_name: 'Atomic Structure', tier: 'H', exam_board: 'AQA',
    q: 'How do you write a **balanced half equation**? Give the step-by-step method.',
    a: ['Write the species involved on each side (e.g. Cl₂ → Cl⁻)', 'Balance the **atoms** first (e.g. Cl₂ → 2Cl⁻)', 'Balance the **charge** by adding **electrons (e⁻)**: total charge on left must equal right', 'For **cathode (reduction)**: electrons are on the LEFT (e.g. 2H⁺ + 2e⁻ → H₂)', 'For **anode (oxidation)**: electrons are on the RIGHT (e.g. 2Cl⁻ → Cl₂ + 2e⁻)'],
    hint: 'Balance atoms → balance charge by adding e⁻. Cathode: e⁻ on left (reduction = REduction = Receives Electrons). Anode: e⁻ on right (oxidation = OIL).',
    exam_q: 'Write the half equation for the formation of hydrogen gas at the cathode during electrolysis. [2 marks]',
    examMarks: 2,
    examA: '1 mark: 2H⁺ + 2e⁻ → H₂. 1 mark: balanced (correct atoms and electrons, correct direction).' },

  { id: 'c4_032', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'H', exam_board: 'AQA',
    q: 'How do you write **ionic equations for metal displacement reactions**?',
    a: ['Write the full balanced equation (e.g. Zn + CuSO₄ → ZnSO₄ + Cu)', 'Split soluble ionic compounds into separate ions (spectator ions)', 'Remove **spectator ions** (ions that appear unchanged on both sides)', 'Write the **net ionic equation**: e.g. **Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)**', 'The oxidised species loses electrons (Zn → Zn²⁺); the reduced species gains electrons (Cu²⁺ → Cu)'],
    hint: 'Cancel spectators. Zn + Cu²⁺ → Zn²⁺ + Cu. Zn is oxidised (loses 2e⁻). Cu²⁺ is reduced (gains 2e⁻). State symbols matter.',
    exam_q: 'Write the ionic equation for the reaction of iron with copper(II) sulfate solution. [2 marks]',
    examMarks: 2,
    examA: '1 mark: Fe(s) + Cu²⁺(aq) → Fe²⁺(aq) + Cu(s). 1 mark: balanced with correct state symbols.' },

  { id: 'c4_033', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'H', exam_board: 'AQA',
    q: 'What is the difference between **dilute/concentrated** and **strong/weak** for acids?',
    a: ['**Dilute vs concentrated**: refers to the **amount of acid dissolved** in a given volume of solvent — a dilute acid has few moles of acid per dm³; a concentrated acid has many moles per dm³', '**Strong vs weak**: refers to the **degree of ionisation** — a strong acid (e.g. HCl) is **fully dissociated** into ions; a weak acid (e.g. CH₃COOH) is **partially dissociated**', 'A **concentrated weak acid** is possible (many acid molecules, but few dissociate): has low pH but not as low as strong acid at same concentration'],
    hint: 'Dilute/concentrated = how much acid per dm³. Strong/weak = how much dissociates. Strong: fully ionised. Weak: partially ionised. These are independent properties.',
    exam_q: 'Explain the difference between a dilute acid and a weak acid. [2 marks]',
    examMarks: 2,
    examA: '1 mark: dilute refers to the concentration (amount of solute per volume). 1 mark: weak refers to the degree of ionisation / partial dissociation of the acid.' },

  { id: 'c6_020', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate of Reaction', tier: 'H', exam_board: 'AQA',
    q: 'How do you **draw a tangent to a rate-of-reaction graph** and calculate the instantaneous rate?',
    a: ['At the required time point, draw a **straight line** that just touches the curve (tangent) without cutting through it', '**Extend the tangent** across a wide range to make calculation easier', 'Calculate the **gradient** of the tangent: gradient = rise ÷ run = (change in y) ÷ (change in x)', 'Units of rate: if y = volume (cm³) and x = time (s), then rate = **cm³/s**; if y = moles → rate in **mol/s**', 'Steeper tangent = faster rate at that moment'],
    hint: 'Tangent = straight line touching curve at one point. Gradient = rise/run. Units: (y units)/(x units) = cm³/s or g/s or mol/s. Steeper = faster rate.',
    exam_q: 'Describe how to use a tangent drawn to a concentration-time graph to find the rate of reaction at a specific time. [3 marks]',
    examMarks: 3,
    examA: '1 mark: draw tangent (straight line touching curve at that point). 1 mark: calculate gradient = rise ÷ run. 1 mark: state appropriate units (mol/s or mol/dm³/s or cm³/s).' },

  { id: 'c2_034', subject: 'Chemistry', topic: 'C2', topic_name: 'Bonding and Structure', tier: 'H', exam_board: 'AQA',
    q: 'What are the **limitations of the particle model** of matter?',
    a: ['The particle model **does not account for forces between particles** — it treats particles as independent, but in reality they attract and repel each other', 'Particles are assumed to have **no volume** — in practice, particles occupy space and this affects pressure/volume', 'The model **cannot explain** anomalous properties such as water **expanding** on freezing (instead of contracting like most substances)', 'It treats all particles as identical spheres — actual shapes and polarities affect properties'],
    hint: 'Limitations: ignores inter-particle forces, assumes zero particle volume, cannot explain why water expands on freezing, treats all particles as identical spheres.',
    exam_q: 'Give one limitation of the simple particle model of matter. [1 mark]',
    examMarks: 1,
    examA: '1 mark: any valid limitation — does not account for forces between particles / particles assumed to have no volume / cannot explain why water expands when it freezes.' },

  { id: 'c3_023', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', tier: 'H', exam_board: 'AQA',
    q: 'How do you **balance an equation from experimental masses** (working backwards from data)?',
    a: ['Given masses of reactants and products, **convert each mass to moles**: moles = mass ÷ Mr', 'Divide all mole values by the **smallest** value to get the simplest whole number ratio', 'Use this ratio as the **balancing coefficients** in the equation', 'Example: 56 g Fe reacts with 32 g S → moles Fe = 56/56 = 1; moles S = 32/32 = 1 → ratio 1:1 → Fe + S → FeS'],
    hint: 'Mass ÷ Mr = moles for each substance. Divide all by smallest mole value. Those numbers = balancing coefficients. Works backwards from real data.',
    exam_q: '4.0 g of calcium reacts with 3.2 g of oxygen. Find the simplest formula. (Ar: Ca=40, O=16) [3 marks]',
    examMarks: 3,
    examA: '1 mark: moles Ca = 4/40 = 0.1 mol; moles O = 3.2/16 = 0.2 mol. 1 mark: ratio Ca:O = 0.1:0.2 = 1:2. 1 mark: formula = CaO₂ / empirical formula CaO₂.' },

  { id: 'c3_024', subject: 'Chemistry', topic: 'C3', topic_name: 'Quantitative Chemistry', tier: 'H', exam_board: 'AQA',
    q: 'How do you identify **outliers** in titration and what are **concordant results**?',
    a: ['Perform the titration **at least three times** and record all titre values', 'An **outlier** (anomalous result) differs significantly from the others — typically by more than **0.10 cm³** from the others', '**Concordant results** are those that agree within **0.10 cm³** of each other', 'Calculate the **mean titre** using only concordant results (exclude the outlier)', 'First titration is a rough titre to estimate the endpoint; not used in calculating the mean'],
    hint: 'Do ≥3 titrations. Concordant = within 0.10 cm³ of each other. Outlier = more than 0.10 cm³ different. Mean = average of concordant only. First = rough.',
    exam_q: 'A student gets titres of 24.75, 24.80, 24.70, 25.40 cm³. Which is the outlier? Calculate the mean. [2 marks]',
    examMarks: 2,
    examA: '1 mark: 25.40 cm³ is the outlier (more than 0.10 cm³ from others). 1 mark: mean = (24.75 + 24.80 + 24.70) ÷ 3 = 24.75 cm³.' },

  { id: 'c4_034', subject: 'Chemistry', topic: 'C4', topic_name: 'Chemical Changes', tier: 'H', exam_board: 'AQA',
    q: 'How do you **identify the oxidised and reduced species** in a redox equation?',
    a: ['In **OIL RIG**: Oxidation Is Loss of electrons; Reduction Is Gain of electrons', 'Find species whose **oxidation state increases** → that species is **oxidised** (it is the reducing agent)', 'Find species whose **oxidation state decreases** → that species is **reduced** (it is the oxidising agent)', 'Example: Zn + Cu²⁺ → Zn²⁺ + Cu: Zn goes 0 → +2 (loses 2e⁻ → oxidised); Cu²⁺ goes +2 → 0 (gains 2e⁻ → reduced)'],
    hint: 'OIL RIG. Oxidation = charge goes up (loses electrons). Reduction = charge goes down (gains electrons). Oxidised species = reducing agent. Reduced species = oxidising agent.',
    exam_q: 'In the reaction Fe + Cu²⁺ → Fe²⁺ + Cu, identify which species is oxidised. Explain. [2 marks]',
    examMarks: 2,
    examA: '1 mark: iron (Fe) is oxidised. 1 mark: its oxidation state increases from 0 to +2 / it loses 2 electrons.' },

  { id: 'c6_021', subject: 'Chemistry', topic: 'C6', topic_name: 'Rate of Reaction', tier: 'H', exam_board: 'AQA',
    q: 'What units are used for **rate of reaction** when using moles, and how is rate expressed?',

  { id: 'b8_004', subject: 'Biology', topic: 'B8', topic_name: 'Exchange and Transport', tier: 'H', exam_board: 'AQA', q: 'What is the **transpiration stream**?', a: ['The movement of **water** through a plant', 'From **roots** to **stem** to **leaves** then **evaporates** through stomata', 'Driven by **evaporation** from leaves'], hint: 'Water pulled up from roots to replace what evaporates from leaves', exam_q: 'Describe the transpiration stream in plants. [2 marks]', examMarks: 2, examA: '1 mark: water moves from roots through stem to leaves. 1 mark: water evaporates through stomata.' },

  { id: 'b14_001', subject: 'Biology', topic: 'B14', topic_name: 'Hormones (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is the difference between **Type 1** and **Type 2** diabetes?', a: ['**Type 1**: pancreas produces **no insulin** — treated with **insulin injections**', '**Type 2**: body cells **do not respond** to insulin — linked to **obesity** — managed by diet'], hint: 'Type 1 = no insulin made. Type 2 = insulin ignored', exam_q: 'State two differences between Type 1 and Type 2 diabetes. [2 marks]', examMarks: 2, examA: '1 mark each: Type 1 no insulin produced / Type 2 cells resistant to insulin / different treatments.' },
  { id: 'b15_001', subject: 'Biology', topic: 'B15', topic_name: 'Inheritance (Triple)', tier: 'H', exam_board: 'AQA', q: 'How is **sex determined** in humans?', a: ['Females = **XX**, males = **XY**', '**Y chromosome** determines male sex', '50:50 chance of male or female offspring'], hint: 'XX = female. XY = male. Y from dad determines boy', exam_q: 'Explain how sex is determined in humans. [2 marks]', examMarks: 2, examA: '1 mark: females XX, males XY. 1 mark: Y chromosome determines male sex.' },
  { id: 'b15_002', subject: 'Biology', topic: 'B15', topic_name: 'Inheritance (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is **sex-linked inheritance**?', a: ['Gene located on the **X chromosome**', 'Males (XY) only have **one copy** — if they inherit the allele, they show the condition', 'Examples: **colour blindness**, **haemophilia**', 'More common in **males**'], hint: 'Gene on X. Males only have one X so one copy = condition shows', exam_q: 'Explain why sex-linked conditions are more common in males. [2 marks]', examMarks: 2, examA: '1 mark: gene on X chromosome. 1 mark: males only have one X / only need one copy to show condition.' },
  { id: 'c11_001', subject: 'Chemistry', topic: 'C11', topic_name: 'Rates of Reaction (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is **collision theory**?', a: ['Reactions occur when particles **collide** with **sufficient energy**', 'Minimum energy needed = **activation energy**', 'More frequent and more energetic collisions = **faster rate**'], hint: 'Particles must collide AND have enough energy', exam_q: 'Explain rate of reaction in terms of collision theory. [2 marks]', examMarks: 2, examA: '1 mark: particles must collide. 1 mark: must have sufficient energy / activation energy.' },
  { id: 'c11_002', subject: 'Chemistry', topic: 'C11', topic_name: 'Rates of Reaction (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is **dynamic equilibrium**?', a: ['Forward and reverse reaction rates are **equal**', 'Concentrations of reactants and products remain **constant**', 'Only reached in a **closed system**'], hint: 'Both reactions at same rate. Concentrations constant, not equal', exam_q: 'What is meant by dynamic equilibrium? [2 marks]', examMarks: 2, examA: '1 mark: forward and reverse reactions at equal rates. 1 mark: concentrations remain constant.' },
  { id: 'c12_001', subject: 'Chemistry', topic: 'C12', topic_name: 'Organic Chemistry (Triple)', tier: 'H', exam_board: 'AQA', q: 'What are **alcohols** — functional group and properties?', a: ['Contain an **-OH** functional group', 'Soluble in water, **flammable**', 'Used as **fuels** and **solvents**', 'First member: **methanol** (CH₃OH)'], hint: 'Alcohols end in -ol. OH group is the key', exam_q: 'What functional group is present in alcohols? [1 mark]', examMarks: 1, examA: '1 mark: -OH (hydroxyl group).' },
  { id: 'c12_002', subject: 'Chemistry', topic: 'C12', topic_name: 'Organic Chemistry (Triple)', tier: 'H', exam_board: 'AQA', q: 'How are **esters** made?', a: ['Reacting an **alcohol** with a **carboxylic acid**', 'Requires an **acid catalyst**', 'Also produces **water**', 'Used as **flavourings** and **perfumes**'], hint: 'Alcohol + carboxylic acid = ester + water. Sweet smells = esters', exam_q: 'How are esters formed? [2 marks]', examMarks: 2, examA: '1 mark: alcohol reacts with carboxylic acid. 1 mark: acid catalyst / produces water.' },
  { id: 'c13_001', subject: 'Chemistry', topic: 'C13', topic_name: 'Chemical Analysis (Triple)', tier: 'H', exam_board: 'AQA', q: 'What are the **flame test colours** for common metal ions?', a: ['**Li⁺**: crimson/red', '**Na⁺**: yellow/orange', '**K⁺**: lilac/purple', '**Ca²⁺**: orange-red', '**Cu²⁺**: blue-green'], hint: 'Little Suzy Kissed Copper Carelessly: Li=crimson, Na=yellow, K=lilac, Ca=orange-red, Cu=blue-green', exam_q: 'State the flame test colours for sodium and potassium ions. [2 marks]', examMarks: 2, examA: '1 mark: sodium = yellow/orange. 1 mark: potassium = lilac/purple.' },
  { id: 'c13_002', subject: 'Chemistry', topic: 'C13', topic_name: 'Chemical Analysis (Triple)', tier: 'H', exam_board: 'AQA', q: 'How do you test for **halide ions**?', a: ['Add **dilute nitric acid** then **silver nitrate** solution', '**Chloride**: white precipitate', '**Bromide**: cream precipitate', '**Iodide**: yellow precipitate'], hint: 'Silver nitrate test: White=Cl, Cream=Br, Yellow=I', exam_q: 'Describe how to test for chloride ions. [2 marks]', examMarks: 2, examA: '1 mark: add dilute nitric acid then silver nitrate. 1 mark: white precipitate formed.' },
  { id: 'c15_001', subject: 'Chemistry', topic: 'C15', topic_name: 'Equilibria (Triple)', tier: 'H', exam_board: 'AQA', q: 'How does **temperature** affect equilibrium position?', a: ['Increase temperature → shifts in **endothermic direction**', 'Decrease temperature → shifts in **exothermic direction**'], hint: 'Heat added = endothermic direction. Heat removed = exothermic direction', exam_q: 'Explain how increasing temperature affects an exothermic reaction at equilibrium. [2 marks]', examMarks: 2, examA: '1 mark: equilibrium shifts in endothermic direction. 1 mark: yield of products decreases.' },
  { id: 'c16_001', subject: 'Chemistry', topic: 'C16', topic_name: 'Electrode Processes (Triple)', tier: 'H', exam_board: 'AQA', q: 'What are the products of **electrolysis of brine**?', a: ['**Chlorine gas** at the anode', '**Hydrogen gas** at the cathode', '**Sodium hydroxide** solution remains'], hint: 'Brine gives Cl2 + H2 + NaOH. Three useful products', exam_q: 'State the three products of the electrolysis of brine. [3 marks]', examMarks: 3, examA: '1 mark each: chlorine gas / hydrogen gas / sodium hydroxide solution.' },
  { id: 'p8_001', subject: 'Physics', topic: 'P8', topic_name: 'Space (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is the **life cycle of a star** like our Sun?', a: ['**Nebula** → **protostar** → **main sequence star** → **red giant** → **white dwarf** → **black dwarf**'], hint: 'Our Sun is in main sequence. After: red giant, white dwarf, black dwarf', exam_q: 'Describe the life cycle of a star similar in size to our Sun. [3 marks]', examMarks: 3, examA: '1 mark each: nebula/protostar / main sequence / red giant / white dwarf / black dwarf (in order).' },
  { id: 'p8_002', subject: 'Physics', topic: 'P8', topic_name: 'Space (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is the **life cycle of a massive star**?', a: ['**Nebula** → **protostar** → **main sequence** → **red supergiant** → **supernova** → **neutron star** or **black hole**'], hint: 'Massive stars end dramatically — supernova then neutron star or black hole', exam_q: 'Describe the life cycle of a star much more massive than our Sun. [3 marks]', examMarks: 3, examA: '1 mark each: main sequence / red supergiant / supernova / neutron star or black hole (in order).' },
  { id: 'p8_003', subject: 'Physics', topic: 'P8', topic_name: 'Space (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is the evidence for the **Big Bang theory**?', a: ['**Red shift** — distant galaxies moving away, light shifted towards red', '**Cosmic microwave background radiation (CMBR)** — afterglow of the Big Bang'], hint: 'Red shift = galaxies moving away. CMBR = leftover heat from Big Bang', exam_q: 'State two pieces of evidence for the Big Bang theory. [2 marks]', examMarks: 2, examA: '1 mark each: red shift of distant galaxies / cosmic microwave background radiation.' },
  { id: 'p9_001', subject: 'Physics', topic: 'P9', topic_name: 'Forces (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is the **principle of moments**?', a: ['For an object in **equilibrium**: sum of **clockwise moments** = sum of **anticlockwise moments**', '**Moment = force × perpendicular distance** from pivot (Nm)'], hint: 'Balanced seesaw: clockwise = anticlockwise moments', exam_q: 'State the principle of moments. [1 mark]', examMarks: 1, examA: '1 mark: sum of clockwise moments = sum of anticlockwise moments.' },
  { id: 'p9_002', subject: 'Physics', topic: 'P9', topic_name: 'Forces (Triple)', tier: 'H', exam_board: 'AQA', q: "What is **Hooke's Law** and the formula?", a: ['**Extension** is directly proportional to **force** applied', '**F = ke** — k = spring constant (N/m), e = extension (m)', 'Only applies up to the **limit of proportionality**'], hint: 'F = ke. Double force = double extension. Until you stretch too far', exam_q: "State Hooke's Law and write the formula. [2 marks]", examMarks: 2, examA: '1 mark: extension proportional to force. 1 mark: F = ke.' },
  { id: 'p10_001', subject: 'Physics', topic: 'P10', topic_name: 'Waves (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is **refraction** and why does it occur?', a: ['**Bending** of waves at boundary between two media', 'Caused by a change in **wave speed**', 'Slows down → bends **towards normal**. Speeds up → bends **away from normal**'], hint: 'Light slows in glass = bends towards normal. Speeds up leaving = bends away', exam_q: 'Explain why refraction occurs when light passes from air into glass. [2 marks]', examMarks: 2, examA: '1 mark: light slows down. 1 mark: change in speed causes change in direction / bends towards normal.' },
  { id: 'p10_002', subject: 'Physics', topic: 'P10', topic_name: 'Waves (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is **total internal reflection**?', a: ['When light hits a boundary at an angle **greater than** the **critical angle**', 'All light is **reflected back** — none passes through', 'Used in **optical fibres**'], hint: 'Past critical angle = all reflected. Optical fibres and diamonds use this', exam_q: 'Explain what is meant by total internal reflection. [2 marks]', examMarks: 2, examA: '1 mark: angle greater than critical angle. 1 mark: all light reflected / none transmitted.' },
  { id: 'p11_001', subject: 'Physics', topic: 'P11', topic_name: 'Magnetism (Triple)', tier: 'H', exam_board: 'AQA', q: 'How does an **electric motor** work?', a: ['**Current-carrying coil** in a **magnetic field**', 'Forces on opposite sides of coil act in **opposite directions** → **rotation**', '**Split-ring commutator** reverses current every half turn to keep rotation continuous'], hint: 'Current + field = force. Opposite sides spin the coil. Commutator keeps it going', exam_q: 'Explain how a simple electric motor works. [3 marks]', examMarks: 3, examA: '1 mark each: current-carrying coil in field / forces in opposite directions / coil rotates / commutator reverses current.' },
  { id: 'p12_001', subject: 'Physics', topic: 'P12', topic_name: 'Nuclear Physics (Triple)', tier: 'H', exam_board: 'AQA', q: 'What happens in **alpha decay**?', a: ['Nucleus emits an **alpha particle** (2 protons + 2 neutrons)', '**Mass number −4**, **atomic number −2**', 'A new element is formed'], hint: 'Alpha decay: lose 4 mass, lose 2 atomic number. Ejects helium nucleus', exam_q: 'Describe what happens to the nucleus during alpha decay. [2 marks]', examMarks: 2, examA: '1 mark: emits alpha particle. 1 mark: mass number -4, atomic number -2.' },
  { id: 'p12_002', subject: 'Physics', topic: 'P12', topic_name: 'Nuclear Physics (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is a **chain reaction** in nuclear fission?', a: ['**Uranium-235** absorbs a neutron and splits', 'Releases **energy** and **2-3 more neutrons**', 'These cause **further fission** — self-sustaining', 'Controlled in **nuclear reactors**, uncontrolled = **explosion**'], hint: 'One split gives neutrons that cause more splits. Exponential. Controlled in reactors', exam_q: 'Explain what is meant by a chain reaction in nuclear fission. [3 marks]', examMarks: 3, examA: '1 mark each: fission releases neutrons / neutrons cause further fission / self-sustaining / exponential increase.' },
  { id: 'p13_001', subject: 'Physics', topic: 'P13', topic_name: 'Particle Physics (Triple)', tier: 'H', exam_board: 'AQA', q: 'What is **antimatter**?', a: ['Every particle has a corresponding **antiparticle** — same mass, **opposite charge**', 'When particle meets antiparticle they **annihilate** — releasing **gamma rays**', 'Example: **positron** is the antiparticle of the electron'], hint: 'Antiparticle = same mass, opposite charge. Meet = annihilate = energy', exam_q: 'What happens when a particle meets its antiparticle? [2 marks]', examMarks: 2, examA: '1 mark: they annihilate. 1 mark: energy/gamma rays released.' },

  { id: 'p1_020', subject: 'Physics', topic: 'P1', topic_name: 'Energy', tier: 'F', exam_board: 'AQA',
    q: 'State the **elastic potential energy equation** (Ee = ½ke²) and define each term.',
    a: ['**Ee = ½ke²** where: Ee = elastic potential energy stored (J); k = spring constant (N/m); e = extension or compression (m)', '**k** measures the stiffness of the spring — a higher k means a stiffer spring', 'The equation also equals the **work done** in stretching/compressing the spring (assuming elastic deformation)', 'Units: if k in N/m and e in m → Ee in joules (J)'],
    hint: 'Ee = ½ke². k = spring constant (N/m). e = extension (m). Result in joules. Only valid within the limit of proportionality.',
    exam_q: 'A spring with spring constant 40 N/m is extended by 0.05 m. Calculate the elastic PE stored. [2 marks]',
    examMarks: 2,
    examA: '1 mark: Ee = ½ × 40 × (0.05)². 1 mark: = ½ × 40 × 0.0025 = 0.05 J.' },

  { id: 'p2_019', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'What are the **standard circuit symbols** you need to know?',
    a: ['**Cell**: one long and one short line (+ and −). **Battery**: multiple cells in series', '**Switch** (open): gap in line; **switch** (closed): line connects', '**Fixed resistor**: rectangle; **variable resistor**: rectangle with arrow through it', '**Lamp**: circle with X inside; **LED**: triangle with arrow pointing right with two arrows out (light emitting)', '**Ammeter**: circle with A (connected in series); **voltmeter**: circle with V (connected in parallel)', '**Diode**: triangle pointing right with bar. **Fuse**: rectangle. **Thermistor**: rectangle with T. **LDR**: rectangle with arrows pointing in'],
    hint: 'Cell (one short/long line). Resistor (rectangle). Lamp (circle X). Ammeter A (series). Voltmeter V (parallel). Thermistor = resistor + T. LDR = resistor + arrows in.',
    exam_q: 'Draw the circuit symbol for: (a) a thermistor (b) an LDR. [2 marks]',
    examMarks: 2,
    examA: '1 mark each: thermistor = resistor symbol (rectangle) with T above / LDR = resistor symbol with arrows pointing toward it (indicating light).' },

  { id: 'p2_020', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 15** for investigating what affects resistance.',
    a: ['**Effect of wire length**: connect a length of resistance wire to a circuit with ammeter and voltmeter; measure current (A) and voltage (V); calculate R = V/I; change length and repeat', '**Series and parallel combinations**: build circuits with different numbers/arrangements of resistors; measure total resistance each time', 'Control variables: temperature, wire diameter/material, voltage; repeat readings for reliability', '**Result**: longer wire → greater resistance; more resistors in series → greater resistance; more in parallel → lower resistance'],
    hint: 'RP15: measure R=V/I for different wire lengths (longer → higher R) and for series/parallel combinations. Control temperature and wire material.',
    exam_q: 'Describe how to investigate how wire length affects resistance. [4 marks]',
    examMarks: 4,
    examA: '1 mark each: set up circuit with ammeter in series and voltmeter in parallel / measure V and I for different wire lengths / calculate R = V/I each time / keep temperature and wire material constant.' },

  { id: 'p2_021', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Describe how a **thermistor** works and how it is used in a **thermostat**.',
    a: ['A **thermistor** is a component whose **resistance decreases as temperature increases** (most common type: NTC — negative temperature coefficient)', 'At high temperature: low resistance → high current flows. At low temperature: high resistance → low current flows', 'In a **thermostat circuit**: as temperature rises → thermistor resistance falls → voltage across it falls → this change is used to switch off a heater', '**Uses**: thermostats in central heating, temperature sensors in electronic devices, fire alarms'],
    hint: 'Thermistor: hotter → resistance falls. NTC = Negative Temperature Coefficient. In thermostat: low resistance at high temp → sensor detects warmth → heater switches off.',
    exam_q: 'Describe the relationship between temperature and resistance for a thermistor. [2 marks]',
    examMarks: 2,
    examA: '1 mark: as temperature increases, resistance decreases. 1 mark: this is a non-linear relationship / the component has a negative temperature coefficient.' },

  { id: 'p2_022', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Describe how an **LDR (light-dependent resistor)** works and give an application.',
    a: ['An **LDR** is a component whose **resistance decreases as light intensity increases**', 'In bright light: low resistance → high current. In dim light: high resistance → low current', '**In automatic lighting circuits**: in darkness, LDR resistance is high → voltage across LDR is high → circuit detects this and **switches on the light**; in daylight, resistance falls, voltage falls, light switches off', '**Other uses**: camera light meters, automatic street lights, burglar alarms'],
    hint: 'LDR: brighter → resistance falls. Dark → high resistance → circuit activates. Automatic street lights: dark → LDR high R → light turns on. Bright → low R → light stays off.',
    exam_q: 'Explain how an LDR could be used in an automatic street lighting circuit. [3 marks]',
    examMarks: 3,
    examA: '1 mark: in darkness LDR has high resistance. 1 mark: high resistance gives high voltage across LDR / triggers switching circuit. 1 mark: light switches on / as it gets light the resistance falls and the lamp switches off.' },

  { id: 'p2_023', subject: 'Physics', topic: 'P2', topic_name: 'Electricity', tier: 'F', exam_board: 'AQA',
    q: 'Why is the **live wire dangerous** even when a switch is open? What happens when live wire touches earth?',
    a: ['The **live wire** is at 230 V (alternating, dangerous voltage) relative to earth — this is maintained by the power station **even when the switch is open**', 'The switch interrupts the **circuit path** but does NOT disconnect the live wire from its source of voltage', 'If the switch is in the **neutral wire** instead of the live, the appliance is disconnected from current flow but the live wire terminal is still at 230 V → touching it causes **electric shock** or **death**', 'If live wire touches **earth**: huge current flows → fuse blows or circuit breaker trips → circuit disconnected for safety'],
    hint: 'Live wire = always at 230 V (even switch open). Switch in circuit breaks current flow, not the live voltage. Live + earth = short circuit → massive current → fuse blows.',
    exam_q: 'Explain why the live wire is dangerous even when the switch in a circuit is open. [2 marks]',
    examMarks: 2,
    examA: '1 mark: the live wire remains at 230 V even when the switch is open. 1 mark: contact with the live wire can cause electric shock / the switch interrupts current flow but not the voltage on the live wire.' },

  { id: 'p3_015', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 17** for measuring density of regular, irregular, and liquid samples.',
    a: ['**Regular solid** (e.g. cuboid): measure dimensions with ruler/callipers (length l, width w, height h); volume V = l × w × h; weigh on balance; ρ = m/V', '**Irregular solid** (e.g. rock): weigh on balance; fill measuring cylinder with water; submerge solid; volume = increase in water level (displacement)', '**Liquid**: use a measuring cylinder to measure volume; weigh empty container then container + liquid; mass of liquid = difference; ρ = m/V', 'All densities in g/cm³ or kg/m³'],
    hint: 'Regular: measure dimensions → V = l×w×h. Irregular: displace water → V = water rise. Liquid: measure volume in cylinder; weigh. ρ = m/V for all.',
    exam_q: 'Describe how to find the density of an irregularly shaped stone. [3 marks]',
    examMarks: 3,
    examA: '1 mark: measure mass using balance. 1 mark: partially fill measuring cylinder with water; record volume. 1 mark: lower stone in; volume = new reading minus old reading; density = mass ÷ volume.' },

  { id: 'p3_016', subject: 'Physics', topic: 'P3', topic_name: 'Particle Model', tier: 'F', exam_board: 'AQA',
    q: 'Describe the required practical to **measure latent heat of fusion** for water (ice).',
    a: ['Set up crushed ice in a **funnel** over a beaker; connect an **immersion heater** (known power P) to melt the ice; collect melt water', 'Record the **mass of water collected** (m) over a known time (t): energy supplied E = P × t', 'Control experiment: set up identical funnel without heater to measure water collected by natural melting (subtract from total)', 'Calculate **Lf = E/m** = (P × t) / m. Units: J/kg', 'Or plot E against m: gradient = Lf'],
    hint: 'Heater in ice → melt water collected. E = Pt. Subtract control (no heater). Lf = E/m = Pt/m. Or: gradient of E vs m graph = Lf.',
    exam_q: 'A 50 W heater melts 0.025 kg of ice in 5 minutes. Calculate the specific latent heat of fusion. [3 marks]',
    examMarks: 3,
    examA: '1 mark: E = 50 × 300 = 15 000 J. 1 mark: Lf = E/m = 15 000 ÷ 0.025. 1 mark: = 600 000 J/kg.' },

  { id: 'p4_016', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'F', exam_board: 'AQA',
    q: 'Define **atomic number**, **mass number** and **isotopes**.',
    a: ['**Atomic number** (proton number): the number of **protons** in the nucleus; defines which element it is; equal to the number of electrons in a neutral atom', '**Mass number** (nucleon number): the total number of **protons + neutrons** in the nucleus', '**Number of neutrons** = mass number − atomic number', '**Isotopes**: atoms of the **same element** (same atomic number) but with **different numbers of neutrons** (different mass numbers). Example: carbon-12 and carbon-14 are isotopes'],
    hint: 'Atomic number = protons (= electrons in neutral atom). Mass number = protons + neutrons. Neutrons = mass − atomic. Isotopes = same protons, different neutrons.',
    exam_q: 'Carbon-12 has atomic number 6. State the number of protons and neutrons. [2 marks]',
    examMarks: 2,
    examA: '1 mark: protons = 6. 1 mark: neutrons = 12 − 6 = 6.' },

  { id: 'p4_017', subject: 'Physics', topic: 'P4', topic_name: 'Atomic Structure', tier: 'F', exam_board: 'AQA',
    q: 'Write **balanced nuclear equations** for alpha and beta decay.',
    a: ['**Alpha decay** (⁴₂α): mass number decreases by 4; atomic number decreases by 2. Example: ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He', '**Beta decay** (⁰₋₁β): mass number unchanged; atomic number increases by 1 (a neutron converts to proton + electron). Example: ¹⁴₆C → ¹⁴₇N + ⁰₋₁e', 'Check: **top numbers** (mass) must balance on both sides; **bottom numbers** (atomic number) must balance', 'Nuclear equations always have both numbers: superscript = mass number, subscript = atomic number'],
    hint: 'Alpha: -4 mass, -2 atomic. Beta: 0 mass, +1 atomic. Top numbers balance. Bottom numbers balance. Alpha particle = ⁴₂He. Beta particle = ⁰₋₁e.',
    exam_q: 'Complete the nuclear equation for alpha decay: ²²⁶₈₈Ra → ? + ⁴₂He. [2 marks]',
    examMarks: 2,
    examA: '1 mark: correct mass number = 226 − 4 = 222. 1 mark: correct atomic number = 88 − 2 = 86, so ²²²₈₆Rn.' },

  { id: 'p5_022', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'State the equation **v² = u² + 2as** and explain when to use it.',
    a: ['**v² = u² + 2as** where: v = final velocity (m/s); u = initial velocity (m/s); a = acceleration (m/s²); s = distance/displacement (m)', 'Use when you know or want to find **velocity, initial speed, acceleration, and distance** but do NOT know the time', 'If object starts from rest: u = 0 → v² = 2as', 'Rearrangements: a = (v² − u²) ÷ 2s; s = (v² − u²) ÷ 2a'],
    hint: 'v² = u² + 2as. Use when time is unknown. u=0 (from rest) → v²=2as. Rearrange: a=(v²-u²)/2s, s=(v²-u²)/2a.',
    exam_q: 'A car accelerates from 10 m/s to 30 m/s over 200 m. Calculate the acceleration. [3 marks]',
    examMarks: 3,
    examA: '1 mark: v² = u² + 2as → 900 = 100 + 2a(200). 1 mark: 800 = 400a. 1 mark: a = 2 m/s².' },

  { id: 'p5_023', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 18** for investigating the force-extension relationship for a spring.',
    a: ['Set up a **clamp stand** with a spring hanging vertically; attach a **pointer** to the bottom of the spring and a ruler alongside', 'Add masses one at a time (e.g. 100 g each); record the **extension** (final length − original length) for each mass', 'Calculate **force** = mass × g (N); plot **force (N)** on y-axis vs **extension (m)** on x-axis', 'Below the **limit of proportionality**: straight line through origin (Hooke\'s Law obeyed)', 'Spring constant k = gradient of the straight-line section'],
    hint: 'Clamp stand. Hang spring. Add masses. Measure extension each time. Plot F vs extension. Straight line = Hooke\'s Law. k = gradient. Kink = limit of proportionality.',
    exam_q: 'Describe how to investigate the relationship between force and extension of a spring. [4 marks]',
    examMarks: 4,
    examA: '1 mark each: clamp spring vertically / add masses and record extension for each / calculate force = mg / plot force vs extension / identify limit of proportionality / spring constant = gradient of linear section.' },

  { id: 'p5_024', subject: 'Physics', topic: 'P5', topic_name: 'Forces', tier: 'F', exam_board: 'AQA',
    q: 'Describe the **Required Practical 19** for investigating Newton\'s Second Law (F = ma).',

// ============================================================
// SRS SCHEDULING
// ============================================================
function sm2Next(card, grade) {
  // grade: 0=again, 1=hard, 2=good, 3=easy
  // repetitions always increments — never resets, it's a record of how many times seen
  let { repetitions = 0, easyCount = 0 } = card;

  let interval;
  if (grade === 0 || grade === 1) {
    interval = 1;
  } else if (grade === 2) {
    interval = 3;
  } else {
    // Easy: 7 days first time, 28 days every time after
    interval = easyCount === 0 ? 7 : 28;
    easyCount++;
  }

  repetitions++;

  const nextReview = new Date();
  nextReview.setDate(nextReview.getDate() + interval);

  return { repetitions, easyCount, interval, nextReview: nextReview.toISOString(), lastGrade: grade };
}

// ============================================================
// SUPABASE CLIENT (lightweight)
// ============================================================
const SB = {
  async request(path, method='GET', body=null, token=null) {
    const headers = {
      'Content-Type': 'application/json',
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${token || CONFIG.SUPABASE_ANON_KEY}`,
    };
    const res = await fetch(`${CONFIG.SUPABASE_URL}${path}`, {
      method,
      headers,
      body: body ? JSON.stringify(body) : null,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || 'Supabase error');
    }
    return res.json().catch(() => null);
  },

  async authRequest(path, body) {
    const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1${path}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': CONFIG.SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(body),
    });
    return res.json();
  },

  async signUp(email, password, meta) {
    return this.authRequest('/signup', { email, password, data: meta });
  },

  async signIn(email, password) {
    return this.authRequest('/token?grant_type=password', { email, password });
  },

  async getUser(token) {
    const res = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/user`, {
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` }
    });
    return res.json();
  },

  async select(table, filter='', token=null) {
    return this.request(`/rest/v1/${table}?${filter}&select=*`, 'GET', null, token).catch(() => []);
  },

  async insert(table, data, token=null) {
    return this.request(`/rest/v1/${table}`, 'POST', data, token);
  },

  async update(table, filter, data, token=null) {
    return this.request(`/rest/v1/${table}?${filter}`, 'PATCH', data, token);
  },

  async upsert(table, data, token=null) {
    return this.request(`/rest/v1/${table}?on_conflict=id`, 'POST', {...(Array.isArray(data)?data[0]:data)}, token);
  }
};

        model: CONFIG.CLAUDE_MODEL,
        max_tokens: maxTokens,
        system: systemPrompt,
        messages: [{ role: 'user', content: userMessage }],
      })
    });
    const data = await res.json();
    return data.content?.[0]?.text || '';
  } catch (e) {
    console.error('Claude API error:', e);
    return null;
  }
}

async function gradeAnswer(question, correctAnswer, studentAnswer, timeSeconds) {
  const system = `You are a strict AQA GCSE science marker. Grade the student's answer by counting what percentage of the key concepts from the correct answer are present.
STRICT RULES:
- Count how many key concepts from the correct answer appear in the student's answer
- 0-25% of key concepts present → "again"
- 26-49% of key concepts present → "hard"
- 50-99% of key concepts present → "good"
- 100% of key concepts present → "easy" (spelling mistakes are fine, all concepts must be there)
- "I don't know", blank answers, or single words always = "again" (0%)
- Consider time: under 3 seconds = likely copy-paste, flag it
- Return ONLY valid JSON: {"grade": "again"|"hard"|"good"|"easy", "feedback": "brief specific feedback under 20 words", "copy_paste_suspected": boolean}`;

  const userMsg = `Question: ${question}
Correct answer: ${correctAnswer}
Student's answer: ${studentAnswer}
Time taken: ${timeSeconds} seconds`;

  const raw = await callClaude(system, userMsg, 200);
  try {
    return JSON.parse(raw);
  } catch {
    return { grade: 'good', feedback: 'Good effort!', copy_paste_suspected: false };
  }
}

function formatAIResponse(text) {
  if (!text) return '';
  return text
    .replace(/^### (.+)$/gm, '<div style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--ss-green);margin:10px 0 4px;">$1</div>')
    .replace(/^## (.+)$/gm, '<div style="font-size:15px;font-weight:800;color:var(--text);margin:10px 0 4px;">$1</div>')
    .replace(/^# (.+)$/gm, '<div style="font-size:17px;font-weight:900;margin:10px 0 6px;">$1</div>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<div style="display:flex;gap:8px;margin:3px 0;"><span style="color:var(--ss-green);font-weight:800;">&bull;</span><span>$1</span></div>')
    .replace(/^\* (.+)$/gm, '<div style="display:flex;gap:8px;margin:3px 0;"><span style="color:var(--ss-green);font-weight:800;">&bull;</span><span>$1</span></div>')
    .replace(/^\d+\. /gm, (m) => '<span style="font-weight:800;color:var(--ss-blue);">' + m + '</span>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function generateCode(len=6) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I/L to avoid confusion
  let code = '';
  for (let i = 0; i < len; i++) code += chars[Math.floor(Math.random() * chars.length)];

}

function formatTime(secs) {
  const m = Math.floor(secs/60).toString().padStart(2,'0');
  const s = (secs%60).toString().padStart(2,'0');

}

function bold(t) {
  return (t || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function fmtMs(ans) {
  if (!ans) return '';
  // Parse "N mark(s) [each]: text. N mark(s): text." format
  const rawParts = ans.split(/\.\s+(?=\d+\s+mark)/i);
  const points = rawParts.map(part => {
    const m = part.match(/^(\d+)\s+marks?\s*(?:each)?\s*:\s*(.*)/i);
    if (!m) return null;
    return { marks: parseInt(m[1]), text: m[2].trim().replace(/\.$/, '') };
  }).filter(Boolean);
  if (points.length === 0) {
    return '<div style="font-size:13px;font-weight:700;color:var(--text);">' + bold(ans) + '</div>';
  }
  return points.map((p, i, arr) => {
    const label = p.marks === 1 ? '(1 mark)' : '(' + p.marks + ' marks)';
    const bdr = i < arr.length - 1 ? 'border-bottom:1px solid #F0F4F8;' : '';
    return '<div style="padding:5px 0;' + bdr + 'font-size:13px;font-weight:700;color:var(--text);line-height:1.5;">'
      + bold(p.text) + '. <span style="color:#6366F1;font-weight:800;">' + label + '</span></div>';
  }).join('');
}

function tierLabel(tier) {

function getCardsForUser(user) {
  const tier = user?.tier || 'combined_foundation';
  return SAMPLE_CARDS.filter(c => {
    if (tier === 'combined_foundation') return c.tier === 'F' && !c.triple_only;
    if (tier === 'combined_higher') return (c.tier === 'F' || c.tier === 'H') && !c.triple_only;
    if (tier === 'triple_foundation') return (c.tier === 'F' || c.tier === 'H' || c.tier === 'triple_F');
    return true; // triple_higher: all cards
  });
}

function getDueCards(user) {
  const allCards = getCardsForUser(user);
  // Free tier: restrict to primary subject only
  const cards = user.is_paid ? allCards : allCards.filter(c => c.subject === (user.primary_subject || 'Biology'));
  const progress = LS.get('card_progress') || {};
  const now = new Date();
  const today = new Date().toDateString();

  // Reset daily counts if new day
  const sessionState = LS.get('session_state') || {};
  if (sessionState.date !== today) {
    LS.set('session_state', { date: today, cardsStudied: 0 });
  }

  // Separate due reviews and new cards
  const due = [];
  const newCards = [];
  cards.forEach(c => {
    if (!progress[c.id]) {
      newCards.push(c);
    } else if (new Date(progress[c.id].nextReview) <= now) {
      due.push(c);
    }
  });

  // Pick up to 4 review cards and 6 new cards
  const reviewPick = due.slice(0, CONFIG.REVIEW_CARDS_PER_SESSION);
  // Always give new users cards - default 6 new cards per session
  const newSlots = Math.max(CONFIG.NEW_CARDS_PER_SESSION, CONFIG.CARDS_PER_SESSION - reviewPick.length);
  const newPick = newCards.slice(0, newSlots);
  const combined = [...reviewPick, ...newPick];

  // Group by topic so the session feels coherent
  // Find the most common topic in the combined set
  const topicCounts = {};
  combined.forEach(c => { topicCounts[c.topic] = (topicCounts[c.topic] || 0) + 1; });
  const primaryTopic = Object.entries(topicCounts).sort((a,b) => b[1]-a[1])[0]?.[0];

  // Put primary topic cards first
  if (primaryTopic) {
    combined.sort((a, b) => {
      if (a.topic === primaryTopic && b.topic !== primaryTopic) return -1;
      if (b.topic === primaryTopic && a.topic !== primaryTopic) return 1;
      return 0;
    });
  }

  return combined;
}

function getTodaysCardCount() {
  const sessionState = LS.get('session_state') || {};
  const today = new Date().toDateString();
  if (sessionState.date !== today) return 0;
  return sessionState.cardsStudied || 0;
}

function incrementCardCount() {
  const today = new Date().toDateString();
  const sessionState = LS.get('session_state') || { date: today, cardsStudied: 0 };
  if (sessionState.date !== today) {
    LS.set('session_state', { date: today, cardsStudied: 1 });
  } else {
    sessionState.cardsStudied = (sessionState.cardsStudied || 0) + 1;
    LS.set('session_state', sessionState);
  }
}

  } else {
    const rawMsg = res.msg || res.error_description || (typeof res.error === 'string' ? res.error : '') || 'Signup failed';
    showSignupError(friendlyAuthError(rawMsg));
  }
}

function friendlyAuthError(msg) {
  if (!msg) return 'Something went wrong — please try again.';
  const m = msg.toLowerCase();
  if (m.includes('already registered') || m.includes('already been registered') || m.includes('user_already_exists') || m.includes('already in use'))
    return 'That email is already registered. Try logging in instead.';
  if (m.includes('password should be at least') || m.includes('password must be at least') || m.includes('too short') || m.includes('weak password'))
    return 'Password must be at least 6 characters.';
  if (m.includes('invalid format') || m.includes('invalid email') || m.includes('validate email') || m.includes('valid email'))
    return 'Please enter a valid email address.';
  if (m.includes('rate limit') || m.includes('too many requests') || m.includes('too many'))
    return 'Too many attempts — please wait a minute and try again.';
  if (m.includes('email not confirmed') || m.includes('not confirmed'))
    return 'Please check your inbox and confirm your email first.';
  if (m.includes('signup disabled') || m.includes('signups not allowed'))
    return 'New signups are temporarily unavailable. Please try again later.';
  return msg.charAt(0).toUpperCase() + msg.slice(1).replace(/\.$/, '') + '.';
}

function showSignupError(msg) {
  document.querySelectorAll('.signup-error-msg').forEach(el => el.remove());
  const btn = document.querySelector('[onclick="doSignup()"]');
  if (btn) {
    const err = document.createElement('div');
    err.className = 'signup-error-msg';
    err.style.cssText = 'margin-top:10px;padding:10px 14px;background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:10px;font-size:13px;font-weight:700;color:#DC2626;line-height:1.5;';
    err.textContent = '⚠️ ' + msg;
    btn.insertAdjacentElement('afterend', err);
  }
  showToast(msg, 5000);
}

async function requestPushPermission() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if (Notification.permission === 'granted') { registerPushSubscription(); return; }
  if (Notification.permission === 'denied') return;
  showModal(`
    <div class="modal-handle"></div>
    <div style="text-align:center;padding:8px 0;">
      <div style="font-size:40px;margin-bottom:12px;">📚</div>
      <div class="modal-title">Stay on track!</div>
      <p style="color:#64748B;font-weight:600;font-size:14px;line-height:1.6;">Get reminders when it's time to study 📚 — we'll only ping you when it matters.</p>
      <button class="btn btn-primary btn-full" style="margin-top:20px;" onclick="closeModal();doRequestPushPermission()">Allow Notifications</button>
      <button class="btn btn-ghost btn-full" style="margin-top:8px;" onclick="closeModal()">Not now</button>
    </div>
  `);
}

async function doRequestPushPermission() {
  const permission = await Notification.requestPermission();
  if (permission === 'granted') registerPushSubscription();
}

async function registerPushSubscription() {
  if (!('serviceWorker' in navigator)) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const keyBytes = urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY);
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes });
    }
    const token = STATE.user?.token;
    if (!token || !sub) return false;
    const res = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/profiles?user_id=eq.' + STATE.user.id, {
      method: 'PATCH',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ push_subscription: sub.toJSON() })
    });
    if (!res.ok) return false;
    const rows = await res.json();
    // return=representation gives back the updated rows — empty array means 0 rows matched (write silently failed)
    return Array.isArray(rows) && rows.length > 0;
  } catch(e) { console.warn('Push registration failed:', e); return false; }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function checkStudentPings() {
  const user = STATE.user;
  if (!user?.token || user?.role !== 'student') return;
  const banner = document.getElementById('ping-banner-student');
  if (!banner) return;
  try {
    const res = await fetch(
      CONFIG.SUPABASE_URL + '/rest/v1/pings?student_id=eq.' + user.id + '&read_at=is.null&order=sent_at.desc&limit=1&select=id,message,deadline',
      { headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + user.token } }
    );
    const pings = res.ok ? await res.json() : [];
    if (!pings.length) return;
    const p = pings[0];
    const deadlineText = p.deadline ? ' · by ' + p.deadline : '';
    banner.innerHTML = `<div style="background:#EEF2FF;border-bottom:2px solid #6366F1;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:12px;font-weight:900;color:#4F46E5;letter-spacing:0.05em;margin-bottom:3px;">💬 MESSAGE FROM YOUR PARENT</div>
        <div style="font-size:14px;font-weight:700;color:#1e293b;">${p.message}${deadlineText}</div>
      </div>
      <button onclick="dismissStudentPing('${p.id}')" style="background:none;border:none;color:#94A3B8;font-size:20px;cursor:pointer;flex-shrink:0;padding:4px;line-height:1;">✕</button>
    </div>`;
  } catch(e) {}
}

async function dismissStudentPing(pingId) {
  const banner = document.getElementById('ping-banner-student');
  if (banner) banner.innerHTML = '';
  if (!STATE.user?.token) return;
  try {
    await fetch(CONFIG.SUPABASE_URL + '/rest/v1/pings?id=eq.' + pingId, {
      method: 'PATCH',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + STATE.user.token, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ read_at: new Date().toISOString() })
    });
  } catch(e) {}
}

function startFlashcards() {
  const user = STATE.user;

  // Free tier: weekly card limit
  if (!user.is_paid) {
    const weekCount = getWeeklyCardCount();
    if (weekCount >= CONFIG.FREE_CARDS_PER_WEEK) {
      showUpgradeModal(`You've used your ${CONFIG.FREE_CARDS_PER_WEEK} cards this week 🎉 Upgrade to ScienceSpark Premium for unlimited revision — £12.99/month`);
      return;
    }
  }

  STATE.cardQueue = getDueCards(user);
  STATE.cardsDone = [];
  STATE.currentCardIndex = 0;
  STATE.screen = 'flashcards';

  if (STATE.cardQueue.length === 0) {
    showModal('<div class="modal-handle"></div><div class="modal-title">🎉 All caught up!</div><p style="color:var(--text-secondary);font-weight:600;font-size:15px;line-height:1.5;">You have no cards due for review. Come back tomorrow to keep your streak going!</p><button class="btn btn-primary btn-full" style="margin-top:20px;" onclick="closeModal();showHome()">Back to Home</button>');
    return;
  }

  renderFlashcard();
}

    // Split on ' — ', '. ', '; ' to make multiple bullets

function revealFlashcardAnswer() {
  const revealBtn = document.getElementById('reveal-btn');
  if (revealBtn) revealBtn.style.display = 'none';
  const qCard = document.getElementById('question-card');
  const answerSec = document.getElementById('answer-sec');
  const ratingWrap = document.getElementById('rating-wrap');
  if (qCard && answerSec) {
    qCard.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
    qCard.style.transform = 'perspective(600px) rotateX(90deg)';
    qCard.style.opacity = '0';
    setTimeout(() => {
      qCard.style.display = 'none';
      answerSec.style.display = 'block';
      answerSec.style.animation = 'cardRevealIn 0.28s ease forwards';
      if (ratingWrap) ratingWrap.style.display = 'block';
    }, 220);
  } else {
    if (answerSec) answerSec.style.display = 'block';
    if (ratingWrap) ratingWrap.style.display = 'block';
  }
}

function toggleExamCard() {
  STATE.examOpen = !STATE.examOpen;

  if (card) card.classList.toggle('open', STATE.examOpen);

async function submitFlashcardAI() {
  const card = STATE.cardQueue[STATE.currentCardIndex];
  const studentAnswer = (document.getElementById('student-answer')?.value || '').trim().toLowerCase();
  const timeSeconds = Math.round((Date.now() - STATE.pendingAnswerTime) / 1000);
  const keyWords = Array.isArray(card.a)
    ? card.a.flatMap(line => { const matches = line.match(/\*\*([^*]+)\*\*/g) || []; return matches.map(m => m.replace(/\*\*/g, '').trim().toLowerCase()); })
    : [];
  const blankPhrases = ['', 'i dont know', "i don't know", 'idk', 'no idea', 'not sure', 'dont know', 'dunno'];
  if (blankPhrases.includes(studentAnswer)) { showAIResult('again', 'No answer given.', false); recordAndAdvance(card.id, 'again'); return; }
  const btn = document.querySelector('#ai-input-area button');
  if (btn) { btn.disabled = true; btn.textContent = 'Marking...'; }
  const keyWordList = keyWords.join(', ');
  const keyPointsList = Array.isArray(card.a) ? card.a.map(b => b.replace(/\*\*/g, '')).join(' | ') : (card.answer || '');
  const system = `You are a strict AQA GCSE science examiner.\nKey terms that MUST appear: ${keyWordList}\nFull answer: ${keyPointsList}\nCount what percentage of key terms appear in the student's answer (close spellings count, synonyms alone do NOT):\n- 0-25% of key terms → again\n- 26-49% of key terms → hard\n- 50-99% of key terms → good\n- 100% of key terms → easy\nRespond ONLY with JSON: {"grade":"again","feedback":"under 12 words"}`;
  try {
    const raw = await callClaude(system, 'Student answer: ' + studentAnswer, 150);
    const parsed = JSON.parse(raw.replace(/\`\`\`json|\`\`\`/g, '').trim());
    const grade = ['again','hard','good','easy'].includes(parsed.grade) ? parsed.grade : 'again';
    showAIResult(grade, parsed.feedback || '', timeSeconds < 4);
    recordAndAdvance(card.id, grade);
  } catch(e) {
    const inputArea = document.getElementById('ai-input-area');
    if (inputArea) inputArea.style.display = 'none';
    document.getElementById('answer-sec').style.display = 'block';
    document.getElementById('rating-wrap').style.display = 'block';
  }
}

function recordAndAdvance(cardId, grade) {
  const card = STATE.cardQueue[STATE.currentCardIndex];
  const gradeNum = { again:0, hard:1, good:2, easy:3 }[grade] ?? 0;
  playGradeSound(gradeNum);
  if (gradeNum === 3) launchConfetti();

  // Update SRS via shared sm2Next
  const progress = LS.get('card_progress') || {};
  const existing = progress[cardId] || {};
  const updated = { ...existing, ...sm2Next(existing, gradeNum), cardId };
  progress[cardId] = updated;
  LS.set('card_progress', progress);
  syncCardProgress(cardId, updated);

  incrementCardCount();

  // Save to history
  const history = LS.get('card_history') || [];
  history.unshift({
    cardId,
    question: card?.question || card?.q,
    subject: card?.subject,
    topic: card?.topic_name || card?.topic,
    grade: gradeNum,
    date: new Date().toISOString()
  });
  LS.set('card_history', history.slice(0, 200));
  syncStudyHistoryRow(cardId, gradeNum, card, true);

  // Show next button instead of auto-advancing
  const ratingWrap = document.getElementById('rating-wrap');
  if (ratingWrap) {

    if (!existing) {

function syncCardProgress(cardId, prog) {
  const user = STATE.user;
  if (!user?.id || !user?.token) return;
  fetch(CONFIG.SUPABASE_URL + '/rest/v1/card_progress', {
    method: 'POST',
    headers: {
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + user.token,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify({
      user_id: user.id,
      card_id: cardId,
      easy_count: prog.easyCount || 0,
      interval: prog.interval || 1,
      repetitions: prog.repetitions || 0,
      next_review: prog.nextReview ? prog.nextReview.slice(0, 10) : null,
      last_grade: prog.lastGrade ?? null,
      last_reviewed: new Date().toISOString()
    })
  }).catch(() => {});
}

async function restoreCardProgressFromSupabase(user) {
  if (!user?.id || !user?.token) return;
  try {
    const res = await fetch(
      CONFIG.SUPABASE_URL + '/rest/v1/card_progress?user_id=eq.' + user.id + '&select=card_id,easy_count,interval,repetitions,next_review,last_grade',
      { headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + user.token } }
    );
    if (!res.ok) return;
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) return;
    const local = LS.get('card_progress') || {};
    rows.forEach(r => {
      local[r.card_id] = {
        cardId: r.card_id,
        easyCount: r.easy_count || 0,
        interval: r.interval || 1,
        repetitions: r.repetitions || 0,
        nextReview: r.next_review ? new Date(r.next_review).toISOString() : null,
        lastGrade: r.last_grade ?? null
      };
    });
    LS.set('card_progress', local);
  } catch(e) {}
}

let mcqState = {};
function renderMCQs() {
  mcqState = {};
  const primaryTopic = STATE.cardQueue[0]?.topic;
  const topicCards = STATE.cardQueue.filter(c => c.topic === primaryTopic);
  const cards = topicCards.slice(0, 4);
  if (cards.length === 0) return '<p style="color:var(--text-secondary);font-weight:600;">No questions available</p>';

  return cards.map((card, i) => {
    const question = card.q || card.question || '';
    const answer = Array.isArray(card.a) ? card.a[0] : (card.answer || '');
    const sameTopicPool = SAMPLE_CARDS.filter(c => c.id !== card.id && c.topic === card.topic);
    const fallbackPool = SAMPLE_CARDS.filter(c => c.id !== card.id && c.subject === card.subject);
    const pool = sameTopicPool.length >= 3 ? sameTopicPool : fallbackPool;
    const others = pool.slice(0, 3).map(c => Array.isArray(c.a) ? c.a[0] : (c.answer || '')).filter(Boolean);
    const opts = shuffle([answer, ...others]);
    mcqState[`q${i}`] = { correct: answer, done: false };

    return `
<div style="margin-bottom:20px;">
  <div style="font-size:14px;font-weight:700;margin-bottom:10px;">${i+1}. ${bold(question)}</div>
  <div style="display:flex;flex-direction:column;gap:8px;" id="mcq-opts-${i}">
    ${opts.map(opt => `
      <button class="mcq-option" data-val="${escapeAttr(opt)}" onclick="selectMCQ(${i}, this)">${bold(opt)}</button>
    `).join('')}
  </div>
</div>`;
  }).join('');
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function escapeAttr(str) {
  return str.replace(/'/g, "&#39;").replace(/"/g, '&quot;');
}

function selectMCQ(qIdx, el) {
  if (mcqState[`q${qIdx}`]?.done) return;
  const correct = mcqState[`q${qIdx}`].correct;
  const selected = el.getAttribute('data-val');
  const container = document.getElementById(`mcq-opts-${qIdx}`);
  if (!container) return;
  const isCorrect = selected === correct;
  container.querySelectorAll('.mcq-option').forEach(btn => {
    if (btn.getAttribute('data-val') === correct) btn.classList.add('correct');
    else if (btn === el && !isCorrect) btn.classList.add('wrong');
    btn.disabled = true;
  });
  if (isCorrect) {
    mcqState[`q${qIdx}`].done = true;
    checkAllMCQsDone();
  }
}

function checkAllMCQsDone() {
  const allDone = Object.values(mcqState).every(s => s.done);
  if (allDone) {
    const btn = document.getElementById('mcq-continue-btn') || document.getElementById('continue-btn');
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.textContent = '🎉 All correct! Continue →';
    }
  }
}

function renderEmbedCard() {
  const card = STATE.cardQueue[STATE.currentCardIndex];
  if (!card) { showTransition('embed-to-apply'); return; }

  const total = STATE.cardQueue.length;
  const current = STATE.currentCardIndex;
  STATE.pendingAnswerTime = Date.now();
  STATE.flashcardFlipped = false;

  let answerBullets;
  if (Array.isArray(card.a) && card.a.length > 0) {
    answerBullets = card.a.map(b => '<li>' + bold(b) + '</li>').join('');
  } else {
    const ans = card.answer || '';
    const parts = ans.split(/(?:\. |; | — | \/ )/).filter(p => p.trim().length > 5);
    if (parts.length > 1) {
      answerBullets = parts.map(p => '<li>' + p.trim() + '</li>').join('');
    } else {
      answerBullets = '<li>' + ans + '</li>';
    }
  }

function playGradeSound(grade) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t = ctx.currentTime;
    function chime(freq, start, vol) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(vol, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(start); osc.stop(start + 0.45);
    }
    if (grade === 3) {
      // Easy: bright three-note ascending arpeggio
      chime(523.25, t,       0.22);
      chime(659.25, t + 0.10, 0.20);
      chime(783.99, t + 0.20, 0.18);
    } else if (grade === 2) {
      // Good: two-note ascending chime
      chime(523.25, t,       0.20);
      chime(783.99, t + 0.12, 0.17);
    } else if (grade === 1) {
      // Hard: soft descending (E4→C4)
      chime(329.63, t,       0.10);
      chime(261.63, t + 0.15, 0.08);
    } else {
      // Again: very soft descending (D4→A3)
      chime(293.66, t,       0.09);
      chime(220.00, t + 0.15, 0.07);
    }
  } catch(e) {}
}

function launchConfetti() {
  const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#F97316','#6366F1','#22C55E'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;overflow:hidden;';
  document.body.appendChild(container);
  for (let i = 0; i < 70; i++) {
    const piece = document.createElement('div');
    const color = colors[i % colors.length];
    const x = (i * 13.7) % 100;
    const size = 7 + (i % 5);
    const duration = 0.9 + (i % 4) * 0.15;
    const delay = (i % 8) * 0.05;
    const rot = (i * 37) % 360;
    const isCircle = i % 3 === 0;
    piece.style.cssText = `position:absolute;left:${x}%;top:-15px;width:${size}px;height:${isCircle ? size : Math.round(size*0.55)}px;background:${color};border-radius:${isCircle ? '50%' : '2px'};animation:confettiFall ${duration}s ${delay}s ease-in forwards;--rot:${rot}deg;`;
    container.appendChild(piece);
  }
  setTimeout(() => { if (container.parentNode) container.remove(); }, 2000);
}

function showLevelUpCelebration(newLevel, callback) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:linear-gradient(135deg,#4F46E5,#818CF8,#A78BFA);z-index:99998;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:levelUpEntry 0.4s ease;';
  overlay.innerHTML = `
    <div style="font-size:80px;margin-bottom:12px;">⬆️</div>
    <div style="font-size:38px;font-weight:900;color:white;letter-spacing:0.02em;margin-bottom:6px;">LEVEL UP!</div>
    <div style="font-size:24px;font-weight:900;color:rgba(255,255,255,0.92);margin-bottom:10px;">Level ${newLevel} unlocked 🎉</div>
    <div style="font-size:15px;color:rgba(255,255,255,0.75);font-weight:700;">Keep sparking — you're on fire! 🔥</div>
  `;
  document.body.appendChild(overlay);
  launchConfetti();
  playGradeSound(3);
  setTimeout(() => {
    overlay.style.transition = 'opacity 0.5s ease';
    overlay.style.opacity = '0';
    setTimeout(() => { if (overlay.parentNode) overlay.remove(); if (callback) callback(); }, 500);
  }, 2200);
}

  const messages = STATE.tutorHistory.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }));

  try {
    const res = await fetch('https://sciencespark-worker.sciencespark.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: CONFIG.CLAUDE_MODEL,
        max_tokens: 600,
        system: TUTOR_SYSTEM,
        messages,
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || "Sorry, I couldn't get a response. Try again!";

    document.getElementById('tutor-loading')?.remove();
    STATE.tutorHistory.push({ role: 'ai', content: reply });
    showAITutor();
  } catch (e) {
    document.getElementById('tutor-loading')?.remove();
    // Offline fallback
    const fallback = "I'm having trouble connecting right now. Check that the Claude API key is configured and try again!";
    STATE.tutorHistory.push({ role: 'ai', content: fallback });
    showAITutor();
  }
}
