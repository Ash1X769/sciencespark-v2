async function init() {
  // Handle Stripe redirect
  if (window.location.search.includes('upgraded=true')) {
    const saved = LS.get('demo_user');
    if (saved && saved.id) {
      STATE.user = saved;
      STATE.role = saved.role || 'student';
      showUpgradedCelebration();
      return;
    }
  }

  const saved = LS.get('demo_user');

  // Restore session instantly — no network call, no delay, no logout on refresh
  if (saved && saved.id) {
    STATE.user = saved;
    STATE.role = saved.role || 'student';
    const lastScreen = LS.get('last_screen');
    afterLogin(lastScreen || null);
    // Silently refresh token in background
    if (saved.refresh_token) {
      fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': CONFIG.SUPABASE_ANON_KEY },
        body: JSON.stringify({ refresh_token: saved.refresh_token })
      }).then(r => r.json()).then(data => {
        if (data.access_token) {
          STATE.user = { ...STATE.user, token: data.access_token, refresh_token: data.refresh_token };
          LS.set('demo_user', STATE.user);
        }
      }).catch(() => {});
    }
    return;
  }
  
  // Try reading Supabase session directly from localStorage
  try {
    const sbKey = Object.keys(localStorage).find(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
    if (sbKey) {
      const sbSession = JSON.parse(localStorage.getItem(sbKey));
      if (sbSession && sbSession.access_token && sbSession.user) {
        const u = sbSession.user;
        const meta = u.user_metadata || {};
        STATE.user = {
          id: u.id,
          email: u.email,
          token: sbSession.access_token,
          refresh_token: sbSession.refresh_token,
          display_name: meta.display_name || u.email,
          role: meta.role || 'student',
          year_group: meta.year_group || 11,
          tier: meta.tier || 'combined_higher',
          exam_board: meta.exam_board || 'AQA',
          class_code: meta.class_code || null,
          parent_code: meta.parent_code || null,
          xp: meta.xp || 0,
          streak: meta.streak || 0,
          level: meta.level || 1,
          ai_mode: meta.ai_mode !== false,
        };
        STATE.role = STATE.user.role;
        LS.set('demo_user', STATE.user);
        afterLogin();
        return;
      }
    }
  } catch(e) {
    console.log('Supabase session read error:', e);
  }
  
  showAuth();
}

function renderMarkdown(text) {
  // Escape HTML so AI can't inject tags
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = esc(text).split('\n');
  let html = '';
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Table: current line has pipes and next is a separator row
    if (line.trim().startsWith('|') && i + 1 < lines.length && /^\|[\s\-:|]+\|/.test(lines[i+1].trim())) {
      const cols = line.split('|').slice(1,-1);
      let t = '<table style="border-collapse:collapse;width:100%;font-size:0.82rem;margin:6px 0;">';
      t += '<thead><tr>' + cols.map(h => `<th style="border:1px solid #e2e8f0;padding:5px 8px;background:#f1f5f9;font-weight:800;text-align:left;">${h.trim()}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        const cells = lines[i].split('|').slice(1,-1);
        t += '<tr>' + cells.map(c => `<td style="border:1px solid #e2e8f0;padding:5px 8px;">${c.trim()}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      html += t;
      continue;
    }
    // Headings
    if (/^### /.test(line)) {
      html += `<div style="font-size:0.88rem;font-weight:800;color:#1e293b;margin:8px 0 3px;">${line.slice(4)}</div>`;
    } else if (/^## /.test(line)) {
      html += `<div style="font-size:0.93rem;font-weight:800;color:#1e293b;margin:10px 0 4px;">${line.slice(3)}</div>`;
    } else if (/^# /.test(line)) {
      html += `<div style="font-size:1rem;font-weight:900;color:#1e293b;margin:12px 0 5px;">${line.slice(2)}</div>`;
    } else if (line.trim() === '') {
      html += '<br>';
    } else {
      const inline = line
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
      html += inline + '<br>';
    }
    i++;
  }
  return html.trimEnd().replace(/(<br>)+$/, '');
}

        messages: [{ role: 'user', content: message }]
      })
    });
    const data = await res.json();
    aiDiv.innerHTML = renderMarkdown(data.content?.[0]?.text || 'Sorry, try again!');
  } catch(e) {
    aiDiv.textContent = 'Something went wrong. Please try again.';
  }
  msgs.scrollTop = msgs.scrollHeight;
}

window.toggleAIChat = toggleAIChat;
window.showAIChatWidget = showAIChatWidget;
window.hideAIChatWidget = hideAIChatWidget;
window.sendAIChat = sendAIChat;
window.updateChatWidgetVisibility = updateChatWidgetVisibility;
window.showAIChatTab = showAIChatTab;
window.sendAITabChat = sendAITabChat;

// ============================================================
// PWA INSTALL PROMPT
// ============================================================

let _installPromptEvent = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPromptEvent = e;
  // Slight delay so it doesn't interrupt app load
  setTimeout(showInstallBanner, 3000);
});

function showInstallBanner() {
  if (document.getElementById('pwa-install-banner')) return;
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  const banner = document.createElement('div');
  banner.id = 'pwa-install-banner';
  banner.style.cssText = 'position:fixed;bottom:80px;left:16px;right:16px;margin:0 auto;max-width:440px;background:#0F172A;color:white;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:9500;box-shadow:0 4px 24px rgba(0,0,0,0.3);animation:slideUpFade 0.35s ease;';
  banner.innerHTML = `
    <div style="font-size:26px;flex-shrink:0;">📱</div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;font-weight:900;line-height:1.3;">Add ScienceSpark to your home screen for the best experience 📱</div>
    </div>
    <button onclick="triggerInstallPrompt()" style="flex-shrink:0;background:#16A34A;color:white;border:none;border-radius:10px;padding:8px 14px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;">Add</button>
    <button onclick="dismissInstallBanner()" style="flex-shrink:0;background:rgba(255,255,255,0.12);color:white;border:none;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;">✕</button>
  `;
  document.body.appendChild(banner);
}

function dismissInstallBanner() {
  const b = document.getElementById('pwa-install-banner');
  if (b) {
    b.style.transition = 'opacity 0.2s ease';
    b.style.opacity = '0';
    setTimeout(() => b.remove(), 200);
  }
}

async function triggerInstallPrompt() {
  if (!_installPromptEvent) return;
  _installPromptEvent.prompt();
  await _installPromptEvent.userChoice;
  _installPromptEvent = null;
  dismissInstallBanner();
}

window.addEventListener('appinstalled', () => dismissInstallBanner());

</script>

<div id="ai-chat-widget" class="closed hidden">
  <div id="ai-chat-header" onclick="toggleAIChat()">
    <span class="chat-title">✨ AI Tutor</span>
    <span id="ai-chat-icon">▲</span>
  </div>
  <div id="ai-chat-body">
    <div id="ai-chat-messages">
      <div class="ai-msg-ai">Hi! I'm your AI Tutor 🎓 Ask me anything about GCSE Science — topics, exam questions, or tricky concepts.</div>
    </div>
    <div id="ai-chat-input-area">
      <input id="ai-chat-input" type="text" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')sendAIChat()">
      <button onclick="sendAIChat()">Send</button>
    </div>
  </div>
</div>
